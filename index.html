<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 25, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 25, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal esta noche.",
    "en": "The concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for objects/people at a location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de escalar la montaña, los excursionistas ___ completamente muertos de cansancio.",
    "en": "After climbing the mountain, the hikers were completely dead with exhaustion.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "son"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for temporary states and conditions, including physical or emotional states resulting from an activity. 'Muerto de cansancio' describes how they felt in that moment, not an inherent trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese pastel todavía — ___ caliente y te quemarás!",
    "en": "Don't touch that cake yet — it's hot and you'll burn yourself!",
    "options": [
      "es",
      "está",
      "sea",
      "será"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary physical states like temperature. The cake is not inherently hot by nature; it is hot right now as a result of being baked, making this a changeable condition."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino siempre me pareció raro, pero resulta que ___ muy listo — acaba de ganar un premio científico.",
    "en": "My neighbor always seemed strange to me, but it turns out he is very clever — he just won a scientific award.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "'Listo' with SER means 'clever/intelligent', an inherent characteristic. With ESTAR, 'listo' means 'ready'. Since the sentence refers to intelligence as a quality of the person, SER is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions. The word 'siempre' is a strong signal that this was a recurring routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading calmly when suddenly the phone rang.",
    "options": [
      "leí",
      "leeré",
      "leía",
      "había leído"
    ],
    "correct": 2,
    "explanation": "The Imperfecto describes a background action in progress ('was reading') that gets interrupted. The interrupting event ('sonó') uses the Indefinido because it is a single completed moment that broke the ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmará",
      "habría firmado",
      "firmó"
    ],
    "correct": 3,
    "explanation": "The Indefinido is used for completed actions with a specific time reference. 'El año pasado' marks this as a finished event bounded in time, so the Indefinido is correct."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what', and is used when the antecedent is unspecified or abstract. 'Qué' would be used in a direct question, not an embedded clause like this one."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ día tan hermoso hace hoy, ¿verdad?",
    "en": "What a beautiful day it is today, isn't it?",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' is used in exclamatory sentences to express strong emotion or admiration. In this structure (¡Qué + noun + tan/más + adjective!), it conveys intensity and is always written with an accent mark."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando llego a casa tarde y ella ya está dormida.",
    "en": "Lately I feel very guilty when I get home late and she is already asleep.",
    "options": [
      "me siento culpable",
      "me sientes culpable",
      "me siente culpable",
      "te sientes culpable"
    ],
    "correct": 0,
    "explanation": "When the subject experiences a feeling directed at themselves ('Yo y yo' pattern), the reflexive pronoun 'me' is used with a first-person verb. 'Me siento' means 'I feel', where the subject and the experiencer are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ muy frustrado con tus respuestas.",
    "en": "Every time we argue, you make me feel very frustrated with your responses.",
    "options": [
      "me siento",
      "te pones",
      "me pones",
      "me pongo"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y tú' pattern, someone else causes the speaker's emotional state. 'Me pones' (tú me pones) means 'you make me feel', where 'me' is the affected object and the implied subject is 'tú'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina italiana.",
    "en": "If I had more free time, I would take an Italian cooking course.",
    "options": [
      "tomaré",
      "tomo",
      "tomaría",
      "voy a tomar"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses referring to unlikely or contrary-to-fact present situations, the structure is si + Imperfecto de Subjuntivo + Condicional. The Condicional expresses what would happen under that condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be over 35 degrees across the whole region.",
    "options": [
      "habría",
      "haría",
      "habrá",
      "haga"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple expresses factual predictions about the future, especially when supported by evidence like a forecast. It is more certain than the Condicional, which implies a condition or softened supposition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Oye, ¿puedes decirle a Marcos que ___ a la reunión del jueves?",
    "en": "Hey, can you tell Marcos that he is going to come to Thursday's meeting?",
    "options": [
      "irá",
      "va a ir",
      "iría",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (and its conjugated forms) expresses a near-future plan or intention that is already decided and feels certain. It is preferred over the Futuro Simple when referring to concrete, imminent plans."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del mediodía.",
    "en": "The boss wants everyone to submit the report before noon.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregan"
    ],
    "correct": 1,
    "explanation": "After verbs of desire like 'querer que', the Subjuntivo is required in the subordinate clause because the main subject is expressing a wish about the action of a different subject. This is the classic 'wish/volition' trigger for the Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tengas",
      "tendrás",
      "tienes",
      "tuvieras"
    ],
    "correct": 0,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' referring to future events, the Subjuntivo is mandatory. The present Subjuntivo is used here because the action hasn't happened yet."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the Subjuntivo because the speaker is expressing doubt or denial. If the opinion were affirmative ('creo que'), the Indicativo would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ a tu hermana ahora mismo y pídele disculpas!",
    "en": "Call your sister right now and apologize to her!",
    "options": [
      "Llama",
      "Llamas",
      "Llame",
      "Llamar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative is formed like the third-person singular of the present Indicativo (él/ella form). 'Llama' is the correct tú command for 'llamar'. Note that pronouns attach to the end of affirmative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la cena — es una regla de esta casa.",
    "en": "Please, don't use the phone during dinner — it's a rule in this house.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "uses"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present Subjuntivo (second-person singular). For 'usar', the negative imperative is 'no uses'. Negative commands always use the Subjuntivo, unlike affirmative commands which use the Indicativo form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Pablo todavía no ha llegado. ___ perdido el autobús otra vez.",
    "en": "It's eleven at night and Pablo still hasn't arrived. He must have missed the bus again.",
    "options": [
      "Habría perdido",
      "Habrá perdido",
      "Habrá perdiendo",
      "Va a haber perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto can express probability or deduction about a past event from the perspective of the present. 'Habrá perdido' means 'he must have missed', indicating the speaker is making an educated guess about something that likely already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
