<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 01, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 01, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events, even though location normally uses ESTAR. Events (concerts, parties, meetings) are considered definitions of where something takes place, not descriptions of a thing's position."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No puedo creer que tu abuela todavía ___ tan viva — tiene 95 años y baila todos los días.",
    "en": "I can't believe your grandmother is still so lively — she's 95 and dances every day.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "VIVO/A changes meaning depending on the verb: SER vivo means 'clever/sharp', while ESTAR vivo means 'alive or lively'. Here the context of energy and vitality points to ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — ¿le pusiste chocolate belga?",
    "en": "This dessert is incredibly delicious — did you put Belgian chocolate in it?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "RICO with ESTAR means 'tastes delicious' (a sensory, temporary experience), while SER rico means 'wealthy'. When reacting to how food tastes in the moment, Spanish speakers use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino ___ muy aburrido en las reuniones de trabajo — siempre habla de lo mismo.",
    "en": "My neighbor is very boring at work meetings — he always talks about the same thing.",
    "options": [
      "es",
      "está",
      "sería",
      "estaría"
    ],
    "correct": 0,
    "explanation": "SER aburrido means 'to be a boring person' (a characteristic trait), while ESTAR aburrido means 'to feel bored' (a temporary emotional state). The context here describes a habitual personality trait, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, todos los veranos mi familia ___ a la misma playa en Galicia.",
    "en": "When I was a child, every summer my family went to the same beach in Galicia.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (iba) is used for habitual or repeated actions in the past, especially when cues like 'todos los veranos' (every summer) signal a routine. The Indefinido would imply a single completed trip."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading calmly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto (leía), while the interrupting event uses the Indefinido (sonó). The phrase 'de repente' signals the sudden interrupting action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "La reunión ___ a las tres y duró dos horas exactas.",
    "en": "The meeting started at three and lasted exactly two hours.",
    "options": [
      "empezaba",
      "empezó",
      "ha empezado",
      "empieza"
    ],
    "correct": 1,
    "explanation": "The Indefinido (empezó) is used for completed, bounded events with a clear start and end in the past. When the duration is specified and the action is presented as a finished whole, Indefinido is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me quieres decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "LO QUE functions as a nominalizer meaning 'that which' or 'what', and is used when referring to an idea or thing that has not been previously mentioned. QUE alone would be a simple connector, not a noun clause equivalent."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿Con ___ empresa trabajas ahora? ¿Sigues en el sector tecnológico?",
    "en": "Which company do you work for now? Are you still in the tech sector?",
    "options": [
      "lo que",
      "que",
      "qué",
      "quien"
    ],
    "correct": 2,
    "explanation": "QUÉ (with accent) is used as an interrogative or exclamatory determiner before nouns in direct and indirect questions. Without the accent, QUE is a relative pronoun or conjunction, not suitable for questions."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ muchísimo con los plazos de entrega en el trabajo.",
    "en": "Lately I stress out a lot because of delivery deadlines at work.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject causes their own emotional reaction (Yo y yo pattern), the reflexive verb agrees with the first-person subject: ME ESTRESO (yo). ME ESTRESA would require an external third-person subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupas",
      "me preocupo",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 0,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) causes an emotional reaction in the speaker (yo). The verb agrees with the TÚ subject (preocupas), and ME marks that the speaker is the one affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tome",
      "tomaría",
      "voy a tomar"
    ],
    "correct": 2,
    "explanation": "In hypothetical or contrary-to-fact conditional sentences with SI + Imperfecto de Subjuntivo, the main clause requires the Condicional Simple (tomaría). The Futuro Simple is used for real future possibilities, not hypotheticals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región.",
    "en": "According to the forecast, tomorrow it will be very hot throughout the region.",
    "options": [
      "haría",
      "habrá",
      "vaya a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "FUTURO SIMPLE (habrá) is used for factual predictions about the future, especially based on evidence or forecasts. The Condicional (haría) would be used in hypothetical contexts or reported speech from the past."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio después del trabajo — ya lo tengo todo preparado.",
    "en": "This afternoon I'm going to go to the gym after work — I've already got everything ready.",
    "options": [
      "iré",
      "voy a ir",
      "fuera",
      "iría"
    ],
    "correct": 1,
    "explanation": "IR A + INFINITIVO is preferred for near-future plans that are already decided or in motion, especially when context shows preparation or intention. The Futuro Simple (iré) is more appropriate for distant or less certain future events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que los empleados ___ puntualmente a todas las reuniones.",
    "en": "It is important that employees arrive punctually to all meetings.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegan a"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of value or necessity (es importante que, es necesario que) trigger the Subjuntivo in the subordinate clause. The Indicativo (llegan) would be used to state facts, not to express importance or obligation."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ los resultados del análisis.",
    "en": "I will call you as soon as the test results arrive.",
    "options": [
      "lleguen",
      "llegan",
      "llegarán",
      "llegaron"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like EN CUANTO, CUANDO, and TAN PRONTO COMO require the Subjuntivo when referring to future events. Although it feels like a fact, the event hasn't happened yet, so Subjuntivo marks it as anticipated, not real."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que tenga terraza.",
    "en": "I'm looking for an apartment that is near the metro and has a terrace.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent (the thing being sought) is indefinite or hypothetical — meaning it may not exist yet — the relative clause requires the Subjuntivo. If you already had a specific apartment in mind, you would use the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe todavía — espera a que lleguen todos los datos.",
    "en": "Don't send the report yet — wait until all the data arrives.",
    "options": [
      "envías",
      "envíes",
      "envía",
      "enviarás"
    ],
    "correct": 1,
    "explanation": "Negative imperatives in Spanish always use the Subjuntivo form, not the affirmative imperative. For TÚ commands, the affirmative is envía, but the negative is NO ENVÍES (Subjuntivo), following the pattern of no + Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad antes del despegue.",
    "en": "Ladies and gentlemen, fasten your seatbelts before takeoff.",
    "options": [
      "abrochen",
      "abrocha",
      "abrocháis",
      "abrochan"
    ],
    "correct": 0,
    "explanation": "USTEDES commands use the third-person plural Subjuntivo form (abrochen). In Latin America and formal contexts in Spain, USTEDES is used instead of VOSOTROS for group commands, and the Subjuntivo form applies to both affirmative and negative."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ salido ya a hacer los recados.",
    "en": "He's not answering the phone. He must have already gone out to run errands.",
    "options": [
      "Habrá",
      "Hubiera",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from a present perspective. It's the Spanish equivalent of 'must have done something' and signals the speaker is making a logical inference."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
