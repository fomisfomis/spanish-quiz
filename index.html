<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 06, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 06, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled activities use SER to indicate where they take place, not ESTAR. ESTAR is used for the physical location of objects and people, but for events, SER expresses location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar dos semanas en la playa, María ___ morena.",
    "en": "After spending two weeks at the beach, María is tan.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the tan is a change of state — a temporary condition resulting from an experience. If she were naturally dark-skinned, you would use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No puedo creer lo mucho que ha cambiado tu vecino — antes era antipático, pero ahora ___ muy simpático.",
    "en": "I can't believe how much your neighbor has changed — he used to be unfriendly, but now he is very friendly.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here to signal a change from a previous state, implying 'he seems friendly now' in contrast to how he was before. Using SER would simply describe his permanent personality."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — ¿puedo saber la receta?",
    "en": "This dessert is absolutely delicious — may I have the recipe?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Rico' with ESTAR means 'delicious' (a sensory experience in the moment), while with SER it would mean 'rich' or 'wealthy.' When tasting food, Spanish speakers always use ESTAR + rico."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, todos los domingos ___ (ir) al mercado con mi abuela.",
    "en": "When I was little, every Sunday I used to go to the market with my grandmother.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The signal word 'todos los domingos' (every Sunday) confirms this is a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "The imperfecto describes the background action in progress (reading) that was interrupted. The interrupting event 'sonó' uses indefinido because it is a single completed action that cut into the ongoing one."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (abrir) una nueva sede en Lisboa.",
    "en": "Last year, my company opened a new office in Lisbon.",
    "options": [
      "abría",
      "abrió",
      "ha abierto",
      "hubiera abierto"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido is used for completed actions with a specific, closed time reference. 'El año pasado' marks it as a finished event in the past, so indefinido is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when there is no specific antecedent noun. 'Que' would need a prior noun to refer back to, and 'qué' with an accent is used in direct or indirect questions implying a question, not an embedded clause of understanding."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa encontrarte aquí en el aeropuerto después de tantos años!",
    "en": "What a surprise to find you here at the airport after so many years!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Como"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express strong emotion or emphasis, equivalent to 'What a...!' in English. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hay mucho tráfico en la autopista, ___ muchísimo.",
    "en": "Whenever there is a lot of traffic on the highway, I get really stressed.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject causes their own emotional state (Yo y yo pattern), the reflexive verb agrees with the speaker as both agent and patient: 'yo me estreso.' This differs from 'me estresa el tráfico,' where an external thing causes the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho la verdad.",
    "en": "When you arrive late without warning, you really worry me.",
    "options": [
      "me preocupo",
      "me preocupas",
      "te preocupas",
      "me preocupa"
    ],
    "correct": 1,
    "explanation": "This is the 'Yo y tú' pattern: a second-person subject (tú) causes a feeling in the speaker (me). The verb conjugates for 'tú' — 'me preocupas' — because it is you who worries me, not the other way around."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir, ___ (vivir) en una ciudad pequeña cerca del mar.",
    "en": "If I could choose, I would live in a small city near the sea.",
    "options": [
      "viviré",
      "vivo",
      "viviría",
      "viviera"
    ],
    "correct": 2,
    "explanation": "The condicional simple is used in the result clause of hypothetical (si + imperfecto de subjuntivo) sentences. 'Si pudiera' signals an unreal or unlikely condition, so the result requires condicional, not futuro."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde en toda la región.",
    "en": "According to the forecast, tomorrow it will rain in the afternoon throughout the region.",
    "options": [
      "llovería",
      "lloverá",
      "va a llover",
      "llueve"
    ],
    "correct": 1,
    "explanation": "The futuro simple is used for objective predictions or scheduled future events, especially with information from a source like a forecast. Both 'lloverá' and 'va a llover' are possible, but futuro simple is more formal and impersonal for reported predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "— ¿Por qué no me llamaste ayer? — Perdona, pero ___ (estar) muy ocupado con el cierre del proyecto.",
    "en": "— Why didn't you call me yesterday? — Sorry, I must have been very busy with the project deadline.",
    "options": [
      "estaré",
      "estaría",
      "estuve",
      "esté"
    ],
    "correct": 1,
    "explanation": "The condicional simple can express probability or supposition about a past event, equivalent to 'must have been' in English. This is parallel to how futuro simple expresses probability in the present tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos los empleados ___ (entregar) el informe antes del viernes.",
    "en": "The boss wants all employees to hand in the report before Friday.",
    "options": [
      "entregan",
      "entregarán",
      "entreguen",
      "entregaran"
    ],
    "correct": 2,
    "explanation": "After verbs of desire or will (querer, desear, pedir) with a change of subject, the subjuntivo is required in the subordinate clause. The trigger 'quiere que' signals the switch from indicative to subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) de cocinar, ponemos la mesa y nos sentamos a cenar.",
    "en": "As soon as you finish cooking, we'll set the table and sit down to eat.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminabas"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' referring to a future action, Spanish requires the subjuntivo. These expressions describe something that has not yet happened, so indicative cannot be used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ (tener) terraza y buenas vistas al mar.",
    "en": "I'm looking for an apartment that has a terrace and good sea views.",
    "options": [
      "tiene",
      "tendrá",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (the apartment may or may not exist), the subjuntivo is required. If the speaker already knew of a specific apartment, the indicative 'tiene' would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (escuchar, tú) bien porque solo lo voy a explicar una vez.",
    "en": "Hey, listen carefully because I'm only going to explain it once.",
    "options": [
      "escuchas",
      "escucha",
      "escuches",
      "escuchar"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of most regular -ar verbs is identical to the third-person singular present indicative: 'escucha.' This is distinct from the negative tú command, which uses the present subjunctive: 'no escuches.'"
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (preocuparse, ustedes) por los detalles — nosotros nos encargamos de todo.",
    "en": "Please don't worry about the details — we'll take care of everything.",
    "options": [
      "se preocupan",
      "se preocupen",
      "preocúpense",
      "os preocupéis"
    ],
    "correct": 1,
    "explanation": "Negative ustedes commands use the present subjunctive with the pronoun placed before the verb: 'no se preocupen.' The affirmative 'preocúpense' would attach the pronoun after the verb, but negation requires the subjunctive form with the pronoun preceding it."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Lucía no ha llegado todavía. ___ (perderse) en el metro otra vez.",
    "en": "It's three in the afternoon and Lucía still hasn't arrived. She must have gotten lost on the subway again.",
    "options": [
      "Se perderá",
      "Se perdió",
      "Se habrá perdido",
      "Se hubiera perdido"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that likely already happened. It conveys 'she must have gotten lost,' speculating about a completed past action from the present moment."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
