<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 09, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 09, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de rock ___ en el estadio esta noche.",
    "en": "The rock concert is at the stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR is used for the location of physical objects and people, but scheduled events always take SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No comas esa carne — ___ mala desde ayer.",
    "en": "Don't eat that meat — it has been bad since yesterday.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo/a means 'to be spoiled or in bad condition (temporarily),' a change of state. SER + malo/a would mean the thing is inherently bad or evil by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy vivo para sus noventa años — siempre tiene un chiste listo.",
    "en": "My grandfather is very sharp/lively for his ninety years — he always has a joke ready.",
    "options": [
      "es",
      "está",
      "fue",
      "ha sido"
    ],
    "correct": 0,
    "explanation": "SER + vivo means 'to be sharp, clever, or lively' as a characteristic. ESTAR + vivo, on the other hand, would mean 'to be alive' (still living)."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la reunión, todos ___ aburridos y querían salir.",
    "en": "After the meeting, everyone was bored and wanted to leave.",
    "options": [
      "eran",
      "estaban",
      "fueron",
      "estuvieron"
    ],
    "correct": 3,
    "explanation": "ESTAR + aburrido/a means 'to feel bored' as a temporary state resulting from circumstances. SER + aburrido/a describes a personality trait, meaning 'to be a boring person.' The preterite (estuvieron) is used here for a completed past state."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (caminar) a la escuela todos los días.",
    "en": "When I was a child, I used to walk to school every day.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used to describe habitual or repeated actions in the past. The phrase 'todos los días' reinforces this ongoing habit, which contrasts with the indefinido that marks a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe cuando de repente ___ (apagarse) la luz.",
    "en": "I was reading the report when suddenly the light went out.",
    "options": [
      "se apagaba",
      "se apagó",
      "se apague",
      "se apagaría"
    ],
    "correct": 1,
    "explanation": "In an interrupted-action sentence, the background ongoing action uses the imperfecto (leía) and the interrupting event uses the indefinido (se apagó). 'De repente' signals a sudden completed action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ (estar) lleno, así que decidimos pedir comida a domicilio.",
    "en": "The restaurant was full, so we decided to order food delivery.",
    "options": [
      "estuvo",
      "estaba",
      "estará",
      "está"
    ],
    "correct": 1,
    "explanation": "The imperfecto sets the scene or background condition (the restaurant being full), while the main decision (decidimos) uses the indefinido. Background descriptions that frame a story use the imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese gesto.",
    "en": "I don't understand what you are trying to tell me with that gesture.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' acting as the object of 'entiendo.' 'Que' alone is a simple connector and cannot stand in for 'what' in this embedded clause context."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable verte aquí en la conferencia!",
    "en": "What a pleasant surprise to see you here at the conference!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cuál"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark introduces exclamations, translating as 'What a...!' It precedes a noun (sorpresa) and expresses strong emotion, which is a distinct use from the relative pronoun 'que' without an accent."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Últimamente ___ mucho con los plazos de entrega del trabajo.",
    "en": "Lately I get really stressed about work deadlines.",
    "options": [
      "me estresas",
      "me estrés",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and object of the action are the same person (yo — yo pattern), the verb is reflexive and conjugated in the first person: 'me estreso.' This differs from 'me estresAs' (you stress me) or 'me estresA el trabajo' (work stresses me)."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "___ cuando llegas tarde sin avisar y yo te estoy esperando.",
    "en": "You frustrate me when you arrive late without warning while I'm waiting for you.",
    "options": [
      "Me frustro",
      "Me frustras",
      "Me frustra",
      "Te frustras"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes an effect on the first-person object (me), so the verb takes the tú conjugation: 'me frustras.' This differs from the reflexive 'me frustro' (I frustrate myself) or 'me frustra' (something impersonal frustrates me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "voy a aprender"
    ],
    "correct": 2,
    "explanation": "The condicional (aprendería) is required in the main clause of hypothetical si-clauses that use the imperfecto de subjuntivo (si tuviera). The futuro simple (aprenderé) is used for real, likely future conditions with si + presente de indicativo."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale en diez minutos — ___ (llegar) tarde si no corremos ahora.",
    "en": "The train leaves in ten minutes — we will arrive late if we don't run now.",
    "options": [
      "llegaríamos",
      "llegaremos",
      "vamos a llegar",
      "llegamos"
    ],
    "correct": 2,
    "explanation": "'Vamos a + infinitivo' expresses an imminent or planned future, especially when there is evidence or urgency in the present moment. Both 'llegaremos' and 'vamos a llegar' are possible here, but 'vamos a llegar' emphasizes the near, concrete consequence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me ___ (poder) explicar cómo funciona este software cuando tengas un momento?",
    "en": "Could you explain to me how this software works when you have a moment?",
    "options": [
      "puedes",
      "podrás",
      "podrías",
      "puedas"
    ],
    "correct": 2,
    "explanation": "The condicional (podrías) is used to make polite requests, softening the directness of a demand. The futuro (podrás) would sound like a prediction rather than a courteous question, and 'puedes' would be a more direct, less formal request."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el nuevo compañero de trabajo ___ (llevarse) bien con el equipo.",
    "en": "I hope that the new coworker gets along well with the team.",
    "options": [
      "se lleva",
      "se llevará",
      "se lleve",
      "se llevaba"
    ],
    "correct": 2,
    "explanation": "After verbs of wish or hope like 'esperar que,' the subjuntivo is required when the subject of the main clause and the subordinate clause are different. 'Se lleve' is the present subjuntivo of 'llevarse.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Avísame en cuanto ___ (llegar) los resultados del análisis.",
    "en": "Let me know as soon as the test results arrive.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the subjuntivo when referring to a future event that has not yet occurred. The indicative would be used only if referring to habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que María ___ (saber) la verdad sobre lo que pasó.",
    "en": "I don't think María knows the truth about what happened.",
    "options": [
      "sabe",
      "sepa",
      "sabrá",
      "supiera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the subjuntivo because the speaker is distancing themselves from the truth of the subordinate clause. If the speaker were affirming it ('creo que sabe'), the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "___ (decir, tú) la verdad ahora mismo — todos te están escuchando.",
    "en": "Tell the truth right now — everyone is listening to you.",
    "options": [
      "Dices",
      "Dí",
      "Di",
      "Digas"
    ],
    "correct": 2,
    "explanation": "'Di' is the irregular affirmative tú imperative of 'decir.' Many common verbs have one-syllable irregular imperatives (di, haz, ve, pon, sal, sé, ten, ven). 'Digas' is the tú subjuntivo, which is used for negative commands, not affirmative ones."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto por los detalles — ya lo arreglamos.",
    "en": "Don't worry so much about the details — we'll fix it.",
    "options": [
      "te preocupa",
      "te preocupes",
      "preocúpate",
      "preocupas"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present subjuntivo: 'no te preocupes.' In negative reflexive commands, the reflexive pronoun stays before the verb and the verb takes the subjuntivo form. 'Preocúpate' is the affirmative imperative, used only for positive commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Laura aún no ha llegado. ___ (perderse) en el camino.",
    "en": "It's three in the afternoon and Laura still hasn't arrived. She must have gotten lost on the way.",
    "options": [
      "Se perderá",
      "Se perdería",
      "Se habrá perdido",
      "Se había perdido"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habrá + participio) expresses probability or speculation about something that may have already happened. When the speaker is making a deduction about a past event from a present clue, this tense is the natural choice in Spanish."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
