<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 26, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 26, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal esta noche.",
    "en": "The concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions that can change, such as the current temperature of food. SER would imply the soup is inherently, permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means clever or smart (an inherent characteristic), while ESTAR + listo means ready. Here the context confirms cleverness as a personality trait, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy malo.",
    "en": "After the chemotherapy, the patient was very ill.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR + malo means to be ill or sick (a temporary physical condition), while SER + malo means to be a bad or evil person. The imperfect ESTABA is also appropriate here for a prolonged state in the past."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis primos.",
    "en": "When I was a child, I used to play football every Saturday with my cousins.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaré"
    ],
    "correct": 1,
    "explanation": "The imperfect (jugaba) is used for habitual or repeated actions in the past with no defined endpoint. The clue 'todos los sábados' signals repetition, which is a classic trigger for the imperfect."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo cuando de repente se cortó la luz.",
    "en": "I was writing an email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "escribiré",
      "haya escrito"
    ],
    "correct": 1,
    "explanation": "The imperfect (escribía) describes the ongoing background action that was interrupted. The interrupting event (se cortó) uses the preterite. This is the classic imperfect + preterite interrupted action pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the novel I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "terminaría",
      "termine"
    ],
    "correct": 1,
    "explanation": "The preterite (terminé) is used for a completed action with a clear, defined endpoint. 'Ayer' and 'por fin' are strong time markers signaling a single finished event, which calls for the indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and is used when there is no specific antecedent noun. 'Que' alone would be a simple connector, not capable of introducing a full embedded question here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo — ¡te lo mereces!",
    "en": "How great that you got that job — you deserve it!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "Accented 'qué' is used in exclamations to express an emotional reaction (how…! / what a…!). Unaccented 'que' introduces subordinate clauses but cannot carry the exclamatory force needed here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque el jefe siempre me critica delante de todos.",
    "en": "Lately I get really stressed because my boss always criticises me in front of everyone.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional reaction, use the first-person reflexive: 'me estreso' (yo → yo). 'Me estresa' would mean something external stresses me out, and 'me estresas' means you stress me out."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé por qué, pero ___ mucho cuando llegas tarde sin avisar.",
    "en": "I don't know why, but you really annoy me when you arrive late without telling me.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "te molestas"
    ],
    "correct": 1,
    "explanation": "When a second-person subject (tú) provokes a first-person reaction, the verb agrees with tú (molestas) and the pronoun me shows who is affected. This is the 'Yo y tú' pattern where the other person causes the feeling."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina japonesa.",
    "en": "If I had more free time, I would take a Japanese cooking course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "Hypothetical 'si' clauses in the present/future use the imperfect subjunctive in the condition and the conditional (haría) in the result clause. The conditional expresses what would happen in an unreal or unlikely scenario."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ al médico porque llevo una semana con fiebre.",
    "en": "Tomorrow I'm going to go to the doctor because I've had a fever for a week.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already decided or arranged, especially when there is a present reason or justification. 'Iré' is more neutral or distant; both are technically correct but 'voy a ir' feels more natural here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ lluvias intensas durante todo el fin de semana.",
    "en": "According to the forecast, there will be heavy rain throughout the entire weekend.",
    "options": [
      "habría",
      "habrá",
      "va a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "The future simple (habrá) is used for objective predictions or forecasts based on evidence, especially in formal or news-style contexts. The conditional (habría) would imply a hypothetical or reported speech context."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el protocolo de seguridad.",
    "en": "It is essential that all employees follow the safety protocol.",
    "options": [
      "siguen",
      "seguirán",
      "sigan",
      "seguían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es importante que) trigger the subjunctive in the following clause. The subjunctive 'sigan' expresses a requirement rather than a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto, ¿vale?",
    "en": "Call me as soon as you arrive at the airport, okay?",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the subjunctive when referring to a future event that has not yet happened. 'Llegas' (indicative) would describe a habitual present fact, not a future expectation."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco una secretaria que ___ tres idiomas y tenga experiencia en exportación.",
    "en": "I'm looking for a secretary who speaks three languages and has experience in exports.",
    "options": [
      "habla",
      "hablará",
      "hable",
      "hablaría"
    ],
    "correct": 2,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (the person may or may not exist), the subjunctive is required. If the speaker had a specific person in mind, the indicative 'habla' would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ las flores del jardín comunitario.",
    "en": "Please, don't pick the flowers from the community garden.",
    "options": [
      "coges",
      "cojas",
      "coge",
      "coges tú"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present subjunctive, not with the affirmative imperative form. 'No cojas' (subjunctive) is correct; 'no coges' sounds like a statement rather than a command."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen alguna pregunta, ___ al final de la presentación.",
    "en": "If you have any questions, ask them at the end of the presentation.",
    "options": [
      "pregunten",
      "preguntan",
      "pregunten ustedes",
      "preguntad"
    ],
    "correct": 0,
    "explanation": "The ustedes affirmative command uses the third-person plural present subjunctive form. 'Preguntad' is the vosotros form used in Spain; since context implies a formal or Latin American setting, 'pregunten' is the appropriate ustedes command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Ha",
      "Habrá",
      "Habría",
      "Haya"
    ],
    "correct": 1,
    "explanation": "The future perfect (habrá + participio) is used in Spanish to express probability or deduction about something that likely happened in the recent past. It is the equivalent of 'must have done' in English and reflects the speaker's speculation."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
