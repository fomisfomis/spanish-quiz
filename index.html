<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 23, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 23, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "ser",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though SER is not typically associated with location. ESTAR is used for the location of physical objects and people, not for scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "son",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary condition or current state, such as temperature at a given moment. SER would imply that being hot is a permanent, defining characteristic of the soup."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado con ese hombre! Dicen que ___ muy malo.",
    "en": "Watch out for that man! They say he is very evil.",
    "options": [
      "está",
      "es",
      "sea",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning depending on SER or ESTAR, 'ser malo' means to be a bad or evil person (a defining trait), while 'estar malo' means to be sick or feel unwell. The context here refers to character, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la dieta, María ___ delgadísima — casi no la reconocí.",
    "en": "After the diet, María was incredibly thin — I almost didn't recognize her.",
    "options": [
      "era",
      "fue",
      "estuvo",
      "estaba"
    ],
    "correct": 3,
    "explanation": "ESTAR is used for conditions that result from a change, especially when contrasting with a previous state. Here, being thin is presented as a noticeable change from before the diet, not as a permanent characteristic, so ESTAR (imperfecto) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ niño, mi abuelo me ___ cuentos todas las noches.",
    "en": "When I was a child, my grandfather told me stories every night.",
    "options": [
      "era / contaba",
      "fui / contó",
      "era / contó",
      "fui / contaba"
    ],
    "correct": 0,
    "explanation": "The Imperfecto is used for both background states ('era niño') and habitual or repeated past actions ('contaba cuentos todas las noches'). The Indefinido would imply a single completed event, which contradicts 'todas las noches'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading calmly when the phone suddenly rang.",
    "options": [
      "leía / sonó",
      "leí / sonaba",
      "leía / sonaba",
      "leí / sonó"
    ],
    "correct": 0,
    "explanation": "The Imperfecto ('leía') sets the ongoing background action, while the Indefinido ('sonó') marks the sudden interrupting event. This is the classic interrupted action structure in Spanish narration."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, mis amigos y yo ___ en un restaurante tailandés por primera vez.",
    "en": "Last Saturday, my friends and I ate at a Thai restaurant for the first time.",
    "options": [
      "comíamos",
      "comimos",
      "habíamos comido",
      "comiéramos"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for single, completed events anchored to a specific time in the past. Clues like 'el sábado pasado' and 'por primera vez' confirm this is a finished, one-time action."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con esa historia.",
    "en": "I don't understand what you're trying to tell me with that story.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what', and is used when 'what' refers to something unspecified or abstract. 'Que' alone is a simple conjunction linking two clauses, not a substitute for this type of embedded question."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo, ¡te lo mereces!",
    "en": "How great that you got that job, you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to express admiration or strong emotion, equivalent to 'how' or 'what a' in English. Without the accent, 'que' is simply a conjunction and cannot begin an exclamation of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con el nuevo jefe — nunca está de buen humor.",
    "en": "Lately I get stressed out a lot because of the new boss — he's never in a good mood.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "When a third-party element (like 'el nuevo jefe') causes a feeling in the speaker, the verb agrees with the cause (third person singular), not the speaker. This is the 'yo y el mundo' pattern, similar to how 'gustar' works: something stresses me = me estresa."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ muchísimo y luego te arrepientes.",
    "en": "Whenever we argue, you make me very angry and then you regret it.",
    "options": [
      "me enfado",
      "me enfadas",
      "me enfada",
      "nos enfadamos"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes an emotional reaction in the first person (yo), the verb takes the second-person ending: 'me enfadas' means 'you make me angry'. This is the 'yo y tú' pattern, distinct from 'me enfado' (I get angry on my own)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ a clases de pintura.",
    "en": "If I had more free time, I would go to painting classes.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses where the condition is contrary to reality or unlikely (si + imperfecto de subjuntivo), the main clause uses the Condicional Simple. The Futuro Simple is used for real or likely future plans, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Voy a llamar a la agencia mañana — seguramente nos ___ los billetes antes del viernes.",
    "en": "I'm going to call the agency tomorrow — they'll surely send us the tickets before Friday.",
    "options": [
      "enviarían",
      "envían",
      "enviarán",
      "hayan enviado"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for real, expected future actions, especially with time markers like 'antes del viernes'. The Condicional would imply a hypothetical or conditional outcome, which is not the case in this straightforward future prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿___ tú un trabajo así si el sueldo fuera tan bajo?",
    "en": "Would you accept a job like that if the salary were so low?",
    "options": [
      "Aceptarás",
      "Vas a aceptar",
      "Aceptarías",
      "Aceptes"
    ],
    "correct": 2,
    "explanation": "The Condicional is used to ask about hypothetical or imagined situations, equivalent to 'would' in English. The Futuro Simple ('aceptarás') asks about a real future intention, while the Condicional frames the question as a hypothesis tied to the low-salary condition."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ más agua y que ___ menos café.",
    "en": "The doctor recommends that you drink more water and that you drink less coffee.",
    "options": [
      "bebes / tomas",
      "bebas / tomes",
      "beber / tomar",
      "beberás / tomarás"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, suggestion, or desire (recomendar, querer, desear), a change of subject triggers the Subjuntivo in the subordinate clause. The infinitive is only used when both clauses share the same subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to a future event that has not yet happened. When referring to habitual or past actions, the Indicativo is used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el tren ___ a tiempo con este temporal de nieve.",
    "en": "I don't think the train will arrive on time in this snowstorm.",
    "options": [
      "llega",
      "llegará",
      "llegue",
      "llegara"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar, no parecer) trigger the Subjuntivo because the speaker is casting doubt on the proposition. When the opinion is affirmed ('creo que llega'), the Indicativo is used."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil encima de la mesa durante la cena.",
    "en": "Please, don't put your phone on the table during dinner.",
    "options": [
      "pongas",
      "pongas tú",
      "pon",
      "pones"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo, not with the affirmative imperative form. The affirmative 'pon' is correct for positive commands, but adding 'no' requires 'no pongas' (subjuntivo)."
  },
  {
    "topic": "Imperativo",
    "q": "El guía nos dijo: «___ el pasaporte a mano en todo momento, por favor.»",
    "en": "The guide told us: 'Keep your passport handy at all times, please.'",
    "options": [
      "Tengan",
      "Tienen",
      "Tendrán",
      "Tuvieran"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (both affirmative and negative), the form used is the third-person plural of the present Subjuntivo. This applies in both Latin American Spanish (where ustedes replaces vosotros) and in formal contexts everywhere."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "¿Por qué no contesta Ana? ___ dejado el teléfono en casa otra vez.",
    "en": "Why isn't Ana answering? She must have left her phone at home again.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Hubiera"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past, equivalent to 'must have' in English. This is distinct from its other use of expressing an action completed before a future reference point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
