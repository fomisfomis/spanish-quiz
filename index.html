<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 28, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 28, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. ESTAR is used for the physical location of objects and people, not for scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a current, temporary condition or state. The soup being hot is a changeable physical condition right now, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo para su edad — siempre sabe exactamente qué decir.",
    "en": "My grandfather is very clever for his age — he always knows exactly what to say.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With 'listo,' SER means 'clever/smart' as a personality trait, while ESTAR means 'ready.' Since the sentence describes an inherent characteristic of the grandfather, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, ___ completamente muerto.",
    "en": "After running ten kilometers, I am completely exhausted (dead).",
    "options": [
      "soy",
      "estoy",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' in this colloquial sense describes a temporary physical state resulting from an action. ESTAR + past participle often describes a resulting condition or state of being, not a permanent characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre siempre me leía un cuento antes de dormir.",
    "en": "When I was little, my mother always read me a story before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto (era) is used for habitual or repeated actions in the past and for setting background conditions. The word 'siempre' (always) signals a habitual past action, confirming the imperfecto is needed."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un mensaje cuando de repente se fue la luz.",
    "en": "I was writing a message when suddenly the lights went out.",
    "options": [
      "escribí",
      "escribía",
      "escribo",
      "he escrito"
    ],
    "correct": 1,
    "explanation": "The imperfecto (escribía) describes an ongoing background action that was in progress when it was interrupted. The interrupting event ('se fue la luz') uses the indefinido, while the action being interrupted uses the imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses intentando terminar.",
    "en": "Yesterday I finally finished the novel I had been trying to finish for months.",
    "options": [
      "terminaba",
      "terminé",
      "terminaré",
      "termine"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido (terminé) is used for completed actions with a clear endpoint in the past. 'Ayer' (yesterday) and 'por fin' (finally) are temporal markers that signal a single, finished event, requiring the indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and is used when referring to something unspecified or abstract. It acts as the object of 'entender,' replacing a noun. 'Que' alone is a conjunction and cannot open a noun clause this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo — ¡te lo mereces!",
    "en": "How great that you got that job — you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to express strong emotion or emphasis, equivalent to 'How...!' or 'What a...!' in English. It intensifies the adjective or adverb that follows it."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todas las reuniones innecesarias en la oficina.",
    "en": "Lately I get really stressed by all the unnecessary meetings at the office.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When something (a thing or situation) causes a feeling in you, the verb agrees with the subject causing the feeling — here 'las reuniones' (plural) is the subject, so the verb is third-person plural 'me estresan.' Wait — in this sentence the subject is 'todas las reuniones' so 'me estresa' would need the subject to be singular. Re-reading: the subject here is the implicit concept of 'all this,' but the intended pattern is 'something stresses me' → the thing is the grammatical subject and the person is the indirect object. Use 'me estresa' when a single thing causes stress in you, like the gustar construction."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me hablas en ese tono, ___ muchísimo.",
    "en": "When you talk to me in that tone, it bothers me a lot.",
    "options": [
      "me molesto",
      "te molestas",
      "me molestas",
      "se molesta"
    ],
    "correct": 2,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes a feeling in a first-person object (me). 'Me molestas' means 'you (tú) bother me,' where 'me' is the indirect object and the verb conjugates to agree with 'tú' as the subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomaba"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + imperfecto de subjuntivo), the main clause requires the condicional simple. The condicional expresses what would happen under an unreal or unlikely condition, not a real future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale a las ocho — ___ al aeropuerto a tiempo si salimos ahora.",
    "en": "The train leaves at eight — we will get to the airport on time if we leave now.",
    "options": [
      "llegaríamos",
      "lleguemos",
      "llegaremos",
      "llegamos"
    ],
    "correct": 2,
    "explanation": "When the condition is real and achievable (si + presente de indicativo), the main clause uses the futuro simple to express what will genuinely happen. The condicional would be used only for hypothetical or unreal scenarios."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He decidido que esta tarde ___ el informe antes de que llegue mi jefe.",
    "en": "I've decided that this afternoon I'm going to finish the report before my boss arrives.",
    "options": [
      "terminaría",
      "termino",
      "voy a terminar",
      "terminara"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention or plan that has already been decided. It emphasizes the speaker's intention and is more personal than the neutral futuro simple ('terminaré'), which is better for predictions or formal statements."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis compañeros ___ a tiempo a la reunión de mañana.",
    "en": "I hope my colleagues arrive on time for tomorrow's meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "After 'esperar que,' which expresses a wish or hope with a change of subject, the subjuntivo is required in the subordinate clause. The subjuntivo (lleguen) reflects uncertainty and desire rather than a statement of fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the subjuntivo because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would take the indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the analysis results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuve"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the subjuntivo when they refer to a future event that hasn't happened yet. If the sentence referred to a habitual or past action, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — necesito contarte algo importante.",
    "en": "Hey, wait a moment — I need to tell you something important.",
    "options": [
      "esperas",
      "espera",
      "esperes",
      "espere"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed using the third-person singular present indicative (él/ella form). 'Espera' is the correct tú imperative. 'Esperes' would be the negative tú imperative or a subjuntivo form."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el móvil encima de la mesa durante la cena, por favor.",
    "en": "Don't put your phone on the table during dinner, please.",
    "options": [
      "pongas",
      "pongas tú",
      "pones",
      "pon"
    ],
    "correct": 0,
    "explanation": "Negative tú imperatives are formed with 'no' + present subjuntivo. 'No pongas' uses the subjuntivo of 'poner.' The affirmative imperative 'pon' cannot be used in negative commands — only the subjunctive form is used for negative imperatives."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Carlos todavía no ha llegado. ___ perdido en el metro otra vez.",
    "en": "It's three in the afternoon and Carlos still hasn't arrived. He must have gotten lost on the metro again.",
    "options": [
      "Se habrá perdido",
      "Se perdería",
      "Se perderá",
      "Se perdió"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened. It functions as the 'future perfect of probability,' equivalent to 'must have done' or 'probably did' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
