<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 22, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 22, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (where something takes place), while ESTAR is used for the location of physical objects or people. Because a concert is an event, 'ser' is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese pastel — ___ envenenado, según la noticia.",
    "en": "Don't touch that cake — it is poisoned, according to the news.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'envenenado' describes a resulting state or condition that has been caused by an external action, not an inherent characteristic. The cake was made poisonous, so it is in that state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué sorpresa! Tu primo ___ muy listo para su edad.",
    "en": "What a surprise! Your cousin is very clever for his age.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever or smart' as an inherent personality trait, while ESTAR with 'listo' means 'ready'. Since the sentence praises natural intelligence, 'es' is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de trabajar doce horas, la directora ___ agotada.",
    "en": "After working twelve hours, the director is exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "sea"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with adjectives that describe a temporary physical or emotional state resulting from specific circumstances. Exhaustion here is a condition caused by the long workday, not a permanent trait."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre ___ un pastel de manzana los domingos.",
    "en": "When she was little, my grandmother always made an apple cake on Sundays.",
    "options": [
      "hacía",
      "hizo",
      "había hecho",
      "haga"
    ],
    "correct": 0,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when signaled by words like 'siempre' (always) or 'los domingos'. 'Hizo' would indicate a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ la cena cuando de repente sonó el timbre.",
    "en": "I was preparing dinner when suddenly the doorbell rang.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "preparo"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted, while the Indefinido ('sonó') expresses the sudden interrupting event. 'Preparaba' sets the scene; 'sonó' is the new event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, la empresa ___ un nuevo sistema de gestión.",
    "en": "Last year, the company implemented a new management system.",
    "options": [
      "implementaba",
      "implementó",
      "implementaría",
      "implementa"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed, bounded actions in the past. 'El año pasado' signals a finished time frame, and the action (implementing the system) was a one-time completed event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me quieres decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'the thing that', and it is used as the object of the verb 'entender'. 'Que' alone would be a simple connector and cannot stand as the object here without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien huele esta sopa de ajo!",
    "en": "How good this garlic soup smells!",
    "options": [
      "Lo que",
      "Que",
      "¡Qué",
      "¡Lo que"
    ],
    "correct": 2,
    "explanation": "'¡Qué + adjective/adverb!' is the standard Spanish structure for exclamations expressing intensity or surprise. 'Qué' here is an exclamatory adverb modifying 'bien', and it always carries a written accent mark."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando hay reuniones largas en la oficina.",
    "en": "Lately, I get very stressed when there are long meetings at the office.",
    "options": [
      "me estresan",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the speaker is both the agent and the recipient of the action (I stress myself), use the first-person reflexive: 'me estreso'. 'Me estresan' would mean external things stress me, and 'me estresa' requires a singular external subject."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupas",
      "me preocupo",
      "te preocupas",
      "me preocupa"
    ],
    "correct": 0,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) acts on a first-person object (me). The verb agrees with 'tú' as the subject, and 'me' is the indirect/direct object, giving 'me preocupas'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "hago"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is required in the main clause of a hypothetical 'si + Imperfecto Subjuntivo' sentence. It expresses what would happen under an unreal or unlikely condition, distinguishing it from the Futuro which states real plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el billete comprado: ___ a Bangkok el próximo jueves.",
    "en": "I have the ticket bought: I'm going to Bangkok next Thursday.",
    "options": [
      "iría",
      "voy a viajar",
      "viajaría",
      "viaje"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a near-future plan with concrete evidence or strong intention (the ticket is already bought). 'Iré' would also be acceptable but feels less immediate; 'iría' belongs to the conditional and implies doubt or hypothesis."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho viento en la costa.",
    "en": "According to the forecast, tomorrow there will be a lot of wind on the coast.",
    "options": [
      "habría",
      "hay",
      "habrá",
      "haya"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for predictions and statements about future events based on external evidence (a weather forecast). 'Habría' is conditional, implying a hypothetical rather than a straightforward prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho vasos de agua al día.",
    "en": "The doctor recommends that you drink at least eight glasses of water a day.",
    "options": [
      "bebes",
      "beberás",
      "bebas",
      "beber"
    ],
    "correct": 2,
    "explanation": "After verbs of recommendation, advice, or desire ('recomendar'), Spanish requires the Subjunctive in the subordinate clause when there is a change of subject. 'Bebas' is the present subjunctive of 'beber' for 'tú'."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ el resultado del examen.",
    "en": "Call me as soon as you get the exam result.",
    "options": [
      "sabes",
      "sepas",
      "sabrás",
      "supieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjunctive when they refer to a future event that has not yet happened. 'Sabes' (indicative) would describe a habitual present fact, not a future event."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los empleados ___ sus derechos laborales.",
    "en": "It is fundamental that employees know their labor rights.",
    "options": [
      "conocen",
      "conocerán",
      "conozcan",
      "conocieran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental, es importante, es necesario) trigger the Subjunctive in the following 'que' clause. 'Conozcan' is the present subjunctive of 'conocer' for 'ellos'."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la ventana antes de salir, que hace frío afuera.",
    "en": "Please close the window before going out, it's cold outside.",
    "options": [
      "cierras",
      "cierres",
      "cierra",
      "cerrar"
    ],
    "correct": 2,
    "explanation": "The affirmative 'tú' imperative of stem-changing verbs like 'cerrar' (e→ie) is formed using the third-person singular present indicative form: 'cierra'. The negative command would use the subjunctive: 'no cierres'."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe sin revisarlo dos veces, por favor.",
    "en": "Don't send the report without reviewing it twice, please.",
    "options": [
      "manda",
      "mandas",
      "mandes",
      "mandará"
    ],
    "correct": 2,
    "explanation": "Negative 'tú' commands are formed with 'no + present subjunctive'. The affirmative imperative 'manda' cannot be used in negative commands; the subjunctive form 'mandes' is required for all negative tú imperatives."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro mis llaves. Las ___ dejado en la oficina.",
    "en": "I can't find my keys. I must have left them at the office.",
    "options": [
      "habré",
      "habría",
      "haya",
      "he"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a past event from a present perspective. It conveys 'I must have / probably have', making it the correct choice to speculate about where the keys were left."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
