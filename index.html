<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 24, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 24, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR is used for the location of physical objects and people, but for scheduled events (conferences, concerts, parties), Spanish uses SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante y te va a arder la boca.",
    "en": "Don't touch that sauce — it's very spicy and it will burn your mouth.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used here because being spicy is an inherent characteristic of the sauce, not a temporary or changed state. Permanent or defining qualities of things use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado! El pescado ___ malo — lo dejaron fuera del frigorífico toda la noche.",
    "en": "Be careful! The fish is bad/spoiled — they left it outside the fridge all night.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, ESTAR is used to describe a resulting state or condition. 'Estar malo' means something has gone bad or spoiled (a change of state), while 'ser malo' would mean it is inherently of poor quality or morally bad."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de aprobar todos los exámenes, mi hermana ___ muy lista para empezar la carrera.",
    "en": "After passing all the exams, my sister is very ready to start her degree.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "'Estar listo/a' means to be ready (a state you are currently in), while 'ser listo/a' means to be clever or smart (an inherent trait). Since the sentence describes readiness as a result of completing the exams, ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, mi abuelo siempre me ___ cuentos antes de dormir.",
    "en": "When I was a child, my grandfather always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things that 'used to' happen regularly. The adverb 'siempre' (always) combined with 'cuando era niño' signals a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando los informes cuando de repente el sistema ___ .",
    "en": "I was reviewing the reports when suddenly the system crashed.",
    "options": [
      "se caía",
      "se cayó",
      "se ha caído",
      "se hubiera caído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the ongoing background action uses Imperfecto ('estaba revisando'), while the interrupting event uses Indefinido. 'Se cayó' is a completed, punctual event that cut through the ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmara"
    ],
    "correct": 1,
    "explanation": "Indefinido is used for single completed actions at a specific point in the past. 'El año pasado' is a closed, finished time frame that signals a completed event, so Indefinido (firmó) is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a noun clause meaning 'what' in the sense of 'that which.' It acts as the object of 'entiendo.' 'Que' alone would need a prior antecedent, and 'qué' is used in direct or indirect questions with interrogative meaning."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ interesante es que nadie en la reunión se dio cuenta del error.",
    "en": "How interesting it is that nobody at the meeting noticed the mistake.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' is used in exclamatory constructions to express surprise or emphasis, equivalent to 'How…!' in English. 'Lo que' would function as a noun clause, and bare 'que' is a conjunction, neither of which fits an exclamation here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo que hablar en público.",
    "en": "Lately I get very nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso yo",
      "te pones nervioso",
      "me pone nervioso",
      "nos ponemos nerviosos"
    ],
    "correct": 0,
    "explanation": "This is a 'yo y yo' pattern: the subject causes a reaction in themselves. 'Ponerse nervioso' is reflexive — the subject (yo) experiences the state because of their own situation, so the reflexive pronoun 'me' matches the first-person subject."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé cómo decirte esto, pero a veces ___ cuando llegas tarde sin avisar.",
    "en": "I don't know how to tell you this, but sometimes you make me angry when you arrive late without warning.",
    "options": [
      "me enojo",
      "me enojas",
      "me enoja",
      "nos enojamos"
    ],
    "correct": 1,
    "explanation": "This is a 'yo y tú' pattern: a second person (tú) causes an emotional reaction in the speaker (me). The verb 'enojar' works like 'molestar' — the subject is the person causing the feeling (tú), so the verb conjugates in second person: 'me enojas.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina japonesa.",
    "en": "If I had more free time, I would take a Japanese cooking course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical 'si' clauses that describe an unlikely or contrary-to-fact condition (si + Imperfecto de Subjuntivo), the result clause requires the Condicional Simple. Futuro Simple is reserved for real, open conditions (si + Presente de Indicativo)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el parte meteorológico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the weather forecast, it will be very hot along the entire coast tomorrow.",
    "options": [
      "haría",
      "va a hacer",
      "hará",
      "haga"
    ],
    "correct": 2,
    "explanation": "Futuro Simple expresses a neutral, straightforward prediction about the future, especially in formal contexts like weather reports. Both 'hará' and 'va a hacer' are possible, but Futuro Simple is the standard choice for official or impersonal predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me puedes decir qué ___ si descubrieras que tu jefe te ha mentido?",
    "en": "Can you tell me what you would do if you found out your boss had lied to you?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is used to speculate about hypothetical situations and to soften or distance statements. Here the question asks what someone 'would do' in an imagined scenario, requiring the Condicional, not a real future plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el vuelo no ___ retraso esta vez.",
    "en": "I hope the flight doesn't have a delay this time.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "After verbs of wishing or hoping (esperar, querer, desear) with a change of subject, the subordinate clause requires the Subjuntivo Presente. 'Espero que' triggers Subjuntivo because it expresses a desire about someone/something else's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the analysis results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' when referring to a future action, Spanish requires the Subjuntivo Presente. Using Indicativo Presente ('tengo') would imply a habitual present action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que,' 'no pensar que,' and 'no parecer que' require the Subjuntivo in the dependent clause because they signal doubt or denial rather than assertion of fact. The affirmative 'creo que' would take Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la ventana, por favor — hay demasiado ruido de la calle.",
    "en": "Hey, close the window, please — there's too much noise from the street.",
    "options": [
      "cierra",
      "cierras",
      "cierres",
      "cerrar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for stem-changing verbs like 'cerrar' (e→ie) is formed using the third-person singular present indicative form: 'cierra.' The negative tú command ('no cierres') uses the Subjuntivo, but for affirmative commands, Indicativo 3rd person singular applies."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe sin revisar los datos del último trimestre.",
    "en": "Don't send the report without reviewing last quarter's data.",
    "options": [
      "manda",
      "mandas",
      "mandes",
      "mandar"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are always formed with the Subjuntivo Presente: 'no mandes.' Unlike affirmative commands, which use the 3rd-person Indicativo form, all negative commands (tú, usted, ustedes, vosotros) use the Subjuntivo."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Sofía todavía no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Sofía still hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habrá sido",
      "Habrá perdido",
      "Hubiera perdido"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto is used to express probability or logical deduction about something that likely happened in the recent past. 'Habrá perdido' conveys the speaker's reasoned guess ('she must have missed it'), not a future action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
