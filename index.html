<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 21, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 21, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio central esta noche.",
    "en": "The concert is at the central stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (concerts, meetings, parties). ESTAR is used for the location of physical objects and people, but events 'take place' with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary physical states or conditions, such as temperature at a given moment. The soup is not inherently hot by nature; it is hot right now."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo — siempre sabe la respuesta antes que nadie.",
    "en": "My grandfather is very clever — he always knows the answer before anyone else.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "With SER, 'listo' means clever or intelligent as a permanent characteristic. With ESTAR, 'listo' means ready. Since we are describing a personality trait, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, los niños ___ agotados.",
    "en": "After walking ten kilometers, the children are exhausted.",
    "options": [
      "son",
      "están",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a change of state or a condition that results from an action. The children became exhausted because of the walk — it is not a defining trait, it is a current state."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre siempre me leía cuentos antes de dormir.",
    "en": "When I was little, my mother always read me stories before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past and for background descriptions. 'Siempre me leía' describes a routine, and 'era pequeña' sets the background time frame."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ el informe cuando de repente se fue la luz.",
    "en": "I was writing the report when the power suddenly went out.",
    "options": [
      "escribí",
      "escribía",
      "escribiré",
      "haya escrito"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for an ongoing background action that gets interrupted. 'Escribía' (was writing) provides the context, while 'se fue' (Indefinido) is the sudden interrupting event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Paula ___ un nuevo trabajo en Barcelona y se mudó allí.",
    "en": "Last year, Paula found a new job in Barcelona and moved there.",
    "options": [
      "encontraba",
      "encontró",
      "ha encontrado",
      "encuentre"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed, specific actions at a defined point in the past. 'El año pasado' marks a closed time frame, and finding the job was a single completed event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what / the thing that' and is used when referring to something non-specific. 'Que' alone would require a prior noun antecedent, which is absent here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas aprobado el examen de conducir al primer intento!",
    "en": "How great that you passed your driving test on the first try!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express surprise, admiration, or strong emotion, often followed by an adjective, adverb, or noun. It is not a conjunction like 'que'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo extra que tengo.",
    "en": "Lately I stress myself out a lot with all the extra work I have.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject and the object of the action are the same person (yo), the reflexive pronoun 'me' is used with a first-person verb form. This is the 'Yo y yo' pattern — the subject acts upon themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "This is the 'Yo y tú' pattern: a second-person subject (tú) affects a first-person object (me). The verb agrees with 'tú' (estresas) while 'me' shows who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ a estudiar pintura.",
    "en": "If I had more free time, I would go to study painting.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya"
    ],
    "correct": 2,
    "explanation": "In a hypothetical conditional sentence using the imperfect subjunctive (si tuviera), the result clause requires the Condicional Simple (iría), not the Futuro. This expresses an unreal or unlikely scenario."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ a hablar con mi jefa sobre el aumento de sueldo — ya lo tengo decidido.",
    "en": "Tomorrow I am going to talk to my boss about the raise — I've already decided.",
    "options": [
      "hablaré",
      "hablaría",
      "voy a hablar",
      "hable"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a planned, decided near-future action. It is preferred when there is clear intention or a decision already made, while 'hablaré' (Futuro Simple) sounds more open or distant."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ bastante frío en la sierra este fin de semana.",
    "en": "According to the forecast, it will be quite cold in the mountains this weekend.",
    "options": [
      "haría",
      "hará",
      "hace",
      "vaya a hacer"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for predictions and statements about the future, especially based on objective information like weather forecasts. The Condicional would require a conditional or hypothetical context."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ el formulario antes del viernes.",
    "en": "It is important that all employees complete the form before Friday.",
    "options": [
      "completan",
      "completarán",
      "completen",
      "completaban"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of importance, necessity, or obligation (es importante que, es necesario que) trigger the Subjunctivo in the dependent clause because they express a subjective evaluation rather than a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del hospital.",
    "en": "Call me as soon as you get news from the hospital.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que', when referring to a future action, require the Subjuntivo. This is because the event has not yet happened and is therefore not factual."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante ___ tan bueno como dicen.",
    "en": "I don't think the new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que) trigger the Subjuntivo because the speaker is expressing doubt or denial about the truth of the proposition."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión, es una falta de respeto.",
    "en": "Please don't use your phone during the meeting — it's disrespectful.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "usa"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo (no uses, no hagas, no vengas). The affirmative tú command 'usa' cannot be used in a negative command — the subjunctive form is required."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad en todo momento.",
    "en": "Ladies and gentlemen, fasten your seatbelts at all times.",
    "options": [
      "abrochen",
      "abrochan",
      "abrochéis",
      "abrocha"
    ],
    "correct": 0,
    "explanation": "Commands directed at 'ustedes' (used throughout Latin America and in formal contexts in Spain) use the third-person plural Subjuntivo form. 'Abrochen' is the ustedes imperative of 'abrocharse'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía — ___ perdido el autobús otra vez.",
    "en": "Marcos hasn't arrived yet — he must have missed the bus again.",
    "options": [
      "habrá perdido",
      "habrá perdiendo",
      "habría perdido",
      "haya perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when seen from the present. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
