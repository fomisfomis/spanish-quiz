<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 07, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 07, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it is very hot still.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe temporary physical states or conditions, such as the current temperature of food. SER would imply it is inherently and permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Antes era muy delgada, pero después del embarazo ___ bastante rellenita.",
    "en": "She used to be very thin, but after the pregnancy she is quite plump.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR signals a change of state — the speaker is highlighting that her current condition is different from before. Using SER would treat it as a fixed, permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino ___ muy listo; siempre encuentra una solución para todo.",
    "en": "My neighbor is very clever; he always finds a solution for everything.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever/smart' as an inherent quality, while ESTAR means 'ready'. Since the sentence describes an ongoing personality trait, SER is correct here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (ir) a la playa todos los veranos con mis abuelos.",
    "en": "When I was a child, I used to go to the beach every summer with my grandparents.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los veranos' is a key indicator that this was a recurring habit, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ (preparar) la cena, sonó el teléfono.",
    "en": "While I was preparing dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "prepararé"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action (preparing dinner) that was interrupted by a completed event (the phone rang). The interrupted action always takes the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas escribiendo.",
    "en": "Yesterday I finally finished the report that I had been writing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a single, completed action at a specific point in the past. 'Ayer' and 'por fin' both signal a one-time completed event with a clear endpoint."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what', referring to an unspecified thing. 'Que' alone cannot introduce an embedded question or refer back to something unspecified without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "No tienes ___ preocuparte; ya lo he resuelto yo.",
    "en": "You don't have to worry; I've already sorted it out.",
    "options": [
      "lo que",
      "de qué",
      "que",
      "por qué"
    ],
    "correct": 2,
    "explanation": "'No tener que + infinitivo' is a fixed structure meaning 'not to have to do something'. Here 'que' acts as a connector between the verb 'tener' and the infinitive, not as a relative pronoun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con tanto trabajo acumulado.",
    "en": "Lately I stress out a lot with so much accumulated work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "When the subject causes the action upon themselves (yo → yo), use a reflexive construction: me estreso. 'Me estresas' would mean 'you stress me out', and 'me estresa' needs a third-party subject like 'el trabajo'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "te preocupas",
      "me preocupas",
      "se preocupa"
    ],
    "correct": 2,
    "explanation": "Here the action flows from a second person (tú) to a first person (yo): tú → me. The verb agrees with the subject 'tú' (preocupas) and the object pronoun 'me' marks who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ (hacer)?",
    "en": "If you had more free time, what would you do?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical 'si' sentence when the condition uses the Imperfecto de Subjuntivo. It expresses what would happen in an unlikely or imagined scenario."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde.",
    "en": "According to the forecast, tomorrow it will rain in the afternoon.",
    "options": [
      "llovaría",
      "va a llover",
      "llueva",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "The Futuro Simple is used to make predictions or statements about future events based on known information, like a weather forecast. 'Voy a + infinitivo' would also work but implies more immediate or personal certainty."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me prometió que ___ (llamar) en cuanto llegara al aeropuerto.",
    "en": "He promised me that he would call as soon as he arrived at the airport.",
    "options": [
      "llamará",
      "llamaría",
      "va a llamar",
      "llame"
    ],
    "correct": 1,
    "explanation": "After verbs of saying or promising in past tense (prometió), the reported future action shifts to the Condicional. The Futuro Simple cannot be used here because the reference point is in the past, not the present."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que la reunión no ___ (durar) más de una hora.",
    "en": "I hope the meeting doesn't last more than an hour.",
    "options": [
      "dura",
      "durará",
      "dure",
      "duró"
    ],
    "correct": 2,
    "explanation": "After 'esperar que', the Subjuntivo is mandatory because it expresses a wish or desire about a different subject. The main clause subject (yo) differs from the subordinate subject (la reunión)."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) los invitados, podemos empezar a cenar.",
    "en": "As soon as the guests arrive, we can start having dinner.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', or 'hasta que' referring to a future event, Spanish requires the Subjuntivo. Using the Indicative would imply a habitual or established fact, not a future event."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (ser) tan bueno como dicen.",
    "en": "I don't think that restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the Subjuntivo in the subordinate clause because they express doubt or denial about the truth of something. 'Creo que es...' (affirmative) would use the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ (tocar) eso — está recién pintado!",
    "en": "Don't touch that — it's just been painted!",
    "options": [
      "tocas",
      "toques",
      "toca",
      "toque"
    ],
    "correct": 1,
    "explanation": "Negative 'tú' commands always use the present Subjuntivo form: no toques. The affirmative command 'toca' cannot be used with negation; 'no tocas' would be a statement, not a command."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrochar) sus cinturones antes del despegue.",
    "en": "Ladies and gentlemen, please fasten your seatbelts before takeoff.",
    "options": [
      "abrocha",
      "abrochad",
      "abróchense",
      "abróchate"
    ],
    "correct": 2,
    "explanation": "In Latin America and in formal contexts, 'ustedes' commands are used instead of 'vosotros'. They are formed with the third-person plural of the Subjuntivo, and reflexive/object pronouns attach to the end: abróchense."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ (quedarse) dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Se quedará dormido",
      "Se habrá quedado dormido",
      "Se quedó dormido",
      "Se habría quedado dormido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto can express probability or deduction about a past event from the perspective of the present. The speaker is speculating about what has already happened, equivalent to 'he must have...' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
