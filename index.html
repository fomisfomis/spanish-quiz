<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 21, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 21, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, not ESTAR. ESTAR is used for the location of physical objects and people, but scheduled events (concerts, conferences, weddings) require SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ¡___ malo desde hace tres días!",
    "en": "Don't touch that cheese — it's been bad for three days!",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is spoiled (a temporary, changed state). SER + malo means something is inherently bad or evil by nature, which is a different meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe exactamente qué decir.",
    "en": "My grandmother is very clever — she always knows exactly what to say.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means to be clever or sharp as a permanent character trait. ESTAR + listo/a means to be ready (for something), so the choice of verb completely changes the meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después del entrenamiento, los jugadores ___ agotados.",
    "en": "After the training session, the players are exhausted.",
    "options": [
      "son",
      "sean",
      "están",
      "estén"
    ],
    "correct": 2,
    "explanation": "ESTAR is used with adjectives that describe a resulting state or condition that has come about through a process or event. Exhaustion after training is a temporary state, not an inherent characteristic, so ESTAR is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (vivir) cerca del mar y cada verano nadaba todos los días.",
    "en": "When I was little, I used to live near the sea and every summer I swam every day.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "habré vivido"
    ],
    "correct": 1,
    "explanation": "Imperfecto is used for habitual or repeated actions in the past and for background states. The context 'cuando era pequeña' and the ongoing routine framing both signal Imperfecto, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (ducharse) cuando de repente sonó el teléfono.",
    "en": "I was showering when suddenly the phone rang.",
    "options": [
      "me duché",
      "me duchaba",
      "me he duchado",
      "me duchara"
    ],
    "correct": 1,
    "explanation": "When one action is interrupted by another, the ongoing background action uses Imperfecto (me duchaba) while the interrupting completed event uses Indefinido (sonó). The phrase 'de repente' signals the sudden interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ (conseguir) el trabajo que tanto quería después de cinco entrevistas.",
    "en": "Last year I got the job I had wanted so much after five interviews.",
    "options": [
      "conseguía",
      "consiguiera",
      "conseguí",
      "he conseguido"
    ],
    "correct": 2,
    "explanation": "Pretérito Indefinido marks a single, completed action at a specific point in the past. 'El año pasado' anchors the event to a finished time period, and getting the job was a one-time completed achievement, not a habitual state."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando explicar.",
    "en": "I don't understand what you are trying to explain to me.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a nominalised relative pronoun meaning 'that which' or 'what' and introduces a noun clause referring to an idea or thing. 'Que' alone would need a clear antecedent, and 'qué' is an interrogative used in direct or indirect questions with a questioning nuance."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ bonito está el jardín desde que plantaste las rosas!",
    "en": "How beautiful the garden looks since you planted the roses!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "Qué (with an accent) is used in exclamations to express admiration, surprise, or strong emotion before adjectives, adverbs, or nouns. Without the accent, que is a subordinating conjunction or relative pronoun, which would not be grammatically correct here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todas las responsabilidades del trabajo.",
    "en": "Lately I stress myself out a lot with all the work responsibilities.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "Me estreso is the 'yo y yo' pattern — the subject performs an action on themselves (yo me estreso). This is different from me estresas (you stress me out) or me estresa el tráfico (traffic stresses me out), where an external agent causes the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas planes sin avisar, ___ mucho.",
    "en": "Every time you cancel plans without warning, you frustrate me a lot.",
    "options": [
      "me frustro",
      "me frustra",
      "me frustras",
      "nos frustramos"
    ],
    "correct": 2,
    "explanation": "Me frustras is the 'yo y tú' pattern — a second-person subject (tú) performs an action that affects the first person (me). This is different from me frustro (I frustrate myself) or me frustra algo (something frustrates me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "In hypothetical or contrary-to-fact conditionals with si + Imperfecto de Subjuntivo, the result clause requires Condicional Simple, not Futuro. Futuro would imply the condition is likely to be fulfilled, whereas Condicional expresses an imagined or unlikely scenario."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tranquila, la reunión termina a las tres, así que ___ (llegar) a tu cita sin problema.",
    "en": "Don't worry, the meeting ends at three, so you will arrive at your appointment without a problem.",
    "options": [
      "llegarías",
      "llegarás",
      "llegues",
      "llegaras"
    ],
    "correct": 1,
    "explanation": "Futuro Simple expresses a straightforward prediction or expectation about something likely to happen. Condicional would imply a hypothesis or a condition not yet established, but here the speaker is reassuring someone about a concrete, anticipated outcome."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿___ (poder, tú) ayudarme a mover estos muebles este fin de semana?",
    "en": "Could you help me move this furniture this weekend?",
    "options": [
      "Podrás",
      "Vas a poder",
      "Podrías",
      "Puedas"
    ],
    "correct": 2,
    "explanation": "Condicional Simple is commonly used to make polite requests, softening the directness of an ask. Podrás (Futuro) would sound like a presumptuous assumption rather than a polite question, while Podrías is the conventional choice for courteous requests."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ (hacer) ejercicio moderado tres veces a la semana.",
    "en": "The doctor recommends that you do moderate exercise three times a week.",
    "options": [
      "haces",
      "harás",
      "hagas",
      "hiciste"
    ],
    "correct": 2,
    "explanation": "Verbs of recommendation, advice, or wish (recomendar, querer, sugerir) trigger Subjuntivo in the subordinate clause when the subject changes. The structure 'recomienda que + subjuntivo' is a classic example of subjunctive after a verb of volition."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que tu hermano ___ (tener) razón en este caso.",
    "en": "I don't think your brother is right in this case.",
    "options": [
      "tiene",
      "tendrá",
      "tenga",
      "tuvo"
    ],
    "correct": 2,
    "explanation": "Negated opinion verbs (no creo que, no pienso que, no me parece que) require the Subjuntivo in the dependent clause because the speaker is expressing doubt or denial rather than asserting a fact. The affirmative creo que would take Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like en cuanto, cuando, tan pronto como, and hasta que require Subjuntivo when they refer to a future event that has not yet happened. If the event were habitual or in the past, Indicativo would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (enviar, tú) ese correo todavía — necesito revisarlo.",
    "en": "Please, don't send that email yet — I need to review it.",
    "options": [
      "envías",
      "envía",
      "envíes",
      "enviaste"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are formed with the present Subjuntivo, not the affirmative imperative form. The affirmative tú command would be 'envía', but to negate it you must say 'no envíes', using the subjunctive form."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) el cinturón de seguridad inmediatamente.",
    "en": "Ladies and gentlemen, fasten your seatbelts immediately.",
    "options": [
      "abróchense",
      "se abrochen",
      "abróchate",
      "os abrochéis"
    ],
    "correct": 0,
    "explanation": "Ustedes affirmative commands are formed using the third-person plural present Subjuntivo, and reflexive pronouns attach directly to the end of the imperative verb. In Latin American Spanish, ustedes replaces vosotros for all formal and informal plural address."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Lucía aún no ha llegado. ___ (perderse) con las nuevas indicaciones.",
    "en": "It's eleven at night and Lucía still hasn't arrived. She must have got lost with the new directions.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdería",
      "Se pierda"
    ],
    "correct": 1,
    "explanation": "Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened in the past or recent past. The speaker does not know for certain but is making a logical inference about a completed action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
