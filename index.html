<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 11, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 11, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de jazz ___ en el teatro municipal este viernes.",
    "en": "The jazz concert is at the municipal theater this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to indicate the location of events, even though location normally uses ESTAR. Events (concerts, meetings, parties) are an exception: 'el concierto es en el teatro' tells us where the event takes place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese chile — ___ muy picante y te va a arder la boca.",
    "en": "Don't touch that chili — it's very spicy and it'll burn your mouth.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Use SER for inherent or defining characteristics of things. Spiciness here is an intrinsic property of the chili, not a temporary state. Compare 'el café está frío' (temporary) vs 'el chile es picante' (characteristic)."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de una semana en la playa, mi abuela ___ muy viva — bromeaba con todos y cantaba canciones.",
    "en": "After a week at the beach, my grandmother was very lively — she was joking with everyone and singing songs.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + 'vivo/a' means to be lively or full of energy (a temporary state). SER + 'vivo/a' means to be alive (a permanent condition) or to be clever. Context here describes a temporary, observed mood, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La sopa que preparaste ___ riquísima — ¿me das la receta?",
    "en": "The soup you made was absolutely delicious — will you give me the recipe?",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR + 'rico/a' means something tastes good (a sensory experience). SER + 'rico/a' means someone is wealthy. Since we're describing how the food tasted, ESTAR is used. The imperfect 'estaba' fits the context of describing taste during the meal."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi madre siempre me ___ un cuento antes de dormir.",
    "en": "When I was little, my mother always told me a story before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated past actions, especially when signals like 'siempre,' 'todos los días,' or 'cuando era pequeño/a' appear. The action wasn't a single completed event but a recurring routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente en el parque cuando de repente empezó a llover a cántaros.",
    "en": "I was reading calmly in the park when it suddenly started to pour.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the imperfecto and the sudden interrupting event uses the indefinido. 'Leía' sets the scene; 'empezó' is the new completed event that interrupted it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Daniela ___ un nuevo trabajo y cambió completamente su estilo de vida.",
    "en": "Last year, Daniela found a new job and completely changed her lifestyle.",
    "options": [
      "encontraba",
      "encontró",
      "ha encontrado",
      "encontraría"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido is used for completed, bounded past events, especially with time markers like 'el año pasado,' 'ayer,' or 'en 2020.' Finding a job and changing lifestyle are both specific completed events, not ongoing states or habits."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what' (the thing that). It acts as the object of 'entender.' 'Que' alone would need an antecedent noun, and 'qué' with an accent is used in direct or indirect questions, not relative clauses embedded in statements."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ bien huele este pan recién horneado!",
    "en": "How wonderful this freshly baked bread smells!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express intensity or surprise, equivalent to 'how' or 'what a' in English. Without the accent, 'que' is a conjunction or relative pronoun and cannot open an exclamatory sentence this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo que hablar en público — se me traba la lengua.",
    "en": "Lately I get very nervous when I have to speak in public — my tongue gets tied.",
    "options": [
      "me pongo nervioso yo mismo",
      "me pones nervioso",
      "me pone nervioso",
      "me nervioso"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or physical state (Yo y yo pattern), a reflexive or pronominal verb is used where the subject and object refer to the same person. 'Me pongo nervioso' = I make myself nervous / I get nervous. 'Me pones' would mean 'you make me nervous' and 'me pone' would need a third-person cause."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que escucho esa canción, ___ — tiene algo muy especial.",
    "en": "Every time I hear that song, it moves me — there's something very special about it.",
    "options": [
      "me emociono a mí mismo",
      "te emocionas",
      "me emociona",
      "me emociono contigo"
    ],
    "correct": 2,
    "explanation": "When an external, third-person thing (a song, a film, news) causes an emotional reaction in the speaker, the verb agrees with the third-person cause: 'la canción me emociona' (Yo y el mundo pattern). This mirrors the structure of 'me gusta,' 'me sorprende,' etc."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ la cocina entera.",
    "en": "If we had more budget, we would renovate the entire kitchen.",
    "options": [
      "renovaremos",
      "renovaríamos",
      "vamos a renovar",
      "renovemos"
    ],
    "correct": 1,
    "explanation": "In hypothetical or contrary-to-fact conditional sentences with 'si + imperfecto de subjuntivo,' the main clause always uses the condicional simple. The condicional expresses what would happen under an imagined condition, not a real future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que ___ esta tarde.",
    "en": "Look at those dark clouds — I think it's going to rain this afternoon.",
    "options": [
      "llovería",
      "lloverá",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "'Voy/va a + infinitivo' is preferred for near-future events when there is visible evidence or a concrete reason to expect something. Dark clouds are immediate evidence, making 'va a llover' the most natural choice. 'Lloverá' would work too but sounds more formal or distant."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mi jefa dijo que ___ los resultados del proyecto en la reunión del lunes.",
    "en": "My boss said she would present the project results at Monday's meeting.",
    "options": [
      "presentará",
      "presentaría",
      "va a presentar",
      "presente"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said they would do (indirect speech about the future in the past), Spanish uses the condicional, not the futuro. The condicional here is the 'future of the past': from the past speaker's point of view, the action was still ahead."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿A qué hora ___ los invitados mañana? Necesito organizar los asientos.",
    "en": "What time will the guests arrive tomorrow? I need to organise the seating.",
    "options": [
      "llegarían",
      "llegaron",
      "llegarán",
      "van a llegar"
    ],
    "correct": 2,
    "explanation": "The futuro simple is used for scheduled or expected future events, especially when asking about specific times or plans. Both 'llegarán' and 'van a llegar' are possible, but 'llegarán' is more neutral and common in questions about future timing. 'Llegarían' implies a hypothetical condition."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el informe antes del viernes.",
    "en": "It is essential that all employees submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregaran"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of obligation, necessity, or importance (es fundamental que, es necesario que, es importante que) trigger the subjuntivo in the subordinate clause because they express a wish or demand about someone else's actions, not a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto — estaré esperándote.",
    "en": "Call me as soon as you arrive at the airport — I'll be waiting for you.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' 'hasta que,' and 'tan pronto como' require the subjuntivo when referring to future events. Since the arrival hasn't happened yet, the subjuntivo 'llegues' is used, even though 'cuando llegas' would be correct for habitual present actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del centro y que no sea demasiado ruidoso.",
    "en": "I'm looking for an apartment that is near the centre and that isn't too noisy.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or unknown (you haven't found the apartment yet), the subjuntivo is used. 'Busco un apartamento que esté cerca' refers to an unspecified, possibly non-existent place. If you were describing a specific known apartment, you'd use the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ¡no ___ el móvil en la mesa durante la cena — es una norma de la casa!",
    "en": "Hey, don't put your phone on the table during dinner — it's a house rule!",
    "options": [
      "pongas",
      "pongas tú",
      "pongas usted",
      "pon"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjuntivo form: 'no pongas.' The affirmative tú command would be 'pon' (irregular), but negation switches to subjuntivo. This applies to all verbs: no hables, no vengas, no digas, etc."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad antes del despegue.",
    "en": "Ladies and gentlemen, please fasten your seatbelts before takeoff.",
    "options": [
      "abrochen",
      "abrocen",
      "abrocéis",
      "abrochan"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (affirmative), the form is the third-person plural present subjuntivo: 'abrochen.' In Latin America, 'ustedes' replaces 'vosotros' for all plural address, so this form is standard. 'Abrocéis' would be the vosotros subjuntivo used in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marcos no ha llegado a la reunión. ___ olvidado la cita.",
    "en": "It's three in the afternoon and Marcos hasn't arrived at the meeting. He must have forgotten the appointment.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) expresses probability or deduction about a past event when the speaker is in the present. It is equivalent to 'must have + past participle' in English. Here the speaker deduces what probably happened in the past based on present evidence."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
