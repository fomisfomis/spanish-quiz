<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 18, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 18, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where they take place, even though location normally triggers ESTAR. The rule is: SER + location applies to scheduled events, while ESTAR + location applies to physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it has been bad for three days.",
    "options": [
      "es",
      "está",
      "sea",
      "sería"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'malo' describes a temporary condition (spoiled/gone off), a change of state. 'Es malo' would mean the cheese is inherently bad in quality or character, a permanent trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ___ muy lista para encontrar soluciones creativas.",
    "en": "My grandmother has always been very clever at finding creative solutions.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "'Ser listo/a' means to be clever or smart as an inherent personality trait, so SER is correct. 'Estar listo/a' would mean to be ready, which is a temporary state, not what is described here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después del maratón, los corredores ___ agotados pero felices.",
    "en": "After the marathon, the runners were exhausted but happy.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 2,
    "explanation": "ESTAR describes the resulting condition or state of the runners following the race. Although 'estuvieron' (preterite of estar) is also possible with a focus on the completed state, 'estaban' (imperfect) better describes the ongoing condition at that moment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre me leía cuentos cada noche.",
    "en": "When I was little, my mother read me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "'Era' (imperfect) is correct because 'when I was little' sets up habitual background circumstances in the past. The imperfect describes ongoing states and repeated habits, not single completed events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando el informe cuando el jefe me ___ con malas noticias.",
    "en": "I was reviewing the report when the boss called me with bad news.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llamara"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in progress, the background action uses the imperfect (estaba revisando) and the interrupting action uses the preterite indefinido (llamó). The preterite marks the single completed event that broke into the ongoing one."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses intentando terminar.",
    "en": "Yesterday I finally finished the novel I had been trying to finish for months.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "'Terminé' (preterite indefinido) is correct because the action is a single, completed event anchored to a specific past time marker ('ayer por fin'). The imperfect 'terminaba' would suggest a habitual or ongoing action, not a definitive completion."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ te molesta tanto de su comentario.",
    "en": "I don't understand what bothers you so much about his comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that). It is used when 'what' refers to an unspecified thing or concept. 'Qué' as an interrogative would require it to be a direct question, and 'que' alone cannot introduce a noun clause of this type."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese ascenso, ¡te lo mereces!",
    "en": "How great that you got that promotion — you deserve it!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express emotion or intensity, equivalent to 'how' or 'what a' in English. Without an accent, 'que' is a conjunction or relative pronoun and cannot carry exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo que hablar en público.",
    "en": "I always get nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "te pongo nervioso",
      "se pone nervioso",
      "nos ponemos nerviosos"
    ],
    "correct": 0,
    "explanation": "In the 'yo y yo' reflexive pattern, the subject and the object are the same person — the speaker affects themselves. 'Me pongo nervioso' means 'I make myself nervous / I get nervous', where the action loops back to the subject (yo)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé por qué, pero tu actitud siempre ___ de mal humor.",
    "en": "I don't know why, but your attitude always puts me in a bad mood.",
    "options": [
      "me pone",
      "te pone",
      "se pone",
      "nos pone"
    ],
    "correct": 0,
    "explanation": "This is the 'yo y tú / yo y el mundo' pattern: an external agent (tu actitud) causes a state in the speaker. 'Me pone' means 'it puts me', where 'me' is the indirect object (the person affected) and the subject is 'tu actitud', not the speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "The conditional (haría) is required in the main clause of a hypothetical si-clause that uses the past subjunctive (si tuviera). The future simple or 'voy a + infinitivo' cannot be used here because those forms express real plans, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ la presentación al cliente a las diez en punto.",
    "en": "Tomorrow I'll give the client presentation at ten o'clock sharp.",
    "options": [
      "daría",
      "diera",
      "daré",
      "voy a dar"
    ],
    "correct": 3,
    "explanation": "'Voy a + infinitivo' is preferred for plans that are already decided and imminent, especially when a specific future time is mentioned in context. While 'daré' (future simple) is grammatically correct, 'voy a dar' is more natural in spoken Spanish for concrete near-future arrangements."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El médico dijo que los resultados ___ listos para el viernes.",
    "en": "The doctor said that the results would be ready by Friday.",
    "options": [
      "estarán",
      "estén",
      "estarían",
      "estaban"
    ],
    "correct": 2,
    "explanation": "After a past reporting verb (dijo), the conditional (estarían) is used to report a future-in-the-past statement — the equivalent of 'would be' in reported speech. The future simple (estarán) is used in direct speech or after present-tense reporting verbs."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El coordinador quiere que todos ___ el informe antes del jueves.",
    "en": "The coordinator wants everyone to submit the report before Thursday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entreguen"
    ],
    "correct": 1,
    "explanation": "After 'querer que', the subjunctive is obligatory when the subject of the main clause differs from the subject of the subordinate clause. 'Entreguen' (present subjunctive) expresses the coordinator's wish directed at others, not a statement of fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto para no preocuparme.",
    "en": "Call me as soon as you arrive at the airport so I don't worry.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' referring to a future event, the present subjunctive is required. The indicative 'llegas' would only be used if describing a habitual present action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ tres idiomas y experiencia en ventas.",
    "en": "They are looking for someone who speaks three languages and has sales experience.",
    "options": [
      "habla",
      "hable",
      "hablará",
      "hablaba"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown, hypothetical, or non-existent from the speaker's perspective, the subjunctive is required. Here, the company doesn't know yet if such a person exists, making the antecedent indefinite."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión.",
    "en": "Please don't use your phone during the meeting.",
    "options": [
      "uses",
      "usas",
      "usés",
      "usa"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjunctive form — 'no uses' comes from the subjunctive of 'usar'. The affirmative tú command would be 'usa', but for negative commands you must switch to the subjunctive, never the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen alguna pregunta, ___ con libertad al final de la sesión.",
    "en": "If you have any questions, feel free to ask at the end of the session.",
    "options": [
      "pregunten",
      "preguntan",
      "preguntad",
      "preguntes"
    ],
    "correct": 0,
    "explanation": "'Pregunten' is the ustedes affirmative imperative, formed identically to the third-person plural present subjunctive. 'Preguntad' is the vosotros command, used in Spain. When addressing a group formally in Latin America (or even Spain in formal contexts), 'pregunten' is the correct form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ salido ya a buscar señal.",
    "en": "He's not answering the phone. He must have already gone out to find a signal.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) expresses probability or deduction about something that may have already happened in the recent past. It is the epistemic future perfect — equivalent to 'must have done' in English — and is distinct from the present perfect (ha salido), which states a fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
