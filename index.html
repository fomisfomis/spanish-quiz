<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 14, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 14, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events, because an event's location is considered a defining characteristic of it. ESTAR is used for the location of physical objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy delgado.",
    "en": "After the chemotherapy, the patient is very thin.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the thinness is a result of a change caused by illness — it's a temporary or circumstantial condition, not an inherent physical trait. The same adjective with SER would imply the person is naturally thin."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No me gusta este pastel — ___ demasiado rico en azúcar.",
    "en": "I don't like this cake — it is too rich in sugar.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With the adjective 'rico', ESTAR means 'tastes good/rich' or refers to a sensory quality experienced in the moment. SER + rico means 'to be wealthy.' Here the speaker is commenting on the cake's taste/composition as currently experienced."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en el momento justo.",
    "en": "My grandmother is very clever — she always knows what to say at the right moment.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'to be clever or smart' as a permanent personality trait. ESTAR + listo/a means 'to be ready.' Since the sentence describes an inherent intellectual quality, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play soccer every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a recurring routine, not a single completed event, so Indefinido would be incorrect here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, sonó el teléfono.",
    "en": "While I was making dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "preparo"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the background/ongoing action uses the Imperfecto ('preparaba') and the interrupting event uses the Indefinido ('sonó'). 'Mientras' typically introduces the continuous background."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas escribiendo.",
    "en": "Yesterday I finally finished the report I had been writing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "terminaría",
      "haya terminado"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed, bounded actions with a clear endpoint. 'Ayer' and 'por fin' are strong signals of a single completed past event, making Indefinido the correct choice over Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizing relative pronoun meaning 'that which' or 'what,' and is used when there is no specific antecedent noun. 'Que' alone would be a simple conjunction here, and 'qué' with accent is for direct questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ buena idea la de organizar la reunión en la terraza!",
    "en": "What a great idea to organize the meeting on the terrace!",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong emotion or admiration. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce an exclamation of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo demasiado trabajo acumulado, ___ mucho.",
    "en": "When I have too much accumulated work, I get very stressed.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and the reflexive pronoun refer to the same person (yo… me), the action reflects back on oneself — 'yo me estreso' means 'I stress myself out.' This is the 'yo y yo' pattern where the agent and receiver are identical."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "te estresas",
      "se estressa"
    ],
    "correct": 1,
    "explanation": "This is the 'yo y tú' pattern: the subject (tú) performs an action that affects a different person (me = yo). The verb conjugates for 'tú' and the object pronoun 'me' indicates who receives the effect."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina japonesa.",
    "en": "If I had more free time, I would take a Japanese cooking course.",
    "options": [
      "haré",
      "hago",
      "haría",
      "voy a hacer"
    ],
    "correct": 2,
    "explanation": "The Condicional (haría) is used in the result clause of hypothetical or contrary-to-fact si-clauses. When the si-clause uses Imperfecto de Subjuntivo (tuviera), the main clause must use Condicional, not Futuro."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la costa.",
    "en": "According to the forecast, tomorrow it will be over thirty degrees all along the coast.",
    "options": [
      "haría",
      "habría",
      "hará",
      "va a hacer"
    ],
    "correct": 2,
    "explanation": "Futuro Simple is used for predictions based on external evidence or forecasts. Both 'hará' and 'va a hacer' are possible, but when citing an official source like a forecast about a specific time, Futuro Simple sounds more neutral and formal."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Podrías pedirle al jefe que ___ la reunión al jueves?",
    "en": "Could you ask the boss to move the meeting to Thursday?",
    "options": [
      "moverá",
      "mueva",
      "movería",
      "va a mover"
    ],
    "correct": 2,
    "explanation": "After verbs of request or suggestion (pedir que), the Subjuntivo is required — but this blank follows 'que' in an indirect request context where the embedded clause needs Subjuntivo ('mueva'). The Condicional here would apply to the main clause speaker's softened request, not the embedded clause."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el vuelo no ___ retraso esta vez.",
    "en": "I hope the flight doesn't have a delay this time.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tendría"
    ],
    "correct": 1,
    "explanation": "After verbs of hope or wish like 'esperar que,' the Subjuntivo is required because the action in the subordinate clause is uncertain or desired rather than factual. 'Tiene' (Indicativo) would only follow if the speaker were stating a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the Subjuntivo in the subordinate clause because the speaker is casting doubt on the information. The affirmative 'creo que' would take Indicativo ('es'), but negation shifts the mood."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamo en cuanto ___ los resultados del análisis.",
    "en": "I'll call you as soon as I get the test results.",
    "options": [
      "tengo",
      "tuve",
      "tenga",
      "tendré"
    ],
    "correct": 2,
    "explanation": "With temporal conjunctions like 'en cuanto,' 'cuando,' or 'hasta que' referring to future events, Spanish requires the Subjuntivo. The action hasn't happened yet, so it's hypothetical. Indicativo would be used only if the action were habitual or past."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ tanto el móvil mientras comemos, por favor.",
    "en": "Don't use your phone so much while we eat, please.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "usa"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the Subjuntivo: 'no uses.' The affirmative command 'usa' cannot be used in a negative command. This is a key distinction — affirmative and negative tú commands use entirely different forms."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus asientos hasta que el avión se detenga por completo.",
    "en": "Ladies and gentlemen, remain in your seats until the plane comes to a complete stop.",
    "options": [
      "permanezcan",
      "permanecen",
      "permanezca",
      "permanece"
    ],
    "correct": 0,
    "explanation": "Ustedes commands use the third-person plural Subjuntivo form ('permanezcan'). This is the standard form for formal or plural commands in most of the Spanish-speaking world. 'Permanecen' is simply the Indicativo and cannot function as a command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contestas el teléfono — ___ quedado dormido en el sofá otra vez.",
    "en": "You're not answering the phone — you must have fallen asleep on the sofa again.",
    "options": [
      "habrás",
      "habrías",
      "hubieras",
      "habías"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrás + participio) is used to express probability or deduction about a past event from the perspective of the present moment. The speaker doesn't know for certain but is making a logical inference about what has already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
