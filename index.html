<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 19, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 19, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR expresses the location of physical objects or people, but for scheduled events, Spanish uses SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, María ___ completamente agotada.",
    "en": "After running ten kilometers, María is completely exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary physical or emotional state resulting from an action or circumstance. Exhaustion here is a condition, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado con ese hombre — ___ muy listo y puede engañarte fácilmente!",
    "en": "Be careful with that man — he is very cunning and can trick you easily!",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER + listo means 'to be clever or cunning' as an inherent characteristic. ESTAR + listo, by contrast, means 'to be ready,' so the choice of verb completely changes the meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — nunca había probado algo tan bueno.",
    "en": "This dessert is absolutely delicious — I had never tasted anything so good.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means 'to taste delicious' and refers to a sensory experience in the moment. SER + rico/a, on the other hand, means 'to be wealthy,' showing how verb choice shifts the adjective's meaning entirely."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play soccer every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially with time markers like 'todos los sábados.' The Indefinido would imply a single completed event rather than a routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, sonó el teléfono y tuve que dejarlo todo.",
    "en": "While I was cooking dinner, the phone rang and I had to leave everything.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "prepararía"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto (preparaba), while the interrupting event uses the Indefinido (sonó). The Imperfecto sets the scene; the Indefinido advances the story."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmara"
    ],
    "correct": 1,
    "explanation": "The Indefinido (firmó) is used for a completed, one-time event at a specific point in the past, indicated here by 'el año pasado.' The Imperfecto would imply it was an ongoing or habitual action, which doesn't fit this context."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que is used as a compound relative pronoun meaning 'what' or 'that which,' referring to an unspecified thing or idea. Que alone would need a specific antecedent, and qué (with accent) is used in direct or indirect questions with interrogative force."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me alegra es que por fin hayas conseguido ese trabajo tan deseado.",
    "en": "What makes me happy is that you finally got that long-awaited job.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El cual"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause subject meaning 'what' (the thing that), and is required when referring to an abstract, unspecified concept at the start of a sentence. Que without lo cannot begin a clause as a subject in this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo acumulado.",
    "en": "Lately I stress out a lot with all the accumulated work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "Me estreso uses the yo form of the reflexive verb estresarse, meaning the subject (yo) experiences stress through their own state. Me estresas would mean 'you stress me out' and me estresa would mean 'something stresses me out,' showing how the verb form encodes who is responsible for the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a great deal.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "Me preocupas uses tú as the subject with the verb preocupar in second person, meaning the other person (tú) is the cause of the speaker's worry. This is the 'yo y tú' pattern where the second person acts upon the first-person speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "The Condicional (tomaría) is required in the main clause of hypothetical si-clauses when the condition is contrary to current reality (si + Imperfecto de Subjuntivo). The Futuro Simple cannot be used in the main clause of this type of conditional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región.",
    "en": "According to the forecast, tomorrow it will be very hot throughout the region.",
    "options": [
      "haría",
      "habrá",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple (habrá) is used for predictions or statements about the future based on external information, like a weather forecast. The Condicional would imply a hypothetical condition, and 'voy a hacer' is too informal and lacks a subject here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio porque ya lo tengo todo preparado.",
    "en": "This afternoon I am going to go to the gym because I already have everything ready.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "Voy a + infinitivo is preferred when there is clear present intention or preparation already in place for a near-future action. The Futuro Simple (iré) sounds more formal or distant, while voy a ir conveys immediacy and intentionality rooted in the present moment."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ más agua y que reduzcas el consumo de sal.",
    "en": "The doctor recommends that you drink more water and reduce your salt intake.",
    "options": [
      "bebes",
      "bebas",
      "beber",
      "beberás"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, wish, or influence (recomendar, querer, pedir, etc.), the subordinate clause requires the Subjuntivo when the subjects of the two clauses are different. The infinitive is only used when both verbs share the same subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as the test results arrive.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the Subjuntivo when they refer to a future action that has not yet occurred. The Indicative is used only when the sentence describes habitual actions or past events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ las normas de seguridad antes de empezar.",
    "en": "It is essential that all employees know the safety regulations before starting.",
    "options": [
      "conocen",
      "conocerán",
      "conozcan",
      "conocieran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental, es necesario, es importante) trigger the Subjuntivo in the subordinate clause. These expressions convey a subjective judgment rather than objective fact, which is the core trigger for the Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es una falta de respeto.",
    "en": "Please, don't use your phone during the meeting — it's disrespectful.",
    "options": [
      "uses",
      "usas",
      "usar",
      "usarás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo, not the affirmative imperative form. So 'no uses' (Subjuntivo) is correct, while 'no usas' would be indicative and 'usa' is only the affirmative command form."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad durante el despegue.",
    "en": "Ladies and gentlemen, fasten your seatbelts during takeoff.",
    "options": [
      "abróchense",
      "abróchate",
      "abrochad",
      "abrochen"
    ],
    "correct": 0,
    "explanation": "In Latin American Spanish, the ustedes imperative form is used for all formal or group commands, and reflexive/object pronouns are attached directly to the end of the affirmative imperative. Abróchense is the ustedes command of abrocharse with the reflexive pronoun attached."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ quedado dormido después del partido.",
    "en": "He's not answering the phone. He must have fallen asleep after the game.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Hubiera"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened in the past, especially when the speaker is speculating from the present moment. It is the Spanish equivalent of 'must have' or 'probably has' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
