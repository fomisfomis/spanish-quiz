<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 24, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 24, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio esta noche, así que llega temprano.",
    "en": "The concert ___ at the stadium tonight, so arrive early.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place. ESTAR indicates the physical location of objects or people, not the location of scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, María ___ agotada pero feliz.",
    "en": "After running ten kilometers, María ___ exhausted but happy.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "ESTAR is used to describe a temporary physical or emotional condition resulting from an action. Exhaustion after exercise is a state, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese queso! ___ malo y te puede hacer daño.",
    "en": "Don't touch that cheese! It ___ bad and it could hurt you.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Estará"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or spoiled (a change of state). SER + malo means someone or something is bad by nature or character."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo siempre ___ listo para ayudar a cualquier persona del barrio.",
    "en": "My grandfather is always ___ ready to help anyone in the neighborhood.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready.' SER + listo means 'to be clever or smart.' The meaning of the adjective shifts completely depending on whether SER or ESTAR is used."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al parque todos los sábados con mi padre.",
    "en": "When I was a child, I ___ to the park every Saturday with my father.",
    "options": [
      "fui",
      "iba",
      "había ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. 'Todos los sábados' is a clear signal that this action happened regularly, not just once."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ la cena cuando de repente sonó el teléfono.",
    "en": "I ___ dinner when the phone suddenly rang.",
    "options": [
      "preparaba",
      "preparé",
      "había preparado",
      "prepararé"
    ],
    "correct": 0,
    "explanation": "The Imperfecto describes a background action in progress that gets interrupted. 'De repente sonó' (rang) is the interrupting event in Indefinido, while 'preparaba' sets the ongoing scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ terminar el informe que llevaba semanas posponiendo.",
    "en": "Yesterday I finally ___ to finish the report I had been putting off for weeks.",
    "options": [
      "podía",
      "pude",
      "puedo",
      "pudiera"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a completed action at a specific time in the past. 'Ayer por fin' signals a single, finished event. 'Podía' would imply an ongoing ability, not a completed achievement."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando explicar con ese diagrama.",
    "en": "I don't understand ___ you are trying to explain to me with that diagram.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' or 'that which' when it refers to an idea or concept with no specific antecedent. 'Que' alone would need a prior noun to refer back to."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ asco tiene este café. ¿Cuánto tiempo lleva hecho?",
    "en": "___ disgusting this coffee is. How long has it been made?",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Lo cual"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamations to express strong emotion or reaction. It precedes a noun or adjective and acts as an intensifier. 'Que' without accent is a conjunction or relative pronoun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho ruido en la oficina, ___ concentrar.",
    "en": "When there is a lot of noise in the office, ___ to concentrate.",
    "options": [
      "me cuesta",
      "te cuesta",
      "se me hace difícil",
      "me hago difícil"
    ],
    "correct": 2,
    "explanation": "'Hacerse difícil' with an indirect object pronoun (se me) expresses that an external situation makes something hard for the speaker — this is the 'yo y el mundo' pattern where a circumstance acts on you."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con tus comentarios negativos antes de las reuniones.",
    "en": "Lately ___ a lot with your negative comments before meetings.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "'Me estresas' follows the 'yo y tú' pattern: the subject is 'tú' and the action affects 'me.' The verb agrees with the person causing the stress (tú → estresas), not the person feeling it."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I ___ take a photography course.",
    "options": [
      "haré",
      "tomaría",
      "tomaré",
      "voy a tomar"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses with the Imperfecto de Subjuntivo (si tuviera), the result clause requires the Condicional (tomaría). The Futuro is used for real or likely future conditions, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ sol toda la tarde en la costa.",
    "en": "According to the forecast, tomorrow it ___ sunny all afternoon on the coast.",
    "options": [
      "habría",
      "haría",
      "hará",
      "va a hacer"
    ],
    "correct": 2,
    "explanation": "Both 'hará' and 'va a hacer' can express future predictions, but 'hará' (Futuro Simple) is preferred for information from official or external sources like forecasts. 'Va a hacer' feels more personal and immediate."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Le dije que ___ la reserva con antelación para evitar problemas.",
    "en": "I told him that he ___ make the reservation in advance to avoid problems.",
    "options": [
      "hará",
      "haría",
      "va a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "After verbs of saying or reporting in the past (dije), the Condicional is used for reported future actions — this is called 'futuro del pasado.' The Futuro Simple would be incorrect after a past reporting verb."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que los empleados ___ sus ideas en la próxima reunión.",
    "en": "It is important that the employees ___ their ideas in the next meeting.",
    "options": [
      "comparten",
      "comparten",
      "compartan",
      "compartirán"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of importance, necessity, or value (es importante que) trigger the Subjuntivo in the dependent clause. The Subjuntivo here expresses the speaker's wish about someone else's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo jefe ___ suficiente experiencia para este puesto.",
    "en": "I don't think the new boss ___ enough experience for this position.",
    "options": [
      "tiene",
      "tendrá",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion and belief (no creo que, no pienso que) require the Subjuntivo because the speaker is expressing doubt or uncertainty. The affirmative 'creo que' would take Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamaré enseguida.",
    "en": "As soon as I ___ the results of the analysis, I'll call you right away.",
    "options": [
      "recibo",
      "recibiré",
      "reciba",
      "recibiera"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when they refer to a future action that hasn't happened yet. When referring to habitual or past actions, Indicativo is used."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la cena. Es una regla de la familia.",
    "en": "Please, don't ___ your phone during dinner. It's a family rule.",
    "options": [
      "saques",
      "saca",
      "sacas",
      "sacarás"
    ],
    "correct": 0,
    "explanation": "Negative commands for 'tú' are formed using the present Subjuntivo (no saques). The affirmative command 'saca' cannot be made negative by simply adding 'no' — the form must change to Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad antes del despegue.",
    "en": "Passengers, ___ your seatbelts before takeoff.",
    "options": [
      "abrochen",
      "abrochad",
      "abrocha",
      "abrochéis"
    ],
    "correct": 0,
    "explanation": "The 'ustedes' command uses the third-person plural of the present Subjuntivo (abrochen). 'Abrochad' is the 'vosotros' command used in Spain; 'ustedes' is standard in Latin America and formal contexts globally."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Lleva tres horas sin responder. ___ quedado dormido en el sofá otra vez.",
    "en": "He hasn't responded for three hours. He ___ fallen asleep on the sofa again.",
    "options": [
      "habrá",
      "habrá",
      "habrá",
      "habrá"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or logical deduction about something that has likely already happened in the recent past. It is equivalent to 'he must have' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
