<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 20, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 20, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo.",
    "en": "Don't touch that cable — it is very dangerous right now.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "Although danger can feel like an inherent trait, 'ahora mismo' signals a current, situational condition rather than a permanent characteristic. ESTAR is used for states that apply in a specific moment or context."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal del campus.",
    "en": "The conference is in the main auditorium on campus.",
    "options": [
      "es",
      "está",
      "será",
      "estaría"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. This is a classic exception: ESTAR indicates the physical location of objects and people, while SER indicates where an event takes place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo, ¿verdad?",
    "en": "Try this broth — it tastes absolutely delicious, doesn't it?",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Rico' changes meaning depending on the verb: 'es rico' means someone is wealthy, while 'está rico' means something tastes good or is delicious. ESTAR describes the sensory experience of food."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué a la reunión, mi jefa ___ de muy mal humor.",
    "en": "When I arrived at the meeting, my boss was in a very bad mood.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "Moods and emotional states are temporary conditions described with ESTAR. The imperfect 'estaba' is also correct here because the bad mood was an ongoing background state at the time of arrival."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me contaba cuentos cada noche.",
    "en": "When I was little, my grandmother used to tell me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "'Era' (imperfect of SER) is used because being small was an ongoing life stage, not a single completed event. The imperfect describes habitual states and repeated background conditions in the past."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estábamos cenando tranquilamente cuando alguien ___ a la puerta.",
    "en": "We were eating dinner calmly when someone knocked at the door.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llamaría"
    ],
    "correct": 1,
    "explanation": "This is the classic interrupted-action pattern: the imperfect ('estábamos cenando') sets the background action in progress, while the indefinido ('llamó') expresses the sudden, completed event that interrupted it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que empecé hace tres meses.",
    "en": "Yesterday I finally finished the novel I started three months ago.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The adverb 'por fin' combined with 'ayer' marks a single, completed, bounded event — the hallmark of the pretérito indefinido. The imperfect would imply an ongoing or habitual action, which contradicts 'por fin'."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "lo que que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominal relative clause meaning 'that which / what,' and it is used as the object of 'entender' here. 'Que' alone is a subordinating conjunction and cannot serve as the object of the verb in this structure."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ vestido tan bonito llevas hoy!",
    "en": "What a beautiful dress you're wearing today!",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "Cuál"
    ],
    "correct": 2,
    "explanation": "In exclamations expressing admiration or surprise, Spanish uses 'qué' (with accent mark) before a noun or adjective. This is distinct from the relative pronoun 'que' (no accent) or the nominal relative 'lo que'."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get really stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' is the Yo y yo pattern: the subject (yo) performs and experiences the action upon themselves, like a reflexive action with no external cause specified. This differs from 'me estresa el tráfico,' where 'el tráfico' is the external subject causing the stress."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cada vez que cancelas los planes a última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you annoy me a lot.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "te molestas"
    ],
    "correct": 1,
    "explanation": "This is the Yo y tú pattern: 'me molestas' means 'you (tú) bother me (me).' The subject is the second person 'tú,' acting on 'me.' 'Me molesto' would mean I get annoyed by myself, and 'me molesta' needs a third-person subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "hago",
      "voy a hacer"
    ],
    "correct": 1,
    "explanation": "Hypothetical si-clauses in the present/future use the imperfect subjunctive in the 'si' clause and the conditional in the main clause. The conditional 'haría' expresses what would happen under an unlikely or contrary-to-fact condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes, ___ a recogerte al aeropuerto mañana a las ocho.",
    "en": "Don't worry, I'm going to pick you up from the airport tomorrow at eight.",
    "options": [
      "iré",
      "voy",
      "voy a ir",
      "iría"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already arranged or decided, especially in spoken Spanish. 'Iré' is grammatically correct but sounds more formal or distanced; 'voy a ir' conveys personal commitment to a concrete plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según las previsiones, el precio de la vivienda ___ un 5% el año que viene.",
    "en": "According to forecasts, housing prices will rise 5% next year.",
    "options": [
      "subiría",
      "sube",
      "subirá",
      "haya subido"
    ],
    "correct": 2,
    "explanation": "When making predictions or forecasts about the future based on information (not hypothetical conditions), Spanish uses the futuro simple. The conditional 'subiría' would imply a hypothetical 'if' condition that is not present here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el taller mecánico ___ el coche antes del viernes.",
    "en": "I hope the repair shop fixes the car before Friday.",
    "options": [
      "arregla",
      "arregle",
      "arreglará",
      "arreglaría"
    ],
    "correct": 1,
    "explanation": "After expressions of hope and wish like 'esperar que,' the subjunctive is required in the subordinate clause when the subjects are different. 'Arregle' is the present subjunctive of 'arreglar.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ los resultados del análisis, llámame enseguida.",
    "en": "When the test results come in, call me right away.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegarían"
    ],
    "correct": 1,
    "explanation": "When 'cuando' refers to a future event (not a habitual or repeated present action), Spanish requires the present subjunctive. 'Llegan' would be used for habitual present actions; 'llegarán' (future indicative) cannot follow 'cuando' in standard Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ abierto los lunes.",
    "en": "I don't think that restaurant is open on Mondays.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creo que,' 'no pienso que') trigger the subjunctive in the following clause. The affirmative 'creo que' would take the indicative, but negation signals doubt or denial, requiring subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — necesito contarte algo importante.",
    "en": "Hey, wait a moment — I need to tell you something important.",
    "options": [
      "esperas",
      "espera",
      "esperes",
      "espere"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -AR verbs is formed using the third-person singular present indicative form: 'espera.' This is distinct from the negative tú command, which uses the present subjunctive: 'no esperes.'"
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el informe sin revisarlo antes.",
    "en": "Please don't send the report without reviewing it first.",
    "options": [
      "envía",
      "envías",
      "envíes",
      "envíe"
    ],
    "correct": 2,
    "explanation": "Negative tú commands always use the present subjunctive form. 'Envíes' is the present subjunctive of 'enviar' for tú. The affirmative 'envía' cannot be used after 'no' for the tú imperative."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas dos horas sin responder. ___ dormido con el teléfono en la mano otra vez.",
    "en": "You've been unresponsive for two hours. You must have fallen asleep with your phone in your hand again.",
    "options": [
      "Habrás caído",
      "Caerás",
      "Caíste",
      "Hayas caído"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habré + participio) can express probability or deduction about a past event when viewed from the present moment. It is equivalent to 'you must have fallen asleep' — the speaker is making a logical inference about something that already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
