<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 23, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 23, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "The location of events uses SER, not ESTAR. ESTAR expresses where a person or object physically is, but for scheduled events, SER indicates where and when they take place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, María ___ agotada.",
    "en": "After running ten kilometers, María is exhausted.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for states resulting from a change or circumstance, such as feeling exhausted after exercise. This contrasts with SER, which would describe exhaustion as a permanent personality trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese queso — ___ malo desde hace tres días!",
    "en": "Don't touch that cheese — it has been bad for three days!",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is spoiled (a temporary, acquired state). SER + malo, by contrast, would mean something is generally bad in quality or that a person is evil by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino ___ muy listo; siempre encuentra soluciones rápidas.",
    "en": "My neighbor is very clever; he always finds quick solutions.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "SER + listo means someone is clever or smart as an inherent characteristic. ESTAR + listo, on the other hand, means someone is ready, so choosing the correct verb here changes the meaning entirely."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) cerca del mar y todos los veranos nadaba con mis primos.",
    "en": "When I was a child, I used to live near the sea and every summer I swam with my cousins.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "había vivido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing past situations, especially when introduced by 'cuando era niña.' The key markers here are repeated, background actions rather than single completed events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading calmly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes the background ongoing action (reading) that was interrupted by a sudden event (the phone ringing), which is expressed in the Indefinido. This interrupted-action structure is a classic trigger for the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, mis amigos y yo ___ (ir) a un restaurante nuevo en el centro.",
    "en": "Last Saturday, my friends and I went to a new restaurant downtown.",
    "options": [
      "íbamos",
      "fuimos",
      "habíamos ido",
      "vamos"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed actions at a specific, finished point in time. 'El sábado pasado' is a definite time marker that signals a one-time completed event, making the Indefinido the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó a los organizadores.",
    "en": "What surprises me is that nobody informed the organizers.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'what' (the thing that), used when there is no prior antecedent. Que alone would require a noun before it, and qué introduces direct or indirect questions, not subject noun clauses like this one."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo la razón por ___ cancelaron la reunión sin avisar.",
    "en": "I don't understand the reason why they canceled the meeting without notice.",
    "options": [
      "qué",
      "lo que",
      "que",
      "cual"
    ],
    "correct": 2,
    "explanation": "After a preposition followed by a defined antecedent (la razón), Spanish uses preposition + que. The structure 'por que' (written separately) refers back to the noun 'la razón,' making que the correct relative pronoun here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I stress a lot about work deadlines.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject performs the action on themselves, Spanish uses a reflexive structure: yo me estreso (I stress myself out). This is the 'yo y yo' pattern where the agent and the affected party are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde, ___ muchísimo.",
    "en": "Every time you arrive late, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "When someone else (tú) causes a feeling or reaction in the speaker (yo), the verb agrees with the causing subject: tú me estresas. This is the 'yo y tú' pattern, similar to how gustar works — the subject is the cause, not the experiencer."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprendiera"
    ],
    "correct": 2,
    "explanation": "Hypothetical si-clauses that use the Imperfecto de Subjuntivo in the condition always require the Condicional in the result clause. The Futuro would only be appropriate for real, likely future conditions using si + present indicative."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde en toda la región.",
    "en": "According to the forecast, it will rain tomorrow afternoon across the whole region.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "llueve"
    ],
    "correct": 1,
    "explanation": "Voy a + infinitivo (and its conjugated forms like va a) is preferred in spoken Spanish for near-future events with evidence or a known source, such as a weather forecast. The Futuro Simple (lloverá) is also correct but feels more formal or written."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que el jefe ___ (llegar) tarde a la reunión de hoy.",
    "en": "They told me that the boss would arrive late to today's meeting.",
    "options": [
      "llegará",
      "llegaría",
      "llegue",
      "llegaba"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about a future event in the past (reported speech with a past reporting verb like dijeron), Spanish shifts to the Condicional, which acts as the 'future of the past.' The Futuro would be used if the reporting verb were in the present."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (leer) el nuevo reglamento antes del lunes.",
    "en": "It is important that all employees read the new regulations before Monday.",
    "options": [
      "leen",
      "leerán",
      "lean",
      "leyeran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of importance, necessity, or value (es importante que, es necesario que) trigger the Subjuntivo in the dependent clause. The present subjunctive lean is required here because the main clause is in the present tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (terminar) la presentación.",
    "en": "Call me as soon as you finish the presentation.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminaste"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the Subjuntivo when referring to future events that have not yet happened. Using the indicative (terminas) would imply a habitual present action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco a alguien que ___ (hablar) mandarín y que esté dispuesto a viajar.",
    "en": "I'm looking for someone who speaks Mandarin and is willing to travel.",
    "options": [
      "habla",
      "hablará",
      "hable",
      "hablara"
    ],
    "correct": 2,
    "explanation": "When the antecedent is hypothetical or indefinite — the speaker doesn't yet know if such a person exists — the Subjuntivo is required in the relative clause. If the person were known and specific, the indicative (habla) would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (dejar) los platos sucios en el fregadero.",
    "en": "Please, don't leave the dirty dishes in the sink.",
    "options": [
      "dejas",
      "dejes",
      "deja",
      "dejéis"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present subjunctive, not the affirmative imperative form. While deja is the affirmative command, no dejes correctly follows the rule: negative imperative = no + present subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "___ (Decirme, ustedes) la verdad ahora mismo.",
    "en": "Tell me the truth right now (formal plural command).",
    "options": [
      "Decídmelo",
      "Dígamelo",
      "Díganme",
      "Decídme"
    ],
    "correct": 2,
    "explanation": "Ustedes affirmative commands use the third person plural present subjunctive: díganme (from decir → digan). The pronoun me attaches directly after the verb in affirmative commands. Dígamelo would be used if 'it' (lo) were also mentioned."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ (quedarse) sin batería otra vez.",
    "en": "She's not answering the phone. She must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se ha quedado",
      "Se habrá quedado",
      "Se quedó"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) is used in Spanish to express probability or logical deduction about something that likely happened in the past. It is the equivalent of 'must have done' in English and is distinct from the simple past or present perfect."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
