<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 03, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 03, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal este sábado.",
    "en": "The concert is at the municipal stadium this Saturday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place. ESTAR indicates the physical location of objects or people, but for scheduled events, SER is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Mario ___ completamente listo.",
    "en": "After running ten kilometers, Mario is completely exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'exhausted' (a temporary state resulting from an action). SER + listo means 'clever' or 'smart' — this is one of the classic meaning-changing adjectives."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Esta sopa de lentejas ___ riquísima — ¿le pusiste algo especial?",
    "en": "This lentil soup is absolutely delicious — did you add something special?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a describes how something tastes right now, a sensory experience in the moment. SER + rico/a means 'to be wealthy' when referring to a person, or an inherent quality when describing food in general."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ una mujer muy fuerte; nunca se quejaba de nada.",
    "en": "My grandmother was a very strong woman; she never complained about anything.",
    "options": [
      "estaba",
      "estuvo",
      "era",
      "fue"
    ],
    "correct": 2,
    "explanation": "SER is used to describe inherent or defining characteristics of a person. ERA (imperfect of SER) is correct here because it describes a permanent personality trait in the past."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi familia ___ todos los veranos al mismo pueblo.",
    "en": "When I was little, my family went to the same village every summer.",
    "options": [
      "era / iba",
      "fui / fue",
      "era / fue",
      "fui / iba"
    ],
    "correct": 0,
    "explanation": "Both verbs here require the imperfect: ERA describes a continuous background state (being young), and IBA describes a habitual repeated action in the past. The imperfect is used for both ongoing states and recurring past habits."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente el teléfono ___ .",
    "en": "I was reading calmly when suddenly the phone rang.",
    "options": [
      "leía / sonó",
      "leí / sonó",
      "leía / sonaba",
      "leí / sonaba"
    ],
    "correct": 0,
    "explanation": "The imperfect (LEÍA) sets a background action in progress, while the indefinido (SONÓ) expresses the sudden interrupting event. This is the classic 'interrupted action' structure in Spanish narrative."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Lucía ___ un nuevo trabajo y su vida ___ por completo.",
    "en": "Last year, Lucía found a new job and her life changed completely.",
    "options": [
      "encontraba / cambiaba",
      "encontró / cambió",
      "encontraba / cambió",
      "encontró / cambiaba"
    ],
    "correct": 1,
    "explanation": "Both actions are completed, one-time events with a specific time reference ('el año pasado'), so both require the pretérito indefinido. The indefinido marks finished actions that moved the narrative forward."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to say to me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "LO QUE functions as a noun clause meaning 'that which' or 'what' in indirect statements. QUE is a simple connector, and QUÉ (with accent) is used in direct or indirect questions, not in this type of embedded noun clause."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que finalmente hayas conseguido el ascenso que tanto querías.",
    "en": "How great that you finally got the promotion you wanted so much.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "QUÉ (with accent) is used in exclamations to express strong emotion or reaction, equivalent to 'how' or 'what a' in English. It modifies adjectives, adverbs, or nouns in exclamatory sentences."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I get really stressed about work deadlines.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "When the subject causes its own emotional or physical state, use a reflexive verb in the matching person: YO me estreso (I stress myself). This is the 'yo y yo' pattern where the subject and the experiencer are the same."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, TÚ is the subject causing the feeling and YO is the experiencer. The verb agrees with TÚ (second person), giving ME PREOCUPAS — 'you worry me.' The indirect object ME shows who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses with the imperfect subjunctive (si tuviera), the main clause requires the condicional simple (HARÍA). The conditional expresses the imagined, unreal outcome of a contrary-to-fact situation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ mucho calor este fin de semana, así que llevad protector solar.",
    "en": "According to the forecast, it will be very hot this weekend, so bring sunscreen.",
    "options": [
      "haría",
      "habría",
      "hará",
      "haga"
    ],
    "correct": 2,
    "explanation": "The futuro simple (HARÁ) is used for predictions based on evidence or reliable information, like weather forecasts. The conditional would suggest hypothesis or politeness, not a straightforward future prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira las nubes. Creo que ___ a llover esta tarde, coge el paraguas.",
    "en": "Look at those clouds. I think it's going to rain this afternoon, take an umbrella.",
    "options": [
      "lloverá",
      "llovería",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "IR A + infinitivo is preferred when there is immediate evidence or a strong intention pointing to a near-future event. Here, the visible clouds provide concrete evidence, making VA A LLOVER the most natural choice over the more neutral LLOVERÁ."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entreguen"
    ],
    "correct": 1,
    "explanation": "After verbs of desire or will (querer que, desear que, pedir que) when the subjects of the two clauses differ, the subjunctive is required in the subordinate clause. ENTREGUEN is the present subjunctive of ENTREGAR."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, llámame de inmediato.",
    "en": "As soon as you receive the test results, call me immediately.",
    "options": [
      "recibes",
      "recibirás",
      "recibas",
      "recibieras"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like EN CUANTO, CUANDO, and HASTA QUE require the subjunctive when referring to future events that haven't happened yet. RECIBAS (present subjunctive) is correct here even though the future indicative might feel logical."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ tan bueno como dicen las reseñas.",
    "en": "I don't think this restaurant is as good as the reviews say.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que) trigger the subjunctive in the dependent clause because they express doubt or denial rather than a stated fact. The affirmative 'creo que es' would use indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la verdad de una vez — ¿estás de acuerdo con la decisión o no?",
    "en": "Hey, tell the truth for once — do you agree with the decision or not?",
    "options": [
      "dices",
      "di",
      "decid",
      "digas"
    ],
    "correct": 1,
    "explanation": "DI is the irregular tú affirmative imperative of DECIR. Several common verbs have irregular tú imperatives (di, haz, ve, pon, sal, sé, ten, ven) that must be memorized as they don't follow the regular pattern."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es muy molesto para todos.",
    "en": "Please, don't use your phone during the meeting — it's very annoying for everyone.",
    "options": [
      "uses",
      "usa",
      "usas",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive: no + subjunctive (NO USES). The affirmative tú imperative (USA) cannot be used in negative commands; the subjunctive form takes over for all negative imperatives."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos de la tarde y Daniela aún no ha llegado. ___ perdido el autobús otra vez.",
    "en": "It's two in the afternoon and Daniela still hasn't arrived. She must have missed the bus again.",
    "options": [
      "Habrá perdido",
      "Habría perdido",
      "Habrá perdiendo",
      "Perdería"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (HABRÁ + participio) is used to express probability or deduction about a past event, equivalent to 'must have' or 'probably did' in English. This is distinct from its other use of expressing completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
