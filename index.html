<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 02, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 02, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events (like conferences, parties, meetings) use SER to express location, not ESTAR. ESTAR indicates the location of physical objects and people, while SER is used for the location of scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante y te va a arder la boca.",
    "en": "Don't touch that sauce — it's very spicy and it's going to burn your mouth.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER is used with adjectives that describe inherent or defining characteristics of something. The spiciness here is a permanent, defining quality of the sauce, not a temporary state, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué raro! Normalmente Marcos ___ muy animado, pero hoy parece cansado.",
    "en": "How strange! Normally Marcos is very lively, but today he seems tired.",
    "options": [
      "está",
      "es",
      "estuviera",
      "fuera"
    ],
    "correct": 1,
    "explanation": "SER is used here because 'animado' describes Marcos's habitual, characteristic personality. The contrast with 'hoy' (today) highlights that his usual nature (SER) differs from his current temporary state (which would use ESTAR)."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba el arroz — ___ riquísimo desde que le añadí azafrán.",
    "en": "Try the rice — it tastes incredible since I added saffron.",
    "options": [
      "es",
      "está",
      "sea",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "'Rico' is one of the adjectives that changes meaning with SER vs ESTAR. With SER, 'rico' means wealthy or inherently tasty as a quality; with ESTAR, it means 'it tastes delicious right now,' describing a sensory experience in the moment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me ___ cuentos todas las noches.",
    "en": "When I was little, my grandmother used to tell me stories every night.",
    "options": [
      "era / contaba",
      "fui / conté",
      "era / contó",
      "fui / contaba"
    ],
    "correct": 0,
    "explanation": "Both verbs describe habitual, repeated past situations without a defined endpoint, so Imperfecto is correct for both. 'Cuando era pequeña' sets a background age, and 'contaba' expresses a recurring action — both classic Imperfecto uses."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un podcast cuando de repente ___ la alarma de incendios.",
    "en": "I was listening to a podcast when suddenly the fire alarm went off.",
    "options": [
      "escuchaba / sonó",
      "escuché / sonaba",
      "escuchaba / sonaba",
      "escuché / sonó"
    ],
    "correct": 0,
    "explanation": "The Imperfecto ('escuchaba') describes the ongoing background action that was already in progress, while the Indefinido ('sonó') marks the sudden completed event that interrupted it. This is the classic interrupted-action structure."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un contrato muy importante con una multinacional.",
    "en": "Last year, my company signed a very important contract with a multinational.",
    "options": [
      "firmaba",
      "firmó",
      "había firmado",
      "firmase"
    ],
    "correct": 1,
    "explanation": "The time marker 'el año pasado' and the context of a specific, completed event (signing a contract) call for the Indefinido. The Imperfecto would imply repeated or habitual signing, which doesn't make sense here."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'that which' or 'what,' and is used when 'what' refers to an unspecified thing or idea — not a direct question. 'Qué' would be used in a direct or indirect question, but here 'lo que' connects the verb to its object."
  },
  {
    "topic": "Usos de QUE",
    "q": "Para ___ sirve este botón en la aplicación?",
    "en": "What is this button in the app for?",
    "options": [
      "lo que",
      "que",
      "qué",
      "el que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in direct and indirect questions to ask for information. After the preposition 'para,' the interrogative 'qué' is required here. 'Que' without accent is a relative conjunction or subordinator, not an interrogative."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo reuniones largas en el trabajo.",
    "en": "Lately I stress out a lot when I have long meetings at work.",
    "options": [
      "me estresan",
      "te estreso",
      "me estreso",
      "se estresa"
    ],
    "correct": 2,
    "explanation": "This is the 'yo y yo' pattern: the subject (yo) and the person experiencing the effect are the same, so the reflexive 'me estreso' is correct. The verb describes an internal reaction the speaker causes upon themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Lo siento, sé que a veces ___ con mis comentarios sin querer.",
    "en": "I'm sorry, I know that sometimes I annoy you with my comments without meaning to.",
    "options": [
      "me aburro",
      "te aburres",
      "te aburro",
      "se aburre"
    ],
    "correct": 2,
    "explanation": "This is the 'yo y tú' pattern: the subject (yo) causes an effect on another person (tú). 'Te aburro' means 'I bore/annoy you' — the subject performs the action and the object pronoun 'te' marks the person affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir cualquier destino, ___ directamente a Japón en primavera.",
    "en": "If I could choose any destination, I would go straight to Japan in spring.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fuera"
    ],
    "correct": 0,
    "explanation": "The Condicional is used in the result clause of hypothetical (si + Imperfecto de Subjuntivo) sentences to express what would happen. 'Futuro Simple' or 'voy a ir' cannot be used in this type of contrary-to-fact conditional structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ fuertes lluvias este fin de semana en toda la región.",
    "en": "According to the forecast, there will be heavy rain this weekend throughout the region.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple expresses a factual prediction or forecast about the future. The Condicional ('habría') would imply a hypothetical or reported speech context, not a straightforward meteorological prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche no salgo; ___ a terminar el informe antes de dormir.",
    "en": "I'm not going out tonight; I'm going to finish the report before sleeping.",
    "options": [
      "terminaré",
      "voy a terminar",
      "terminaría",
      "termine"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention that has already been decided or planned, especially when the decision is made in the present moment. 'Futuro Simple' tends to express more distant or less personal predictions rather than immediate personal intentions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi jefe quiere que ___ el informe antes del mediodía.",
    "en": "My boss wants me to submit the report before noon.",
    "options": [
      "entrego",
      "entregue",
      "entregaré",
      "entregar"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or wishing ('querer que'), the Subjuntivo is required in the subordinate clause when the subject changes. 'Querer que + subjuntivo' is a fundamental trigger structure in Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del hospital.",
    "en": "Call me as soon as you get news from the hospital.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to future events that haven't happened yet. If the sentence referred to a habitual past action, the Indicative would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los participantes ___ el formulario antes de entrar.",
    "en": "It is essential that all participants sign the form before entering.",
    "options": [
      "firman",
      "firmaron",
      "firmen",
      "firmarán"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance ('es fundamental que,' 'es necesario que,' 'es importante que') always trigger the Subjuntivo in the dependent clause, because they express a subjective evaluation rather than a factual statement."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión; es muy molesto.",
    "en": "Please don't use your phone during the meeting; it's very annoying.",
    "options": [
      "uses",
      "usas",
      "usa",
      "usés"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present Subjuntivo form: 'no uses.' The affirmative tú command would be 'usa,' but for negation you must switch to the Subjunctive. This applies to all regular and irregular verbs in negative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Si quieren más información, ___ directamente al departamento de recursos humanos.",
    "en": "If you (all) want more information, write directly to the human resources department.",
    "options": [
      "escriban",
      "escribid",
      "escribe",
      "escribas"
    ],
    "correct": 0,
    "explanation": "'Ustedes' commands (used in Latin America and as the formal plural in Spain) use the third-person plural Subjuntivo form: 'escriban.' 'Escribid' is the 'vosotros' affirmative imperative, which is a different register and region."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos y Pablo todavía no ha llegado. ___ perdido en el metro.",
    "en": "It's two o'clock and Pablo still hasn't arrived. He must have gotten lost on the metro.",
    "options": [
      "Se habrá perdido",
      "Se perdería",
      "Se hubiera perdido",
      "Se perdió"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) can express probability or deduction about something that likely happened in the past, equivalent to 'must have' in English. This is distinct from its use to describe an action completed before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
