<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 04, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 04, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR indicates the location of physical objects or people, but for scheduled events, SER is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de trabajar doce horas, el chef ___ agotado.",
    "en": "After working twelve hours, the chef is exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary state or condition resulting from an action or circumstance. Exhaustion here is a current state, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel de chocolate ___ riquísimo — ¿puedo tomar otro trozo?",
    "en": "This chocolate cake is absolutely delicious — can I have another piece?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With food, ESTAR + rico/a means 'tastes delicious' (a sensory experience in the moment). SER + rico/a would mean 'is a rich person' or describe an inherent quality unrelated to taste."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ya tiene ochenta años, pero ___ muy lista — siempre nos gana al ajedrez.",
    "en": "My grandmother is already eighty years old, but she is very clever — she always beats us at chess.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "SER + listo/a means 'to be clever or intelligent,' a personality trait. ESTAR + listo/a means 'to be ready.' The context here describes a permanent characteristic, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (ir) al mercado con mi madre todos los sábados.",
    "en": "When I was a child, I used to go to the market with my mother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a routine, making Imperfecto the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ (sonar) el teléfono.",
    "en": "I was reading the report calmly when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "suena"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the ongoing background action uses Imperfecto (leía), while the sudden interrupting event uses Indefinido. 'De repente' often signals a completed past event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer ___ (conocer) a la nueva directora de marketing en la reunión.",
    "en": "Yesterday I met the new marketing director at the meeting.",
    "options": [
      "conocía",
      "conocí",
      "he conocido",
      "conozco"
    ],
    "correct": 1,
    "explanation": "Indefinido is used for a completed action at a specific past moment. 'Ayer' anchors this to a definite time. Note that 'conocer' in Indefinido means 'met for the first time,' a completed event."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó al supervisor antes de que ocurriera el problema.",
    "en": "What surprises me is that nobody warned the supervisor before the problem occurred.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and acts as the subject of the sentence. 'Que' alone cannot start a nominal clause as a subject without an article in this construction."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es fundamental ___ los empleados entreguen los formularios antes del viernes.",
    "en": "It is essential that the employees submit the forms before Friday.",
    "options": [
      "qué",
      "que",
      "lo que",
      "de que"
    ],
    "correct": 1,
    "explanation": "After impersonal expressions like 'es fundamental,' the conjunction 'que' (no accent) introduces a subjunctive clause. 'Qué' with accent is only used in questions or exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con las críticas de mis compañeros de trabajo.",
    "en": "Lately I stress a lot because of my coworkers' criticism.",
    "options": [
      "me estresan",
      "te estreso",
      "me estreso",
      "se estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and the experiencer are both the speaker ('yo'), the reflexive form 'me estreso' is used — the action reflects back on the subject themselves (Yo y yo pattern)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No entiendo por qué ___ tanto cuando llego tarde — tampoco es para tanto.",
    "en": "I don't understand why you get so upset when I arrive late — it's not that big a deal.",
    "options": [
      "me enojas",
      "te enojas",
      "se enoja",
      "nos enojamos"
    ],
    "correct": 1,
    "explanation": "The subject is 'tú' and the feeling is experienced by that same person, so the reflexive 'te enojas' is correct (Yo y tú pattern where tú acts on themselves). 'Me enojas' would mean 'you make me angry.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ (viajar) a Japón?",
    "en": "If you had more free time, would you travel to Japan?",
    "options": [
      "viajarás",
      "viajarías",
      "vas a viajar",
      "viajes"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses with Imperfecto de Subjuntivo, the result clause requires the Condicional Simple. Futuro Simple cannot be used in the result of a hypothetical (unreal) condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde en toda la región.",
    "en": "According to the forecast, it will rain tomorrow afternoon throughout the region.",
    "options": [
      "llovería",
      "va a llover",
      "llueve",
      "lloviera"
    ],
    "correct": 1,
    "explanation": "'Voy/va a + infinitivo' is preferred for planned or highly predictable near-future events supported by evidence (like a weather forecast). Futuro Simple (lloverá) is also acceptable but less common in spoken Spanish for imminent events."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que si aprobaba el examen, ___ (conseguir) el ascenso automáticamente.",
    "en": "They told me that if I passed the exam, I would automatically get the promotion.",
    "options": [
      "conseguiré",
      "consiga",
      "conseguiría",
      "conseguía"
    ],
    "correct": 2,
    "explanation": "In reported speech referring to a future action that was conditional at the time of speaking in the past, the Condicional replaces the Futuro Simple. This is the 'futuro del pasado' use of Condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ (dormir) al menos ocho horas antes de la operación.",
    "en": "The doctor recommends that you sleep at least eight hours before the operation.",
    "options": [
      "duermes",
      "duermas",
      "dormirás",
      "durmiendo"
    ],
    "correct": 1,
    "explanation": "Verbs of recommendation, advice, and influence (recomendar, aconsejar, pedir) trigger the Subjuntivo in the subordinate clause when the subjects are different. Here 'tú' sleeps, not the doctor."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto para que no me preocupe.",
    "en": "Call me as soon as you arrive at the airport so that I don't worry.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' referring to a future action, the Subjuntivo is required. These conjunctions use Indicativo only when referring to habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (abrir) los lunes — mejor llama antes.",
    "en": "I don't think this restaurant opens on Mondays — better call first.",
    "options": [
      "abre",
      "abra",
      "abrirá",
      "abría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar) require the Subjuntivo in the subordinate clause because they express doubt or denial of certainty. Affirmative 'creo que' uses Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (salir) de la sala hasta que el examinador recoja los papeles.",
    "en": "Please, don't leave the room until the examiner collects the papers.",
    "options": [
      "sales",
      "salgas",
      "sal",
      "salís"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present Subjuntivo ('no salgas'), not the affirmative imperative form ('sal'). The affirmative and negative command forms are completely different for tú."
  },
  {
    "topic": "Imperativo",
    "q": "Tenemos demasiado equipaje — ___ (dejar, vosotros) las maletas grandes en la consigna del hotel.",
    "en": "We have too much luggage — leave the large suitcases in the hotel luggage storage.",
    "options": [
      "dejen",
      "dejad",
      "dejéis",
      "dejad os"
    ],
    "correct": 1,
    "explanation": "The affirmative vosotros imperative is formed by replacing the infinitive's final -r with -d (dejar → dejad). 'Dejen' is the ustedes command, and 'dejéis' is the negative vosotros command (subjuntivo)."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Pablo todavía no ha llegado. ___ (perderse) con las indicaciones que le di.",
    "en": "It's three in the afternoon and Pablo still hasn't arrived. He must have gotten lost with the directions I gave him.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdió",
      "Se pierde"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It conveys the speaker's reasoned guess about a completed past action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
