<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 04, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 04, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La sopa que preparó mi abuela ___ riquísima. ¡Me encantó!",
    "en": "The soup my grandmother made was absolutely delicious. I loved it!",
    "options": [
      "era",
      "estuvo",
      "fue",
      "estaba"
    ],
    "correct": 1,
    "explanation": "When 'rico' is used with ESTAR, it means 'delicious' — a sensory experience or condition. Here the speaker is reacting to how the soup tasted, so ESTAR is required. 'Estuvo' (preterite of ESTAR) fits because it refers to a completed sensory impression."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia de marketing ___ en el Auditorio Nacional el próximo martes.",
    "en": "The marketing conference is at the National Auditorium next Tuesday.",
    "options": [
      "está",
      "estará",
      "será",
      "es"
    ],
    "correct": 2,
    "explanation": "Events — things that happen at a place and time, like conferences, concerts, or weddings — use SER to indicate location, not ESTAR. ESTAR is used for the location of physical objects and people, but events take SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de estudiar toda la noche, Carlos ___ listo para el examen.",
    "en": "After studying all night, Carlos is ready for the exam.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "'Listo' changes meaning depending on the verb: SER + listo = clever/smart (a permanent trait), while ESTAR + listo = ready (a temporary state). Since the context describes being prepared at a specific moment, ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No entiendo por qué Miguel ___ tan aburrido en la fiesta; normalmente es muy animado.",
    "en": "I don't understand why Miguel is so bored at the party; he's usually very lively.",
    "options": [
      "es",
      "está",
      "fue",
      "sea"
    ],
    "correct": 1,
    "explanation": "'Aburrido' with SER means 'boring' (a personality trait), but 'aburrido' with ESTAR means 'bored' (a temporary emotional state). Because Miguel is experiencing boredom at this specific moment — contrary to his usual nature — ESTAR is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos del barrio.",
    "en": "When I was a child, I used to play soccer every Saturday with my neighborhood friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things that happened regularly over a period of time. The clue 'todos los sábados' signals a recurring habit in the past, which calls for the Imperfecto, not the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma del edificio.",
    "en": "I was reading calmly when suddenly the building alarm went off.",
    "options": [
      "leía",
      "leí",
      "había leído",
      "leeré"
    ],
    "correct": 0,
    "explanation": "In interrupted action structures, the ongoing background action uses the Imperfecto ('leía' — I was reading), while the sudden interrupting event uses the Indefinido ('sonó' — it went off). The Imperfecto sets the scene; the Indefinido marks the new event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Lucía ___ un trabajo nuevo en una empresa tecnológica de Barcelona.",
    "en": "Last year, Lucía found a new job at a technology company in Barcelona.",
    "options": [
      "encontraba",
      "encontró",
      "ha encontrado",
      "encontraría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed, one-time events that occurred at a specific point in the past. 'El año pasado' is a specific time marker indicating a finished action, so the Indefinido 'encontró' is correct, not the habitual or background Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No termino de entender ___ me estás intentando decir con ese correo.",
    "en": "I can't quite understand what you're trying to tell me with that email.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'that which' or 'what,' and it introduces a noun clause when there is no explicit antecedent. 'Que' alone would require a prior noun to refer to, and 'qué' (with accent) is used in direct or indirect questions with interrogative force, which is not the case here."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ vestido tan elegante llevas hoy! ¿Es nuevo?",
    "en": "What an elegant dress you're wearing today! Is it new?",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express surprise, admiration, or emotion. In exclamations of the structure '¡Qué + noun + tan/más + adjective!', the accented 'qué' is obligatory. The unaccented 'que' is a relative pronoun or conjunction and cannot carry exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hay reuniones largas en la oficina, ___ muchísimo.",
    "en": "Whenever there are long meetings at the office, I get very stressed.",
    "options": [
      "me estresan",
      "me estreso",
      "te estresas",
      "se estresa"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y yo' pattern, the subject and the experiencer are the same person (yo), so the verb is first-person singular with the reflexive pronoun 'me': 'me estreso.' This differs from 'me estresan' (something stresses me — 'yo y el mundo' pattern) where an external subject causes the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me criticas delante de todos en clase, ___ muchísimo.",
    "en": "When you criticize me in front of everyone in class, you embarrass me a lot.",
    "options": [
      "me avergüenzo",
      "te avergüenzas",
      "me avergüenzas",
      "nos avergonzamos"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) causes an emotional effect on a first-person object (yo). The structure is: tú + verb (2nd person singular) + me (object pronoun). So 'me avergüenzas' = you embarrass me, which fits perfectly here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más experiencia en diseño, ___ el puesto sin duda.",
    "en": "If you had more experience in design, you would definitely get the job.",
    "options": [
      "conseguirás",
      "conseguirías",
      "vas a conseguir",
      "consigues"
    ],
    "correct": 1,
    "explanation": "In hypothetical 'si' clauses that describe unreal or unlikely conditions (si + imperfecto de subjuntivo), the main clause must use the Condicional Simple, not the Futuro. The Futuro Simple is used for real, probable future events, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras. Esta tarde ___ lluvia seguramente.",
    "en": "Look at those dark clouds. It will probably rain this afternoon.",
    "options": [
      "llovaría",
      "llovería",
      "lloverá",
      "va a llover"
    ],
    "correct": 3,
    "explanation": "When there is clear, immediate evidence pointing to a near-future event (like dark clouds), Spanish speakers prefer 'ir a + infinitivo' to express imminent future. The Futuro Simple ('lloverá') is also acceptable but slightly less natural with immediate physical evidence. 'Llovería' implies conditionality or politeness, which doesn't fit."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me pregunto cuánto ___ un viaje de dos semanas a Japón en mayo.",
    "en": "I wonder how much a two-week trip to Japan in May would cost.",
    "options": [
      "costará",
      "costaría",
      "va a costar",
      "cuesta"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple is used for speculation or conjecture about something hypothetical or uncertain, especially in reported or internal speech with 'preguntarse.' While Futuro can also express speculation, Condicional is preferred when the uncertainty involves a hypothetical scenario rather than a factual future prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el nuevo protocolo de seguridad antes del viernes.",
    "en": "It is essential that all employees read the new safety protocol before Friday.",
    "options": [
      "lean",
      "leen",
      "leerán",
      "leer"
    ],
    "correct": 0,
    "explanation": "Impersonal expressions of necessity, importance, or obligation (es fundamental que, es necesario que, es importante que) trigger the Subjuntivo in the subordinate clause. The subordinate verb must change to subjuntivo because the impersonal expression implies a subjective requirement, not a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis, ¿vale?",
    "en": "Call me as soon as you get the test results, okay?",
    "options": [
      "tengas",
      "tienes",
      "tendrás",
      "tuvieras"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'cuando,' 'en cuanto,' 'tan pronto como,' and 'hasta que' require the Subjuntivo when referring to future events that have not yet happened. Although it feels like a statement about the future, 'en cuanto + subjuntivo' is the required structure for anticipated future actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ terraza y que no ___ demasiado lejos del metro.",
    "en": "I'm looking for an apartment that has a terrace and that isn't too far from the metro.",
    "options": [
      "tiene / está",
      "tenga / esté",
      "tiene / esté",
      "tenga / está"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown, non-existent, or indefinite (you're searching for something you haven't found yet), the Subjuntivo is required in the relative clause. Since the apartment doesn't exist yet in the speaker's experience, both relative clauses need subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, no ___ el informe sin revisarlo bien, por favor. Es muy importante.",
    "en": "Hey, don't send the report without reviewing it properly, please. It's very important.",
    "options": [
      "mandas",
      "mandes",
      "mandar",
      "manda"
    ],
    "correct": 1,
    "explanation": "Negative commands in tú form always use the present Subjuntivo, not the indicative: 'no mandes' (don't send). The affirmative tú command would be 'manda,' but once negated, Spanish switches to the subjunctive form for all persons. This is one of the most common errors learners make."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus teléfonos en modo avión durante el despegue.",
    "en": "Ladies and gentlemen, please put your phones in airplane mode during takeoff.",
    "options": [
      "ponen",
      "pongan",
      "poned",
      "ponéis"
    ],
    "correct": 1,
    "explanation": "Ustedes commands — used in both Latin America and formal contexts in Spain — are formed with the third-person plural of the present Subjuntivo. 'Poned' is the vosotros affirmative command, used only informally in Spain. 'Pongan' is the correct ustedes imperative form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Daniela todavía no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Daniela still hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Había",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past — the speaker is speculating about a cause. This is distinct from its other use (an action completed before a future point in time). 'Habrá perdido' = she must have missed."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
