<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 06, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 06, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. ESTAR is reserved for the physical location of people and objects, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde la semana pasada.",
    "en": "Don't touch that cheese — it has been bad/off since last week.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means 'to be spoiled or ill' (a state or condition), while SER + malo means 'to be bad by nature or morally wicked.' Since the cheese has gone off, ESTAR is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista; resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever; she solved the crossword in ten minutes.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "SER + listo/a means 'to be clever or intelligent' (an inherent characteristic), whereas ESTAR + listo/a means 'to be ready.' Since this describes a personality trait, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tres semanas en la playa, Marcos ___ muy moreno.",
    "en": "After three weeks at the beach, Marcos is very tan.",
    "options": [
      "es",
      "está",
      "será",
      "ha sido"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for states that result from a change, especially those caused by external circumstances. Marcos's tan is a temporary condition resulting from being at the beach, not a permanent characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ al parque todos los sábados con mi padre.",
    "en": "When I was little, I used to go to the park every Saturday with my father.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals repetition, and the broader context of childhood reinforces an ongoing routine rather than a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading the report calmly when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the Imperfecto (leía), while the sudden interrupting event uses the Indefinido. 'De repente' (suddenly) signals a completed punctual action that broke the background."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ pequeño, tenía paredes de ladrillo y olía a canela.",
    "en": "The restaurant was small, had brick walls, and smelled of cinnamon.",
    "options": [
      "fue",
      "era",
      "estuvo",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used to paint background descriptions in past narrative — setting the scene with characteristics, atmosphere, and ongoing states. None of these details are single completed events, so Indefinido would be wrong here."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and it is used when 'what' refers to an entire idea or unspecified thing. 'Que' alone would need a prior noun antecedent, and 'qué' with an accent is used in direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí en Tokio, ¡después de tantos años!",
    "en": "What a pleasant surprise to find you here in Tokyo, after so many years!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánta"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express emotion or intensity, equivalent to 'What a…!' in English. Without the accent, 'que' is a relative pronoun or conjunction and cannot carry exclamatory force on its own."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo que tengo pendiente.",
    "en": "Lately I stress out a lot with all the work I have pending.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or physical state, the reflexive verb agrees with the subject (yo). This is the 'yo y yo' pattern — the person acts upon themselves. Me estreso = I stress myself out."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas los planes a última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you frustrate me a lot.",
    "options": [
      "me frustro",
      "me frustras",
      "me frustra",
      "te frustras"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, another person (tú) causes the speaker's emotional reaction. The verb agrees with the subject tú (second-person singular), while 'me' indicates the speaker is the one experiencing the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "___ que haya tanta desinformación en las redes sociales.",
    "en": "The amount of misinformation on social media worries me.",
    "options": [
      "Me preocupo",
      "Te preocupas",
      "Me preocupa",
      "Me preocupan"
    ],
    "correct": 2,
    "explanation": "In the 'yo y el mundo' pattern, a third-party thing or situation causes the speaker's feeling. The verb agrees with the grammatical subject (the clause 'que haya…'), which is third-person singular, so 'me preocupa' is correct."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "hiciera"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the result clause requires the Condicional, not the Futuro Simple. The Condicional expresses what would happen under an unreal or imagined condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ lluvias en toda la región norte.",
    "en": "According to the forecast, tomorrow there will be rain across the entire northern region.",
    "options": [
      "habrían",
      "habría",
      "habrá",
      "vaya a haber"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for factual predictions about the future, especially when citing evidence like a forecast. The Condicional would imply a hypothetical condition, which is not present here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche no puedo quedar — ___ a cenar con mis suegros.",
    "en": "Tonight I can't meet up — I'm going to have dinner with my in-laws.",
    "options": [
      "cenaré",
      "cenaría",
      "voy a cenar",
      "haya cenado"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already decided or arranged, especially in spoken Spanish. The Futuro Simple sounds more formal or distant, while 'voy a cenar' conveys a concrete, imminent plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi jefa insiste en que ___ el informe antes del mediodía.",
    "en": "My boss insists that I hand in the report before noon.",
    "options": [
      "entrego",
      "entregaré",
      "entregue",
      "entregara"
    ],
    "correct": 2,
    "explanation": "Verbs of insistence, desire, or influence (insistir en que, querer que, pedir que) trigger the Subjuntivo in the subordinate clause when the subjects are different. The present subjunctive 'entregue' is needed here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tuvieras"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future event that has not yet occurred. Using the indicative would imply habitual or already-realized situations."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los niños ___ suficientes horas de sueño cada noche.",
    "en": "It is essential that children get enough hours of sleep each night.",
    "options": [
      "duermen",
      "dormirán",
      "duerman",
      "dormían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity, importance, or judgment (es fundamental, es necesario, es importante) always trigger the Subjuntivo in the dependent clause. 'Duerman' is the present subjunctive of 'dormir.'"
  },
  {
    "topic": "Imperativo",
    "q": "Oye, no ___ ese correo todavía — necesito revisarlo primero.",
    "en": "Hey, don't send that email yet — I need to review it first.",
    "options": [
      "envía",
      "envíes",
      "envías",
      "enviarás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present subjunctive, not the affirmative imperative form. 'Envía' is the affirmative tú command, but negation requires 'no envíes' (subjunctive)."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus documentos de embarque listos antes de pasar el control.",
    "en": "Passengers, please have your boarding documents ready before going through security.",
    "options": [
      "tienen",
      "tengan",
      "tened",
      "ten"
    ],
    "correct": 1,
    "explanation": "The ustedes command uses the third-person plural of the present subjunctive. 'Tengan' is the correct form for addressing a group formally (ustedes). 'Tened' would be the vosotros affirmative command, used in Spain for informal groups."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas dos horas intentando contactarle y no responde — ___ salido a correr sin el móvil.",
    "en": "You've been trying to contact him for two hours and he's not answering — he must have gone out running without his phone.",
    "options": [
      "habrá salido",
      "saldrá",
      "hubiera salido",
      "ha salido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the past from the present speaker's perspective. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
