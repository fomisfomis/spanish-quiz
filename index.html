<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 23, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 23, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to indicate the location of events (where something takes place), even though location normally uses ESTAR. ESTAR is used for the location of physical objects and people, but events use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese pastel — ¡___ riquísimo y lo guardé para mañana!",
    "en": "Don't touch that cake — it's absolutely delicious and I saved it for tomorrow!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/riquísimo means something tastes delicious (a sensory condition experienced in the moment). SER + rico means someone is wealthy. This is a classic adjective meaning shift depending on ser vs estar."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista; siempre sabe cómo resolver los problemas.",
    "en": "My grandmother is very clever; she always knows how to solve problems.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means to be clever or smart as a personality trait. ESTAR + listo/a means to be ready. Since the sentence describes an inherent quality of the grandmother, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Marcos ___ completamente muerto.",
    "en": "After running ten kilometers, Marcos is completely dead tired.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' in this figurative sense (exhausted) describes a temporary state resulting from an action. SER + muerto would suggest a permanent, literal condition, which is not standard usage."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ al parque todos los domingos con mi padre.",
    "en": "When I was a child, I used to go to the park every Sunday with my father.",
    "options": [
      "fui",
      "iba",
      "iré",
      "vaya"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things you used to do regularly. 'Todos los domingos' is a strong signal of repetition, making 'iba' correct. Indefinido would imply a single completed trip."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía un libro tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading a book peacefully when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "suene"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the background action (what was ongoing) uses Imperfecto, while the interrupting event uses Pretérito Indefinido. 'Sonó' is the sudden, completed event that interrupted the ongoing reading."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Ana ___ un nuevo trabajo en Barcelona y se mudó allí.",
    "en": "Last year, Ana found a new job in Barcelona and moved there.",
    "options": [
      "encontraba",
      "encontró",
      "encuentre",
      "encontraría"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido is used for completed, one-time events anchored to a specific past time. 'El año pasado' indicates a closed time frame, and finding a job is a single completed action, not a habitual or ongoing state."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás diciendo ahora mismo.",
    "en": "I don't understand what you're telling me right now.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (that which) and is used when 'what' is the object of the verb and refers to an unspecified thing. 'Que' alone cannot start a noun clause after a verb of understanding in this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el ascenso, ¡te lo mereces!",
    "en": "How great that you got the promotion — you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to mean 'how' or 'what a'. It expresses an emotional reaction. Without the accent, 'que' is a conjunction and cannot carry this exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con el ruido de los vecinos; no puedo dormir.",
    "en": "Lately I get really stressed out because of the neighbors' noise; I can't sleep.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When an external thing (el ruido) causes the feeling, the verb agrees with that subject: 'el ruido me estresa'. This is the 'yo y el mundo' pattern — the thing acts upon me. 'Me estreso' would mean I stress myself, and 'me estresas' implies you stress me."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que discutimos, ___ tanto que luego no puedo concentrarme en el trabajo.",
    "en": "Every time we argue, you stress me out so much that I can't concentrate at work afterward.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, the second person singular subject (tú) causes the emotional effect on the first person (me). The verb therefore takes the second person singular ending: 'me estresas' — you stress me out."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause when the condition is contrary to fact or unlikely (si + Imperfecto de Subjuntivo → Condicional). Futuro Simple or 'voy a + inf.' would imply a real, planned action, not a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the forecast, tomorrow it will be very hot all along the coast.",
    "options": [
      "haría",
      "habrá",
      "vaya a hacer",
      "hiciera"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is used for objective predictions based on evidence or forecasts. 'Haría' (Condicional) would express a hypothetical situation or polite conjecture, not a factual forecast. 'Voy a + inf.' implies personal intention, not a weather prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo la reunión en media hora, así que ___ el autobús de las nueve.",
    "en": "I have the meeting in half an hour, so I'm going to take the nine o'clock bus.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans or intentions based on present circumstances. When there is a clear immediate context (the meeting is in half an hour), this periphrasis is more natural than the Futuro Simple, which sounds more distant or formal."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis padres ___ el vuelo a tiempo mañana.",
    "en": "I hope my parents catch the flight on time tomorrow.",
    "options": [
      "cojan",
      "cogen",
      "cogerán",
      "cogerían"
    ],
    "correct": 0,
    "explanation": "After verbs of wishing or hoping (esperar que), the subjunctive is required in the subordinate clause when the subjects differ. 'Cojan' is the present subjunctive of coger. The indicative 'cogen' or future 'cogerán' are not used after esperar que."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del examen.",
    "en": "Call me as soon as you get the exam results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' referring to a future event, Spanish requires the present subjunctive, not the present indicative or future. The event hasn't happened yet, so it's hypothetical from the speaker's perspective."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el director ___ razón en este asunto.",
    "en": "I don't think the director is right about this matter.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que) trigger the subjunctive in the following clause because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would use indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — necesito contarte algo importante.",
    "en": "Hey, wait a moment — I need to tell you something important.",
    "options": [
      "esperes",
      "espera",
      "espere",
      "esperad"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed by dropping the -s from the present indicative tú form: esperas → espera. 'Esperes' is the subjunctive used for negative tú commands (no esperes), not affirmative ones."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe sin revisarlo dos veces, por favor.",
    "en": "Don't send the report without reviewing it twice, please.",
    "options": [
      "envía",
      "manda",
      "envíes",
      "enviáis"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are always formed with the present subjunctive: no envíes. The affirmative tú imperative (envía) cannot be used after 'no'. This is one of the key structural differences between affirmative and negative imperatives in Spanish."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Lucía aún no ha llegado. ___ perdido el tren.",
    "en": "It's eleven at night and Lucía still hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from the present perspective — equivalent to 'must have' in English. The speaker doesn't know for certain but is making a logical inference based on current evidence."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
