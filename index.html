<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 01, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 01, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal este viernes.",
    "en": "The conference is in the main auditorium this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to indicate where and when they take place. ESTAR is used for the location of physical objects and people, not events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ vivo y podrías electrocutarte.",
    "en": "Don't touch that wire — it's live and you could electrocute yourself.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + vivo means 'to be alive/live (active)' in a current state, while SER + vivo means 'to be clever/sharp' as a permanent characteristic. Here the wire is in a dangerous live state, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel de chocolate ___ riquísimo — ¿lo hiciste tú?",
    "en": "This chocolate cake is absolutely delicious — did you make it?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/riquísimo expresses the sensory experience of tasting or perceiving food in the moment. SER + rico would mean the cake is wealthy, which makes no sense here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la reunión, todos ___ aburridos y listos para irse a casa.",
    "en": "After the meeting, everyone was bored and ready to go home.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 2,
    "explanation": "ESTAR + aburrido means 'to feel bored' as a temporary emotional state resulting from a situation. SER + aburrido would mean 'to be a boring person' as a defining personality trait."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always used to tell me stories before bed.",
    "options": [
      "era / contaba",
      "fui / conté",
      "era / contó",
      "fui / contaba"
    ],
    "correct": 0,
    "explanation": "Both verbs describe habitual, repeated past actions and ongoing background states, which call for the Imperfecto. 'Era pequeña' sets the background scene and 'contaba' describes a routine that happened repeatedly."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente el teléfono ___.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leía / sonó",
      "leí / sonaba",
      "leía / sonaba",
      "leí / sonó"
    ],
    "correct": 0,
    "explanation": "The Imperfecto (leía) describes the ongoing background action that was in progress, while the Indefinido (sonó) marks the sudden completed event that interrupted it. 'De repente' is a strong clue for a punctual Indefinido verb."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses intentando terminar.",
    "en": "Yesterday I finally finished the novel I had been trying to finish for months.",
    "options": [
      "terminaba",
      "terminé",
      "había terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a completed action with a clear endpoint at a specific past time (ayer por fin). The Imperfecto would suggest an ongoing or habitual action, contradicting the finality implied by 'por fin'."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "LO QUE functions as a nominal relative clause meaning 'that which' or 'what', referring to an unspecified thing. QUE alone is a conjunction or simple relative pronoun and cannot stand alone as the object of 'entender' without a prior antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ calor hace hoy — ¡no voy a salir ni a buscar el correo!",
    "en": "What heat there is today — I'm not even going out to get the mail!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "QUÉ (with accent) introduces exclamations expressing surprise or intensity, equivalent to 'What a...!' in English. It is used before nouns, adjectives, or adverbs in exclamatory sentences and should not be confused with the relative conjunction QUE."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "Con todo el trabajo extra este mes, ___ muchísimo.",
    "en": "With all the extra work this month, I'm getting really stressed.",
    "options": [
      "me estresan",
      "me estresas",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "ME ESTRESO follows the 'yo y yo' pattern — the subject (yo) performs and experiences the action on themselves. This is different from ME ESTRESAN (they stress me) where an external plural subject causes the stress, or ME ESTRESAS (you stress me)."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupa",
      "me preocupas",
      "me preocupan"
    ],
    "correct": 2,
    "explanation": "ME PREOCUPAS follows the 'yo y tú' pattern — the subject is tú (second person singular) and the object is me (first person). This contrasts with ME PREOCUPO (I worry myself) and ME PREOCUPA el tráfico (something worries me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si ganara la lotería, ___ un viaje alrededor del mundo.",
    "en": "If I won the lottery, I would take a trip around the world.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "hago"
    ],
    "correct": 2,
    "explanation": "The Condicional (haría) is used in the result clause of a hypothetical si-clause containing the Imperfecto de Subjuntivo. It expresses what would happen under an unlikely or imaginary condition, not a real future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El vuelo sale a las seis de la mañana, así que ___ al aeropuerto antes de las cuatro.",
    "en": "The flight leaves at six in the morning, so I will get to the airport before four.",
    "options": [
      "llegaría",
      "llego",
      "llegaré",
      "voy a llegar"
    ],
    "correct": 3,
    "explanation": "VOY A + infinitivo is preferred for near-future plans that are already decided or organized, especially when there is a concrete trigger (the 6am flight). LLEGARÉ would also be acceptable but sounds more formal; LLEGARÍA implies a hypothetical condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Sabes si ___ tiempo de revisar el informe antes de enviarlo al cliente?",
    "en": "Do you know if there will be time to review the report before sending it to the client?",
    "options": [
      "habría",
      "habrá",
      "hay",
      "haya"
    ],
    "correct": 1,
    "explanation": "HABRÁ (Futuro Simple of haber) is used inside an indirect question to express genuine uncertainty about a future situation. HABRÍA (Condicional) would imply a hypothetical condition rather than a straightforward future possibility."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el nuevo protocolo de seguridad.",
    "en": "It is essential that all employees follow the new safety protocol.",
    "options": [
      "siguen",
      "siguen a",
      "sigan",
      "seguirán"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es necesario que) trigger the Subjuntivo in the subordinate clause. The Indicative (siguen) would be used to state a fact, not to express a requirement or obligation."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like EN CUANTO, CUANDO, and TAN PRONTO COMO, the Subjuntivo is required when referring to a future event that has not yet happened. Using the Indicative (tienes) would suggest a habitual or present-tense meaning."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo director ___ suficiente experiencia para este cargo.",
    "en": "I don't think the new director has enough experience for this position.",
    "options": [
      "tiene",
      "tendrá",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion or belief (no creo que, no pienso que) require the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact. The affirmative 'creo que' would use Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — tengo que contarte algo importante.",
    "en": "Hey, wait a moment — I have to tell you something important.",
    "options": [
      "espera",
      "esperas",
      "espere",
      "no esperes"
    ],
    "correct": 0,
    "explanation": "For affirmative TÚ commands, the Imperativo form is identical to the third-person singular of the present Indicative (espera). This is different from the negative TÚ command, which uses the Subjuntivo (no esperes), or the USTED command (espere)."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el documento hasta que yo lo haya revisado.",
    "en": "Please don't send the document until I have reviewed it.",
    "options": [
      "envía",
      "envíes",
      "envíe",
      "enviéis"
    ],
    "correct": 1,
    "explanation": "Negative TÚ commands always use the present Subjuntivo (no envíes). The affirmative tú command would be 'envía', but negating it requires switching to the Subjuntivo form, which is a key asymmetry in the Spanish Imperativo system."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marcos aún no ha llegado. ___ perdido en el metro otra vez.",
    "en": "It's three in the afternoon and Marcos still hasn't arrived. He must have gotten lost on the subway again.",
    "options": [
      "Se habrá perdido",
      "Se perderá",
      "Se perdería",
      "Se ha perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to make deductions or express probability about something that has likely already happened, equivalent to 'must have' in English. This epistemic use reasons backward from present evidence to a probable past cause."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
