<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 06, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 06, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to express location, not ESTAR. ESTAR is used for the location of physical objects and people, but SER is used for the location of events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tanto trabajar, el jefe ___ muy listo para cerrar el negocio hoy.",
    "en": "After working so hard, the boss is very ready to close the deal today.",
    "options": [
      "es",
      "está",
      "ser",
      "estar"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready,' a state someone is in at a specific moment. SER + listo means 'to be clever/smart,' a permanent characteristic. Context here implies readiness, not intelligence."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Este pastel de chocolate ___ riquísimo! ¿Quién lo hizo?",
    "en": "This chocolate cake is absolutely delicious! Who made it?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'to taste/be delicious,' referring to the current sensory experience of eating it. SER + rico means 'to be rich/wealthy.' When describing how food tastes in the moment, use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy vivo para sus 90 años — siempre tiene una respuesta ingeniosa.",
    "en": "My grandfather is very sharp/lively for his 90 years — he always has a witty comeback.",
    "options": [
      "está",
      "es",
      "estaba",
      "era"
    ],
    "correct": 1,
    "explanation": "SER + vivo means 'to be sharp, clever, or lively' as a personality trait. ESTAR + vivo means 'to be alive' (the state of being living). The context here describes a personality characteristic, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was little, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially when signaled by frequency expressions like 'todos los sábados.' The Indefinido would suggest a single completed trip, not a routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras cocinaba la cena, alguien ___ (llamar) a la puerta.",
    "en": "While I was cooking dinner, someone knocked at the door.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llame"
    ],
    "correct": 1,
    "explanation": "When a completed action interrupts an ongoing background action, the interrupting event uses the Indefinido and the background action uses the Imperfecto. 'Cocinaba' sets the scene; 'llamó' is the sudden interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, ___ (vivir) en Buenos Aires durante seis meses.",
    "en": "Last year, I lived in Buenos Aires for six months.",
    "options": [
      "vivía",
      "viví",
      "he vivido",
      "vivo"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for actions completed within a defined time frame in the past. 'El año pasado' and 'durante seis meses' establish clear boundaries, making this a finished event — not ongoing background."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you are trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when the relative pronoun has no specific antecedent. 'Que' alone would require a prior noun, and 'qué' (with accent) is for direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí en el aeropuerto!",
    "en": "What a pleasant surprise to run into you here at the airport!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to express surprise, admiration, or emotion, equivalent to 'What a...!' in English. Without the accent, 'que' is a conjunction or relative pronoun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos del trabajo. No puedo dormir bien.",
    "en": "Lately I stress out a lot with work deadlines. I can't sleep well.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional state ('Yo y yo' pattern), the reflexive verb agrees with the subject: yo me estreso. No external agent is responsible — the person stresses themselves through their own reaction."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho. Por favor, manda un mensaje.",
    "en": "When you arrive late without warning, you worry me a lot. Please send a message.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, a second person (tú) causes an emotional reaction in a first person (yo). The verb takes the indirect object pronoun 'me' and agrees with the subject causing the feeling: tú me preocupas."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "aprendo",
      "voy a aprender"
    ],
    "correct": 1,
    "explanation": "The Condicional is used in the main clause of hypothetical 'si' sentences where the 'si' clause contains the Imperfecto de Subjuntivo. These express unlikely or imagined conditions, not real future plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He revisado el mapa — el vuelo ___ (aterrizar) en Madrid a las 10:15 según el itinerario.",
    "en": "I've checked the map — the flight will land in Madrid at 10:15 according to the itinerary.",
    "options": [
      "aterrizaría",
      "aterrizará",
      "va a aterrizar",
      "aterriza"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (ir a + infinitivo) expresses a planned, confirmed future event, especially when there is concrete evidence or a fixed arrangement. It is preferred over the Futuro Simple in spoken, everyday Spanish for near-future plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que el nuevo proyecto ___ (comenzar) en enero del próximo año.",
    "en": "The director said that the new project would begin in January of next year.",
    "options": [
      "comenzará",
      "comenzaría",
      "comience",
      "comenzaba"
    ],
    "correct": 1,
    "explanation": "The Condicional is used for future-in-the-past — reporting what someone said would happen from a past point of view. After a past reporting verb like 'dijo,' the Futuro Simple shifts to Condicional in indirect speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis colegas ___ (llegar) a tiempo para la reunión de mañana.",
    "en": "I hope my colleagues arrive on time for tomorrow's meeting.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "After verbs of wishing or hoping (esperar que, querer que, desear que) with a change of subject, the Subjuntivo is required in the subordinate clause. The indicative would incorrectly treat it as a statement of fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ (ser) tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' trigger the Subjuntivo in the subordinate clause because the speaker is denying or casting doubt on the truth of the statement. Affirmative 'creo que' takes indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) el informe, te lo mando por correo electrónico.",
    "en": "As soon as I finish the report, I'll send it to you by email.",
    "options": [
      "termino",
      "terminé",
      "termine",
      "terminaré"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when referring to future actions that haven't happened yet. The Indicative would only be used if referring to habitual or past actions."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (poner) la mesa, que la cena ya está casi lista.",
    "en": "Hey, set the table — dinner is almost ready.",
    "options": [
      "pongas",
      "pon",
      "pone",
      "ponga"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of 'poner' is an irregular form: 'pon.' Many common verbs have irregular tú imperatives (pon, ten, ven, sal, di, haz, sé, ve) that must be memorized separately from the regular pattern."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (olvidar) traer el pasaporte al aeropuerto mañana.",
    "en": "Please don't forget to bring your passport to the airport tomorrow.",
    "options": [
      "olvides",
      "olvida",
      "olvidas",
      "olvidéis"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the present Subjuntivo: no olvides. Unlike affirmative commands which use a special form, ALL negative commands (tú, usted, vosotros, ustedes) use the corresponding Subjuntivo form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las 11 de la noche y Lucía no contesta el teléfono. ___ (quedarse) dormida ya.",
    "en": "It's 11 at night and Lucía isn't answering her phone. She must have already fallen asleep.",
    "options": [
      "Se habrá quedado",
      "Se quedará",
      "Se quedaría",
      "Se ha quedado"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It is equivalent to 'must have + past participle' in English and expresses reasoned speculation."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
