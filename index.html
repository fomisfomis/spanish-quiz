<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 19, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 19, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de jazz ___ en el teatro municipal este viernes.",
    "en": "The jazz concert is at the municipal theater this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to indicate the location of events (concerts, meetings, parties). ESTAR is used for the location of physical objects and people, but events 'take place' with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe temporary conditions or states, such as the current temperature of an object. The plate isn't inherently hot by nature; it's hot right now as a result of cooking."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Pensé que el postre sería sencillo, pero ___ riquísimo — ¡no esperaba ese sabor!",
    "en": "I thought the dessert would be simple, but it's absolutely delicious — I wasn't expecting that flavor!",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With the adjective 'rico', ESTAR means 'tastes delicious' (a sensory experience), while SER means 'to be wealthy.' Here the speaker is reacting to the taste, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que empezó a estudiar meditación, mi vecina ___ mucho más tranquila que antes.",
    "en": "Since she started studying meditation, my neighbor is much calmer than before.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Although personality traits typically use SER, when a change of state is implied ('calmer than before'), ESTAR is used to highlight the contrast with a previous condition. The phrase 'más tranquila que antes' signals a change."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, mi abuelo me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was little, my grandfather used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past — things that happened regularly over a period of time. The cue 'todas las noches' (every night) confirms this is a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente por el parque cuando de repente empezó a llover a cántaros.",
    "en": "I was walking calmly through the park when it suddenly started to pour.",
    "options": [
      "caminaba",
      "caminé",
      "caminaré",
      "camine"
    ],
    "correct": 0,
    "explanation": "The Imperfecto describes the background action in progress (walking) that was interrupted. The Indefinido ('empezó') expresses the sudden interrupting event. 'Cuando de repente' is a classic signal of this pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Después de meses de entrenamiento, Carla ___ su primer maratón en menos de cuatro horas.",
    "en": "After months of training, Carla finished her first marathon in under four hours.",
    "options": [
      "terminaba",
      "terminó",
      "había terminado",
      "termine"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a single, completed action with a clear endpoint. 'En menos de cuatro horas' specifies the time frame of a finished event, making the Indefinido the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used as the object of a verb when referring to something non-specific. 'Que' alone would need a prior noun to refer back to, and 'qué' with an accent is used in direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que por fin hayas conseguido ese trabajo — te lo mereces.",
    "en": "How great that you've finally gotten that job — you deserve it.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cómo"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to express emotion or emphasis, similar to 'how' or 'what' in English exclamations. 'Que' without an accent cannot begin an exclamation of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo y llego a casa agotado.",
    "en": "When there's a lot of traffic in the city, it stresses me out a lot and I arrive home exhausted.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "estreso"
    ],
    "correct": 2,
    "explanation": "When an external thing (el tráfico) causes a feeling in someone, the verb agrees with that thing: 'me estresa el tráfico' (third person singular). This is the 'yo y el mundo' pattern, similar to how 'gustar' works."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ tanto que luego me arrepiento de lo que digo.",
    "en": "Every time we argue, you get me so worked up that I later regret what I say.",
    "options": [
      "me altero",
      "me alteras",
      "me altera",
      "me alteramos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes an effect on the speaker (me), so the verb takes the second-person singular form 'alteras.' The pronoun 'me' shows who is affected, while the verb ending shows who is doing it."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "hago"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple (haría) is required in the result clause of a hypothetical 'si' sentence when the 'si' clause uses the Imperfecto de Subjuntivo (tuviera). This structure expresses an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "La reunión ___ a las diez en punto — el jefe lo confirmó esta mañana.",
    "en": "The meeting will be at ten o'clock sharp — the boss confirmed it this morning.",
    "options": [
      "sería",
      "va a ser",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (va a ser) is preferred over the Futuro Simple for near-future events that have already been planned or confirmed. The phrase 'lo confirmó esta mañana' signals a concrete arrangement, making this the natural choice."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según las previsiones del tiempo, mañana ___ más de treinta grados en toda la región.",
    "en": "According to the weather forecast, it will be over thirty degrees across the whole region tomorrow.",
    "options": [
      "haría",
      "va a hacer",
      "hará",
      "haga"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for predictions based on forecasts or general expectations about the future, especially in formal or written contexts. 'Según las previsiones' signals a forward-looking prediction rather than a personal plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó si ___ a la fiesta de cumpleaños o si tenía otros planes.",
    "en": "He asked me whether I would go to the birthday party or if I had other plans.",
    "options": [
      "iré",
      "voy a ir",
      "fuera",
      "iría"
    ],
    "correct": 3,
    "explanation": "In reported speech (indirect speech), the Futuro Simple shifts back to the Condicional Simple: 'irá' → 'iría.' This is called the 'future of the past,' used to express what was originally a future action from a past perspective."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los participantes ___ el formulario antes del viernes.",
    "en": "It's essential that all participants submit the form before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregaran",
      "entregarán"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es necesario que) trigger the Present Subjunctive in the subordinate clause. The subjunctive is required because the main clause expresses a judgment or requirement rather than a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto para saber que llegaste bien.",
    "en": "Call me as soon as you arrive at the airport so I know you got there safely.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjunctive when they refer to a future action that has not yet occurred. 'En cuanto llegues' refers to a future arrival, making the Present Subjunctive obligatory."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "¿Conoces a alguien que ___ hablar tres idiomas y tenga experiencia en ventas?",
    "en": "Do you know anyone who can speak three languages and has sales experience?",
    "options": [
      "puede",
      "pueda",
      "podría",
      "podrá"
    ],
    "correct": 1,
    "explanation": "When the antecedent (the person or thing being described) is unknown, hypothetical, or non-existent, the Subjunctive is used in the relative clause. The speaker doesn't know if such a person exists, so 'pueda' is correct."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el teléfono durante la cena — quiero que hablemos.",
    "en": "Please, don't use the phone during dinner — I want us to talk.",
    "options": [
      "uses",
      "usas",
      "use",
      "usar"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the Present Subjunctive: 'no uses.' Unlike affirmative tú commands, which have their own special forms, all negative commands (tú, usted, vosotros, ustedes) use the subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "Si te duele la cabeza, ___ esta pastilla y descansa un poco en el sofá.",
    "en": "If your head hurts, take this pill and rest a bit on the sofa.",
    "options": [
      "tomas",
      "toma",
      "tomarás",
      "tomes"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed by dropping the -s from the present tense tú form: 'tomas' → 'toma.' Negative tú commands and formal commands (usted) are different forms and should not be confused here."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las nueve y Paula todavía no ha llegado. ___ perdido el autobús otra vez.",
    "en": "It's nine o'clock and Paula still hasn't arrived. She must have missed the bus again.",
    "options": [
      "Habrá perdido",
      "Habría perdido",
      "Ha perdido",
      "Había perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It conveys 'she must have...' or 'she probably...' without certainty about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
