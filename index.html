<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 27, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 27, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal esta noche.",
    "en": "The concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "The location of events (not physical objects) uses SER, not ESTAR. ESTAR expresses where things or people physically are, but the location of a scheduled event is expressed with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de trabajar doce horas seguidas, el jefe ___ muy malo con todos.",
    "en": "After working twelve hours straight, the boss was very unpleasant/in a bad mood with everyone.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo can mean 'to be in a bad mood' or 'to be ill' (a temporary state), while SER + malo means 'to be a bad person' (a permanent character trait). Here the context describes a temporary state caused by exhaustion, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No me digas que ya ___ lista! Tardaste solo cinco minutos.",
    "en": "Don't tell me you're already ready! You only took five minutes.",
    "options": [
      "eres",
      "estás",
      "has sido",
      "has estado"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo/a means 'to be ready' (a state someone has reached), whereas SER + listo/a means 'to be clever or smart' (an inherent quality). The exclamation here refers to being prepared, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este mango ___ riquísimo — ¿dónde lo compraste?",
    "en": "This mango is absolutely delicious — where did you buy it?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a expresses how something tastes in the moment of eating it (a sensory state), while SER + rico/a means 'to be wealthy.' When commenting on the flavor of food, always use ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ niño, mi abuelo me contaba historias antes de dormir todas las noches.",
    "en": "When I was a child, my grandfather used to tell me stories before bed every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past and for background states (like age or conditions). 'When I was a child' describes a prolonged background state, and 'used to tell stories every night' is a habitual action — both require Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando mi correo cuando de repente ___ la alarma de incendios.",
    "en": "I was checking my email when suddenly the fire alarm went off.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "había sonado"
    ],
    "correct": 1,
    "explanation": "When one ongoing action (Imperfecto) is interrupted by a sudden completed event, the interrupting action uses the Pretérito Indefinido. 'De repente' (suddenly) signals a punctual interruption, which requires Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ hablar con el director sobre mi aumento de sueldo.",
    "en": "Yesterday I finally managed to speak with the director about my raise.",
    "options": [
      "podía",
      "pude",
      "puedo",
      "pueda"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido of poder means 'managed to / succeeded in doing something' — a completed achievement. The Imperfecto of poder (podía) would mean 'was able to / had the ability,' without confirming the action actually happened. 'Por fin' reinforces a completed outcome."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó a los demás antes de la reunión.",
    "en": "What surprises me is that nobody informed the others before the meeting.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "When 'what' at the start of a sentence acts as the subject and refers to an unspecified idea or fact (equivalent to 'the thing that'), use LO QUE. QUE alone cannot begin a nominal clause functioning as a subject in this way; it needs the neuter article LO."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo la razón por ___ rechazaron tu propuesta sin ni siquiera leerla.",
    "en": "I don't understand the reason why they rejected your proposal without even reading it.",
    "options": [
      "que",
      "lo que",
      "la que",
      "qué"
    ],
    "correct": 2,
    "explanation": "When a preposition precedes a relative pronoun referring to a specific feminine noun (razón), you must use the article + que construction: 'la que.' The preposition 'por' requires a relative pronoun that agrees in gender and number with its antecedent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega — hay demasiada presión en el trabajo.",
    "en": "Lately I stress a lot about deadlines — there's too much pressure at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes stress to themselves, use the reflexive pattern where subject and object are the same person: yo me estreso (I stress myself out). This is the 'Yo y yo' pattern — the person both generates and receives the action."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Oye, cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "Hey, when you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "te estresas",
      "me estresa"
    ],
    "correct": 1,
    "explanation": "This is the 'Yo y tú' pattern: tú (subject) me (object = yo) estresas — 'you stress me out.' The verb agrees with tú (second person singular), and me shows that the person affected is the speaker. The subject and object are different people."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina japonesa.",
    "en": "If I had more free time, I would take a Japanese cooking course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses about unlikely or contrary-to-fact situations (si + Imperfecto de Subjuntivo), the main clause always uses the Condicional Simple. Futuro Simple and voy a + infinitivo cannot be used in the result clause of these hypothetical structures."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ tormentas en toda la región norte.",
    "en": "According to the forecast, tomorrow there will be storms throughout the northern region.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "For factual predictions about the future based on evidence or forecasts, use the Futuro Simple. The Condicional would imply a hypothetical condition, not a straightforward prediction. 'Según el pronóstico' signals a real future expectation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira el cielo, está muy nublado. Creo que ___ a llover en cualquier momento.",
    "en": "Look at the sky, it's very cloudy. I think it's going to rain any moment.",
    "options": [
      "irá",
      "iría",
      "va",
      "voy"
    ],
    "correct": 2,
    "explanation": "Ir a + infinitivo is preferred over Futuro Simple when there is immediate evidence or strong certainty about a near-future event. The dark clouds are direct evidence, making 'va a llover' more natural than 'lloverá,' which sounds more distant or formal."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el protocolo de seguridad antes del lunes.",
    "en": "It is essential that all employees review the safety protocol before Monday.",
    "options": [
      "revisan",
      "revisarán",
      "revisen",
      "revisaran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity, importance, or obligation (es fundamental que, es necesario que, etc.) trigger the Subjuntivo in the subordinate clause. The subject changes (impersonal expression → los empleados), which is another cue for Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del médico, ¿vale?",
    "en": "Call me as soon as you get news from the doctor, okay?",
    "options": [
      "tengas",
      "tienes",
      "tendrás",
      "tienes que tener"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when they refer to a future action that hasn't happened yet. If the clause referred to habitual or past actions, Indicativo would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo sistema de gestión ___ los problemas que tenemos actualmente.",
    "en": "I don't think the new management system will solve the problems we currently have.",
    "options": [
      "soluciona",
      "solucionará",
      "solucione",
      "solucionaría"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion and belief (no creo que, no pienso que, no me parece que) require the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would take Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ la puerta al salir — hace mucho frío afuera.",
    "en": "Please don't leave the door open when you leave — it's very cold outside.",
    "options": [
      "dejes",
      "deja",
      "dejas",
      "dejarás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo (no + subjuntivo), NOT with the affirmative imperative form. The affirmative tú command 'deja' cannot be used with 'no' to form a prohibition; you must switch to the subjunctive form 'dejes.'"
  },
  {
    "topic": "Imperativo",
    "q": "Si van al mercado, ___ las especias frescas — son mucho más aromáticas que las secas.",
    "en": "If you (all) go to the market, buy the fresh spices — they're much more aromatic than the dried ones.",
    "options": [
      "compren",
      "comprad",
      "compren ustedes",
      "comprén"
    ],
    "correct": 0,
    "explanation": "Ustedes commands use the present Subjuntivo third-person plural form for both affirmative and negative commands. 'Comprad' is the vosotros affirmative imperative, which is used in Spain but not for ustedes. In Latin America, ustedes is the standard plural second person."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía a la cena. ___ perdido en el nuevo barrio.",
    "en": "Marcos still hasn't arrived at the dinner. He must have gotten lost in the new neighborhood.",
    "options": [
      "Habrá perdido",
      "Habrá perderse",
      "Habrá perdido que",
      "Se habrá perdido"
    ],
    "correct": 3,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about something that likely happened in the past or very recently. 'Perderse' is a reflexive verb, so the reflexive pronoun 'se' must precede the auxiliary 'habrá': se habrá perdido."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
