<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 28, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 28, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de música ___ en el parque central este fin de semana.",
    "en": "The music festival is in the central park this weekend.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location typically uses ESTAR. The rule is: SER + location applies to scheduled events, not physical objects."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's very hot still.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a current, temporary condition or state. The soup being hot is a changeable physical state, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi suegra ___ muy lista; siempre sabe qué decir en cada situación.",
    "en": "My mother-in-law is very clever; she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "SER + 'listo' means clever or smart as a personality trait. ESTAR + 'listo' would mean 'ready.' Here the sentence describes an inherent characteristic, so SER is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El guacamole que preparaste ___ riquísimo, ¿le pusiste limón?",
    "en": "The guacamole you made is absolutely delicious — did you put lime in it?",
    "options": [
      "es",
      "está",
      "estaba",
      "era"
    ],
    "correct": 1,
    "explanation": "ESTAR + 'rico' means something tastes delicious at this moment (a sensory experience). SER + 'rico' would mean someone is wealthy. Food taste is always expressed with ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me contaba cuentos antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto (era) is used to describe habitual or repeated past actions and background states. 'Cuando era pequeña' sets a background age, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading calmly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "The imperfecto (leía) describes an ongoing background action that was interrupted. The interrupting event (sonó) uses indefinido. This is the classic 'interrupted action' contrast between the two tenses."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "firmara",
      "habría firmado"
    ],
    "correct": 1,
    "explanation": "The indefinido (firmó) is used for a single, completed action with a specific past time reference ('el año pasado'). The imperfecto would imply it was a recurring or habitual action."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominal relative pronoun meaning 'what/that which.' It is used when there is no specific antecedent noun — it refers to a general concept or idea, equivalent to 'the thing that.'"
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que por fin hayas conseguido el trabajo que querías.",
    "en": "How great that you've finally gotten the job you wanted.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' (with accent) is used in exclamations to intensify an adjective or adverb, equivalent to 'How…!' in English. Without the accent, 'que' is a conjunction or relative pronoun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo reuniones largas en el trabajo.",
    "en": "Lately I get very stressed when I have long meetings at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the 'yo y yo' pattern where the subject and the experiencer are the same person — I stress myself. This is different from 'me estresas' (you stress me) or 'me estresa el tráfico' (traffic stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "'Me preocupas' follows the 'yo y tú' pattern: a second-person subject (tú) causes an emotional effect on the first-person speaker (me). The verb conjugates to match 'tú,' not the speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "hago"
    ],
    "correct": 1,
    "explanation": "The condicional (haría) is required after a hypothetical 'si + imperfecto de subjuntivo' clause. It expresses a consequence of an unreal or unlikely condition, not a concrete future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ mucho calor este verano en toda la región.",
    "en": "According to the forecast, it will be very hot this summer throughout the region.",
    "options": [
      "haría",
      "habría",
      "hará",
      "va a hacer"
    ],
    "correct": 2,
    "explanation": "The futuro simple (hará) is used for objective predictions based on evidence or external information, like weather forecasts. 'Voy a hacer' would suggest a personal plan, which doesn't fit an impersonal forecast."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Acabo de comprar los ingredientes: esta noche ___ paella para toda la familia.",
    "en": "I just bought the ingredients: tonight I'm going to make paella for the whole family.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when a future action is already planned or when there is immediate evidence of intention (here, having just bought the ingredients). It emphasizes preparation over prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que los empleados ___ sus horas de descanso.",
    "en": "It is important that employees respect their rest hours.",
    "options": [
      "respetan",
      "respeten",
      "respetarán",
      "respetaban"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions like 'es importante que' trigger the subjuntivo because they express a value judgment about someone else's action. The subjunctive (respeten) signals that the action is desired but not guaranteed."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ el informe, te lo mando por correo.",
    "en": "As soon as I finish the report, I'll send it to you by email.",
    "options": [
      "termino",
      "termine",
      "terminaré",
      "terminé"
    ],
    "correct": 1,
    "explanation": "After 'en cuanto' (as soon as) referring to a future action, the subjuntivo (termine) is required. Even though it feels like a future event, Spanish uses the present subjunctive rather than the future indicative in these time clauses."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que tenga terraza.",
    "en": "I'm looking for an apartment that is near the metro and has a terrace.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent is hypothetical or non-specific (the apartment may or may not exist), the subjuntivo (esté) is required. If the speaker already had a specific apartment in mind, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "___ un momento en recepción, por favor; el médico lo atenderá enseguida.",
    "en": "Wait a moment at reception, please; the doctor will see you shortly.",
    "options": [
      "Esperas",
      "Espere",
      "Espera",
      "Esperar"
    ],
    "correct": 1,
    "explanation": "This is a formal command (usted), which uses the present subjunctive form — for '-ar' verbs, that means the '-e' ending (espere). The 'tú' affirmative imperative would be 'espera,' but formal address requires 'espere.'"
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el pasaporte en la mochila; llévalo siempre encima.",
    "en": "Don't leave your passport in the backpack; always keep it on you.",
    "options": [
      "dejes",
      "dejas",
      "deja",
      "dejés"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive, not the indicative. 'No dejes' uses the subjunctive form of 'dejar.' The affirmative tú command would be 'deja,' but negation requires the subjunctive."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marcos no ha llegado. ___ perdido el autobús otra vez.",
    "en": "It's three in the afternoon and Marcos hasn't arrived. He must have missed the bus again.",
    "options": [
      "Habría perdido",
      "Habrá perdido",
      "Ha perdido",
      "Hubiera perdido"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about a past event from a present-moment perspective. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
