<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 08, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 08, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER + location applies to scheduled events, while ESTAR + location applies to physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante y me va a sentar mal.",
    "en": "Don't touch that sauce — it is very spicy and it's going to upset my stomach.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used for inherent or defining characteristics of something, including taste properties that are intrinsic to a food or object. Picante here describes the nature of the sauce, not a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que empezó el ayuno intermitente, mi vecino ___ muy delgado.",
    "en": "Since starting intermittent fasting, my neighbor is very thin.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a condition that results from a change or process, as opposed to a permanent physical trait. The context 'since he started fasting' implies a change of state, so ESTAR signals that the thinness is a new or current condition rather than a lifelong feature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado! El pescado que compraste ayer ___ malo — huele fatal.",
    "en": "Watch out! The fish you bought yesterday is bad — it smells awful.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Malo changes meaning depending on the verb: SER + malo means morally bad or of poor quality by nature, while ESTAR + malo means spoiled (food) or sick (person). Here the fish has gone off, which is a temporary, changed state."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me contaba cuentos antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (era) is used for background conditions and habitual or repeated states in the past. 'When I was little' describes an extended background period, and the habitual telling of stories also calls for the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Me ___ un mensaje justo cuando estaba presentando el informe al jefe.",
    "en": "I received a message just when I was presenting the report to the boss.",
    "options": [
      "llegaba",
      "llegó",
      "había llegado",
      "llegaría"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another ongoing action, the interrupting event uses the Indefinido (llegó) and the background action uses the Imperfecto (estaba presentando). The Indefinido marks a specific, completed moment that cuts into an ongoing scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "De joven, Ramón ___ al gimnasio tres veces por semana sin falta.",
    "en": "As a young man, Ramón went to the gym three times a week without fail.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "habría ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (iba) is used for habitual or repeated past actions with no defined end point. Phrases like 'as a young man' and 'three times a week' signal routine behavior, which belongs to the Imperfecto rather than the completed-action Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ te molesta tanto de mi forma de hablar.",
    "en": "I don't understand what bothers you so much about the way I speak.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what / the thing that' and acts as the object of the verb entender. Plain 'que' is a conjunction linking two clauses, not a nominalizer, so only 'lo que' correctly introduces the embedded question here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable verte aquí después de tanto tiempo.",
    "en": "What a pleasant surprise to see you here after so long.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to mean 'what a…' before a noun or adjective. In this structure (¡Qué + noun + tan/más + adjective!), it expresses strong emotion or admiration."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo reuniones largas — necesito descansar más.",
    "en": "Lately I stress out a lot when I have long meetings — I need to rest more.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject and the object of the action are the same person (Yo → Yo), the reflexive pronoun 'me' is used with a first-person singular verb: me estreso. This is the 'Yo y yo' pattern where the subject acts upon themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que llegamos tarde a casa, el perro ___ con sus ladridos.",
    "en": "Every time we arrive home late, the dog drives us crazy with its barking.",
    "options": [
      "nos volvemos locos",
      "nos vuelve locos",
      "os volvéis locos",
      "se vuelve loco"
    ],
    "correct": 1,
    "explanation": "When an external agent (el perro) causes an effect on another person (us), the verb agrees with the agent and takes an indirect object pronoun matching the recipient. This is the 'Yo y el mundo' pattern: subject (el perro) + verb in 3rd person + indirect object pronoun (nos)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "The si + Imperfecto Subjuntivo construction requires the Condicional in the main clause to express a hypothetical or contrary-to-fact situation. Futuro Simple would imply a real, likely future condition, not the unreal scenario conveyed here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya decidí: mañana ___ a hablar con mi jefa sobre el aumento de sueldo.",
    "en": "I've already decided: tomorrow I'm going to talk to my boss about the salary raise.",
    "options": [
      "iré",
      "voy",
      "iría",
      "voy a ir"
    ],
    "correct": 3,
    "explanation": "'Voy a + infinitivo' (ir a + infinitive) expresses a near future action based on a present decision or intention, especially in informal spoken Spanish. It signals more immediacy and personal commitment than the more neutral Futuro Simple (iré), which is preferred for more distant or formal contexts."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que el tren ___ a las nueve, pero ya son las nueve y cuarto.",
    "en": "They told me the train would arrive at nine, but it's already quarter past nine.",
    "options": [
      "llegará",
      "llegue",
      "llegaría",
      "llega"
    ],
    "correct": 2,
    "explanation": "The Condicional is used in reported speech to represent a future action from the perspective of a past moment (the equivalent of 'would arrive' after a past-tense reporting verb like 'dijeron'). This is called the 'future of the past.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho horas cada noche.",
    "en": "The doctor recommends that you sleep at least eight hours every night.",
    "options": [
      "duermes",
      "duermas",
      "dormirás",
      "dormirías"
    ],
    "correct": 1,
    "explanation": "Verbs of recommendation, advice, and desire (recomendar, querer, esperar) trigger the Subjuntivo in the subordinate clause when the subject changes. The structure is verb of influence + que + different subject + Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del resultado de la entrevista.",
    "en": "Call me as soon as you have news about the interview result.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "Time conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to a future, anticipated event. In the present tense, these conjunctions followed by Indicativo describe habitual facts, but with a future meaning they always take Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ abierto los lunes — compruébalo antes de ir.",
    "en": "I don't think that restaurant is open on Mondays — check before you go.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar, no parecer) trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than affirming a fact. Affirmative 'creo que' would take the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la música — los niños ya están dormidos.",
    "en": "Please, turn down the music — the children are already asleep.",
    "options": [
      "bajas",
      "baja",
      "no bajas",
      "bajar"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed by dropping the -s from the present indicative tú form (bajas → baja). This is distinct from the negative tú command, which uses the present subjunctive (no bajes)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe todavía — hay que revisar los datos del último trimestre.",
    "en": "Don't send the report yet — we need to review last quarter's data.",
    "options": [
      "envíes",
      "envía",
      "enviarás",
      "envías"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjunctive form (no envíes). The affirmative imperative (envía) cannot be made negative simply by adding 'no'; the form must change to the subjunctive for all negative commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro las llaves por ningún lado. Las ___ en el coche otra vez.",
    "en": "I can't find the keys anywhere. I must have left them in the car again.",
    "options": [
      "dejaré",
      "dejé",
      "habré dejado",
      "hubiera dejado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a past event when viewed from the present moment, equivalent to 'must have done' or 'probably did' in English. It signals the speaker's logical inference rather than a known fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
