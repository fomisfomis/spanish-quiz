<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 29, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 29, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR indicates where people or objects are, but scheduled events (concerts, parties, meetings) take SER + location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Pablo ___ completamente muerto.",
    "en": "After running ten kilometers, Pablo is completely dead/exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "Here 'muerto' is used figuratively to mean exhausted, describing a temporary state resulting from an action. ESTAR is used for states, conditions, and results of change, while SER + muerto would mean someone is literally a dead person by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué sorpresa! Tu hermana ___ muy lista para resolver problemas de matemáticas.",
    "en": "What a surprise! Your sister is very clever at solving math problems.",
    "options": [
      "está",
      "es",
      "estaba",
      "era"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'clever or intelligent' as an inherent characteristic. ESTAR + listo/a, on the other hand, means 'ready', so the choice of verb completely changes the meaning of the adjective."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este queso artesanal ___ riquísimo — nunca había probado algo así.",
    "en": "This artisanal cheese is absolutely delicious — I had never tried anything like it.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means 'to taste delicious' and expresses a sensory experience or reaction. SER + rico/a means 'to be wealthy', so using estar here correctly conveys that the cheese tastes amazing."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela me ___ cuentos antes de dormir todas las noches.",
    "en": "When I was a child, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "hubiera contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when signaled by expressions like 'todas las noches'. The Indefinido would imply a single completed event, which contradicts the habitual meaning here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading the report calmly when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto (leía) and the interrupting event uses the Indefinido. 'Sonó' marks the sudden, completed interruption that broke the continuous activity."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ lleno, así que decidimos pedir la comida para llevar.",
    "en": "The restaurant was full, so we decided to order the food to go.",
    "options": [
      "estuvo",
      "estaba",
      "estuviera",
      "ha estado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used to set the scene or describe background conditions in the past. The restaurant being full is a circumstance that existed at that moment, providing context for the action (deciding) expressed in Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con esa actitud.",
    "en": "I don't understand what you're trying to tell me with that attitude.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalized relative pronoun meaning 'that which' or 'what', and is used when the antecedent is unspecified or abstract. 'Que' alone without an article cannot serve as the object of 'entender' in this indirect-question structure."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo en Madrid, ¡te lo mereces!",
    "en": "How great that you got that job in Madrid — you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express admiration, surprise, or emotion, equivalent to 'how' or 'what a' in English. 'Que' without an accent is a subordinating conjunction and cannot open an exclamatory expression on its own."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con tanto trabajo acumulado.",
    "en": "Lately I've been stressing a lot with so much accumulated work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or psychological state, the verb is reflexive and matches the subject (yo → me estreso). This is the 'yo y yo' pattern where the same person is both the cause and the experiencer of the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, one person (tú) causes a psychological effect on another person (yo), so the verb conjugates with the person doing the action (tú → estresas) while the experiencer is marked with the indirect object pronoun (me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical (si + Imperfecto Subjuntivo) sentence to express what would happen under an unreal or unlikely condition. The Futuro Simple cannot appear in these contrary-to-fact conditional clauses."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the forecast, tomorrow it will be very hot all along the coast.",
    "options": [
      "haría",
      "habrá",
      "vaya a hacer",
      "hiciera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for objective predictions or statements about future events, especially when based on evidence like forecasts or plans. The Condicional would imply a hypothetical condition that has not been established here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio porque ya pagué la mensualidad.",
    "en": "This afternoon I'm going to the gym because I already paid the monthly fee.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention that is already planned or decided, often with a personal reason or commitment attached. 'Iré' (Futuro Simple) sounds more distant or formal, while 'iría' (Condicional) would imply a hypothetical that contradicts the certainty conveyed by 'ya pagué'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó si ___ disponible para reunirme con el cliente al día siguiente.",
    "en": "She asked me if I would be available to meet with the client the following day.",
    "options": [
      "seré",
      "sería",
      "voy a ser",
      "sea"
    ],
    "correct": 1,
    "explanation": "In reported speech, when the main verb is in the past (preguntó), the future of the original statement shifts to the Condicional. This is known as the 'future of the past' — the Condicional replaces the Futuro Simple in indirect speech after past-tense verbs."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el cliente ___ satisfecho con la propuesta que enviamos ayer.",
    "en": "I hope the client is satisfied with the proposal we sent yesterday.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or hope like 'esperar que', the subordinate clause requires the Subjuntivo. The Subjuntivo is triggered because the subject of the main clause (yo) differs from the subject of the subordinate clause (el cliente), and the wish is directed outward."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese método ___ los resultados que esperas.",
    "en": "I don't think that method will give the results you're expecting.",
    "options": [
      "da",
      "dé",
      "dará",
      "daría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or uncertainty rather than asserting a fact. The affirmative 'creo que' would take indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the results of the analysis.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to a future event that has not yet happened. Using the Indicativo (tienes) would imply a habitual or present fact, not a future expectation."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la ventana, por favor — hace mucho calor aquí dentro.",
    "en": "Hey, open the window, please — it's very hot in here.",
    "options": [
      "abre",
      "abres",
      "abra",
      "abrir"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of regular -ir verbs like 'abrir' is formed using the third-person singular present indicative form (él/ella abre → abre). This is distinct from the formal usted command, which uses the subjunctive (abra)."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía. ___ perdido en el metro otra vez.",
    "en": "Marcos hasn't arrived yet. He must have gotten lost on the subway again.",
    "options": [
      "Se habrá perdido",
      "Se perdería",
      "Se perderá",
      "Se hubiera perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when the speaker is speculating about something that has already occurred. It corresponds to English 'must have' or 'probably has' when reasoning about the past."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
