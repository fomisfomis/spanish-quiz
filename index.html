<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 12, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 12, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER + location applies to events, not physical objects."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Miguel ___ completamente muerto.",
    "en": "After running ten kilometers, Miguel is completely dead (exhausted).",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' describes a resulting state or condition — in this context it means exhausted, not literally dead. ESTAR + adjective signals a temporary or perceived state rather than an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese chile — ___ muy picante y además ___ podrido!",
    "en": "Don't touch that chili — it is very spicy and it is also rotten!",
    "options": [
      "es / está",
      "está / es",
      "es / es",
      "está / está"
    ],
    "correct": 0,
    "explanation": "Picante is an inherent characteristic of the chili (SER), while podrido describes a change of state — it has become rotten — so it takes ESTAR. This contrast shows how SER marks permanent traits and ESTAR marks changes or resulting conditions."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Todos pensaban que era un hombre honesto, pero resultó que ___ listo para engañar a cualquiera.",
    "en": "Everyone thought he was an honest man, but it turned out he was clever/ready to deceive anyone.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "Listo changes meaning depending on the verb: SER + listo = clever/intelligent (permanent trait), while ESTAR + listo = ready (a state or readiness for something). Here the context of being prepared to deceive points to ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela me ___ cuentos cada noche antes de dormir.",
    "en": "When I was a child, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The imperfecto (contaba) is used for habitual or repeated actions in the past with no defined endpoint. The phrase 'cada noche' reinforces the habitual nature of the action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the imperfecto (leía) while the interrupting event uses the indefinido (sonó). The imperfecto paints the scene; the indefinido marks what disrupted it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un contrato muy importante con una compañía francesa.",
    "en": "Last year, my company signed a very important contract with a French company.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmaría"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido (firmó) is used for a single completed action at a specific past time. 'El año pasado' signals a closed, finished time frame, which calls for indefinido rather than imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a nominalizer meaning 'that which' or 'what,' referring to an unspecified thing. It is needed here because the object of 'entiendo' is an entire concept, not a specific noun already mentioned. Que alone would require an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿___ ciudad tan bonita! Nunca había visto nada igual.",
    "en": "What a beautiful city! I had never seen anything like it.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "Qué with an accent mark is used in exclamations (¡Qué + noun/adjective!) to express admiration, surprise, or emotion. Without the accent, que is a conjunction or relative pronoun and cannot introduce exclamatory structures."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo demasiado trabajo acumulado.",
    "en": "Lately I stress a lot because I have too much accumulated work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject and the affected person are both the speaker (yo), the verb is reflexive: me estreso (yo me estreso). This is the 'Yo y yo' pattern — the subject causes the reaction in themselves, so verb and subject agree in first person singular."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "This is the 'Yo y tú' pattern: a second person subject (tú) causes an emotional reaction in a first person object (me). The verb conjugates for tú (preocupas) while me marks who is affected — making it me preocupas."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ aprender a tocar la guitarra?",
    "en": "If you had more free time, would you like to learn to play the guitar?",
    "options": [
      "querrás",
      "quieres",
      "querrías",
      "vas a querer"
    ],
    "correct": 2,
    "explanation": "The conditional (querrías) is required in the result clause of a hypothetical si-clause that uses the imperfecto subjuntivo (si tuvieras). The structure si + imperfecto subjuntivo + condicional expresses unreal or hypothetical present/future scenarios."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho en la sierra.",
    "en": "According to the forecast, tomorrow it will snow a lot in the mountains.",
    "options": [
      "nevaría",
      "nevaba",
      "nieva",
      "nevará"
    ],
    "correct": 3,
    "explanation": "The futuro simple (nevará) expresses a factual prediction about a future event based on evidence or certainty (a weather forecast). The conditional (nevaría) would imply a hypothetical or dependent condition, which is not the case here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes, ___ a buscar los documentos antes de que cierren la oficina.",
    "en": "Don't worry, I'm going to get the documents before the office closes.",
    "options": [
      "iré",
      "voy",
      "voy a ir",
      "iría"
    ],
    "correct": 2,
    "explanation": "Voy a + infinitivo expresses an immediate or already-decided future intention, often with a sense of personal commitment or proximity in time. The futuro simple (iré) is more neutral or distant; voy a ir better conveys the reassuring, near-term promise here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho horas cada noche.",
    "en": "The doctor recommends that you sleep at least eight hours every night.",
    "options": [
      "duermes",
      "dormirás",
      "duermas",
      "durmas"
    ],
    "correct": 2,
    "explanation": "After verbs of recommendation, wish, or influence (recomendar, querer, pedir), the subordinate clause requires the presente de subjuntivo. Note also that dormir is an e→ie/u stem-changing verb: the tú subjunctive form is duermas, not durmAs."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del examen, te llamo enseguida.",
    "en": "As soon as I get the exam results, I'll call you right away.",
    "options": [
      "tengo",
      "tendré",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the subjuntivo when referring to a future event that has not yet occurred. Using the indicativo (tengo) would imply a habitual present action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ varios idiomas y que haya vivido en el extranjero.",
    "en": "They are looking for someone who speaks several languages and has lived abroad.",
    "options": [
      "habla",
      "hablará",
      "hable",
      "hablara"
    ],
    "correct": 2,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (they don't know yet if such a person exists), the subjuntivo is required. Alguien que + subjuntivo expresses a desired or unknown quality rather than a known fact."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es muy molesto para todos.",
    "en": "Please, don't use your phone during the meeting — it's very annoying for everyone.",
    "options": [
      "uses",
      "usas",
      "usa",
      "usés"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with no + presente de subjuntivo (no uses), not with the affirmative imperative form (usa). This is because the affirmative and negative command forms for tú are structurally different, unlike ustedes commands."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad de inmediato.",
    "en": "Ladies and gentlemen, fasten your seatbelts immediately.",
    "options": [
      "abrochen",
      "abrochan",
      "abroche",
      "abrochar"
    ],
    "correct": 0,
    "explanation": "The ustedes imperative (both affirmative and negative) is identical to the third person plural of the presente de subjuntivo. Abrochen is the correct subjunctive/imperative form for ustedes; abrochan is simply the indicative."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos de la tarde y Luis todavía no ha llegado. ¿Crees que ___ perdido el tren?",
    "en": "It's two in the afternoon and Luis still hasn't arrived. Do you think he may have missed the train?",
    "options": [
      "habrá",
      "habría",
      "haya",
      "había"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to speculate or make a probability judgment about a past event from the present moment. It conveys 'I wonder if he has' or 'he must have,' expressing epistemic deduction rather than a future action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
