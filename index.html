<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 03, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 03, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo.",
    "en": "Don't touch that wire — it's very dangerous right now.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "Use ESTAR when describing a temporary or situational condition. 'Peligroso' here refers to the wire's current state, not an inherent, permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mis primos ___ en el jardín del hotel.",
    "en": "My cousins' wedding is in the hotel garden.",
    "options": [
      "está",
      "es",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "Events take place at a location, so the location of events uses SER, not ESTAR. ESTAR is used for the physical location of objects and people, but events are scheduled with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este postre — ___ riquísimo, te lo juro.",
    "en": "Try this dessert — it's absolutely delicious, I swear.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "When 'rico' means 'delicious' (referring to taste experienced in the moment), ESTAR is used. When 'rico' means 'wealthy', SER is used — this is a classic adjective that changes meaning depending on ser or estar."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que empezó a trabajar doce horas al día, ___ muy aburrido.",
    "en": "Since he started working twelve hours a day, he has been very bored.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + 'aburrido' means the person feels bored (an emotional state). SER + 'aburrido' would mean the person is boring by nature — a permanent characteristic. Context here describes a current condition caused by circumstances."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) cerca del mar y todos los veranos nadaba con mis amigos.",
    "en": "When I was a child, I used to live near the sea and every summer I swam with my friends.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "habría vivido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past and for background descriptions. 'Vivir cerca del mar' was an ongoing situation during childhood, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Me ___ (duchar) tranquilamente cuando de repente sonó el timbre.",
    "en": "I was calmly showering when the doorbell suddenly rang.",
    "options": [
      "duché",
      "duchaba",
      "he duchado",
      "ducharía"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Ducharse' is the background action interrupted by 'sonó el timbre'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Al final, después de meses de dudas, ___ (aceptar, ella) el trabajo en Berlín.",
    "en": "In the end, after months of doubt, she accepted the job in Berlin.",
    "options": [
      "aceptaba",
      "aceptó",
      "había aceptado",
      "aceptaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a single completed event with a clear endpoint in the past. Phrases like 'al final' signal a decisive moment, which contrasts with the Imperfecto's use for ongoing or habitual situations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ más me molesta de viajar en avión es el madrugón.",
    "en": "What bothers me most about flying is having to get up at the crack of dawn.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' acts as a noun clause meaning 'the thing that' and is used as the subject or object of a sentence when there is no specific antecedent noun. Plain 'que' cannot start a sentence as a subject noun clause in this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "No encuentro el informe con ___ trabajé toda la semana pasada.",
    "en": "I can't find the report that I worked on all last week.",
    "options": [
      "lo que",
      "el que",
      "qué",
      "que"
    ],
    "correct": 3,
    "explanation": "After a preposition (con, en, de, a…), Spanish requires a definite article before 'que' when the antecedent is clear and specific: 'con el que'. However, when the preposition directly precedes 'que' without an article in informal speech, 'que' alone is also acceptable here — but note that 'con que' is the simplest relative pronoun option after a stated antecedent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente el trabajo ___ muchísimo. No puedo desconectar.",
    "en": "Lately work stresses me out so much. I can't switch off.",
    "options": [
      "me estreso",
      "te estreso",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "In the 'yo y el mundo' pattern, the subject is the thing causing the feeling (el trabajo) and the person affected is marked by an indirect object pronoun (me). The verb agrees with the subject 'el trabajo' → third-person singular: me estresa."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ sin querer. Luego me arrepiento.",
    "en": "Whenever we argue, I get worked up without meaning to. Then I regret it.",
    "options": [
      "me altero",
      "me alteras",
      "me altera",
      "nos alteramos"
    ],
    "correct": 0,
    "explanation": "In the 'yo y yo' pattern, the subject and the person affected are the same — the speaker. 'Yo me altero' means the speaker becomes agitated through their own emotional reaction, not because of another person's direct action."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprendería",
      "aprenderé",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 0,
    "explanation": "In hypothetical si-clauses where the condition is contrary to present reality (si + Imperfecto de Subjuntivo), the main clause requires the Condicional Simple, not the Futuro. The Condicional here expresses an unreal or imagined consequence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes — ___ (llegar, yo) antes de que empiece la reunión.",
    "en": "Don't worry — I'll arrive before the meeting starts.",
    "options": [
      "llegaría",
      "llegaré",
      "voy a llegar",
      "llegue"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred in spoken Spanish when the event is planned or there is clear present intention. Both 'llegaré' and 'voy a llegar' are correct here, but 'voy a llegar' feels more natural in informal conversation as a near-future commitment."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó si ___ (poder, yo) ayudarle con la mudanza el sábado.",
    "en": "He asked me if I would be able to help him with the move on Saturday.",
    "options": [
      "podré",
      "podría",
      "puedo",
      "pueda"
    ],
    "correct": 1,
    "explanation": "In reported speech where the main verb is in the past (me preguntó), the future-in-the-past is expressed with the Condicional Simple. This is the 'futuro del pasado' — what was future from a past perspective is rendered with the Condicional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ (nevar) en la sierra este fin de semana.",
    "en": "According to the forecast, it will snow in the mountains this weekend.",
    "options": [
      "nevaría",
      "nevará",
      "va a nevar",
      "nieve"
    ],
    "correct": 1,
    "explanation": "When reporting a forecast or a fact stated by an external source about the future, Futuro Simple is natural. 'Va a nevar' is also correct, but Futuro Simple is often preferred in more formal or written registers for predictions based on evidence."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el vuelo ___ (salir) a tiempo porque tengo una conexión muy ajustada.",
    "en": "I hope the flight leaves on time because I have a very tight connection.",
    "options": [
      "sale",
      "salga",
      "saldrá",
      "saldría"
    ],
    "correct": 1,
    "explanation": "After verbs of hope and wish (esperar, desear, querer…) followed by 'que' and a change of subject, the Subjuntivo is required in the dependent clause. The speaker's desire does not guarantee the outcome, so the Subjuntivo expresses this uncertainty."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Avísame cuando ___ (terminar, tú) el informe y lo revisamos juntos.",
    "en": "Let me know when you finish the report and we'll review it together.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminabas"
    ],
    "correct": 2,
    "explanation": "When 'cuando' introduces a future action that has not yet happened, the Subjuntivo is required. This differs from 'cuando' in a descriptive sentence about habits or past facts, where the Indicativo is used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (tener) reservas disponibles un sábado por la noche.",
    "en": "I don't think that restaurant has any reservations available on a Saturday night.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tendría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que) trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial. The affirmative form 'creo que tiene' would take the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "___ (poner, tú) la mesa, por favor — la cena ya está casi lista.",
    "en": "Set the table, please — dinner is almost ready.",
    "options": [
      "Pon",
      "Pones",
      "Pongas",
      "Ponga"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'poner' is irregular: 'pon'. Many common verbs (hacer→haz, salir→sal, venir→ven, decir→di) have irregular affirmative tú imperatives that must be memorised separately from the conjugation pattern."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto — seguro que todo sale bien.",
    "en": "Don't worry so much — I'm sure everything will be fine.",
    "options": [
      "te preocupas",
      "te preocupes",
      "te preocuparás",
      "preocúpate"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with 'no + present subjunctive'. With reflexive verbs, the pronoun goes before the verb: 'no te preocupes'. In affirmative commands the pronoun attaches to the end: 'preocúpate'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Lleva tres días sin contestar mensajes. ___ (irse) de vacaciones sin decirle a nadie.",
    "en": "He hasn't replied to messages in three days. He must have gone on holiday without telling anyone.",
    "options": [
      "Se irá",
      "Se habrá ido",
      "Se fue",
      "Se habría ido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto is used to express probability or deduction about a past event when the speaker is speculating from the present. It conveys 'he has probably gone' — a reasoned guess about something that may have already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
