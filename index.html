<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 13, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 13, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal este viernes.",
    "en": "The conference is in the main auditorium this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though SER typically doesn't indicate location. ESTAR is used for the location of physical objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese pastel — ___ para la fiesta de mañana.",
    "en": "Don't touch that cake — it's for tomorrow's party.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + para expresses purpose or destination. When describing what something is intended for, SER is the correct verb, not ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de años sin trabajar, mi tío ___ muy aburrido con la jubilación.",
    "en": "After years without working, my uncle is very bored with retirement.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + aburrido means 'to feel bored' — a temporary emotional state. SER + aburrido means 'to be a boring person' — a permanent personality trait. Context here describes his current feeling, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Este caldo de pollo ___ riquísimo! ¿Qué le pusiste?",
    "en": "This chicken broth is absolutely delicious! What did you put in it?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'to taste delicious' in the moment of tasting. SER + rico means 'to be rich (wealthy)' when referring to a person, or 'naturally delicious by nature' for food. Here the speaker reacts to the taste right now, so ESTAR is used."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me contaba cuentos todas las noches.",
    "en": "When I was little, my grandmother used to tell me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (era) is used for habitual or repeated actions in the past and for background descriptions like age or ongoing states. 'When I was little' describes a continuous background condition, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma.",
    "en": "I was working calmly when suddenly the alarm went off.",
    "options": [
      "trabajé",
      "trabajaba",
      "había trabajado",
      "trabajaré"
    ],
    "correct": 1,
    "explanation": "When one past action interrupts another, the ongoing background action uses Imperfecto (trabajaba) and the interrupting event uses Indefinido (sonó). 'De repente' signals the interrupting completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con una firma japonesa.",
    "en": "Last year, my company signed a new contract with a Japanese firm.",
    "options": [
      "firmaba",
      "firmó",
      "había firmado",
      "firmara"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido (firmó) is used for completed, bounded events at a specific point in the past. 'El año pasado' signals a defined time frame, making this a single finished action rather than a habitual or ongoing situation."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ más me costó del viaje fue adaptarme al horario.",
    "en": "What cost me the most about the trip was adapting to the schedule.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'what' or 'the thing that,' and is used as the subject or object of a sentence when referring to something unspecified. Que alone cannot begin a noun clause as the subject without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "Estoy harto de ___ siempre lleguéis tarde a las reuniones.",
    "en": "I'm fed up with you always arriving late to meetings.",
    "options": [
      "lo que",
      "que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "After verbs or expressions of emotion like 'estar harto de,' the conjunction que introduces a subordinate clause. Lo que would need to refer back to a specific thing already mentioned, not introduce a new subordinate clause here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I stress out a lot with work deadlines.",
    "options": [
      "me estresas",
      "me estresa",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "Me estreso follows the 'yo y yo' pattern: the subject and the person affected are the same (I stress myself out). The verb estresarse is reflexive and conjugated in first person singular. No external agent causes the stress in this sentence."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé qué haces, pero siempre ___ cuando hablo contigo.",
    "en": "I don't know what you do, but you always relax me when I talk to you.",
    "options": [
      "me relajo",
      "me relajas",
      "me relaja",
      "me relajan"
    ],
    "correct": 1,
    "explanation": "Me relajas follows the 'yo y tú' pattern: you (tú) are the agent causing the effect on me (yo). The verb is conjugated in second person singular (tú) while me indicates the affected first person."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical or contrary-to-fact conditions introduced by 'si + Imperfecto de Subjuntivo,' the result clause uses the Condicional Simple (haría). Futuro Simple or ir a + infinitivo express real future intentions, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — esta tarde ___ tormenta seguro.",
    "en": "Look at those dark clouds — there will definitely be a storm this afternoon.",
    "options": [
      "habría",
      "habrá",
      "voy a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "Futuro Simple (habrá) expresses a prediction or certainty about what will happen based on present evidence. The Condicional (habría) would express a hypothetical possibility, not a confident prediction grounded in current observation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya lo tengo decidido: el mes que viene ___ a hablar con mi jefe sobre el aumento.",
    "en": "I've already decided: next month I'm going to talk to my boss about the raise.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Ir a + infinitivo expresses a planned, intentional future action where the decision has already been made. Futuro Simple (iré) can also work here but sounds more distant or formal; voy a ir emphasizes the firm, pre-made intention more naturally in spoken Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi madre insiste en que yo ___ más verduras.",
    "en": "My mother insists that I eat more vegetables.",
    "options": [
      "como",
      "coma",
      "comeré",
      "comía"
    ],
    "correct": 1,
    "explanation": "Verbs of insistence, desire, and influence (like insistir en que) trigger the Subjuntivo in the subordinate clause when the subjects are different. The speaker's mother wants to influence the speaker's behavior, which is the classic WEIRDO trigger for Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo.",
    "en": "As soon as the test results arrive, I'll call you.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require Subjuntivo when referring to a future event that hasn't happened yet. If the same conjunctions refer to habitual or past actions, Indicativo is used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una lástima que no ___ quedarte más días con nosotros.",
    "en": "It's a shame that you can't stay more days with us.",
    "options": [
      "puedes",
      "puedas",
      "podrás",
      "pudieras"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of emotion like 'es una lástima que' require Subjuntivo in the dependent clause because they express the speaker's subjective reaction to a situation. The present Subjuntivo (puedas) is used when the main verb is in present tense."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ ese archivo todavía — necesito revisarlo antes.",
    "en": "Don't delete that file yet — I need to review it first.",
    "options": [
      "borra",
      "borres",
      "borrarás",
      "borraras"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present Subjuntivo form, not the affirmative imperative. While the affirmative tú command for borrar is 'borra,' the negative form is 'no borres' — the subjunctive is obligatory in all negative imperative constructions."
  },
  {
    "topic": "Imperativo",
    "q": "Si ya terminaron la tarea, ___ sus cuadernos y escúchenme.",
    "en": "If you've already finished the assignment, close your notebooks and listen to me.",
    "options": [
      "cierren",
      "cierran",
      "cerrad",
      "cierren ustedes"
    ],
    "correct": 0,
    "explanation": "Ustedes commands use the third person plural of the present Subjuntivo for both affirmative and negative forms. 'Cerrad' is the vosotros form, which is not used in Latin America. 'Cierren' serves as the ustedes affirmative imperative."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llama otra vez — seguro que para entonces ya ___ de comer.",
    "en": "Call again — surely by then they will have finished eating.",
    "options": [
      "terminarán",
      "habrán terminado",
      "terminaron",
      "terminen"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrán terminado) expresses an action that will be completed before a specific point in the future ('para entonces'). It emphasizes the completion of the action prior to that future reference point, unlike Futuro Simple which just places the action in the future."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
