<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 10, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 10, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR indicates the physical position of people or objects, but for scheduled events, SER is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe temporary states or current conditions. The soup's temperature is a changeable, momentary state, not a permanent characteristic, so ESTAR is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Dicen que el nuevo jefe ___ muy listo, pero sus empleados no confían en él.",
    "en": "They say the new boss is very clever, but his employees don't trust him.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever or intelligent' (a personality trait), while ESTAR means 'ready'. Since the sentence describes an intellectual quality, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, todos nosotros ___ agotados.",
    "en": "After walking ten kilometers, all of us are exhausted.",
    "options": [
      "somos",
      "estamos",
      "seamos",
      "estemos"
    ],
    "correct": 1,
    "explanation": "ESTAR describes a resulting state brought about by an action or experience. Exhaustion here is a temporary condition caused by the hike, not an inherent characteristic of the people involved."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre ___ galletas los domingos.",
    "en": "When I was little, my grandmother always ___ cookies on Sundays.",
    "options": [
      "hornó",
      "horneaba",
      "ha horneado",
      "hornease"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially when accompanied by frequency markers like 'siempre' or 'los domingos'. The Indefinido would imply a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente en el parque cuando de repente empezó a llover a cántaros.",
    "en": "I was walking calmly in the park when it suddenly started to pour with rain.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto sets the background or ongoing action (walking), while the Indefinido ('empezó') marks the interrupting event. The phrase 'de repente' signals the completed interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally ___ the report I had been preparing for weeks.",
    "options": [
      "entregaba",
      "entregué",
      "entregara",
      "entregaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for a completed action with a clear endpoint in the past. 'Ayer' and 'por fin' are strong signals of a single, finished event rather than an ongoing or habitual one."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand ___ you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'that which'. It replaces a thing not previously mentioned. 'Que' alone is a connector and cannot introduce a noun clause as the object of 'entender' here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ interesante es que nadie en la oficina sabía nada del cambio de director.",
    "en": "___ interesting that nobody in the office knew anything about the change of director.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express surprise, admiration, or strong emotion before adjectives or nouns. 'Lo que' would begin a relative clause, not an exclamation."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho por las noches porque tengo varios proyectos pendientes.",
    "en": "Lately I ___ a lot at night because I have several pending projects.",
    "options": [
      "me estreso",
      "te estreso",
      "me estresas",
      "se estresa"
    ],
    "correct": 0,
    "explanation": "When the subject causes stress to themselves, 'me estreso' (yo + me) is used — a true reflexive pattern. 'Me estresas' would mean 'you stress me out', placing the cause externally with a second-person subject."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo y luego no puedo dormir.",
    "en": "When you arrive late without warning, ___ a lot and then I can't sleep.",
    "options": [
      "me estreso",
      "me estresas",
      "te estresas",
      "se me estresa"
    ],
    "correct": 1,
    "explanation": "'Me estresas' follows the Yo y tú pattern: the subject (tú) performs an action that affects the speaker (me). The verb agrees with the agent 'tú', while 'me' marks the indirect experiencer."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ a aprender a tocar la guitarra.",
    "en": "If I had more free time, I ___ learn to play the guitar.",
    "options": [
      "voy a empezar",
      "empezaré",
      "empezaría",
      "empezaba"
    ],
    "correct": 2,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause where the condition uses the Imperfecto de Subjuntivo ('si tuviera'). The Futuro would be used with a real or likely condition ('si tengo')."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la región.",
    "en": "According to the forecast, tomorrow it ___ over thirty degrees across the whole region.",
    "options": [
      "haría",
      "va a hacer",
      "hiciera",
      "habrá hecho"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (periphrastic future) is preferred in spoken Spanish for near-future events with a reliable basis, such as a weather forecast. The Futuro Simple is also possible but sounds more formal or distant."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó si ___ a la inauguración de la exposición el viernes siguiente.",
    "en": "He asked me whether I ___ to the opening of the exhibition the following Friday.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "fuera"
    ],
    "correct": 1,
    "explanation": "In reported speech (indirect speech), the Futuro Simple shifts back to the Condicional. 'Iré' (direct speech) becomes 'iría' when the reporting verb is in a past tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el taller de cocina ___ tan entretenido como el del año pasado.",
    "en": "I hope the cooking workshop ___ as entertaining as last year's.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 1,
    "explanation": "Verbs of wish and hope like 'esperar que' trigger the Subjuntivo in the subordinate clause when the subjects differ. The Subjuntivo form 'sea' (from ser) is required after this expression."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you ___ the analysis results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tenías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to a future action that has not yet occurred. The Indicative would be used if referring to a habitual or past action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo contrato ___ tan beneficioso como nos prometieron.",
    "en": "I don't think the new contract ___ as beneficial as they promised us.",
    "options": [
      "es",
      "está",
      "sea",
      "fue"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion and belief ('no creer que', 'no pensar que') require the Subjuntivo because the speaker is casting doubt on the truth of the subordinate clause. Affirmative 'creo que' would take the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ la luz del baño antes de salir — ya te lo he dicho mil veces!",
    "en": "___ the bathroom light before you leave — I've told you a thousand times!",
    "options": [
      "Apaga",
      "Apagues",
      "No apagues",
      "Apagad"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed with the third-person singular present indicative ending (-a). 'Apagues' is the Subjuntivo form, which is only used for negative tú commands."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, señores pasajeros, no ___ sus equipajes en el pasillo central.",
    "en": "Please, passengers, do not ___ your luggage in the central aisle.",
    "options": [
      "dejen",
      "dejan",
      "den",
      "dejaos"
    ],
    "correct": 0,
    "explanation": "Negative ustedes commands (and all ustedes commands) use the present Subjuntivo form. 'Dejan' is the Indicative and cannot be used for commands; 'dejen' is the correct Subjuntivo-based imperative for ustedes."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Marcos todavía no ha llegado. ___ perdido en el metro otra vez.",
    "en": "It's eleven at night and Marcos still hasn't arrived. He ___ gotten lost on the metro again.",
    "options": [
      "Se habrá perdido",
      "Se perderá",
      "Se perdería",
      "Se ha perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened. It is the equivalent of 'must have + past participle' in English when reasoning about recent past events."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
