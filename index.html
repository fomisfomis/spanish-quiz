<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 17, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 17, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El director de la empresa ___ muy aburrido en las reuniones cuando no habla nadie.",
    "en": "The company director is very bored at meetings when no one speaks.",
    "options": [
      "es muy aburrido",
      "está muy aburrido",
      "fue muy aburrido",
      "estuvo muy aburrido"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'aburrido' describes a temporary emotional state. With SER, 'aburrido' would mean the person is a boring individual by nature — a permanent characteristic, not how they feel right now."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mis primos ___ en el jardín del hotel, no en la iglesia.",
    "en": "My cousins' wedding is in the hotel garden, not in the church.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, not ESTAR. While ESTAR indicates where objects or people are, SER is used to say where an event takes place — this is a classic tricky exception to the 'location = estar' rule."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — ¿puedo pedir la receta?",
    "en": "This dessert is absolutely delicious — can I ask for the recipe?",
    "options": [
      "es riquísimo",
      "está riquísimo",
      "fue riquísimo",
      "estuvo riquísimo"
    ],
    "correct": 1,
    "explanation": "With food, 'estar rico' means it tastes delicious right now (a sensory experience in the moment), while 'ser rico' would mean the food is expensive or wealthy. ESTAR captures the taster's current perception."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegamos al aeropuerto, nos dijeron que el vuelo ___ cancelado.",
    "en": "When we arrived at the airport, they told us the flight was cancelled.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for states resulting from a change — the flight had been cancelled and was in that state when they arrived. 'Estaba cancelado' describes the condition the flight was already in, not the action of cancelling it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past with no specific endpoint. 'Todas las noches' signals a routine, and the Imperfecto paints this as a recurring background activity of childhood."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading the report calmly when the phone suddenly rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "había sonado"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the Imperfecto ('leía'), while the interrupting event uses the Indefinido ('sonó'). The phone ringing is a single completed event that broke the ongoing activity."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ a tres nuevos empleados en el departamento de diseño.",
    "en": "Last year, my company hired three new employees in the design department.",
    "options": [
      "contrataba",
      "contrató",
      "ha contratado",
      "contrate"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed, specific past events with a defined timeframe. 'El año pasado' marks a closed period, and the hiring of three people is a single completed action, not a background state or habit."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'that which' or 'what,' and is used when there is no specific noun antecedent. Here it introduces the thing not understood — a noun clause. 'Que' alone would require a prior noun to refer back to."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que por fin hayas conseguido el trabajo que querías.",
    "en": "How great that you've finally gotten the job you wanted.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to express a strong reaction, equivalent to 'How…!' or 'What a…!' in English. It carries emotional emphasis and is distinct from the connector 'que' (no accent)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando hay cambios de última hora en el trabajo.",
    "en": "Lately I get very stressed when there are last-minute changes at work.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "me estresa"
    ],
    "correct": 0,
    "explanation": "When the speaker is both the subject and the object of the action (Yo y yo pattern), the verb agrees with the first-person subject and takes 'me' as the reflexive pronoun. 'Me estreso' = I stress myself."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ con tus comentarios pasivo-agresivos.",
    "en": "Every time we argue, you irritate me with your passive-aggressive comments.",
    "options": [
      "me irrito",
      "me irritas",
      "me irrita",
      "me irritan"
    ],
    "correct": 1,
    "explanation": "In the Yo y tú pattern, someone else acts upon the speaker. The verb must agree with the second-person subject (tú), giving 'irritas,' while 'me' marks the speaker as the recipient. The subject doing the irritating is 'tú.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "hago"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause structure (si + Imperfecto Subjuntivo + Condicional). The situation is contrary to current reality, so the Futuro Simple or 'voy a' would be grammatically incorrect here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio después del trabajo — ya tengo la bolsa preparada.",
    "en": "This afternoon I'm going to the gym after work — I already have my bag ready.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already decided and have concrete preparation. The detail about the bag being ready signals a firm, imminent intention — a prime context for the periphrastic future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho frío en toda la región norte.",
    "en": "According to the forecast, tomorrow it will be very cold throughout the northern region.",
    "options": [
      "haría",
      "habría",
      "hará",
      "va a haber"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is typically used for predictions and forecasts, especially when citing an external source. While 'va a haber' is also possible, 'hará' (from hacer) is the standard meteorological register for weather predictions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres quieren que yo ___ medicina, pero a mí me apasiona el arte.",
    "en": "My parents want me to study medicine, but I'm passionate about art.",
    "options": [
      "estudie",
      "estudiar",
      "estudio",
      "estudiaré"
    ],
    "correct": 0,
    "explanation": "After verbs of desire like 'querer' with a different subject in each clause, the Subjuntivo is required in the subordinate clause. The structure is: querer + que + different subject + Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the test results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future event that hasn't happened yet. Using the Indicative ('tengo') would imply a habitual present action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo sistema de reservas ___ tan eficiente como prometen.",
    "en": "I don't think the new booking system is as efficient as they claim.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creer que,' 'no pensar que') trigger the Subjuntivo in the dependent clause. The speaker is expressing doubt or denial about the truth of the proposition, which requires Subjunctive mood."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — necesito contarte algo importante antes de que lleguen.",
    "en": "Hey, wait a moment — I need to tell you something important before they arrive.",
    "options": [
      "esperas",
      "espera",
      "espere",
      "esperes"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -AR verbs is formed using the third-person singular present indicative (él/ella form). 'Espera' is directed at a single person informally. 'Esperes' is subjunctive, used only for negative tú commands."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe sin revisarlo bien — el jefe es muy detallista.",
    "en": "Don't send the report without reviewing it carefully — the boss is very detail-oriented.",
    "options": [
      "mandes",
      "manda",
      "mandas",
      "mandarás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the present Subjunctivo, not the regular imperative form. 'No mandes' (tú subjunctive of 'mandar') is the correct structure. The affirmative 'manda' cannot be used after 'no' for commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Miguel no ha llegado todavía. ___ perdido en el metro.",
    "en": "It's eleven at night and Miguel hasn't arrived yet. He must have gotten lost on the subway.",
    "options": [
      "Se habrá perdido",
      "Se perdería",
      "Se pierde",
      "Se hubiera perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a past event from the present moment. The speaker doesn't know for certain but is making an educated guess about what likely happened — a key use distinct from narrating completed future events."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
