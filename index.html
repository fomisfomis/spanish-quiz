<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 25, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 25, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule 'ESTAR for location' applies to people and objects, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tres días sin dormir bien, el jefe ___ muy malo con todos en la reunión.",
    "en": "After three days without sleeping well, the boss was very unpleasant with everyone in the meeting.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo describes a temporary behavioral state (being unpleasant or in a bad mood), while SER + malo would mean the person is inherently bad or evil by nature. The context of a specific incident points to ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pescado ___ riquísimo — ¿puedo pedirte la receta?",
    "en": "This fish is absolutely delicious — can I ask you for the recipe?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/riquísimo means something tastes delicious (a sensory, experienced quality). SER + rico would mean the person or thing is wealthy. When reacting to food you are eating, always use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ___ lista antes de que nadie más se levante.",
    "en": "My grandmother is always ready before anyone else gets up.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo/a means 'to be ready' (a state achieved in a moment). SER + listo/a means 'to be clever or smart' (an inherent characteristic). The context of being ready before others confirms ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (ir) a la playa todos los veranos con mis tíos.",
    "en": "When I was little, I used to go to the beach every summer with my aunts and uncles.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when cues like 'todos los veranos' (every summer) indicate frequency. Pretérito Indefinido would imply a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ (sonar) el teléfono de emergencias.",
    "en": "I was reading the report calmly when suddenly the emergency phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "In interrupted past actions, the ongoing background action uses Imperfecto (leía) and the interrupting event uses Pretérito Indefinido (sonó). The sudden ring is a completed event that cuts through the scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El mercado ___ (estar) lleno de gente y olía a especias frescas cuando llegamos.",
    "en": "The market was full of people and smelled of fresh spices when we arrived.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estará"
    ],
    "correct": 1,
    "explanation": "The Imperfecto sets the scene and describes background conditions — what things looked, smelled, or felt like at a moment in the past. Pretérito Indefinido reports completed actions, not descriptions."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you are trying to say to me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' replacing a whole idea. 'Que' alone would be a conjunction needing a prior noun, and 'qué' with an accent is used in direct or exclamatory questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es una pena ___ no puedas venir a la boda con nosotros.",
    "en": "It's a shame that you can't come to the wedding with us.",
    "options": [
      "lo que",
      "qué",
      "que",
      "de que"
    ],
    "correct": 2,
    "explanation": "After impersonal or evaluative expressions like 'es una pena,' the conjunction 'que' introduces the subordinate clause. No preposition is needed here, and 'lo que' would incorrectly turn the clause into a noun phrase."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Últimamente ___ muchísimo cuando tengo que hablar en público.",
    "en": "Lately I get very stressed when I have to speak in public.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y yo' pattern the subject and the affected person are the same — the speaker causes their own state. 'Me estreso' (yo me estreso) means 'I stress myself out,' using a purely reflexive verb with a first-person subject."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "No sé cómo decírtelo, pero tu actitud últimamente ___ bastante.",
    "en": "I don't know how to tell you, but your attitude lately bothers me quite a bit.",
    "options": [
      "me molesto",
      "me molestas",
      "te molesta",
      "me molesta"
    ],
    "correct": 3,
    "explanation": "In the 'Yo y el mundo' pattern, a third-party subject (tu actitud — third person singular) causes a feeling in the speaker (me). The verb agrees with the subject 'tu actitud,' giving 'me molesta.' This is like the gustar construction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "Hypothetical si-clauses in the present use the Imperfecto de Subjuntivo in the si-clause and the Condicional in the result clause. Futuro Simple or 'voy a + infinitivo' cannot be used in hypothetical (unreal) conditions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tranquila, el técnico dijo que ___ mañana para reparar el ordenador.",
    "en": "Don't worry, the technician said he would come tomorrow to fix the computer.",
    "options": [
      "vendrá",
      "vendría",
      "va a venir",
      "venga"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said they would do (indirect speech shifted back in time), Spanish uses the Condicional as a 'future in the past.' Futuro Simple 'vendrá' would be used in direct speech or independent future statements."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche ___ con mis compañeros después del trabajo — ya está todo organizado.",
    "en": "Tonight I'm going to have dinner with my colleagues after work — everything is already arranged.",
    "options": [
      "cenaré",
      "cenaba",
      "voy a cenar",
      "cenaría"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already decided or arranged, conveying a sense of intention and certainty. Futuro Simple (cenaré) is more formal or used for predictions about more distant events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu hermano ___ bien en la entrevista de trabajo.",
    "en": "I hope your brother does well in the job interview.",
    "options": [
      "lo hace",
      "lo haga",
      "lo hará",
      "lo haría"
    ],
    "correct": 1,
    "explanation": "After verbs of wishing and hoping like 'esperar que,' the subordinate clause requires the Subjuntivo when the subjects of both clauses are different. Indicative would imply certainty rather than hope or desire."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as the test results arrive.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when referring to future events that have not yet happened. Indicative is used only when describing habitual or past situations."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante del barrio ___ tan caro como dicen.",
    "en": "I don't think the new neighborhood restaurant is as expensive as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' trigger the Subjuntivo because the speaker is expressing doubt or disbelief rather than stating a fact. Affirmative 'creo que' would take the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (hablar, tú) tan rápido — no te entiendo bien.",
    "en": "Please don't speak so fast — I can't understand you well.",
    "options": [
      "habla",
      "hables",
      "hablas",
      "hablés"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present Subjuntivo form (no hables), not the affirmative imperative (habla). This is one of the key distinctions: affirmative tú commands have their own form, but negative ones borrow from the Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse) los cinturones antes del despegue.",
    "en": "Ladies and gentlemen, fasten your seatbelts before takeoff.",
    "options": [
      "abróchense",
      "abrochad",
      "abrochéis",
      "abróchate"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (formal plural), the imperative is formed using the third-person plural of the present Subjuntivo with attached pronouns. 'Abrochad' and 'abrochéis' are vosotros forms, not used in ustedes contexts."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ (quedarse) sin batería otra vez.",
    "en": "She's not answering the phone. She must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se habría quedado",
      "Se habrá quedado",
      "Se quedó"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about something that has likely already happened. It is the equivalent of 'must have done' in English and is a key use distinct from the Condicional Compuesto."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
