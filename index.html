<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 27, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 27, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ hirviendo.",
    "en": "Don't touch that soup — it's boiling.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a current state or condition. 'Hirviendo' describes the soup's temporary physical state right now, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia de marketing ___ en el hotel Meliá este viernes.",
    "en": "The marketing conference is at the Hotel Meliá this Friday.",
    "options": [
      "está",
      "es",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "Although ESTAR normally expresses location, the location of scheduled events uses SER. 'La conferencia es en el hotel' indicates where the event takes place, not where an object is sitting."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este ceviche — ___ riquísimo.",
    "en": "Try this ceviche — it's incredibly delicious.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "When 'rico' is used with ESTAR, it means 'tastes delicious' — a sensory experience you're having right now. With SER, 'rico' means 'wealthy,' so context and estar are both key here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe exactamente qué decir.",
    "en": "My grandmother is very clever — she always knows exactly what to say.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "With SER, 'listo' means 'clever/smart' as a permanent personality trait. With ESTAR, 'listo' means 'ready.' Since we're describing a defining characteristic of the grandmother, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al parque todos los sábados con mi padre.",
    "en": "When I was a child, I used to go to the park every Saturday with my father.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes habitual or repeated actions in the past. 'Todos los sábados' is a key signal of habitual action, requiring the Imperfecto 'iba' rather than the completed-action Indefinido 'fui'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba preparando el informe cuando el jefe me ___ para una reunión urgente.",
    "en": "I was preparing the report when the boss called me for an urgent meeting.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llamara"
    ],
    "correct": 1,
    "explanation": "When one ongoing background action (Imperfecto: 'estaba preparando') is interrupted by a sudden event, the interrupting action uses the Pretérito Indefinido. 'Llamó' is the completed, punctual interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el libro que llevaba meses intentando terminar.",
    "en": "Yesterday I finally finished the book I had been trying to finish for months.",
    "options": [
      "terminaba",
      "terminé",
      "terminaría",
      "haya terminado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed action at a specific moment in the past. 'Ayer' and 'por fin' are clear signals of a single, completed event, which requires the Indefinido, not the habitual Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta de ese trabajo es la falta de comunicación entre departamentos.",
    "en": "What bothers me about that job is the lack of communication between departments.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what' or 'the thing that,' and it introduces a noun clause as the subject of a sentence. 'Que' alone cannot start a noun clause as subject without an article."
  },
  {
    "topic": "Usos de QUE",
    "q": "Llevamos tres horas esperando — ¡___ paciencia hay que tener con esta empresa!",
    "en": "We've been waiting three hours — what patience you have to have with this company!",
    "options": [
      "lo que",
      "que",
      "qué",
      "cual"
    ],
    "correct": 2,
    "explanation": "'Qué' with a written accent is used in exclamations to express surprise, admiration, or frustration about a quality or quantity. Without the accent, 'que' is a conjunction or relative pronoun and cannot carry exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ mucho antes de los exámenes — no sé cómo manejarlo.",
    "en": "I always get very stressed before exams — I don't know how to handle it.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "me estresa"
    ],
    "correct": 0,
    "explanation": "When the subject causes the feeling in themselves, use the reflexive with subject agreement: 'yo me estreso' (I stress myself out). This is the 'yo y yo' pattern where the subject and experiencer are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes an emotional reaction in a first-person experiencer (yo). 'Me preocupas' means 'you worry me' — the verb agrees with 'tú' while 'me' marks the affected person."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ otro diseñador para el proyecto.",
    "en": "If we had more budget, we would hire another designer for the project.",
    "options": [
      "contrataríamos",
      "contrataremos",
      "vamos a contratar",
      "contratemos"
    ],
    "correct": 0,
    "explanation": "Hypothetical si-clauses in the past subjunctive (si tuviéramos) always pair with the Condicional in the main clause to express unreal or unlikely conditions. The Futuro would imply a real, expected situation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿A qué hora llegará el paquete? — Según el seguimiento, ___ entre las tres y las cuatro.",
    "en": "What time will the package arrive? — According to the tracking, it will arrive between three and four.",
    "options": [
      "llegaría",
      "llegará",
      "va a llegar",
      "llegue"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (and its conjugated forms like 'va a llegar') is preferred for near-future events with concrete evidence or planning, especially in spoken Spanish. Here, the tracking information provides a clear basis for prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijo que si encontraba tiempo este fin de semana, ___ a visitarnos.",
    "en": "He told me that if he found time this weekend, he would come to visit us.",
    "options": [
      "vendrá",
      "vendría",
      "va a venir",
      "venga"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about a conditional situation in the past, the Condicional functions as the 'future in the past.' Reported speech with a past verb of saying shifts the future into the Condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el médico te ___ algo para el dolor de cabeza.",
    "en": "I hope the doctor gives you something for the headache.",
    "options": [
      "da",
      "dará",
      "dé",
      "ha dado"
    ],
    "correct": 2,
    "explanation": "Verbs of hope and wish like 'esperar que' trigger the Subjuntivo in the subordinate clause when the subject of the main clause differs from that of the subordinate clause. 'Dé' is the present subjunctive of 'dar'."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamo enseguida.",
    "en": "As soon as I get the results, I'll call you right away.",
    "options": [
      "tenga",
      "tengo",
      "tendré",
      "tuve"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future action that has not yet occurred. Using the Indicativo ('tengo') would imply a habitual present action instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated expressions of opinion and belief like 'no creer que' and 'no pensar que' require the Subjuntivo because the speaker is expressing doubt or denial about the truth of the subordinate clause."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la cena — ya hemos hablado de esto.",
    "en": "Please don't use your phone during dinner — we've already talked about this.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjunctive form of the verb: 'no uses.' The affirmative tú command 'usa' and the indicative 'usas' cannot be used in negative direct commands."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad antes del despegue.",
    "en": "Ladies and gentlemen, fasten your seat belts before takeoff.",
    "options": [
      "abrochen",
      "abrochan",
      "abrocháis",
      "abrochen ustedes"
    ],
    "correct": 0,
    "explanation": "The ustedes affirmative command uses the third-person plural present subjunctive form: 'abrochen.' In Latin America and formal contexts in Spain, ustedes is the standard formal/plural command form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llamé a Carmen tres veces pero no contesta — ___ salido a hacer recados.",
    "en": "I called Carmen three times but she's not answering — she must have gone out to run errands.",
    "options": [
      "habrá",
      "habría",
      "haya",
      "ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that has likely already happened. It conveys 'she must have gone out' — a logical inference about a completed past action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
