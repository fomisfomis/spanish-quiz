<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 11, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 11, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal esta noche.",
    "en": "The concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for the location of events, ESTAR for the location of physical objects or people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente.",
    "en": "Don't touch that plate — it's very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, and heat is a condition that can change. Even if something is always hot, Spanish uses ESTAR when describing how something feels or presents itself at a moment in time."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Pensé que el postre era de chocolate, pero ___ riquísimo de todas formas.",
    "en": "I thought the dessert was chocolate, but it was absolutely delicious anyway.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Rico meaning 'delicious' uses ESTAR because it describes a sensory experience or condition, not an inherent quality. When rico means 'wealthy,' it uses SER — this adjective changes meaning depending on which verb accompanies it."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ya no ___ viva; falleció el año pasado.",
    "en": "My grandmother is no longer alive; she passed away last year.",
    "options": [
      "es",
      "está",
      "fue",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Vivo/a meaning 'alive' uses ESTAR because it describes a biological state that can change — being alive is a condition, not an inherent characteristic. If you used SER + vivo, it would mean 'clever or sharp-witted.'"
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al parque todos los sábados con mi padre.",
    "en": "When I was a child, I used to go to the park every Saturday with my father.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "Imperfecto is used for habitual or repeated past actions, especially those tied to a routine. The phrase 'todos los sábados' is a strong signal of habitual past behavior, which calls for the imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el periódico cuando de repente ___ el teléfono.",
    "en": "I was reading the newspaper when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the ongoing background action uses imperfecto (leía) and the sudden interrupting event uses indefinido. 'De repente' reinforces that the phone ringing was a completed, punctual event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ muy concurrido aquella noche, así que decidimos irnos.",
    "en": "The restaurant was very crowded that night, so we decided to leave.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 3,
    "explanation": "Imperfecto is used to set the scene or provide background conditions in a past narrative. The crowded restaurant is background context; the decision to leave (decidimos) is the foreground completed action, which takes indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás tratando de decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "qué",
      "lo que",
      "que",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'that which' or 'what,' and is used when referring to an unspecified thing or concept. Qué is an interrogative or exclamative, and simple que is a conjunction that needs a prior noun to refer back to."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ tarde llega siempre este tren, ¿no?",
    "en": "How late this train always arrives, right?",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "Qué is used in exclamatory sentences to express surprise or emphasis, equivalent to English 'what a' or 'how.' It introduces a strong subjective reaction, whereas que (without accent) is a subordinating conjunction."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando hay cambios en el trabajo.",
    "en": "Lately I stress out a lot when there are changes at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject experiences the feeling through their own reaction (Yo y yo pattern), the reflexive verb agrees with the first-person subject: yo me estreso. This is different from 'me estresas' (you stress me out) where another person causes the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "El ruido de los vecinos ___ cada vez que intentas dormir.",
    "en": "The neighbors' noise bothers you every time you try to sleep.",
    "options": [
      "te molesta",
      "te molestas",
      "me molesta",
      "se molesta"
    ],
    "correct": 0,
    "explanation": "In the 'Yo y el mundo' pattern, an external thing (el ruido) causes an effect on the person. The verb agrees with the subject causing the sensation (el ruido = third person singular), and the affected person appears as an indirect object pronoun (te)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "The condicional is used in the main clause of hypothetical si-sentences when the si-clause is in imperfecto de subjuntivo. This structure expresses unreal or unlikely conditions in the present or future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados.",
    "en": "According to the forecast, tomorrow it will be over thirty degrees.",
    "options": [
      "haría",
      "va a hacer",
      "hiciera",
      "haría hecho"
    ],
    "correct": 1,
    "explanation": "Voy a + infinitivo (or here, va a hacer) expresses a near future event with a concrete basis or evidence, such as a weather forecast. Futuro simple (hará) is also acceptable, but 'va a hacer' emphasizes the planned or evidenced nature of the prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Dijo que ___ a la reunión, pero nunca apareció.",
    "en": "He said he would come to the meeting, but he never showed up.",
    "options": [
      "vendrá",
      "vendría",
      "viene",
      "venga"
    ],
    "correct": 1,
    "explanation": "Condicional is used in reported speech when the main verb is in a past tense — this is known as the 'futuro del pasado.' 'Dijo que vendría' reports a future-from-his-past promise, while 'dijo que vendrá' would be a grammatical mismatch of tenses."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes; ___ lista para la presentación a tiempo.",
    "en": "Don't worry; you will be ready for the presentation on time.",
    "options": [
      "estarías",
      "estarás",
      "estés",
      "estuvieras"
    ],
    "correct": 1,
    "explanation": "Futuro simple is used to make predictions or reassurances about the future when speaking from a present standpoint without a hypothetical condition. Condicional would imply a condition that hasn't been stated here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ el nuevo protocolo antes del viernes.",
    "en": "It is important that all employees read the new protocol before Friday.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "leerían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es importante que, es necesario que) trigger the subjunctive in the subordinate clause. The subjunctive expresses that the action is desired or required, not stated as a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del médico.",
    "en": "Call me as soon as you get news from the doctor.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Time conjunctions like en cuanto, cuando, and hasta que require the subjunctive when referring to a future event that has not yet happened. If the action were habitual or past, the indicative would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que no sea muy caro.",
    "en": "I'm looking for an apartment that is near the metro and isn't too expensive.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "When the antecedent (the noun the relative clause describes) is hypothetical or unspecified — meaning it may or may not exist — the subjunctive is required. Here, the speaker hasn't found the apartment yet, so its existence is uncertain."
  },
  {
    "topic": "Imperativo",
    "q": "___ (tú) ese correo antes de enviarlo — puede haber errores.",
    "en": "Review that email before sending it — there might be errors.",
    "options": [
      "Revisa",
      "Revisas",
      "Revises",
      "Revisar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed using the third-person singular present indicative form (él/ella). So revisar → revisa. This is different from the negative tú command, which uses the present subjunctive (no revises)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (ustedes) el formulario sin leer las instrucciones primero.",
    "en": "Don't fill out the form without reading the instructions first.",
    "options": [
      "rellenen",
      "rellenad",
      "rellena",
      "rellenan"
    ],
    "correct": 0,
    "explanation": "Negative ustedes commands use the present subjunctive form. Since ustedes is used in Latin America as both formal and informal plural, its negative command (no rellenen) comes directly from the subjunctive. Rellenad is the affirmative vosotros command, not ustedes."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido después del almuerzo.",
    "en": "He's not answering the phone. He must have fallen asleep after lunch.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "Futuro compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened in the recent past. This is the 'epistemic' use, equivalent to 'must have' or 'probably has' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
