<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 25, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 25, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place, even though SER normally does not indicate location. ESTAR is used for the location of objects and people, but events (concerts, meetings, parties) use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary physical condition or state, such as temperature that results from a change. If you used SER, it would imply the plate is inherently and permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista; siempre sabe qué decir en cada situación.",
    "en": "My grandmother is very clever; she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "With the adjective 'listo', SER means 'clever or smart' as a characteristic trait. ESTAR + listo means 'to be ready'. Here the context describes a permanent personality quality, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Juan ___ rendido.",
    "en": "After running ten kilometers, Juan is exhausted.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for states resulting from an action or change — Juan became exhausted as a result of running. This is a classic change-of-state use of ESTAR, not a permanent characteristic described by SER."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) cerca del mar y recuerdo el olor a sal.",
    "en": "When I was a child, I used to live near the sea and I remember the smell of salt.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing states in the past without a defined endpoint. 'Cuando era niña' signals a backdrop of childhood, and living somewhere is a continuous background situation, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ (preparar) la cena, sonó el teléfono.",
    "en": "While I was preparing dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "preparo",
      "preparara"
    ],
    "correct": 1,
    "explanation": "When one ongoing action (Imperfecto) is interrupted by a sudden completed event (Indefinido), the background action uses Imperfecto. 'Preparaba' sets the scene; 'sonó' is the interrupting event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ (visitar, nosotros) tres países distintos durante las vacaciones.",
    "en": "Last year we visited three different countries during the vacation.",
    "options": [
      "visitábamos",
      "visitamos",
      "hemos visitado",
      "visitáramos"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions with a clear time frame in the past. 'El año pasado' marks a finished period, and visiting three countries is a specific completed series of events, not a habitual background."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'that which'. It is used when there is no explicit antecedent noun — it combines the article and relative pronoun. 'Que' alone cannot introduce a noun clause of this type without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable verte aquí después de tanto tiempo.",
    "en": "What a pleasant surprise to see you here after so long.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamations to express surprise or emotion, equivalent to 'What a...!' in English. 'Que' without an accent is a conjunction or relative pronoun and cannot introduce an exclamation this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos del trabajo; no puedo desconectar.",
    "en": "Lately I stress a lot about work deadlines; I can't switch off.",
    "options": [
      "me estresas",
      "me estresa",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "When the subject causing the stress IS the speaker themselves (an internal reaction), use 'me estreso' — the subject and the object of the verb are the same person (yo). This is the 'yo y yo' reflexive pattern where the action loops back to oneself."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde a casa sin avisar, ___ muchísimo.",
    "en": "Every time you come home late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estrenas",
      "me estresas"
    ],
    "correct": 3,
    "explanation": "When a second person (tú) causes an effect on the speaker (me), the verb agrees with TÚ as subject: 'me estresas'. This is the 'yo y tú' pattern — distinct from 'me estreso' (I stress myself) or 'me estresa' (it/something stresses me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is used in the result clause of hypothetical (contrary-to-fact) 'si' sentences paired with the Imperfecto de Subjuntivo. Futuro Simple cannot appear in the result clause of a hypothetical condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región.",
    "en": "According to the forecast, it will rain tomorrow throughout the region.",
    "options": [
      "llovería",
      "iba a llover",
      "llueve",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "Futuro Simple expresses a factual prediction about the future based on evidence or forecasts. Condicional would imply a hypothetical condition. 'Lloverá' is the natural choice for a weather prediction with a specific future time reference."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo en dos horas — ___ (ir, yo) al aeropuerto ya.",
    "en": "My flight is in two hours — I'm going to go to the airport now.",
    "options": [
      "iré",
      "fuera",
      "voy a ir",
      "iría"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (periphrastic future) is preferred for immediate, planned, or personally decided near-future actions, especially in spoken Spanish. 'Iré' sounds more formal or refers to a more distant or uncertain future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ (hacer) ejercicio moderado cada día.",
    "en": "The doctor recommends that you do moderate exercise every day.",
    "options": [
      "haces",
      "harás",
      "hagas",
      "harías"
    ],
    "correct": 2,
    "explanation": "After verbs of recommendation, desire, or suggestion (recomendar, querer, pedir), the subordinate clause requires Subjuntivo when the subjects differ. 'Que hagas' reflects the doctor's wish imposed on another person."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (estar) abierto los lunes.",
    "en": "I don't think that restaurant is open on Mondays.",
    "options": [
      "esté",
      "está",
      "estará",
      "estuviera"
    ],
    "correct": 0,
    "explanation": "Negated verbs of opinion or belief (no creer, no pensar) trigger Subjuntivo in the subordinate clause because they express doubt or denial rather than asserting a fact. Affirmative 'creo que' would take Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegarás",
      "llegues",
      "llegarías"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require Subjuntivo when referring to a future action that has not yet occurred. If the action were habitual in the present, Indicativo would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (poner, tú) la mesa, por favor, que la cena ya está lista.",
    "en": "Hey, set the table please, dinner is already ready.",
    "options": [
      "pon",
      "pones",
      "pongas",
      "ponga"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'poner' is 'pon', an irregular form. It does not follow the regular pattern of dropping the -s from the present tense. Negative commands use the Subjuntivo ('no pongas'), but affirmative tú commands have their own forms."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto por lo que dicen los demás.",
    "en": "Don't worry so much about what others say.",
    "options": [
      "te preocupa",
      "te preocupes",
      "preocúpate",
      "te preocuparás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands always use the Subjuntivo form, and with reflexive verbs the pronoun 'te' goes before the verb. 'Preocúpate' is the affirmative imperative (with attached pronoun), but 'no te preocupes' is the correct negative construction."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ (quedarse) dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Se quedará dormido",
      "Se habrá quedado dormido",
      "Se quedó dormido",
      "Se habría quedado dormido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past action from the speaker's present perspective, equivalent to 'must have' in English. This is distinct from its use to indicate completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
