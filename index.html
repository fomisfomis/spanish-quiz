<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 25, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 25, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, not ESTAR. ESTAR indicates the physical location of objects or people, but for scheduled events, SER is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Mario ___ completamente listo para dormir.",
    "en": "After running ten kilometers, Mario is completely ready to sleep.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready,' describing a current state. SER + listo means 'to be clever/smart,' which is a permanent characteristic. Context here demands the state meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Ese pastel de chocolate que hiciste ___ riquísimo!",
    "en": "That chocolate cake you made is absolutely delicious!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'to taste delicious,' referring to a sensory experience in the moment. SER + rico means 'to be wealthy.' When talking about how food tastes, always use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ viuda desde hace veinte años.",
    "en": "My grandmother has been a widow for twenty years.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "Although marital status can feel temporary, Spanish treats it as a defining characteristic and uses SER. Widowhood is classified as a civil status in Spanish grammar, which always takes SER."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los fines de semana.",
    "en": "When I was a child, I used to play football every weekend.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los fines de semana' signals a routine, not a single completed event, which would require the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras ella ___ (preparar) la cena, sonó el teléfono.",
    "en": "While she was preparing dinner, the phone rang.",
    "options": [
      "preparó",
      "preparaba",
      "ha preparado",
      "prepararía"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes the ongoing background action (preparing dinner), while the Indefinido (sonó) marks the interrupting event. 'Mientras' is a strong signal for the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas sin acabar.",
    "en": "Yesterday I finally finished the report I had been unable to finish for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for a completed action at a specific, finished point in time. 'Ayer por fin' signals a single, concluded event, requiring the Indefinido, not the habitual Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'that which' or 'what,' referring to an unspecified thing. 'Que' alone would need a specific antecedent, and 'qué' is interrogative/exclamatory."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo, ¡te lo mereces!",
    "en": "How great that you got that job — you deserve it!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' is used in exclamations to express strong emotion or emphasis, equivalent to 'how' or 'what a' in English. 'Que' without an accent introduces a subordinate clause, not an exclamation."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "'Me estreso' is the 'yo y yo' pattern — the subject (yo) causes their own state change, so both subject and reflexive pronoun refer to the same person. 'Me estresa' would need an external subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ muchísimo con tus comentarios.",
    "en": "Every time we argue, you upset me a lot with your comments.",
    "options": [
      "me estreso",
      "me molestas",
      "me molesto",
      "te molestas"
    ],
    "correct": 1,
    "explanation": "'Me molestas' is the 'yo y tú' pattern — tú (the subject) causes the emotional effect on me (me). The verb conjugates with the person doing the action, while the pronoun marks who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (viajar) por toda Sudamérica.",
    "en": "If I had more free time, I would travel all over South America.",
    "options": [
      "viajaré",
      "viajaría",
      "voy a viajar",
      "viaje"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause when the si-clause uses the Imperfecto de Subjuntivo. It expresses what would happen under an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la costa norte.",
    "en": "According to the forecast, it will rain tomorrow along the entire northern coast.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "llovaría"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' and the Futuro Simple both work for planned or predicted events, but 'va a llover' feels more immediate and grounded in present evidence (the forecast). Both are acceptable, but B is the most natural here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que la reunión ___ (empezar) a las nueve en punto.",
    "en": "The director said that the meeting would start at nine o'clock sharp.",
    "options": [
      "empezará",
      "empezaría",
      "empiece",
      "va a empezar"
    ],
    "correct": 1,
    "explanation": "The Condicional is used in reported speech (estilo indirecto) when the original statement was in the future. After a past reporting verb like 'dijo,' the future shifts to the Condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tus padres ___ (poder) venir a la boda el mes que viene.",
    "en": "I hope your parents can come to the wedding next month.",
    "options": [
      "pueden",
      "puedan",
      "podrán",
      "pudieran"
    ],
    "correct": 1,
    "explanation": "Verbs of wish and hope like 'esperar que' trigger the Subjuntivo in the subordinate clause when the subjects differ. The present subjunctive 'puedan' is used because the main verb is in the present tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto, por favor.",
    "en": "Call me as soon as you arrive at the airport, please.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "When 'en cuanto' refers to a future action, the verb that follows must be in the Subjuntivo, not the Indicativo. This is because the action has not yet occurred and is still pending or uncertain."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ (ser) tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as people say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' require the Subjuntivo in the dependent clause because the speaker is expressing doubt or denial about the truth of the statement. Affirmative 'creo que' uses Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ (decir, tú) nada de esto a nadie, te lo ruego!",
    "en": "Don't say anything about this to anyone, I beg you!",
    "options": [
      "digas",
      "dices",
      "di",
      "diga"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjunctive form, not the affirmative imperative. 'Di' is the affirmative imperative of decir, but 'no digas' is correct for the negative command."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrochar, ustedes) los cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochad",
      "abróchense",
      "abróchenlos",
      "abrochen"
    ],
    "correct": 1,
    "explanation": "For ustedes commands, both affirmative and negative use the present subjunctive form. When the action is reflexive, the reflexive pronoun 'se' attaches to the end of the verb: 'abróchense.' 'Abrochad' is the vosotros form used in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos de la tarde y Lucía aún no ha llegado. ___ (perder) el autobús otra vez.",
    "en": "It's two in the afternoon and Lucía still hasn't arrived. She must have missed the bus again.",
    "options": [
      "Perdería",
      "Habrá perdido",
      "Ha perdido",
      "Habría perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to speculate or make deductions about a past event from the present perspective. It expresses probability about something that likely already happened, equivalent to 'must have' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
