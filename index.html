<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 09, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 09, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "sera",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR is reserved for the physical location of objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the heat is a current, temporary condition of the soup, not a defining characteristic. SER with 'caliente' would imply that heat is an inherent permanent quality."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en cada situación.",
    "en": "My grandmother is very clever — she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "fuera",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "'Listo/a' with SER means 'clever or smart' as a defining personality trait. With ESTAR, 'listo/a' means 'ready'. The sentence describes an inherent characteristic of the grandmother, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de dos semanas en la playa, los niños ___ muy morenos.",
    "en": "After two weeks at the beach, the children are very tanned.",
    "options": [
      "son",
      "están",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR is used because the tan is a change of state resulting from the beach trip — it is a condition the children have arrived at, not an inherent trait. Change-of-state adjectives almost always take ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeño, mi padre me llevaba al estadio todos los domingos.",
    "en": "When I was little, my father used to take me to the stadium every Sunday.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is required here because both clauses describe habitual or repeated past actions and ongoing states. 'Era pequeño' sets a background condition, and 'llevaba' describes a routine — neither is a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estábamos cenando tranquilamente cuando de repente ___ la alarma de incendios.",
    "en": "We were having dinner quietly when suddenly the fire alarm went off.",
    "options": [
      "sonaba",
      "sonó",
      "había sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "This is a classic interrupted-action structure: the Imperfecto ('estábamos cenando') describes the ongoing background action, while the Indefinido ('sonó') marks the sudden event that interrupts it. Sudden, completed interruptions use the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un contrato muy importante con una firma japonesa.",
    "en": "Last year, my company signed a very important contract with a Japanese firm.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmaría"
    ],
    "correct": 1,
    "explanation": "The time marker 'el año pasado' signals a specific, completed past event with a defined endpoint. The Pretérito Indefinido is used for single completed actions at a specific point in the past, not for habits or background descriptions."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what', and is used when referring to something non-specific or abstract. 'Que' alone is a conjunction or relative pronoun and cannot introduce a noun clause meaning 'what'."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ tiempo más horrible hace hoy, ¿verdad?",
    "en": "What horrible weather it is today, right?",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express surprise, admiration, or complaint before a noun or adjective. It is not a relative pronoun here but an exclamative determiner, always written with an accent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ muchísimo con los plazos del trabajo — no puedo dormir bien.",
    "en": "Lately I stress out a lot because of work deadlines — I can't sleep well.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject experiences something as a result of their own internal reaction (yo y yo pattern), the reflexive verb agrees with the first-person subject: 'yo me estreso'. No external agent is causing the stress in this framing."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho — es una falta de respeto.",
    "en": "When you arrive late without notice, you worry me a lot — it's disrespectful.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "This is the 'yo y tú' pattern: a second-person subject (tú) causes an emotional reaction in the first-person speaker (me). The verb agrees with 'tú' — third-person singular would be wrong here because the agent is 'tú', not a thing."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ a aprender a tocar la guitarra.",
    "en": "If I had more free time, I would start learning to play the guitar.",
    "options": [
      "empezaré",
      "empezaría",
      "voy a empezar",
      "empiece"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical (si + Imperfecto Subjuntivo) sentence. It expresses a result that would happen under an imaginary or unlikely condition, not a real future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be over thirty degrees across the whole region.",
    "options": [
      "haría",
      "habría",
      "hará",
      "vaya a hacer"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for predictions or statements about the future based on evidence or forecasts. 'Haría' (Condicional) would imply a hypothetical or polite context, not a straightforward meteorological prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "—¿Cuándo presentas el informe? —___ esta tarde, pero todavía no estoy seguro.",
    "en": "'When are you presenting the report?' 'I'm going to do it this afternoon, but I'm still not sure.'",
    "options": [
      "Lo presentaré",
      "Lo presentaría",
      "Voy a presentarlo",
      "Lo presente"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention that is already planned or in progress. However, the speaker's uncertainty makes either the Futuro Simple or 'ir a' acceptable; here 'voy a' emphasizes the existing intention despite the doubt."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' referring to a future event, the Subjuntivo is required. Using the Indicativo ('tienes') would make the sentence refer to a habitual present, not a future action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el protocolo de seguridad antes del lunes.",
    "en": "It is essential that all employees review the safety protocol before Monday.",
    "options": [
      "revisan",
      "revisarán",
      "revisen",
      "revisaron"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance like 'es fundamental que' always trigger the Subjuntivo in the subordinate clause. The Indicativo would be used after expressions that state facts, not requirements."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ terraza y que no ___ demasiado lejos del metro.",
    "en": "I'm looking for an apartment that has a terrace and that isn't too far from the metro.",
    "options": [
      "tiene / está",
      "tenga / esté",
      "tiene / esté",
      "tenga / está"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (you don't know if such an apartment exists), the Subjuntivo is required in the relative clause. Both verbs must be in the Subjuntivo because the apartment is still being sought."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es muy molesto para todos.",
    "en": "Please, don't use your phone during the meeting — it's very annoying for everyone.",
    "options": [
      "uses",
      "usas",
      "usa",
      "usés"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo, not the affirmative imperative form. The affirmative tú command 'usa' becomes 'no uses' in the negative, following the pattern of all negative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Si el cliente pregunta por el precio, ___ con calma y ___ los detalles del contrato.",
    "en": "If the client asks about the price, answer calmly and explain the contract details.",
    "options": [
      "respóndele / explícale",
      "respóndelo / explícalo",
      "respóndale / explíquele",
      "responde / explica"
    ],
    "correct": 0,
    "explanation": "For affirmative tú commands with indirect object pronouns, the pronoun attaches to the end of the imperative form, and a written accent is often needed to preserve stress. 'Respóndele' and 'explícale' use 'le' because 'al cliente' is an indirect object."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no contestó ningún mensaje en todo el día. ___ tenido el teléfono sin batería.",
    "en": "Marcos didn't reply to any messages all day. He must have had his phone out of battery.",
    "options": [
      "Tendrá",
      "Habrá",
      "Habría",
      "Ha"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or logical deduction about something that happened in the past. It implies 'he probably had his phone dead', reasoning backwards from current evidence."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
