<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 15, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 15, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (scheduled occurrences), even though ESTAR is used for the location of physical objects and people. Events 'take place' somewhere, so they use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante para los niños.",
    "en": "Don't touch that sauce — it's very spicy for the kids.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used here because 'picante' describes an inherent characteristic of the sauce — its defining nature. When an adjective describes a permanent or typical quality, SER is preferred."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de dos semanas en la playa, Pablo ___ muy moreno.",
    "en": "After two weeks at the beach, Pablo is very tanned.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a change of state or a condition resulting from an action. Pablo's tan is the result of being at the beach, not a permanent characteristic — it signals a change, which calls for ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Pensé que era una buena idea, pero al final el plan ___ bastante aburrido.",
    "en": "I thought it was a good idea, but in the end the plan was quite boring.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + aburrido describes how something turned out or was experienced — a subjective reaction or result. If we used SER + aburrido, it would mean the plan is inherently boring by nature; ESTAR signals the speaker's experiential judgment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things that used to happen regularly. The word 'siempre' (always) is a strong signal that this was a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, sonó el teléfono.",
    "en": "While I was making dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "preparo",
      "había preparado"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the Imperfecto (preparaba = was preparing), while the sudden interrupting event uses the Indefinido (sonó = rang). The Imperfecto sets the scene; the Indefinido breaks into it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El martes pasado, Marta ___ al gimnasio por primera vez en meses.",
    "en": "Last Tuesday, Marta went to the gym for the first time in months.",
    "options": [
      "iba",
      "fue",
      "ha ido",
      "hubiera ido"
    ],
    "correct": 1,
    "explanation": "The Indefinido (fue) is used for a single, completed action at a specific point in the past. 'El martes pasado' and 'por primera vez' anchor this as a unique, finished event, not a habit or background state."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (that which) and is used when 'what' is not a direct question but acts as the object of a verb. 'Que' alone cannot introduce this kind of embedded noun clause on its own."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo — te lo mereces.",
    "en": "How great that you got the job — you deserve it.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong emotion or emphasis (¡Qué bien!, ¡Qué lástima!). It is not interchangeable with the conjunction 'que', which links clauses, or 'lo que', which means 'that which'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque el trabajo es muy exigente.",
    "en": "Lately I stress out a lot because work is very demanding.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the speaker is both the experiencer and the implied cause of their own state ('yo y yo' pattern), the reflexive verb agrees with the first-person subject: 'me estreso' (yo me estreso). The subject causes the feeling in themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, one person (tú) causes an emotional reaction in another (yo). The verb agrees with the subject that produces the effect — here 'tú', so the verb takes the second-person singular form: 'me preocupas'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ con él?",
    "en": "If you had more free time, what would you do with it?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional (harías) is required in hypothetical or contrary-to-fact si-clauses in the main clause, paired with the Imperfecto Subjuntivo in the condition (si tuvieras). The Futuro cannot be used in the main clause of this hypothetical structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Creo que mañana ___ bastante tráfico porque hay partido.",
    "en": "I think there will be quite a bit of traffic tomorrow because there's a game.",
    "options": [
      "habría",
      "habrá",
      "va a haber",
      "haya"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (va a haber) is preferred for near-future events that feel planned, anticipated, or grounded in present evidence. Here, the speaker has concrete reasoning (the game) that makes this feel imminent and certain, favouring 'voy a' over a neutral 'habrá'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijo que ___ a la reunión, pero nunca apareció.",
    "en": "He told me he would come to the meeting, but he never showed up.",
    "options": [
      "vendrá",
      "vendría",
      "viene",
      "venga"
    ],
    "correct": 1,
    "explanation": "The Condicional acts as the 'future in the past' — when reporting what someone said or promised about a future action relative to a past moment, the Condicional replaces the Futuro in indirect speech (dijo que vendría = he said he would come)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, este fin de semana ___ más de 30 grados.",
    "en": "According to the forecast, it will be over 30 degrees this weekend.",
    "options": [
      "haría",
      "habrá",
      "hay",
      "haya"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple (habrá) expresses a neutral, objective prediction about the future — especially when citing an external source like a forecast. It is more appropriate than the Condicional, which implies hypothesis or reported speech, not direct prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el mecánico ___ el coche antes del viernes.",
    "en": "I hope the mechanic fixes the car before Friday.",
    "options": [
      "arregla",
      "arregle",
      "arreglará",
      "arreglaría"
    ],
    "correct": 1,
    "explanation": "ESPERAR QUE triggers the Subjuntivo because it expresses a wish or desire about someone else's actions. Whenever there is a change of subject between the main clause and the subordinate clause with a verb of desire, the Subjuntivo is required."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' referring to a future action, the Subjuntivo is required. These conjunctions use the Indicativo only when referring to habitual or past events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que esa aplicación ___ tan útil como dicen en internet.",
    "en": "I don't think that app is as useful as they say online.",
    "options": [
      "es",
      "sea",
      "será",
      "sería"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) trigger the Subjuntivo in the subordinate clause because the speaker is casting doubt on the truth of the statement. Affirmative 'creo que' would use the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la ventana — hace mucho calor aquí dentro.",
    "en": "Please open the window — it's very hot in here.",
    "options": [
      "abre",
      "abres",
      "no abras",
      "abra"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of regular -er verbs uses the third-person singular present indicative form: 'abre'. This is different from the negative tú command (no abras), which uses the present Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad, por favor.",
    "en": "Passengers, please fasten your seatbelts.",
    "options": [
      "abróchense",
      "abróchate",
      "no se abrochen",
      "abrochen"
    ],
    "correct": 0,
    "explanation": "For ustedes affirmative commands, use the third-person plural present Subjuntivo. When adding a reflexive or object pronoun to an affirmative command, it attaches to the end of the verb (abróchense = abróchen + se), and an accent is added to preserve the original stress."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido después de comer.",
    "en": "He's not answering the phone. He must have fallen asleep after lunch.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to make deductions or express probability about something that likely happened in the recent past. It is the future-tense equivalent of 'must have done something', expressing confident speculation about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
