<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 13, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 13, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de música ___ en el parque central este sábado.",
    "en": "The music festival is in the central park this Saturday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where an event takes place. Location of events uses SER, while location of physical objects or people uses ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante para los niños.",
    "en": "Don't touch that sauce — it is very spicy for the kids.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Use SER when describing an inherent or permanent characteristic of something, such as the natural spiciness of a sauce. This is a defining quality, not a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de escuchar la misma historia tres veces, todos ___ aburridos.",
    "en": "After hearing the same story three times, everyone was bored.",
    "options": [
      "eran",
      "estaban",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR + aburrido means 'to feel bored' (a temporary emotional state), while SER + aburrido means 'to be a boring person' (a personality trait). The context of a repeated story points to a temporary feeling."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado! El suelo ___ mojado después de la lluvia.",
    "en": "Careful! The floor is wet after the rain.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for conditions or states that result from a change or external cause. The floor is wet because of the rain — a temporary, changeable condition, not an inherent property."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially with time markers like 'siempre.' The phrase 'cuando era pequeña' also signals background context, which requires the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se cortó la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "había escrito"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another, the ongoing background action uses the Imperfecto, and the interrupting event uses the Indefinido. 'Escribía' is the interrupted action here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo sistema de gestión.",
    "en": "Last year, my company implemented a new management system.",
    "options": [
      "implementaba",
      "implementó",
      "ha implementado",
      "implementaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed actions with a defined time frame in the past. 'El año pasado' marks this as a finished event with a clear endpoint, not a habitual or ongoing situation."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás diciendo ahora mismo.",
    "en": "I don't understand what you are telling me right now.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and it is used when 'what' refers to an unspecified thing or the content of something. 'Que' alone is a simple connector and cannot serve as the object of 'entender' here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonito es el vestido que llevas hoy.",
    "en": "How beautiful the dress you are wearing today is!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory sentences to express admiration or emotion, similar to 'How...!' in English. It directly precedes an adjective or noun in this structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo una reunión difícil con mi jefe, ___ mucho.",
    "en": "When I have a difficult meeting with my boss, I get very stressed.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When the subject experiences a feeling on their own without an external trigger explicitly causing it through a third-person verb, use the yo reflexive form (me estreso). Compare: 'me estresa el tráfico' where the traffic is the subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hablas tan rápido en las reuniones, ___ completamente.",
    "en": "Every time you talk so fast in meetings, you confuse me completely.",
    "options": [
      "me confundo",
      "me confundes",
      "me confunde",
      "nos confundimos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes an effect on a first-person object (me). The verb is conjugated in the second person (confundes) with the first-person object pronoun (me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of hypothetical si-clauses that use the Imperfecto de Subjuntivo. 'Si tuviera' signals a contrary-to-fact condition, so the result must use 'tomaría,' not the future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the forecast, it will be very hot along the entire coast tomorrow.",
    "options": [
      "haría",
      "habrá",
      "vaya a haber",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for objective predictions or forecasts about the future. When reporting what a forecast says, 'habrá' conveys a neutral future prediction, while 'haría' implies a hypothetical or reported condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me ___ un favor? Necesito que alguien me lleve al aeropuerto.",
    "en": "Would you do me a favor? I need someone to take me to the airport.",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is used to make polite requests in Spanish, softening the tone compared to the more direct Futuro Simple. 'Harías' conveys politeness and tentativeness, which is appropriate when asking someone for a favor."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el técnico ___ el problema antes del mediodía.",
    "en": "I hope the technician solves the problem before noon.",
    "options": [
      "resuelve",
      "resuelva",
      "resolverá",
      "resolvería"
    ],
    "correct": 1,
    "explanation": "After verbs of wishing or hope like 'esperar que,' the Subjuntivo is required when the subjects of the two clauses are different. 'Resuelva' is the present subjunctive of 'resolver.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you receive the results of the test.",
    "options": [
      "recibes",
      "recibirás",
      "recibas",
      "recibieras"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' referring to a future event, Spanish requires the present Subjuntivo, not the indicative future. The action hasn't happened yet at the time of speaking."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el nuevo protocolo de seguridad.",
    "en": "It is essential that all employees follow the new safety protocol.",
    "options": [
      "siguen",
      "sigan",
      "seguirán",
      "seguían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance like 'es fundamental que' trigger the Subjuntivo in the dependent clause. These expressions impose a requirement on a subject, which is a classic trigger for the subjunctive mood."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la ventana — hace mucho calor aquí dentro.",
    "en": "Hey, open the window — it's really hot in here.",
    "options": [
      "abras",
      "abre",
      "abrir",
      "abra"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ir verbs is formed using the third-person singular present indicative form. For 'abrir,' the tú command is 'abre.' The subjunctive form 'abras' is only used for negative tú commands."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el informe sin revisarlo primero, por favor.",
    "en": "Don't send the report without reviewing it first, please.",
    "options": [
      "envía",
      "envíes",
      "enviéis",
      "envías"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present subjunctive. For 'enviar,' the negative tú imperative is 'no envíes.' The affirmative form 'envía' cannot be used after 'no' in a command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las doce y Pedro aún no ha llegado. ___ perdido el tren.",
    "en": "It's noon and Pedro still hasn't arrived. He must have missed the train.",
    "options": [
      "Habrá",
      "Había",
      "Habría",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that happened in the past, similar to 'must have done' in English. It signals that the speaker is making an educated guess about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
