<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 29, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 29, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el teatro Colón esta noche.",
    "en": "The concert is at the Teatro Colón tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR indicates the location of physical objects or people, but for scheduled events, Spanish uses SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Miguel ___ completamente muerto.",
    "en": "After running ten kilometers, Miguel is completely dead (exhausted).",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' describes a resulting state or condition, not an inherent characteristic. When adjectives describe how someone feels or a change from a previous state, ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No me gusta este pastel — ___ demasiado rico en azúcar y me empalaga.",
    "en": "I don't like this cake — it is too rich in sugar and it's cloying.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "When 'rico' means 'rich' (in flavor or content) as an inherent quality of the food, SER is used. However, 'estar rico' means 'tastes delicious' — a subjective, experienced quality. Here the sentence refers to the cake's composition, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¿Sabes que tu jefe nuevo ___ muy aburrido en las reuniones? Todos se quedan dormidos.",
    "en": "Did you know your new boss is very boring in meetings? Everyone falls asleep.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "SER + aburrido means 'to be a boring person' (a characteristic trait). ESTAR + aburrido means 'to feel bored.' Since the boss consistently bores everyone, this is a defining characteristic, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was a child, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todas las noches' (every night) signals a routine, not a single completed event, so the Imperfecto 'contaba' is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the background action (what was already happening) uses the Imperfecto, while the interrupting event uses the Indefinido. 'Leía' sets the ongoing scene; 'sonó' is the interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Laura ___ su primer maratón en menos de cuatro horas.",
    "en": "Last year, Laura completed her first marathon in under four hours.",
    "options": [
      "corría",
      "corrió",
      "corre",
      "ha corrido"
    ],
    "correct": 1,
    "explanation": "The Indefinido (Pretérito) is used for completed, one-time actions with a clear endpoint in the past. 'El año pasado' combined with a specific achievement signals a finished event, making 'corrió' the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when the relative pronoun has no specific antecedent. 'Que' alone would need a clear noun referent, and 'qué' with an accent is used in direct or indirect questions, not in this relative clause context."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí en Roma después de tantos años.",
    "en": "What a pleasant surprise to run into you here in Rome after so many years.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express surprise, admiration, or other strong emotions, equivalent to 'What a…!' in English. It always carries a written accent in exclamatory and interrogative contexts."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately, I stress out a lot because of the deadlines at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes its own emotional or psychological state (Yo y yo pattern), the reflexive verb agrees with the first-person subject: 'yo me estreso.' This differs from 'me estresas tú' (you stress me) or 'me estresa el trabajo' (work stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hablas con esa voz tan seria, ___ un poco.",
    "en": "Every time you speak in that serious tone, you scare me a little.",
    "options": [
      "me asusto",
      "me asustas",
      "me asusta",
      "te asustas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) acts upon a first-person object (me). The verb must conjugate for 'tú' (second person): 'me asustas.' This is not a reflexive construction but a transitive one with an indirect/direct object pronoun."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ a clases de guitarra?",
    "en": "If you had more free time, would you go to guitar lessons?",
    "options": [
      "irías",
      "irás",
      "vas a ir",
      "vayas"
    ],
    "correct": 0,
    "explanation": "The Condicional Simple is required in the main clause of a hypothetical (si + imperfecto subjuntivo) sentence. 'Irías' expresses what would happen under an unreal or unlikely condition, which is the hallmark use of the Condicional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la costa.",
    "en": "According to the forecast, tomorrow there will be over thirty degrees along the entire coast.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for predictions or statements about real future events, especially when backed by evidence or forecasts. The Condicional would imply a hypothetical condition, which is not the case here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira, esta tarde ___ al supermercado porque ya no queda nada en la nevera.",
    "en": "Look, this afternoon I'm going to go to the supermarket because there's nothing left in the fridge.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (periphrastic future) expresses a near-future plan or intention, especially when there is present evidence or immediate motivation (the empty fridge). 'Iré' is more neutral and less tied to current circumstances."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho vasos de agua al día.",
    "en": "The doctor recommends that you drink at least eight glasses of water a day.",
    "options": [
      "bebes",
      "bebas",
      "beberás",
      "beberías"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, wish, or influence (recomendar, querer, pedir, etc.) followed by 'que' with a change of subject, the Subjuntivo is required. 'Bebas' is the present subjunctive of 'beber' for the second person singular."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tengas",
      "tienes",
      "tendrás",
      "tuvieras"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' 'hasta que,' and 'tan pronto como,' when referring to future events, require the Subjuntivo. The Indicativo would imply a habitual or past action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que esta propuesta ___ suficiente apoyo en el comité.",
    "en": "I don't think this proposal will get enough support in the committee.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que, no parecer que) trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil encima de la mesa durante la cena.",
    "en": "Please, don't put your phone on the table during dinner.",
    "options": [
      "pones",
      "pongas",
      "pon",
      "ponéis"
    ],
    "correct": 1,
    "explanation": "Negative commands in Spanish always use the Subjuntivo form, regardless of person. 'No pongas' is the negative tú command. The affirmative tú command would be 'pon,' but for negative imperatives, the present subjunctive must be used."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus documentos de identidad antes de pasar el control.",
    "en": "Ladies and gentlemen, please have your identity documents ready before going through security.",
    "options": [
      "preparen",
      "preparen ustedes",
      "prepará",
      "preparad"
    ],
    "correct": 0,
    "explanation": "In Latin American Spanish, 'ustedes' serves as both formal and informal plural address, and its affirmative command form is identical to the third-person plural present subjunctive. 'Preparen' is the correct ustedes imperative here."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ quedado dormido en el sofá otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep on the sofa again.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from a present perspective, equivalent to 'must have' or 'probably has' in English. This is distinct from its use to describe completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
