<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 15, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 15, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to express where they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for objects and people in a place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo, ¿verdad?",
    "en": "Try this broth — it's absolutely delicious, right?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With 'rico', ESTAR means something tastes good (a sensory experience you perceive in the moment), while SER + rico means 'to be wealthy'. Context here is tasting food, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No te preocupes por él — ___ muy listo y sabrá resolver el problema solo.",
    "en": "Don't worry about him — he's very clever and will know how to solve the problem on his own.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER + listo means 'to be clever/smart' as an inherent characteristic. ESTAR + listo means 'to be ready'. Since the sentence refers to a permanent intellectual trait, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué al aeropuerto, el mostrador de facturación ___ cerrado.",
    "en": "When I arrived at the airport, the check-in counter was closed.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for states or conditions resulting from a change (the counter had been closed), not for defining characteristics. 'Cerrado' here describes a temporary state, so ESTAR (imperfect: estaba) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, mi abuela siempre ___ bizcocho los domingos por la mañana.",
    "en": "When I was a child, my grandmother always made sponge cake on Sunday mornings.",
    "options": [
      "hacía",
      "hizo",
      "había hecho",
      "ha hecho"
    ],
    "correct": 0,
    "explanation": "The Imperfecto expresses habitual or repeated actions in the past. The key signal here is 'siempre' (always) combined with 'cuando era niño', which frames a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ una novela cuando de repente sonó el teléfono.",
    "en": "I was reading a novel when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the ongoing background action uses the Imperfecto ('leía') while the interrupting event uses the Indefinido ('sonó'). The Imperfecto paints the scene; the Indefinido marks the new event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ tres veces a París por trabajo.",
    "en": "Last year I went to Paris three times for work.",
    "options": [
      "iba",
      "fui",
      "iría",
      "voy"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions that occurred a specific, countable number of times in a closed past period. 'El año pasado' closes the time frame, and 'tres veces' counts the repetitions as finished events."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó al jefe antes del problema.",
    "en": "What surprises me is that nobody warned the boss before the problem.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'the thing that / what'. It acts as the subject of the sentence. 'Que' alone cannot open a sentence as a noun clause subject in this way without an article."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo la razón por ___ te fuiste sin despedirte.",
    "en": "I don't understand the reason why you left without saying goodbye.",
    "options": [
      "lo que",
      "qué",
      "que",
      "cual"
    ],
    "correct": 2,
    "explanation": "After a preposition + defined antecedent ('la razón'), the relative pronoun 'que' is used in standard spoken Spanish. 'Por que' (two words) here follows 'la razón', making 'que' the correct relative connector."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega; siento que nunca termino nada a tiempo.",
    "en": "Lately I get very stressed about deadlines; I feel like I never finish anything on time.",
    "options": [
      "me estresa",
      "te estreso",
      "me estreso",
      "me estresas"
    ],
    "correct": 2,
    "explanation": "When the subject causes their own stress (Yo y yo pattern), the reflexive 'estresarse' is used: 'yo me estreso'. Compare with 'me estresa' where an external subject (like work) causes the stress in the speaker."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without letting me know, you worry me a lot.",
    "options": [
      "te preocupas",
      "me preocupo",
      "me preocupas",
      "se preocupa"
    ],
    "correct": 2,
    "explanation": "This is the 'Yo y tú' pattern: a second-person subject (tú) acts on a first-person object (me). 'Me preocupas' means 'you make me worry', whereas 'me preocupo' would mean 'I worry myself'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "Hypothetical 'if' clauses with imperfect subjuntivo (si tuviera) require the Condicional in the result clause. The Futuro Simple cannot be used after 'si' in hypotheticals; the Condicional expresses the imagined consequence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que esta tarde ___ tormenta.",
    "en": "Look at those dark clouds — I think there will be a storm this afternoon.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "For predictions or expectations about the future based on present evidence, the Futuro Simple is used. The Condicional would imply a hypothetical or reported speech context, not a direct prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya he comprado los billetes — ___ a Barcelona el viernes por la mañana.",
    "en": "I've already bought the tickets — I'm going to Barcelona on Friday morning.",
    "options": [
      "iré",
      "voy",
      "voy a ir",
      "iría"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when a future action is already planned and decided, with concrete evidence (the tickets are bought). The Futuro Simple (iré) is more neutral; 'voy a ir' emphasises the plan is definite and imminent."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el técnico ___ el ordenador antes de mi presentación.",
    "en": "I hope the technician fixes the computer before my presentation.",
    "options": [
      "arregla",
      "arregle",
      "arreglará",
      "arreglara"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or hope like 'esperar que', the Subjuntivo Presente is required when the subjects of the two clauses are different. The Indicativo 'arregla' would be used only if there were no change of subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "recibes",
      "recibirás",
      "recibas",
      "recibieras"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to a future or hypothetical event. The Indicativo 'recibes' would only be used to describe a habitual present situation."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo reglamento ___ una buena solución para todos.",
    "en": "I don't think the new regulation is a good solution for everyone.",
    "options": [
      "es",
      "sea",
      "sería",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinions and beliefs ('no creer que', 'no pensar que') trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact. The Indicativo would be used with 'creo que'."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la música — los vecinos ya se han quejado dos veces.",
    "en": "Please turn down the music — the neighbours have already complained twice.",
    "options": [
      "baja",
      "bajas",
      "bajar",
      "baje"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -AR verbs is formed with the third-person singular present indicative: 'baja'. This form is used for direct commands addressed to someone you address as 'tú'."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el contrato sin leerlo bien primero.",
    "en": "Don't sign the contract without reading it carefully first.",
    "options": [
      "firmes",
      "firmas",
      "firma",
      "firmáis"
    ],
    "correct": 0,
    "explanation": "Negative tú imperatives are formed with 'no' + the present Subjuntivo: 'no firmes'. The affirmative imperative form 'firma' cannot be used in negative commands; only the Subjuntivo form is grammatically correct here."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ salido ya a hacer recados.",
    "en": "He's not answering the phone. He must have already gone out to run errands.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from the present perspective. It translates as 'must have + past participle' and signals that the speaker is making an inference, not stating a fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
