<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 31, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 31, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso de medicina ___ en el hotel Meliá este año.",
    "en": "The medical congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally triggers ESTAR. The congress is an event, not a physical object, so we use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres semanas en la playa, mi abuela ___ muy morena.",
    "en": "After spending three weeks at the beach, my grandmother is very tanned.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "ESTAR expresses a state resulting from a change, as opposed to a permanent characteristic. Being tanned is a temporary condition that came about after sun exposure, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace días.",
    "en": "Don't touch that cheese — it has been bad for days.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "The adjective 'malo' changes meaning depending on the verb: SER malo means someone is morally bad or of poor quality by nature, while ESTAR malo means something (or someone) is spoiled or ill. Here the cheese has gone off, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino ___ listo — siempre encuentra soluciones creativas a los problemas.",
    "en": "My neighbor is clever — he always finds creative solutions to problems.",
    "options": [
      "está",
      "es",
      "sea",
      "estará"
    ],
    "correct": 1,
    "explanation": "SER + listo means clever or smart as an inherent characteristic of the person. ESTAR + listo would mean 'to be ready,' a temporary state. Since the sentence describes a persistent trait, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi madre me ___ (leer) un cuento todas las noches.",
    "en": "When I was a child, my mother used to read me a story every night.",
    "options": [
      "leyó",
      "leía",
      "ha leído",
      "hubiera leído"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes habitual or repeated actions in the past. The phrase 'todas las noches' is a classic marker of habitual past behavior, which calls for the Imperfecto, not the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (ducharse) cuando sonó el timbre de la puerta.",
    "en": "I was showering when the doorbell rang.",
    "options": [
      "me duché",
      "me duchaba",
      "me había duchado",
      "me ducharía"
    ],
    "correct": 1,
    "explanation": "When two past actions occur together, the ongoing background action uses the Imperfecto and the sudden interrupting event uses the Indefinido. 'Me duchaba' sets the scene; 'sonó' is the interrupting completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar, yo) el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally finished the report I had been preparing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "haya terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed, bounded action at a specific point in time. 'Ayer por fin' signals a definite past moment with a clear endpoint, which requires the Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' and is used when the antecedent is unspecified or abstract. 'Que' alone cannot introduce an embedded interrogative content clause here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien te ha quedado el pastel, ¡está riquísimo!",
    "en": "How well your cake turned out — it's absolutely delicious!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark introduces exclamatory sentences expressing admiration or surprise. It functions as an exclamative adverb modifying 'bien,' and always carries a written accent in this use."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con las reuniones interminables de la oficina.",
    "en": "Lately I get very stressed by the endless office meetings.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "estreso"
    ],
    "correct": 1,
    "explanation": "When an inanimate thing or situation causes the speaker's emotional state, the verb agrees with that thing (the subject), and the speaker appears as the indirect/direct object pronoun. 'Las reuniones' is plural, so the verb is 'estresan.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Oye, cuando me criticas delante de todos, realmente ___ mucho.",
    "en": "Hey, when you criticize me in front of everyone, you really hurt me a lot.",
    "options": [
      "me hieres",
      "me hiero",
      "me hiere",
      "te hieres"
    ],
    "correct": 0,
    "explanation": "In the 'yo y tú' pattern, the other person (tú) performs an action that affects the speaker (yo). The verb must agree with 'tú' (second person singular) while 'me' marks that the speaker receives the impact."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ (hacer)?",
    "en": "If you had more free time, what would you do?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "Hypothetical 'si' clauses in the past subjunctive (si tuvieras) require the Condicional in the main clause to express what would happen under that imagined condition. The Futuro Simple cannot be used in this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el parte meteorológico, mañana ___ (llover) por la tarde.",
    "en": "According to the weather forecast, it will rain tomorrow afternoon.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "lloviera"
    ],
    "correct": 1,
    "explanation": "'Ir a + infinitivo' is preferred for near-future events that are planned, predicted, or based on present evidence (like a forecast). It conveys a stronger sense of certainty about an imminent event than the Futuro Simple."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me prometió que ___ (llamar, él) en cuanto llegara a casa.",
    "en": "He promised me he would call as soon as he got home.",
    "options": [
      "llamará",
      "llamaría",
      "llame",
      "llamara"
    ],
    "correct": 1,
    "explanation": "When reporting a future promise or intention from a past perspective (after a verb like 'prometió'), Spanish uses the Condicional as the 'future of the past.' The Futuro Simple is only used in direct speech or from a present perspective."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe insiste en que todos ___ (entregar) el proyecto antes del viernes.",
    "en": "The boss insists that everyone submit the project before Friday.",
    "options": [
      "entreguen",
      "entregan",
      "entregarán",
      "entregaran"
    ],
    "correct": 0,
    "explanation": "Verbs of insistence, desire, or demand (insistir en que, querer que, pedir que) trigger the Subjunctivo in the subordinate clause because the main clause subject is trying to influence another subject's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante del barrio ___ (ser) tan bueno como dicen.",
    "en": "I don't think the new neighborhood restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "sería",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' require the Subjuntivo because they express doubt or denial of the proposition. Affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te mandaré un mensaje en cuanto ___ (aterrizar, nosotros).",
    "en": "I'll send you a message as soon as we land.",
    "options": [
      "aterrizamos",
      "aterricemos",
      "aterrizaremos",
      "aterrizábamos"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when the clause refers to a future, not-yet-completed action. Only when the clause refers to a habitual or past fact is the Indicativo used."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (poner, tú) los pies encima de la mesa.",
    "en": "Please don't put your feet on the table.",
    "options": [
      "pongas",
      "pongas tú",
      "pon",
      "pones"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with 'no' + the present Subjuntivo second person singular. The affirmative imperative 'pon' cannot be used in negative commands; it must be replaced by the subjunctive form."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) el cinturón de seguridad.",
    "en": "Passengers, please fasten your seatbelts.",
    "options": [
      "abrochénse",
      "se abrochen",
      "abrochense",
      "abrochárselo"
    ],
    "correct": 0,
    "explanation": "In affirmative ustedes commands with reflexive pronouns, the pronoun is attached directly to the end of the imperative form and a written accent is added to maintain the original stress. 'Se abrochen' is the subjunctive structure used for negative commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Carmen todavía no ha llegado. ___ (perderse) con el nuevo sistema de metro.",
    "en": "It's three in the afternoon and Carmen still hasn't arrived. She must have gotten lost with the new metro system.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdería",
      "Se hubiera perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about something that likely happened in the recent past. It is the equivalent of 'must have done' in English and is triggered by present evidence combined with an unknown past cause."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
