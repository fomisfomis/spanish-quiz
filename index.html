<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 07, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 07, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en Madrid este año.",
    "en": "The international congress is in Madrid this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. 'Estar' is used for the physical location of objects and people, but scheduled events always require 'ser'."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante hoy.",
    "en": "Don't touch that sauce — it's very spicy today.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "When describing a condition that is perceived or experienced in the moment rather than an inherent characteristic, 'estar' is used. The word 'hoy' reinforces that this is a current state, not a permanent property."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de leer el libro tres veces, María ___ muy lista para el examen.",
    "en": "After reading the book three times, María is very ready for the exam.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Listo' changes meaning depending on the verb: 'ser listo' means to be clever/smart (a personality trait), while 'estar listo' means to be ready (a current state). Here the context of preparation points to 'estar'."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ vivo todavía — ¡cumple 95 años la semana que viene!",
    "en": "My grandfather is still alive — he turns 95 next week!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "'Vivo' is another adjective with dual meanings: 'ser vivo' means to be clever or sharp, while 'estar vivo' means to be alive (a biological state). States of being alive or dead require 'estar'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was a child, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "Habitual or repeated actions in the past use the Imperfecto. The phrase 'todos los sábados' is a classic marker of habitual past behaviour, which triggers 'imperfecto' rather than 'indefinido'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ (ducharse), sonó el teléfono tres veces.",
    "en": "While I was showering, the phone rang three times.",
    "options": [
      "me duché",
      "me duchaba",
      "me he duchado",
      "me duchara"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto ('me duchaba') and the interrupting completed event uses the Indefinido ('sonó'). The ongoing action provides the context for the sudden event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ (estar) lleno, así que decidimos comer en casa.",
    "en": "The restaurant was full, so we decided to eat at home.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for background descriptions and states that set the scene in a narrative. Here, 'estaba lleno' is a description of a condition, while 'decidimos' (the consequent action) uses the Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta del trabajo no es el jefe, sino las reuniones interminables.",
    "en": "What bothers me about work is not the boss, but the endless meetings.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'the thing that' or 'what' in a non-interrogative context. 'Que' alone cannot start a nominal clause as the subject here, and 'qué' is reserved for direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ bien que hayas conseguido ese ascenso!",
    "en": "How great that you got that promotion!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cuál"
    ],
    "correct": 2,
    "explanation": "'Qué' with a written accent is used in exclamations to express intensity or emotion before adjectives, adverbs, and nouns. In this exclamatory structure '¡Qué + adjective/adverb!', the accent distinguishes it from the relative pronoun 'que'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hay tráfico en la autopista, ___ muchísimo.",
    "en": "Every time there is traffic on the motorway, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject performs and receives the action themselves ('yo y yo' pattern), the reflexive verb agrees with the first-person singular subject. 'Me estreso' = I stress myself out, with 'yo' as both agent and patient."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que me hablas así, ___ mucho.",
    "en": "Every time you talk to me like that, you upset me a lot.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "nos molestamos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject acts upon a first-person object. The verb 'molestar' here works like 'gustar': the subject (tú) causes the emotional effect on 'me', so the verb takes the third-person or second-person form matching 'tú': 'me molestas'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más dinero, ___ un viaje a Japón.",
    "en": "If I had more money, I would take a trip to Japan.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical conditional sentences with 'si + imperfecto de subjuntivo', the main clause requires the Condicional Simple. The Futuro Simple cannot be used after this type of hypothetical 'si' clause."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He mirado el pronóstico: mañana ___ mucho calor en el sur.",
    "en": "I've checked the forecast: tomorrow it will be very hot in the south.",
    "options": [
      "haría",
      "habrá",
      "vaya a hacer",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple expresses a concrete prediction or expected future event based on evidence. 'Haría' (Condicional) would imply a hypothetical or conditional scenario, not a weather forecast."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el plan de viaje, ___ a Lisboa en tren la próxima semana.",
    "en": "According to the travel plan, we're going to go to Lisbon by train next week.",
    "options": [
      "iríamos",
      "iremos",
      "vamos a ir",
      "vayamos"
    ],
    "correct": 2,
    "explanation": "'Voy/vamos a + infinitivo' is typically preferred for near-future plans that are already arranged or decided, especially in spoken Spanish. Both 'iremos' and 'vamos a ir' are possible, but 'vamos a ir' better conveys a concrete, already-made plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El director quiere que nosotros ___ el informe antes del viernes.",
    "en": "The director wants us to submit the report before Friday.",
    "options": [
      "entregamos",
      "entregáramos",
      "entreguemos",
      "entregaremos"
    ],
    "correct": 2,
    "explanation": "After verbs of desire or will ('querer que'), the subordinate clause requires the present subjunctive when the main verb is in the present tense. The change in subject between clauses (él quiere / nosotros entreguemos) is key to triggering the subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamo enseguida.",
    "en": "As soon as I get the results, I'll call you right away.",
    "options": [
      "tengo",
      "tendré",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the subjunctive when they refer to a future event. Even though the action feels predictable, the future-oriented meaning after these conjunctions always triggers the subjunctive in Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ abierto a estas horas.",
    "en": "I don't think this restaurant is open at this hour.",
    "options": [
      "está",
      "estará",
      "esté",
      "estuviera"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion or belief ('no creer que', 'no pensar que') require the subjunctive in the subordinate clause because the speaker is casting doubt on the proposition. The affirmative 'creo que' would use the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto por cosas que no puedes controlar.",
    "en": "Don't worry so much about things you can't control.",
    "options": [
      "te preocupa",
      "te preocupes",
      "preocúpate",
      "te preocuparás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present subjunctive, not the affirmative imperative form. With reflexive verbs in negative commands, the reflexive pronoun 'te' precedes the verb and the verb takes the tú subjunctive form ('preocupes')."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) los cinturones por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abróchenlos",
      "abróchense",
      "se abrochen",
      "abrochen se"
    ],
    "correct": 1,
    "explanation": "For affirmative 'ustedes' commands, the reflexive pronoun is attached directly to the end of the verb. The ustedes imperative of reflexive verbs is formed by dropping the '-n' of the subjunctive form and attaching 'se': 'abrochen' → 'abróchense'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro mis llaves por ningún lado. Las ___ (dejar) en la oficina.",
    "en": "I can't find my keys anywhere. I must have left them at the office.",
    "options": [
      "dejé",
      "dejaré",
      "habré dejado",
      "habría dejado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a recent past event when the speaker is uncertain. It is the equivalent of 'must have done something' in English and expresses an educated guess about what happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
