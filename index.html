<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 14, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 14, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, not ESTAR. ESTAR is used for the location of physical objects and people, but scheduled events (concerts, meetings, parties) require SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions. The soup being hot right now is a current, changeable condition, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre encuentra soluciones que nadie más ve.",
    "en": "My grandmother is very clever — she always finds solutions nobody else sees.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, SER + listo means 'to be clever/smart' as a permanent trait, while ESTAR + listo means 'to be ready'. Here, cleverness is an inherent quality, so SER is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Jorge ___ agotado.",
    "en": "After running ten kilometers, Jorge is exhausted.",
    "options": [
      "es",
      "está",
      "sería",
      "estaría"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a state resulting from a change or action. Exhaustion after running is a temporary, caused condition — a result of what Jorge did — not a permanent characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre siempre me cantaba canciones antes de dormir.",
    "en": "When I was little, my mother always sang me songs before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (era) is used for background conditions and habitual or repeated actions in the past. 'When I was little' describes an ongoing background state, and the singing was a repeated habit, both requiring Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estábamos cenando tranquilamente cuando alguien ___ a la puerta.",
    "en": "We were having dinner quietly when someone knocked at the door.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "había llamado"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the ongoing background action uses Imperfecto (estábamos cenando) and the interrupting event uses Pretérito Indefinido (llamó). The knock is a single, completed event that broke the ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer, finalmente ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday, I finally submitted the report I had been preparing for weeks.",
    "options": [
      "entregaba",
      "entregué",
      "entregara",
      "entregaría"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido (entregué) marks a single completed action at a specific point in the past. The word 'ayer' (yesterday) and 'finalmente' signal a definite, finished event, which requires Indefinido, not Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ tanto te molesta de su actitud.",
    "en": "I don't understand what bothers you so much about his attitude.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'the thing that'. It acts as the direct object of 'entiendo'. 'Que' alone cannot introduce a noun clause without an antecedent, and 'qué' with an accent is for direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien te queda ese vestido, Sofía!",
    "en": "How well that dress suits you, Sofía!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to intensify a quality or action. This structure '¡Qué + adverb/adjective + verb!' expresses admiration or surprise and always carries a written accent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo que hablar en público.",
    "en": "Lately I get very nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "te pongo nervioso",
      "se pone nervioso",
      "me pone nervioso"
    ],
    "correct": 0,
    "explanation": "When the subject and the affected person are the same (yo/yo pattern), the reflexive pronoun 'me' is used with the first person. 'Me pongo nervioso' means the subject causes the feeling in themselves, not in another person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without letting me know, you worry me a lot.",
    "options": [
      "me preocupo",
      "te preocupas",
      "me preocupas",
      "se preocupa"
    ],
    "correct": 2,
    "explanation": "In the yo/tú pattern, 'me preocupas' means 'you (tú) cause worry in me (yo)'. The subject is 'tú' performing the action on 'me'. This differs from 'me preocupo' (I worry myself) or 'te preocupas' (you worry yourself)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tome",
      "tomaría",
      "voy a tomar"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the main clause requires the Condicional Simple. This structure expresses a condition that is contrary to present reality or unlikely to happen."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale a las nueve — si no te das prisa, ___ tarde.",
    "en": "The train leaves at nine — if you don't hurry, you will be late.",
    "options": [
      "llegarías",
      "llegas",
      "llegues",
      "llegarás"
    ],
    "correct": 3,
    "explanation": "Futuro Simple (llegarás) is used for predictions or consequences based on real, likely conditions. This is an open conditional (si + presente indicativo) with a genuinely possible outcome, which pairs with Futuro Simple, not Condicional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He mirado el cielo y las nubes — creo que ___ a llover esta tarde.",
    "en": "I've looked at the sky and the clouds — I think it's going to rain this afternoon.",
    "options": [
      "lloverá",
      "llovería",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near future event based on present evidence or intention. When there is visible evidence (clouds, sky) or a clear immediate plan, 'va a + infinitivo' is more natural than 'lloverá', which is used for more distant or formal predictions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ el nuevo protocolo antes del viernes.",
    "en": "It is important that all employees read the new protocol before Friday.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "leerían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions like 'es importante que' trigger the Subjuntivo in the subordinate clause. Whenever the main clause makes a value judgment or impersonal statement about what someone else should do, Subjuntivo is required."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ el resultado del examen.",
    "en": "I will call you as soon as I get the exam result.",
    "options": [
      "sepa",
      "sabré",
      "sé",
      "sabía"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que', when referring to future events, require the Subjuntivo in Spanish. Even though the English uses the present tense, the future orientation of the action demands Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ tres idiomas y tenga experiencia en ventas.",
    "en": "They are looking for someone who speaks three languages and has sales experience.",
    "options": [
      "habla",
      "hable",
      "hablará",
      "hablaría"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown, non-existent, or hypothetical (they don't know if this person exists yet), the Subjuntivo is required. Contrast with 'tienen a alguien que habla' (indicative, because the person is known/real)."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ las instrucciones antes de montar el mueble, por favor.",
    "en": "Hey, read the instructions before assembling the furniture, please.",
    "options": [
      "lees",
      "leas",
      "lee",
      "leyendo"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative for regular -er verbs is formed using the third person singular of the present indicative (él/ella form). So 'leer' → 'él lee' → imperative 'lee'. Note the negative tú command would be 'no leas' (subjuntivo)."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el teléfono durante la reunión.",
    "en": "Please, don't use the phone during the meeting.",
    "options": [
      "usa",
      "uses",
      "usas",
      "usará"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with 'no' + present Subjuntivo. The present Subjuntivo of 'usar' is 'uses'. Affirmative tú commands use the indicative third-person form, but negative commands always use Subjuntivo."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Ana no ha llegado todavía. ___ perdido en el centro.",
    "en": "Ana hasn't arrived yet. She must have gotten lost downtown.",
    "options": [
      "Se habrá perdido",
      "Se perderá",
      "Se perdería",
      "Se ha perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when the speaker is in the present. It conveys 'she must have...' or 'she probably...' and is a common way Spanish expresses epistemic certainty about completed past actions."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
