<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 13, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 13, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to indicate where they take place, even though location normally triggers ESTAR. ESTAR is used for the physical location of objects and people, but for events, SER is the rule."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, los turistas ___ completamente muertos de cansancio.",
    "en": "After walking ten kilometers, the tourists were completely dead tired.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "siendo"
    ],
    "correct": 2,
    "explanation": "ESTAR is used to describe states or conditions that are the result of a change, such as being tired after an activity. SER would imply a permanent or defining characteristic, which makes no sense here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No me digas que ese chico ___ listo! Siempre engaña a todos en los negocios.",
    "en": "Don't tell me that guy is clever! He always tricks everyone in business.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 0,
    "explanation": "With the adjective 'listo', SER + listo means 'to be clever or sharp', referring to a personality trait. ESTAR + listo, on the other hand, means 'to be ready', so the choice of verb completely changes the meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este mango que compraste ___ riquísimo. ¿Dónde lo encontraste?",
    "en": "This mango you bought is absolutely delicious. Where did you find it?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means 'to taste delicious' and refers to a sensory experience in the moment. SER + rico/a means 'to be wealthy' (referring to a person) or an inherent quality, so ESTAR is the correct choice when talking about how food tastes."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when the frequency is indicated by words like 'todas las noches'. The Indefinido would suggest a single, completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma de incendios.",
    "en": "I was reading calmly when suddenly the fire alarm went off.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In sentences with an interrupted past action, the ongoing background action is in the Imperfecto ('leía') and the interrupting event is in the Indefinido ('sonó'). The Imperfecto paints the scene; the Indefinido marks the new event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmara"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed, one-time events that happened at a specific point in the past. Time markers like 'el año pasado' anchor the action as finished and bounded, making the Indefinido the natural choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando explicar con ese diagrama.",
    "en": "I don't understand what you are trying to explain to me with that diagram.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what', and is used when the referent is unspecified or abstract. 'Que' alone is a conjunction or relative pronoun that requires a specific antecedent, so it cannot stand alone here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie en la oficina se haya dado cuenta del error.",
    "en": "What surprises me is that nobody in the office noticed the mistake.",
    "options": [
      "Que",
      "Lo que",
      "El que",
      "Qué"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used at the start of a sentence as a subject clause equivalent to 'what' in English when referring to something non-specific. 'Que' alone cannot begin a sentence as a subject without an antecedent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo que hablar en público.",
    "en": "Lately I get very nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "me pones nervioso",
      "me pone nervioso",
      "te pones nervioso"
    ],
    "correct": 0,
    "explanation": "When the subject causes a reaction in themselves, Spanish uses the reflexive 'me + verb in first person' pattern (yo y yo). 'Me pone nervioso' would mean something external causes the nervousness, and 'me pones nervioso' would mean 'you make me nervous'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que escucho tu voz por teléfono, ___ muchísimo.",
    "en": "Every time I hear your voice on the phone, you calm me down a lot.",
    "options": [
      "me calmo",
      "me calmas",
      "me calma",
      "te calmas"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes an effect on the speaker (yo), Spanish uses 'me + verb conjugated in second person singular' (me calmas). This is the 'yo y tú' pattern, distinct from the reflexive 'me calmo' where the speaker calms themselves."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "hago",
      "haría",
      "habré hecho"
    ],
    "correct": 2,
    "explanation": "The Condicional is used in the main clause of a hypothetical 'si' sentence when the 'si' clause contains the Imperfecto de Subjuntivo. This structure (si + imperfecto subj. + condicional) expresses unlikely or contrary-to-fact conditions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes, el técnico dijo que ___ a arreglarlo mañana por la mañana.",
    "en": "Don't worry, the technician said he would come to fix it tomorrow morning.",
    "options": [
      "vendrá",
      "vendría",
      "va a venir",
      "venga"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about a future action (indirect speech from a past reporting verb like 'dijo'), Spanish shifts the future to the Condicional. The Futuro Simple ('vendrá') would be used in direct speech or as a direct future statement."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio, ya lo tengo decidido.",
    "en": "This afternoon I'm going to the gym, I've already made up my mind.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a planned or decided near-future action, especially when the speaker has already committed to it. The Futuro Simple ('iré') sounds more distant or uncertain, while 'iría' is Condicional and implies a hypothetical."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que nosotros ___ el informe antes del viernes.",
    "en": "The boss wants us to finish the report before Friday.",
    "options": [
      "terminamos",
      "terminemos",
      "terminaremos",
      "termináramos"
    ],
    "correct": 1,
    "explanation": "After verbs of desire or want like 'querer' with a change of subject, the subordinate clause requires the Subjuntivo. The present subjunctive 'terminemos' is used because the desire refers to a present or upcoming action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the analysis results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', or 'hasta que' referring to a future event, Spanish requires the Subjuntivo. Using the Indicativo ('tienes') would imply a habitual or current situation, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ abierto a estas horas.",
    "en": "I don't think that restaurant is open at this hour.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief like 'no creo que' trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la música. Estoy intentando concentrarme.",
    "en": "Please turn down the music. I'm trying to concentrate.",
    "options": [
      "baja",
      "bajas",
      "bajes",
      "bajar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed using the third person singular of the present indicative ('baja'). This is used to give a direct command or request to someone you address as 'tú'."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ ese formulario sin leer todas las condiciones primero.",
    "en": "Don't sign that form without reading all the conditions first.",
    "options": [
      "firmes",
      "firmas",
      "firma",
      "firmaste"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive: 'no firmes'. Unlike affirmative commands, which use the indicative third-person form, all negative imperatives (tú, usted, ustedes) rely on the subjunctive."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marco aún no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Marco still hasn't arrived. He must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened. It is the equivalent of 'must have + past participle' in English when speculating about the past."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
