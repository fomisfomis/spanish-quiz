<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 30, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 30, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR is used for the physical location of objects and people, but events are described with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, and the temperature of food at a given moment is a changeable state. SER would imply that being hot is an inherent, permanent characteristic of the soup."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Todos pensábamos que el nuevo jefe ___ aburrido, pero sus reuniones son muy dinámicas.",
    "en": "We all thought the new boss was boring, but his meetings are very dynamic.",
    "options": [
      "estaba",
      "era",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "SER + aburrido means the person is boring (a personality trait), while ESTAR + aburrido means the person feels bored. Here the meaning is a character description, so SER (era) is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — ¿me das la receta?",
    "en": "This dessert is absolutely delicious — can you give me the recipe?",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Although 'rico' with SER means 'rich/wealthy,' with ESTAR it means 'delicious' or 'tastes great.' When commenting on how food tastes right now, ESTAR is used because it describes a sensory experience in the moment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ al parque todos los sábados con mi abuela.",
    "en": "When I was a child, I used to go to the park every Saturday with my grandmother.",
    "options": [
      "fui",
      "iba",
      "vaya",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a routine, not a single completed event, so the Indefinido (fui) would be incorrect."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Me ___ un mensaje justo cuando estaba presentando el informe.",
    "en": "She sent me a message just when I was presenting the report.",
    "options": [
      "enviaba",
      "envió",
      "enviará",
      "enviara"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the background ongoing action uses Imperfecto (estaba presentando) and the interrupting event uses Indefinido. 'Envió' is the completed action that broke into the longer ongoing situation."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the novel I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "termine",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The Indefinido marks a completed, bounded event seen as a whole. 'Ayer' and 'por fin' are strong temporal anchors that signal a single accomplished action, making the Imperfecto inappropriate here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ más me sorprendió del viaje fue la amabilidad de la gente.",
    "en": "What surprised me most about the trip was the kindness of the people.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' and is used as the subject or object of a verb when there is no specific noun antecedent. 'Que' alone cannot start a noun clause in this subject position."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es importante ___ llegues puntual a la entrevista de trabajo.",
    "en": "It is important that you arrive on time for the job interview.",
    "options": [
      "que",
      "lo que",
      "qué",
      "de que"
    ],
    "correct": 0,
    "explanation": "Impersonal expressions like 'es importante' introduce a subordinate clause with 'que' followed by the subjunctive. The conjunction here is simply 'que,' not 'lo que,' which is a relative pronoun referring back to a previous idea."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hablo con mi suegra, ___ muchísimo.",
    "en": "Every time I talk to my mother-in-law, I get really stressed.",
    "options": [
      "me estreso",
      "me estresa",
      "te estreso",
      "nos estresamos"
    ],
    "correct": 0,
    "explanation": "When the subject causes the action to happen to themselves (Yo y yo pattern), the reflexive pronoun matches the subject: 'yo me estreso.' 'Me estresa' would mean something external is stressing the speaker, changing the structure entirely."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresás / me estresas",
      "te estresas",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, the subject (tú) performs the action and the speaker (yo) is the indirect object receiving it: 'tú me estresas.' The reflexive 'me estreso' would only apply if the speaker were stressing themselves."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "haga",
      "hiciera"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses that are contrary to present reality, the structure is: si + Imperfecto Subjuntivo → Condicional Simple. The Futuro Simple (haré) is used for real future intentions, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El vuelo sale a las seis, así que ___ al aeropuerto antes de las cuatro.",
    "en": "The flight leaves at six, so I'm going to get to the airport before four.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a planned, near-future action with a clear intention. While 'iré' is also grammatically possible, 'voy a ir' is preferred in spoken Spanish when the plan is already decided and contextually grounded."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me dijiste que ___ la presentación antes del jueves?",
    "en": "Did you tell me you would finish the presentation before Thursday?",
    "options": [
      "terminarás",
      "terminarías",
      "termines",
      "terminaras"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said or implied about a future action (future in the past), Spanish uses the Condicional, just as English uses 'would.' The Futuro Simple refers to future from the speaker's present perspective, not from a past reference point."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el técnico ___ el ordenador antes del mediodía.",
    "en": "I hope the technician fixes the computer before noon.",
    "options": [
      "arregla",
      "arregle",
      "arreglará",
      "arreglara"
    ],
    "correct": 1,
    "explanation": "Verbs of hope and desire (esperar, querer, desear) followed by 'que' and a change of subject trigger the present subjunctive in the subordinate clause. The indicative 'arregla' would be used only if expressing certainty, not desire."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the present subjunctive when referring to a future event that has not yet happened. The indicative is only used when describing habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ abierto los lunes.",
    "en": "I don't think this restaurant is open on Mondays.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer' and 'no pensar' express doubt or uncertainty, which triggers the subjunctive in the subordinate clause. The affirmative 'creo que está' would use the indicative because it expresses a belief."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ ese correo sin revisarlo primero — puede tener errores.",
    "en": "Don't send that email without reviewing it first — it might have errors.",
    "options": [
      "envía",
      "envíes",
      "envía tú",
      "enviás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present subjunctive form, not the affirmative imperative. While 'envía' is the affirmative tú command, 'no envíes' is required for negation — this is a key asymmetry in the imperative system."
  },
  {
    "topic": "Imperativo",
    "q": "___ la verdad, por favor — no nos ayuda que nos ocultes información.",
    "en": "Tell us the truth, please — it doesn't help us if you hide information from us.",
    "options": [
      "Decid",
      "Díganos",
      "Dinos",
      "Dínosla"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of 'decir' is the irregular form 'di,' and when the indirect object pronoun 'nos' is added, it attaches to form 'dinos.' 'Díganos' is the usted command form, not tú."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Pablo no contesta el teléfono. ___ quedado dormido otra vez.",
    "en": "Pablo isn't answering the phone. He must have fallen asleep again.",
    "options": [
      "Habrá",
      "Habría",
      "Haya",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. This is the epistemic use, equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
