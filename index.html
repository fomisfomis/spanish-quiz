<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 22, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 22, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal este viernes.",
    "en": "The conference is in the main auditorium this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, el atleta ___ completamente muerto.",
    "en": "After running ten kilometers, the athlete is completely exhausted (dead tired).",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' describes a temporary state or condition resulting from an action. When 'muerto' is used literally or figuratively to describe a current state, ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No puedo creer que ese postre ___ tan rico — ¡quiero otro trozo!",
    "en": "I can't believe that dessert is so delicious — I want another piece!",
    "options": [
      "sea",
      "esté",
      "es",
      "está"
    ],
    "correct": 3,
    "explanation": "With 'rico', SER means 'wealthy' while ESTAR means 'tasty/delicious'. Since we're describing how the food tastes right now, ESTAR is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ___ lista para ayudarnos cuando la necesitamos.",
    "en": "My grandmother is always ready to help us when we need her.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Listo' with SER means 'clever/smart', but with ESTAR it means 'ready'. Since the sentence describes her readiness to help, ESTAR + listo is the correct combination."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre me leía un cuento todas las noches.",
    "en": "When I was little, my mother used to read me a story every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past and for background states. 'Era pequeña' describes an ongoing state, and 'leía' expresses a routine — both require imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "había escrito"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses imperfecto ('escribía') and the sudden interrupting event uses indefinido ('se fue'). The imperfecto sets the scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por la mañana, Laura ___ al gimnasio y luego ___ con sus amigas.",
    "en": "Yesterday morning, Laura went to the gym and then met with her friends.",
    "options": [
      "iba / quedó",
      "fue / quedó",
      "iba / quedaba",
      "fue / quedaba"
    ],
    "correct": 1,
    "explanation": "A sequence of completed, one-time events in the past uses the pretérito indefinido. Both actions happened and finished on a specific occasion ('ayer'), so both verbs require indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie llegó a tiempo a la reunión.",
    "en": "What surprises me is that nobody arrived on time for the meeting.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and acts as the subject of the sentence. 'Que' alone cannot open a sentence as a subject clause in this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿Con ___ herramienta piensas arreglar la tubería?",
    "en": "With what tool are you planning to fix the pipe?",
    "options": [
      "que",
      "lo que",
      "qué",
      "cuál"
    ],
    "correct": 2,
    "explanation": "When asking a direct question with a preposition followed by an interrogative, 'qué' carries a written accent and means 'what'. 'Que' without accent is a conjunction or relative pronoun, not an interrogative."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando no duermo bien, ___ muy irritable al día siguiente.",
    "en": "When I don't sleep well, I become very irritable the next day.",
    "options": [
      "me pongo",
      "te pones",
      "se pone",
      "nos ponemos"
    ],
    "correct": 0,
    "explanation": "This is the 'yo y yo' pattern — the subject causes a change in themselves. 'Ponerse + adjective' expresses a change of state in the subject, and since the subject is 'yo', the reflexive pronoun is 'me'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que me hablas de esa manera, ___ muchísimo.",
    "en": "Every time you talk to me that way, you upset me a lot.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "te molestas"
    ],
    "correct": 1,
    "explanation": "This is the 'yo y tú' pattern — 'tú' is the subject affecting 'yo'. The verb conjugates in the second person ('molestas') with the first-person object pronoun 'me', meaning 'you bother me'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir cualquier ciudad del mundo, ___ en Kioto.",
    "en": "If I could choose any city in the world, I would live in Kyoto.",
    "options": [
      "viviré",
      "vivo",
      "viviría",
      "vaya a vivir"
    ],
    "correct": 2,
    "explanation": "In a hypothetical 'si' clause with imperfecto de subjuntivo ('si pudiera'), the main clause requires the condicional simple ('viviría'). The futuro simple cannot be used in this conditional structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ los resultados del análisis y te llamaré enseguida.",
    "en": "Tomorrow I will receive the test results and I will call you right away.",
    "options": [
      "recibiría",
      "voy a recibir",
      "recibiré",
      "reciba"
    ],
    "correct": 2,
    "explanation": "When making a firm prediction or plan for a specific future time ('mañana'), both 'futuro simple' and 'voy a + infinitivo' are possible, but futuro simple emphasizes a scheduled or predicted event. Here it pairs naturally with 'llamaré' in a chain of future events."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El jefe dijo que nos ___ el lunes si terminábamos el informe.",
    "en": "The boss said he would pay us on Monday if we finished the report.",
    "options": [
      "pagará",
      "pagaría",
      "pague",
      "paga"
    ],
    "correct": 1,
    "explanation": "In reported speech, when the reporting verb is in the past ('dijo'), the future in the original statement shifts to condicional in the reported version. This is called 'futuro en el pasado'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche ___ a cenar con mis suegros — ya hice la reserva.",
    "en": "Tonight I'm going to have dinner with my in-laws — I already made the reservation.",
    "options": [
      "cenaré",
      "cenaría",
      "voy a cenar",
      "cene"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when a future action is already planned or arranged, especially when there is evidence of prior preparation (like a reservation). It expresses intention with a present connection."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ menos cafeína y que duermas más horas.",
    "en": "The doctor recommends that you drink less caffeine and sleep more hours.",
    "options": [
      "tomas",
      "tomes",
      "tomarás",
      "tomarías"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, wish, or influence (recomendar, querer, pedir), the subordinate clause requires the subjuntivo. The trigger verb 'recomienda' + 'que' signals a change to subjuntivo in the dependent clause."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del hospital.",
    "en": "Call me as soon as you get news from the hospital.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "Conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' require the subjuntivo when referring to a future action that hasn't happened yet. If it referred to a habitual past action, indicativo would be used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo proyecto ___ tan fácil como dice el director.",
    "en": "I don't think the new project is as easy as the director says.",
    "options": [
      "es",
      "sea",
      "será",
      "sería"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar, no parecer) trigger the subjuntivo in the dependent clause because the speaker is expressing doubt or disbelief rather than stating a fact."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ tanto azúcar al café — no es bueno para la salud!",
    "en": "Don't put so much sugar in the coffee — it's not good for your health!",
    "options": [
      "pongas",
      "pongas tú",
      "pon",
      "pones"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjuntivo, not the affirmative imperative form. 'Pon' is the affirmative tú command, but for negative commands, you must use 'no pongas'."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seat belts.",
    "options": [
      "abrochad",
      "abrocháis",
      "abrochad vosotros",
      "abrochense"
    ],
    "correct": 3,
    "explanation": "In Latin American Spanish, 'ustedes' is used instead of 'vosotros' for all groups. The ustedes affirmative command is identical to the third-person plural present subjuntivo, so 'abrocharse' → 'abrochense'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido en el sofá otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep on the sofa again.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It conveys speculation, similar to 'must have' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
