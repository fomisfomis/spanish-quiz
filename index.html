<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 20, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 20, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de rock ___ en el estadio municipal esta noche.",
    "en": "The rock concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR is used for the location of physical objects and people, but scheduled events follow the SER pattern."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it has been bad for three days.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something is spoiled or in a bad condition (a state). SER + malo means something is inherently bad or wicked by nature, so context here requires ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en cada situación.",
    "en": "My grandmother is very clever — she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means clever or smart as a characteristic trait. ESTAR + listo/a means to be ready, so the intended meaning of intelligence requires SER here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, los atletas ___ completamente agotados.",
    "en": "After running ten kilometres, the athletes are completely exhausted.",
    "options": [
      "son",
      "están",
      "sean",
      "estén"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with adjectives that describe a resulting state or condition, especially one caused by an action or change. Exhaustion here is a temporary state resulting from running, not a permanent characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cada verano, mi familia ___ (ir) a la misma playa en Galicia.",
    "en": "Every summer, my family used to go to the same beach in Galicia.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "irá"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The key clue 'cada verano' signals a recurring event, which rules out the Indefinido, which expresses completed single events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ (llamar) mi jefa, yo estaba en mitad de una reunión importante.",
    "en": "When my boss called, I was in the middle of an important meeting.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llamaría"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the interrupting action uses Indefinido while the ongoing background action uses Imperfecto. 'Llamó' is the sudden completed event that interrupted the meeting."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ (estar) lleno, así que decidimos buscar otro sitio.",
    "en": "The restaurant was full, so we decided to look for another place.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto provides background description or setting the scene in a past narrative. 'Estaba lleno' is the descriptive context; the main narrative event ('decidimos') is in Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to say to me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what', and it is used when referring to a non-specific, unnamed thing. 'Que' alone cannot stand as a noun clause subject or object in this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que por fin hayas conseguido ese ascenso en el trabajo.",
    "en": "How great that you've finally got that promotion at work.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamations to express strong emotion or evaluation. In this exclamatory construction, 'qué + adjective/adverb + que + clause' conveys an emotional reaction."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cuando hay mucho tráfico en la autopista, ___ muchísimo.",
    "en": "When there is a lot of traffic on the motorway, it stresses me out a great deal.",
    "options": [
      "me estreso",
      "me estreses",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When an external subject (el tráfico) causes a feeling in you, the verb agrees with that external subject and acts like 'gustar'. Here 'el tráfico' is third-person singular, so the verb is 'estresa' with the object pronoun 'me'."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Últimamente ___ demasiado pensando en el futuro y no puedo dormir.",
    "en": "Lately I stress myself out too much thinking about the future and I can't sleep.",
    "options": [
      "me estresa",
      "me estresan",
      "me estreso",
      "te estresan"
    ],
    "correct": 2,
    "explanation": "When the subject performs the action on themselves (Yo y yo pattern), the subject and the reflexive pronoun refer to the same person. 'Me estreso' = I stress myself, with 'yo' as both agent and receiver."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses where the condition is contrary to current reality (si + Imperfecto de Subjuntivo), the main clause requires the Condicional. The Futuro Simple cannot be used in this type of unreal conditional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El pronóstico dice que mañana ___ (llover) en toda la región norte.",
    "en": "The forecast says that tomorrow it will rain across the entire northern region.",
    "options": [
      "llovería",
      "llueva",
      "lloverá",
      "llueve"
    ],
    "correct": 2,
    "explanation": "Futuro Simple is used for factual predictions and plans, especially when there is evidence or certainty (like a weather forecast). Condicional would imply a hypothetical condition, which is absent here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo la reunión en veinte minutos, así que ___ (ir) a prepararme ya.",
    "en": "I have the meeting in twenty minutes, so I'm going to get ready now.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya a ir"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred for immediate near-future intentions, especially when the speaker has already made the decision and is about to act. 'Iré' sounds too distant or formal for an action about to happen imminently."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu hermano ___ (encontrar) trabajo antes de que termine el mes.",
    "en": "I hope your brother finds a job before the month ends.",
    "options": [
      "encuentra",
      "encontrará",
      "encuentre",
      "encontraría"
    ],
    "correct": 2,
    "explanation": "Verbs of wish or hope (esperar que) trigger the Subjuntivo in the subordinate clause when the subjects are different. 'Encuentre' is the present subjunctive of 'encontrar' and expresses the desired but uncertain outcome."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese candidato ___ (tener) suficiente experiencia para el puesto.",
    "en": "I don't think that candidate has enough experience for the position.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tendría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion (no creer que, no pensar que) trigger the Subjuntivo because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would use the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) los invitados, empezamos a servir la cena.",
    "en": "As soon as the guests arrive, we'll start serving dinner.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to a future event that has not yet happened. If the action were habitual or past, Indicativo would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (hablar) más despacio, por favor — no te entiendo bien.",
    "en": "Hey, speak more slowly, please — I can't understand you well.",
    "options": [
      "hablas",
      "habla",
      "hables",
      "hable"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -AR verbs is formed using the third-person singular present indicative form. 'Habla' is the correct form; 'hables' is the negative tú imperative or present subjunctive, used only in negative commands."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse) tanto por lo que piensen los demás — vive tu vida.",
    "en": "Don't worry so much about what others think — live your life.",
    "options": [
      "te preocupa",
      "te preocupes",
      "te preocuparás",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present subjunctive. For reflexive verbs, the reflexive pronoun 'te' comes before the subjunctive verb form, not attached to the end as it would be in affirmative commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marcos no ha llegado. ___ (perder) el autobús otra vez.",
    "en": "It's three in the afternoon and Marcos hasn't arrived. He must have missed the bus again.",
    "options": [
      "Perdería",
      "Habrá perdido",
      "Habrá perdiendo",
      "Perderá"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event, equivalent to 'must have done' in English. This speculative meaning about something that likely already happened is a key non-temporal use of this tense."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
