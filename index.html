<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 04, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 04, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de mañana ___ en el parque central.",
    "en": "Tomorrow's concert is in the central park.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, not ESTAR. ESTAR is used for the location of physical objects and people, but scheduled events (concerts, weddings, meetings) take SER + location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions that can change. The plate's heat is a current, changeable condition, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever/intelligent' (a permanent trait), while ESTAR + listo means 'ready'. Since we're describing her intelligence as an inherent quality, SER is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy malo.",
    "en": "After the chemotherapy, the patient was very ill.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 3,
    "explanation": "With 'malo', ESTAR describes a temporary health condition (being sick), while SER + malo means 'bad/evil' as a personality trait. ESTUVO (indefinido) is correct because this refers to a specific, bounded period of illness after a definable event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play football every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially in childhood memories. The phrase 'todos los sábados' reinforces the repetitive nature of the action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe cuando de repente ___ el teléfono.",
    "en": "I was reading the report when the phone suddenly rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in progress, the ongoing background action uses Imperfecto (leía) and the interrupting event uses Indefinido (sonó). 'De repente' is a strong clue for a sudden completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ pequeño pero aquella noche estaba lleno de gente.",
    "en": "The restaurant was small but that night it was full of people.",
    "options": [
      "fue",
      "era",
      "estuvo",
      "estaba"
    ],
    "correct": 1,
    "explanation": "Imperfecto is used to describe background characteristics or settings in the past. 'Era pequeño' describes the restaurant's ongoing characteristic, providing the backdrop for the narrative event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what/that which', replacing an entire concept. 'Que' alone is a simple conjunction and cannot introduce a noun clause here. 'Lo que' is needed when 'what' acts as the object of the verb."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonito está el jardín desde que plantaste esas flores!",
    "en": "How beautiful the garden looks since you planted those flowers!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Como"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express admiration or emotion before an adjective or noun. Without the accent, 'que' is a conjunction. The exclamation marks confirm this is an exclamatory structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando llego tarde al trabajo.",
    "en": "Lately I stress out a lot when I arrive late to work.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "estreso"
    ],
    "correct": 2,
    "explanation": "When the subject and the object of the reflexive action are the same person (yo), use the first-person reflexive pronoun 'me' with the first-person verb form 'estreso'. This is the 'yo y yo' pattern — the subject acts on themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que discutimos, ___ muchísimo con tus palabras.",
    "en": "Every time we argue, your words hurt me a lot.",
    "options": [
      "me hiero",
      "me hieres",
      "me hiere",
      "me hieran"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, someone else (tú) acts on me (yo), so the verb agrees with the subject 'tú' (second person singular: hieres) while 'me' marks the first-person as the recipient of the action."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics class.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "In hypothetical 'si' clauses using the Imperfecto de Subjuntivo (tuviera), the main clause must use the Condicional (haría). The Futuro Simple cannot be used in the result clause of these contrary-to-fact conditionals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ mucho calor este fin de semana.",
    "en": "According to the forecast, there will be a lot of heat this weekend.",
    "options": [
      "haría",
      "habría",
      "habrá",
      "vaya a haber"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for facts or predictions about the future with a reasonable degree of certainty. The Condicional would imply a hypothetical condition, which doesn't fit a weather forecast presented as factual."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya hemos comprado los billetes, así que ___ a Lisboa el próximo jueves.",
    "en": "We've already bought the tickets, so we're going to Lisbon next Thursday.",
    "options": [
      "iremos",
      "iríamos",
      "vamos a ir",
      "fuéramos"
    ],
    "correct": 2,
    "explanation": "'Voy/vamos a + infinitivo' expresses a planned future action with concrete evidence or preparation already in place (the purchased tickets). While 'iremos' is grammatically possible, 'vamos a ir' better conveys a decided, imminent plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregaran"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or wishing (querer) with a change of subject, the subordinate clause requires the Present Subjunctive. The trigger here is 'quiere que' + different subject, a core Subjunctive-triggering structure."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los empleados ___ los protocolos de seguridad.",
    "en": "It is essential that employees follow the safety protocols.",
    "options": [
      "siguen",
      "sigan",
      "seguirán",
      "siguieran"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions like 'es fundamental que', 'es importante que', 'es necesario que' always trigger the Subjunctive in the subordinate clause. These expressions convey necessity or value judgment about someone else's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto, ¿vale?",
    "en": "Call me as soon as you arrive at the airport, okay?",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "When 'en cuanto' (as soon as) refers to a future event, it requires the Present Subjunctive in the subordinate clause. This is because the action hasn't happened yet, making it uncertain/hypothetical from the speaker's current perspective."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ ese archivo todavía — necesito revisarlo primero.",
    "en": "Don't delete that file yet — I need to review it first.",
    "options": [
      "borras",
      "borra",
      "borres",
      "borrar"
    ],
    "correct": 2,
    "explanation": "Negative commands in the tú form use the Present Subjunctive (no borres), not the affirmative imperative form (borra). This is a key distinction: affirmative tú commands have their own form, but negative tú commands always use the Subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen alguna pregunta sobre el contrato, ___ directamente al departamento legal.",
    "en": "If you have any questions about the contract, send them directly to the legal department.",
    "options": [
      "manden",
      "manda",
      "mandar",
      "mandéis"
    ],
    "correct": 0,
    "explanation": "When addressing a group with 'ustedes' (used in Latin America and formal Spain), the command form is identical to the third-person plural Present Subjunctive (manden). 'Manda' would be tú, and 'mandéis' would be vosotros."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contestas el teléfono... ___ quedado dormida después del vuelo.",
    "en": "You're not answering the phone... you must have fallen asleep after the flight.",
    "options": [
      "Habrás",
      "Habrías",
      "Has",
      "Hubieras"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrás + participio) is used to express probability or logical deduction about something that likely happened in the recent past. It conveys 'you must have / you've probably', not a real future meaning here."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
