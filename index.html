<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 09, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 09, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. SER is used for the location of scheduled events, not for physical objects."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Miguel ___ completamente listo para dormir.",
    "en": "After running ten kilometers, Miguel is completely ready to sleep.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'ready' (a state or condition), while SER + listo means 'clever' (a permanent characteristic). Since Miguel is in a temporary state of readiness, ESTAR is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel de chocolate ___ riquísimo — ¿me das la receta?",
    "en": "This chocolate cake is absolutely delicious — will you give me the recipe?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'tastes delicious' (a sensory experience happening right now), whereas SER + rico means 'wealthy'. When commenting on how food tastes in the moment, use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ viuda desde que murió mi abuelo hace veinte años.",
    "en": "My grandmother has been a widow since my grandfather died twenty years ago.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 0,
    "explanation": "Although it might seem like a permanent state, ESTAR is used for civil or relational statuses that result from a change (divorciado, viudo, casado) because they represent a condition entered into through an event, not an intrinsic characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) en un pequeño pueblo cerca del mar.",
    "en": "When I was a child, I used to live in a small village near the sea.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing situations in the past with no defined endpoint. 'Cuando era niña' sets a background time frame, signaling a repeated or continuous state rather than a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when the phone suddenly rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leyera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted. The interrupting event (sonó) uses Indefinido, while the action already in progress (reading) uses Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas redactando.",
    "en": "Yesterday I finally finished the report I had been writing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "termine",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido is used for a completed action with a clear endpoint in the past. 'Ayer' and 'por fin' are time markers that signal a specific, finished event, making Indefinido the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what' when referring to an unspecified thing. 'Que' alone would need a prior noun to refer back to, and 'qué' (with accent) introduces direct or indirect questions, but here the meaning is 'the thing that.'"
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo tan interesante — ¡te lo mereces!",
    "en": "How great that you got that interesting job — you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express emotion or emphasis (¡Qué bien!, ¡Qué bonito!). Without the accent, 'que' acts as a conjunction or relative pronoun and cannot introduce an exclamation alone."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo demasiadas responsabilidades en el trabajo.",
    "en": "Lately I stress a lot because I have too many responsibilities at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or psychological state ('yo me estreso'), the reflexive verb agrees with the subject in first person. This is the 'Yo y yo' pattern where the person acts upon themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo — por favor, mándame un mensaje.",
    "en": "When you arrive late without warning, you worry me a lot — please send me a message.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) causes an emotional reaction in a first-person object (me). The verb conjugates for 'tú' (second person), and 'me' indicates who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses that use the Imperfecto de Subjuntivo (si tuviera), the main clause requires the Condicional (aprendería). The Futuro Simple cannot follow this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El médico me dijo que ___ (tomar) el medicamento dos veces al día.",
    "en": "The doctor told me that I would take the medication twice a day.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "The Condicional is used for reported speech when the original statement was in future tense and the reporting verb (dijo) is in the past. The Condicional acts as the 'future of the past' in indirect speech."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — esta tarde ___ (llover) seguro.",
    "en": "Look at those dark clouds — it will definitely rain this afternoon.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "lloviera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (ir a + infinitivo) is preferred for near-future events when there is visible evidence or strong intention in the present moment. The dark clouds serve as immediate evidence, making 'va a llover' more natural than the simple Futuro."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (asistir) a la reunión del lunes.",
    "en": "It is important that all employees attend Monday's meeting.",
    "options": [
      "asisten",
      "asistan",
      "asistirán",
      "asistieran"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es importante que, es necesario que) trigger the Subjuntivo in the subordinate clause. The Indicativo would state a fact, while Subjuntivo expresses a requirement or desire."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) a casa, llámame para saber que estás bien.",
    "en": "As soon as you get home, call me so I know you're okay.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to a future action that has not yet occurred. If the action were habitual or past, the Indicativo would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ (tener) terraza y dos habitaciones.",
    "en": "I'm looking for an apartment that has a terrace and two bedrooms.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent (the noun the relative clause describes) is hypothetical or unknown, the Subjuntivo is required. The speaker doesn't know yet if such an apartment exists, so 'tenga' (Subjuntivo) is used instead of 'tiene' (Indicativo, for a known apartment)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (salir, tú) sin paraguas — el pronóstico dice que va a llover.",
    "en": "Don't leave without an umbrella — the forecast says it's going to rain.",
    "options": [
      "sales",
      "salgas",
      "sal",
      "salieras"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present Subjuntivo (no salgas), NOT the affirmative imperative form (sal). This is a key difference: affirmative tú commands have their own irregular forms, but negative commands always borrow from the Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "___ (Decirme, ustedes) qué prefieren comer y haré la reserva ahora mismo.",
    "en": "Tell me what you prefer to eat and I'll make the reservation right now.",
    "options": [
      "Me dicen",
      "Díganme",
      "Me digan",
      "Decirme"
    ],
    "correct": 1,
    "explanation": "Affirmative ustedes commands are formed with the third-person plural present Subjuntivo (digan). Object pronouns attach directly to the end of affirmative commands (díganme), and the written accent is added to preserve the original stress."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Lleva tres horas encerrado en su despacho. ___ (tener) algún problema serio con ese proyecto.",
    "en": "He's been locked in his office for three hours. He must have some serious problem with that project.",
    "options": [
      "Tendrá",
      "Habrá tenido",
      "Tuvo",
      "Ha tenido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to speculate or make deductions about something that has probably already happened before the present moment. It expresses probability about a past event, similar to 'must have' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
