<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 27, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 27, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques la sopa — ___ muy caliente todavía.",
    "en": "Don't touch the soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for conditions or states that can change, such as temperature. The soup being hot is a temporary, changeable state, not an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Antes era muy tímida, pero ahora ___ muy segura de sí misma.",
    "en": "She used to be very shy, but now she is very confident.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR signals a change of state — the speaker is contrasting her past and present condition. Using ESTAR with an adjective highlights that the situation has changed from what it was before."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El guacamole que hiciste ___ riquísimo — me comí todo.",
    "en": "The guacamole you made was absolutely delicious — I ate all of it.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR (and its past form estuvo) is used with 'rico' to mean 'tasty.' With SER, 'rico' means 'wealthy.' Here the speaker describes how the food tasted — a personal, experiential reaction — so ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mi padre.",
    "en": "When I was a child, I used to play soccer every Saturday with my father.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals repetition, making Imperfecto the correct choice over Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo cuando de repente se cortó la luz.",
    "en": "I was writing an email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "escribiré",
      "escribiera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes a background action in progress when a sudden event (Indefinido) interrupts it. 'De repente' signals the interrupting event, and the ongoing action uses Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the novel I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "terminaré",
      "habré terminado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed action with a specific time reference ('ayer'). 'Por fin' further emphasizes the completion of the action, ruling out the ongoing nature of Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprendió fue su reacción tan tranquila ante la noticia.",
    "en": "What surprised me was her very calm reaction to the news.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is a nominalizing relative pronoun meaning 'that which' or 'what,' used to refer to an abstract idea or unspecified thing. 'Que' alone cannot begin a noun clause as the subject without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ sorpresa tan agradable encontrarte aquí!",
    "en": "What a pleasant surprise to find you here!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cómo"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to mean 'what a...!' It introduces an exclamatory phrase and always carries a written accent to distinguish it from the relative pronoun 'que.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay demasiado ruido en la oficina, ___ muchísimo y no puedo concentrarme.",
    "en": "When there is too much noise in the office, I get really stressed and can't concentrate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 0,
    "explanation": "This is the 'Yo y yo' pattern: the subject causes the action to happen to themselves. 'Me estreso' means the speaker is the agent and the recipient — no external person is causing the stress, just the situation acting on them personally."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ mucho, ¿lo sabes?",
    "en": "Every time you arrive late without warning, you really worry me, you know?",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "This is the 'Yo y tú' pattern: a second person (tú) causes an effect on a first person (me). 'Me preocupas' = you (subject) worry me (object). The verb agrees with the subject 'tú' (second person singular)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ diferente en tu vida?",
    "en": "If you had more free time, what would you do differently in your life?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical 'si' sentence when the condition is contrary to fact (si + Imperfecto Subjuntivo → Condicional). The future simple cannot be used in this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tranquilo, ___ el informe antes de que llegue tu jefe, te lo prometo.",
    "en": "Relax, I will finish the report before your boss arrives, I promise.",
    "options": [
      "terminaría",
      "terminaré",
      "voy a terminar",
      "termine"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near future action that is planned or feels certain, especially in spoken Spanish. It can also convey a promise or firm intention, making it natural here alongside 'te lo prometo.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijo que ___ a la reunión, pero al final no apareció.",
    "en": "He told me he would come to the meeting, but in the end he didn't show up.",
    "options": [
      "vendrá",
      "vendría",
      "viene",
      "venga"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about the future from a past perspective, Spanish uses the Condicional (known as the 'future of the past'). The Futuro Simple cannot express futurity relative to a past reporting verb."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis colegas ___ el nuevo sistema antes de la presentación.",
    "en": "I hope my colleagues understand the new system before the presentation.",
    "options": [
      "entienden",
      "entiendan",
      "entenderán",
      "entendieran"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or hope (esperar que, querer que), the subjunctive is required in the subordinate clause because the main subject expresses a desire about another subject's action. The present subjunctive is used for present or future wishes."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ el paquete, avísame por WhatsApp.",
    "en": "As soon as the package arrives, let me know via WhatsApp.",
    "options": [
      "llega",
      "llegue",
      "llegará",
      "llegara"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the subjunctive when referring to future events. Even though the action feels certain, it hasn't happened yet, so the subjunctive is obligatory."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que no sea demasiado caro.",
    "en": "I'm looking for an apartment that is near the subway and not too expensive.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown or hypothetical (the speaker doesn't know if such an apartment exists), the subjunctive is required. If the apartment were already identified, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — tengo que contarte algo importante.",
    "en": "Hey, wait a moment — I have to tell you something important.",
    "options": [
      "esperes",
      "espera",
      "espere",
      "esperáis"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -AR verbs is formed with the third person singular present indicative (él/ella form). 'Espera' is the tú imperative, while 'esperes' is the tú present subjunctive used only for negative commands."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el archivo sin hacer una copia de seguridad primero.",
    "en": "Please, don't delete the file without making a backup first.",
    "options": [
      "borras",
      "borres",
      "borra",
      "borrad"
    ],
    "correct": 1,
    "explanation": "Negative tú commands always use the present subjunctive (no + subjunctive). The affirmative imperative form 'borra' cannot be negated directly — instead, 'borres' (tú present subjunctive) must be used with 'no.'"
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido después del partido.",
    "en": "He's not answering the phone. He must have fallen asleep after the game.",
    "options": [
      "Habrá",
      "Había",
      "Hubiera",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about something that may have already happened. It is the Spanish equivalent of 'must have done' when speculating about a past event from the present moment."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
