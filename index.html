<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 27, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 27, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (not physical objects). Events like concerts, meetings, and parties use SER + location, while permanent or temporary physical objects use ESTAR + location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante y te va a arder la boca.",
    "en": "Don't touch that sauce — it's very spicy and it will burn your mouth.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used for inherent or defining characteristics of something. A sauce being spicy is an intrinsic property of that type of food, not a temporary condition, so SER is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar años en el extranjero, mi abuela ___ muy viva — recuerda cada detalle de todo.",
    "en": "After spending years abroad, my grandmother is very sharp — she remembers every detail of everything.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "'Vivo/a' with SER means alert, sharp, or clever (a personality trait), while 'vivo/a' with ESTAR means alive (a physical state). Since the sentence refers to mental sharpness, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El postre que preparaste ___ riquísimo — ¿me das la receta?",
    "en": "The dessert you made is absolutely delicious — can you give me the recipe?",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "'Rico/a' with ESTAR describes how food tastes (a sensory, perceived experience in the moment), while 'rico/a' with SER means wealthy. When commenting on the flavor of a dish, ESTAR is always used."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, ___ (ir) al mercado con mi madre todos los sábados.",
    "en": "When I was little, I used to go to the market with my mother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when signaled by frequency expressions like 'todos los sábados'. The Indefinido would imply a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras ella ___ (ducharse), sonó el teléfono.",
    "en": "While she was showering, the phone rang.",
    "options": [
      "se duché",
      "se duchaba",
      "se duchó",
      "se había duchado"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the background or ongoing action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Ducharse' is the ongoing background action here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (lanzar) un nuevo producto al mercado.",
    "en": "Last year, my company launched a new product onto the market.",
    "options": [
      "lanzaba",
      "lanzó",
      "ha lanzado",
      "había lanzado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed, one-time events that occurred at a specific point in the past. 'El año pasado' is a fixed past time marker that signals a completed action, so Indefinido is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and is used when there is no specific antecedent noun. 'Que' alone would need a prior noun to refer back to, and 'qué' is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ sorpresa tan bonita me habéis dado esta mañana!",
    "en": "What a lovely surprise you gave me this morning!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations (as well as direct and indirect questions). In exclamatory structures like '¡Qué + noun + tan/más + adjective!', the accent mark is always required."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo que hablar en público.",
    "en": "I always get nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "te pongo nervioso",
      "le pongo nervioso",
      "nos ponemos nervioso"
    ],
    "correct": 0,
    "explanation": "When the subject causes a reaction in themselves (Yo y yo pattern), a reflexive construction is used: the subject and the reflexive pronoun refer to the same person. 'Me pongo nervioso' means the subject makes themselves nervous."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde, ___ muchísimo.",
    "en": "Every time you arrive late, you make me very angry.",
    "options": [
      "me enfado",
      "me enfadas",
      "me enfada",
      "te enfadas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, an action by the 'tú' subject affects the 'yo' speaker. The verb is conjugated for 'tú' (enfadas) and the object pronoun 'me' shows who receives the emotional impact."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the main clause requires the Condicional Simple, not the Futuro. The Condicional expresses what would happen under an unlikely or imagined condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el parte meteorológico, mañana ___ (llover) por la tarde.",
    "en": "According to the weather forecast, it will rain tomorrow afternoon.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "Both Futuro Simple and 'voy a + infinitivo' can express future events, but Futuro Simple is preferred for official forecasts, predictions from external sources, and more formal or distant future statements."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El jefe dijo que nos ___ (enviar) los contratos antes del viernes.",
    "en": "The boss said he would send us the contracts before Friday.",
    "options": [
      "enviará",
      "enviaría",
      "va a enviar",
      "envíe"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about a future action (indirect speech with a past reporting verb), the Futuro Simple shifts to the Condicional Simple — this is called the 'future-in-the-past' use of the Condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (llegar) puntualmente a la reunión.",
    "en": "It is important that all employees arrive on time to the meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegarían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of importance, necessity, or obligation (es importante que, es necesario que, etc.) trigger the Subjuntivo in the dependent clause. The subject of the main clause and dependent clause must differ."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante ___ (ser) tan bueno como dicen.",
    "en": "I don't think the new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "sería"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) require the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) el proyecto, te lo mando por correo.",
    "en": "As soon as I finish the project, I'll send it to you by email.",
    "options": [
      "termino",
      "termine",
      "terminé",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the Subjuntivo when referring to future events. If the action were habitual or past, the Indicativo would be used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (poner, tú) la mesa antes de que lleguen los invitados.",
    "en": "Please set the table before the guests arrive.",
    "options": [
      "pones",
      "ponga",
      "pon",
      "pongas"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of 'poner' is irregular: 'pon'. Many common verbs have irregular affirmative tú imperatives (pon, ten, ven, di, haz, sal, sé, ve) that must be memorized separately from the regular pattern."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (hablar, vosotros) tan alto en la biblioteca, por favor.",
    "en": "Don't speak so loudly in the library, please.",
    "options": [
      "hablad",
      "habléis",
      "hablen",
      "habláis"
    ],
    "correct": 1,
    "explanation": "Negative imperatives for all persons are formed using the present Subjuntivo. For the negative vosotros command, use the present Subjuntivo vosotros form (habléis), NOT the affirmative imperative form (hablad)."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llamé tres veces pero no contesta. ___ (salir) a hacer recados.",
    "en": "I called three times but she's not answering. She must have gone out to run errands.",
    "options": [
      "Salió",
      "Habrá salido",
      "Hubiera salido",
      "Habría salido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when the speaker is uncertain. It conveys 'she must have / she has probably' — a logical inference rather than confirmed fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
