<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 16, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 16, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de rock ___ en el estadio central esta noche.",
    "en": "The rock concert is at the central stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR indicates where a physical object or person is, but for scheduled events, SER is required: '¿Dónde es la fiesta?' follows this rule."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar horas en la cocina, la sopa por fin ___ lista.",
    "en": "After spending hours in the kitchen, the soup is finally ready.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo/a means 'ready' (a current state), while SER + listo/a means 'clever' (a defining characteristic). Since the soup has reached a state of being prepared, ESTAR is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No me esperaba que el nuevo vecino ___ tan aburrido — solo habla de impuestos.",
    "en": "I didn't expect the new neighbor to be so boring — he only talks about taxes.",
    "options": [
      "esté",
      "sea",
      "está",
      "es"
    ],
    "correct": 1,
    "explanation": "SER + aburrido/a describes a personality trait — someone who IS a boring person by nature. ESTAR + aburrido/a means the person feels bored at a given moment. Context here describes his character, so SER (subjunctive 'sea' after 'esperaba que') is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Prueba este mango! ___ riquísimo — lo compré en el mercado esta mañana.",
    "en": "Try this mango! It's absolutely delicious — I bought it at the market this morning.",
    "options": [
      "Es",
      "Está",
      "Fue",
      "Estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a expresses how food tastes right now — a sensory, temporary experience. SER + rico/a would mean the mango (or a person) is wealthy. When describing the taste of food, always use ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Todos los veranos de mi infancia, mi familia ___ a la misma playa en Galicia.",
    "en": "Every summer of my childhood, my family went to the same beach in Galicia.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially with time expressions like 'todos los veranos.' The Indefinido would imply a single, completed trip, not a recurring pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when the phone suddenly rang.",
    "options": [
      "leí",
      "leía",
      "he leído",
      "había leído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto and the interrupting event uses the Indefinido. 'Leía' sets the scene; 'sonó' is the sudden event that broke it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses intentando terminar.",
    "en": "Yesterday I finally finished the novel I had been trying to finish for months.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido marks a single, completed event with a clear endpoint in the past. 'Ayer' and 'por fin' are strong signals of a finished, bounded action. The Imperfecto would suggest an ongoing or habitual state."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when referring to an unspecified thing or concept. 'Que' alone is a simple connector and cannot stand alone as the object of 'entender' here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí en Lisboa después de tanto tiempo.",
    "en": "What a pleasant surprise to run into you here in Lisbon after so long.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' (with accent) is used in exclamations to express emotion or emphasis, often followed by a noun or adjective. 'Que' without an accent is a relative pronoun or conjunction and cannot introduce exclamations this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hay mucho tráfico en la autopista, ___ muchísimo.",
    "en": "Whenever there's a lot of traffic on the highway, I get really stressed.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject of the stress is 'yo' and the cause is an external situation (not another person), we use 'me estreso' — the reflexive where the subject acts on itself. 'Me estresa' would require a third-person subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me hablas en ese tono tan brusco, realmente ___ muchísimo.",
    "en": "When you talk to me in that harsh tone, you really upset me a lot.",
    "options": [
      "me molesto",
      "te molestas",
      "me molestas",
      "nos molestamos"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject (tú) causes an effect on a first-person object (me). 'Me molestas' means 'you bother/upset me' — the subject is tú, the indirect object is me. 'Me molesto' would mean I upset myself."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir cualquier destino, ___ directamente a Japón en primavera.",
    "en": "If I could choose any destination, I would go straight to Japan in spring.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "vaya"
    ],
    "correct": 0,
    "explanation": "The Condicional is required in the result clause of hypothetical (si + Imperfecto de Subjuntivo) sentences. 'Iré' (Futuro) is used for real future plans or predictions, not hypothetical scenarios."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo reservado — ___ a Madrid el próximo martes por la mañana.",
    "en": "I have the flight booked — I'm going to Madrid next Tuesday morning.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future plan that is already arranged or decided, especially when there is concrete evidence (here, a booked flight). 'Iré' is more neutral or distant, and 'iría' implies a hypothetical condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en el sur del país.",
    "en": "According to the forecast, tomorrow it will be over 35 degrees in the south of the country.",
    "options": [
      "haría",
      "habría",
      "hará",
      "va a hacer"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is standard for predictions or forecasts based on external information, particularly in formal or neutral contexts like weather reports. 'Va a hacer' is also possible but slightly more informal; 'haría' implies a conditional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entreguen"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or desire (querer, desear) with a change of subject, the subordinate clause requires the Subjunctive. 'Que entreguen' follows the pattern: verb of will + que + subjuntivo. The indicative 'entregan' cannot be used here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del médico, ¿de acuerdo?",
    "en": "Call me as soon as you get news from the doctor, okay?",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjunctive when referring to a future action that has not yet happened. If the action were habitual or past, the Indicative would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una pena que no ___ venir a la cena de aniversario con nosotros.",
    "en": "It's a shame that you can't come to the anniversary dinner with us.",
    "options": [
      "puedes",
      "puedas",
      "podrás",
      "podrías"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of emotion like 'es una pena,' 'es bueno,' or 'es importante' trigger the Subjunctive in the subordinate clause when there is a specific subject. The Indicative 'puedes' would make it a statement of fact, not a reaction."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil encima de la mesa durante la reunión.",
    "en": "Please don't put your phone on the table during the meeting.",
    "options": [
      "pongas",
      "pongas tú",
      "pon",
      "pones"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjunctive: 'no pongas.' The affirmative tú command 'pon' cannot be used in a negative command. Adding 'tú' is redundant but not grammatically required here."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen alguna duda sobre el contrato, ___ directamente con el departamento legal.",
    "en": "If you have any questions about the contract, speak directly with the legal department.",
    "options": [
      "hablen",
      "habláis",
      "hablad",
      "hablen ustedes"
    ],
    "correct": 0,
    "explanation": "The ustedes affirmative command uses the third-person plural of the present Subjunctive. 'Hablad' is the vosotros command used in Spain; 'hablen' covers ustedes commands in both Spain and Latin America in formal contexts."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Lucía no ha llegado aún. ___ perdido el autobús otra vez.",
    "en": "It's three in the afternoon and Lucía still hasn't arrived. She must have missed the bus again.",
    "options": [
      "Ha perdido",
      "Habrá perdido",
      "Hubiera perdido",
      "Perdió"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about a past event from the speaker's present perspective — equivalent to 'must have done.' The Indicative 'ha perdido' would state a known fact, not a guess."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
