<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 05, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 05, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where an event takes place. Location of events (concerts, weddings, meetings) uses SER, while location of physical objects and people uses ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's very hot still.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, including temperature as experienced at a specific moment. The soup's heat is a current, changeable state, not an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo era cocinero, pero ahora ___ jubilado y descansa mucho.",
    "en": "My grandfather was a cook, but now he is retired and rests a lot.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for states that result from a change, such as being retired (jubilado), which implies a transition from working to not working. These participial adjectives describing a resulting condition require ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No me gusta esta película — ___ muy aburrida.",
    "en": "I don't like this movie — it's very boring.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "With adjectives that change meaning based on SER/ESTAR, 'ser aburrido/a' means to be boring (an inherent quality), while 'estar aburrido/a' means to be bored (a feeling). Here the movie is described as inherently boring, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (caminar) al colegio todos los días.",
    "en": "When I was a child, I used to walk to school every day.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The clue 'cuando era niña' (when I was a child) combined with 'todos los días' signals a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) el informe cuando mi jefa entró en la oficina.",
    "en": "I was reading the report when my boss came into the office.",
    "options": [
      "leí",
      "leía",
      "he leído",
      "había leído"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the background or ongoing action uses Imperfecto (leía), while the interrupting event uses Indefinido (entró). The reading was already in progress when the boss arrived."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por la tarde, el equipo ___ (ganar) el partido con un gol en el último minuto.",
    "en": "Yesterday afternoon, the team won the match with a goal in the last minute.",
    "options": [
      "ganaba",
      "ganó",
      "ha ganado",
      "ganaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed, single events in the past with a clear time reference ('ayer por la tarde'). The win is a finished, bounded action, not a repeated or background situation."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese gesto.",
    "en": "I don't understand what you are trying to tell me with that gesture.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what' (the thing that) when introducing a noun clause after a verb. 'Que' alone cannot head a noun clause in this context without a prior antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "Llevamos tres horas esperando — ¡___ paciencia hay que tener!",
    "en": "We've been waiting three hours — what patience one needs to have!",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express intensity or emotion (¡Qué + noun/adjective!). Without an accent, 'que' is a conjunction or relative pronoun and cannot carry exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Desde que empezaste a trabajar en esa empresa, ___ mucho.",
    "en": "Since you started working at that company, you stress me out a lot.",
    "options": [
      "me estreso",
      "te estresas",
      "me estresas",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject (tú) causes an emotional effect on a first-person object (me), the verb agrees with the subject (tú → estresas) and the object pronoun 'me' shows who is affected. This is the 'yo y tú' pattern."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hay mucho tráfico en la autopista, ___ muchísimo.",
    "en": "Whenever there is a lot of traffic on the highway, it stresses me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresan",
      "me estresa"
    ],
    "correct": 3,
    "explanation": "When an inanimate or abstract subject (el tráfico, singular) causes an emotional effect on a person, the verb agrees with that subject in third-person singular and the affected person appears as an indirect object pronoun. This is the 'yo y el mundo' pattern."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ (viajar) a Japón?",
    "en": "If you had more free time, would you travel to Japan?",
    "options": [
      "viajarás",
      "viajes",
      "viajarías",
      "vas a viajar"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses with Imperfecto de Subjuntivo (si tuvieras), the result clause requires the Condicional Simple (viajarías). The Futuro Simple and 'ir a + infinitivo' are used for real future plans, not hypothetical scenarios."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ (reunirse, nosotros) con los clientes a las diez en punto.",
    "en": "Tomorrow we are going to meet with the clients at ten o'clock sharp.",
    "options": [
      "nos reuniríamos",
      "nos reunimos",
      "vamos a reunirnos",
      "nos reunamos"
    ],
    "correct": 2,
    "explanation": "'Ir a + infinitivo' (vamos a reunirnos) is preferred when talking about a near future event that is already planned or scheduled, especially in spoken Spanish. The Condicional would imply hypothetical doubt, not a confirmed appointment."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, el próximo invierno ___ (ser) más frío de lo normal.",
    "en": "According to the forecast, next winter will be colder than normal.",
    "options": [
      "sería",
      "va a ser",
      "sea",
      "será"
    ],
    "correct": 3,
    "explanation": "The Futuro Simple (será) is used for predictions based on evidence or expectations about a more distant future. 'Ir a + infinitivo' suits imminent or personally planned events, while Condicional implies a hypothesis or polite request."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegues",
      "llegas",
      "llegarás",
      "llegarías"
    ],
    "correct": 0,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' that refer to a future event, the Presente de Subjuntivo is required. The Indicative present would imply a habitual action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ (leer) el nuevo protocolo antes del lunes.",
    "en": "It is essential that all employees read the new protocol before Monday.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "leerían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of obligation, importance, or emotion (es fundamental que, es importante que) trigger the Subjuntivo in the subordinate clause because they express a subjective assessment rather than stating objective fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo director ___ (tener) suficiente experiencia para el puesto.",
    "en": "I don't think the new director has enough experience for the position.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tendría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que, no parecer que) require the Subjuntivo because the speaker is expressing doubt or denial rather than asserting something as true."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ¡no ___ (poner, tú) los pies encima de la mesa!",
    "en": "Hey, don't put your feet on the table!",
    "options": [
      "pongas",
      "pongas tú",
      "pones",
      "pon"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the second-person singular Presente de Subjuntivo (no pongas). The affirmative irregular imperative 'pon' cannot be made negative by simply adding 'no' — the subjunctive form is always required for negative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) los cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "se abrochen",
      "abrocharse",
      "se abrochan",
      "abróchenlos"
    ],
    "correct": 0,
    "explanation": "Ustedes affirmative commands use the third-person plural Presente de Subjuntivo. Reflexive pronouns are placed before the verb in affirmative ustedes commands (unlike tú commands, where they attach to the end)."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Han llamado varias veces y no contesta. ___ (salir) a hacer recados.",
    "en": "They have called several times and she is not answering. She must have gone out to run errands.",
    "options": [
      "Saldrá",
      "Habría salido",
      "Habrá salido",
      "Haya salido"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) is used in Spanish to express probability or logical deduction about a past action from a present perspective — equivalent to 'must have done something' in English. This is distinct from the Condicional Compuesto, which is used for hypothetical past events."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
