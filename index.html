<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 12, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 12, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, not ESTAR. ESTAR indicates the location of physical objects or people, but for scheduled events, SER is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "será",
      "está",
      "estará"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for temporary states or conditions, and the temperature of food right now is a temporary, changeable condition. SER would imply the soup is inherently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo — siempre encuentra la solución a todo.",
    "en": "My grandfather is very clever — he always finds the solution to everything.",
    "options": [
      "está",
      "estaba",
      "es",
      "era"
    ],
    "correct": 2,
    "explanation": "With 'listo', SER means 'to be clever/smart' (an inherent characteristic), while ESTAR + listo means 'to be ready'. Since the sentence describes a permanent personality trait, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que perdió el trabajo, Ramón ___ muy aburrido en casa.",
    "en": "Since he lost his job, Ramón has been very bored at home.",
    "options": [
      "es",
      "fue",
      "era",
      "está"
    ],
    "correct": 3,
    "explanation": "ESTAR + aburrido means 'to feel bored' (a temporary emotional state), whereas SER + aburrido means 'to be a boring person' (a personality trait). Here the context describes how Ramón feels due to circumstances."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre me leía cuentos cada noche.",
    "en": "When I was little, my mother used to read me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto (era) is used for states and habitual actions in the past that had no defined end. 'Cuando era pequeña' describes a background condition, and 'leía' describes a repeated habit — both require imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo preparaba la cena, el teléfono ___.",
    "en": "While I was making dinner, the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "había sonado"
    ],
    "correct": 1,
    "explanation": "When one ongoing action (imperfecto: preparaba) is interrupted by a sudden, completed event, the interrupting action uses pretérito indefinido (sonó). The indefinido marks the new, punctual event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El verano pasado ___ tres veces a la playa de Tarifa.",
    "en": "Last summer I went to Tarifa beach three times.",
    "options": [
      "iba",
      "fui",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "Pretérito indefinido (fui) is used for completed actions in a closed, finished time period ('el verano pasado'). The number 'tres veces' also signals a counted, completed occurrence rather than a habit."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is a relative pronoun meaning 'what / that which' and is used when referring to an abstract or unnamed thing. 'Qué' (with accent) introduces direct or indirect questions, and bare 'que' is a conjunction — neither fits here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ vestido tan elegante llevas hoy, Sofía.",
    "en": "What an elegant dress you're wearing today, Sofía.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express admiration or surprise, equivalent to English 'What a...!'. It modifies a noun directly and always carries a written accent in this use."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque el proyecto tiene plazos imposibles.",
    "en": "Lately I stress myself out a lot because the project has impossible deadlines.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the 'yo y yo' pattern — the subject (yo) causes stress in themselves. Compare 'me estresan' (they stress me) or 'me estresa el tráfico' (traffic stresses me), where an external subject triggers the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hablas tan rápido, ___ y no puedo seguirte.",
    "en": "When you speak so fast, you confuse me and I can't follow you.",
    "options": [
      "me confundes",
      "me confundo",
      "te confundes",
      "me confunden"
    ],
    "correct": 0,
    "explanation": "'Me confundes' follows the 'yo y tú' pattern — a second person (tú) performs an action that affects the first person (me). The verb agrees with the subject 'tú' (confundes), and 'me' is the object pronoun."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "After a hypothetical 'si' clause with imperfecto de subjuntivo (tuviera), the main clause requires the condicional simple (haría). The future simple or 'voy a + infinitivo' cannot follow this type of hypothetical condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale a las ocho, así que ___ a la estación antes de las siete y media.",
    "en": "The train leaves at eight, so I'll get to the station before seven thirty.",
    "options": [
      "llegaría",
      "llegaba",
      "llegaré",
      "llegue"
    ],
    "correct": 2,
    "explanation": "Futuro simple (llegaré) expresses a real, planned intention for the future. Condicional (llegaría) implies a hypothetical or conditional scenario. 'Voy a llegar' is also valid for near plans, but from the options, futuro simple is the appropriate choice here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Crees que ___ bien trabajar desde casa todos los días?",
    "en": "Do you think it would be good to work from home every day?",
    "options": [
      "estará",
      "va a estar",
      "esté",
      "estaría"
    ],
    "correct": 3,
    "explanation": "The condicional (estaría) is used to speculate about hypothetical situations or to express a softened opinion. The question is not about a concrete future fact but about a theoretical scenario, so condicional is more appropriate than futuro."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que los empleados ___ sus ideas en las reuniones.",
    "en": "It's important that employees share their ideas in meetings.",
    "options": [
      "compartan",
      "comparten",
      "compartirán",
      "compartan con"
    ],
    "correct": 0,
    "explanation": "Impersonal expressions of necessity or importance (es importante que, es necesario que) trigger the subjuntivo in the dependent clause. The main clause has no specific subject making a personal statement, which is the classic trigger for present subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamo enseguida.",
    "en": "As soon as I get the results, I'll call you right away.",
    "options": [
      "tengo",
      "tendré",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require subjuntivo when referring to a future action that has not yet happened. Since the results haven't arrived yet, the present subjunctive (tenga) is required, not the present indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que tenga terraza.",
    "en": "I'm looking for an apartment that is near the subway and has a terrace.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown, hypothetical, or non-existent, the verb in the relative clause uses subjuntivo. Here the speaker is searching for an unspecified apartment, so its existence is not confirmed."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la puerta al salir — hay corriente de aire.",
    "en": "Please close the door when you leave — there's a draft.",
    "options": [
      "cierra",
      "cierras",
      "cierres",
      "cierre"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'cerrar' is 'cierra', which follows the third-person singular present indicative form for most verbs. The subjunctive form 'cierres' is used for negative commands (no cierres), not affirmative ones."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones antes del despegue.",
    "en": "Ladies and gentlemen, fasten your seatbelts before takeoff.",
    "options": [
      "abrochan",
      "abrochen",
      "abrochad",
      "abrocha"
    ],
    "correct": 1,
    "explanation": "The ustedes affirmative imperative is formed using the third-person plural of the present subjunctive (abrochen). In Latin America, 'ustedes' replaces both vosotros and the formal usted plural, making this the standard polite command form for groups."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevan tres horas sin dar señales de vida. ___ perdido el teléfono otra vez.",
    "en": "They've been out of contact for three hours. They must have lost their phone again.",
    "options": [
      "Han perdido",
      "Habrán perdido",
      "Habían perdido",
      "Hubieran perdido"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrán + participio) is used to express probability or deduction about something that may have already happened in the past. It is the future equivalent of 'must have done', expressing the speaker's inference rather than a confirmed fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
