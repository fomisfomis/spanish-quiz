<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 24, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 24, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el Parque Central este sábado.",
    "en": "The concert is at Central Park this Saturday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place. ESTAR expresses the physical location of objects or people, but for scheduled events, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente.",
    "en": "Don't touch that plate — it's very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, and heat is a temporary, changeable quality. SER would imply the plate is permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en cada situación.",
    "en": "My grandmother is very clever — she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, SER + listo/a means 'to be clever/smart' (an inherent trait), while ESTAR + listo/a means 'to be ready.' Context here points to an intellectual quality, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy débil.",
    "en": "After chemotherapy, the patient is very weak.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 2,
    "explanation": "ESTAR describes a state resulting from a change or circumstance, such as a medical condition. Using SER would suggest weakness is a permanent, defining characteristic of the person."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ niño, mi padre me leía cuentos todas las noches.",
    "en": "When I was a child, my father read me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past and for background states like age or descriptions. 'Era niño' describes a prolonged background state during which the repeated action took place."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras ___ por el parque, vi a mi ex con otra persona.",
    "en": "While I was walking through the park, I saw my ex with someone else.",
    "options": [
      "caminé",
      "camino",
      "caminaba",
      "caminara"
    ],
    "correct": 2,
    "explanation": "The Imperfecto describes an ongoing background action (walking) that was interrupted by a single completed event expressed in the Indefinido (vi). The structure 'mientras + Imperfecto' is a classic interrupted-action pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally submitted the report I had been preparing for weeks.",
    "options": [
      "entregaba",
      "entregué",
      "entregara",
      "entregaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed, bounded action at a specific point in time — here signalled by 'ayer' and 'por fin.' The Imperfecto would suggest an ongoing or habitual action rather than a finished one."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir.",
    "en": "I don't understand what you're trying to tell me.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' and it is used when there is no explicit noun antecedent. 'Que' alone would require a preceding noun, and 'qué' is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ película tan larga! No creía que fuera a terminar nunca.",
    "en": "What a long film! I didn't think it would ever end.",
    "options": [
      "Lo que",
      "Cómo",
      "Qué",
      "Que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to express surprise or strong emotion, often in the structure '¡Qué + noun/adjective!' It requires a written accent to distinguish it from the relative pronoun 'que.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con tanto trabajo y pocas horas de sueño.",
    "en": "Lately I stress a lot with so much work and few hours of sleep.",
    "options": [
      "me estresas",
      "te estresas",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject performs the action on themselves (Yo y yo pattern), the verb is conjugated in the first person with the reflexive pronoun 'me': yo me estreso. This differs from 'me estresas' (you stress me) or 'me estresa' (something stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "te estresas",
      "me estresa"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, one person causes an effect on another. Here, 'tú' is the subject causing stress to 'yo,' so the verb takes the second-person form with first-person object pronoun: me estresas."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ clases de pintura.",
    "en": "If I had more free time, I would take painting classes.",
    "options": [
      "tomaré",
      "tomo",
      "tomaría",
      "tome"
    ],
    "correct": 2,
    "explanation": "In hypothetical (contrary-to-fact) conditionals using 'si + Imperfecto de Subjuntivo,' the main clause takes the Condicional Simple. The Futuro Simple is reserved for real, likely conditions using 'si + Presente de Indicativo.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Cuando llegue a Madrid, ___ a mis primos que no he visto en años.",
    "en": "When I arrive in Madrid, I will visit my cousins whom I haven't seen in years.",
    "options": [
      "visitaría",
      "visito",
      "visitaré",
      "visitara"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for real, planned future events. After temporal conjunctions like 'cuando' referring to the future, Spanish uses the Subjuntivo (llegue), and the main clause takes the Futuro Simple to express a genuine intention."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan negras — ___ a llover en cualquier momento.",
    "en": "Look at those dark clouds — it's going to rain at any moment.",
    "options": [
      "lloverá",
      "va a llover",
      "llovería",
      "llueve"
    ],
    "correct": 1,
    "explanation": "'Voy/va a + infinitivo' expresses an imminent future event with present evidence or strong intention. When there is a visible, immediate cause for a prediction (the dark clouds), this periphrastic future is more natural than the simple Futuro."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los participantes ___ el formulario antes del viernes.",
    "en": "It is important that all participants complete the form before Friday.",
    "options": [
      "completan",
      "completen",
      "completarán",
      "completaron"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity, importance, or recommendation (es importante que, es necesario que) trigger the Subjuntivo in the subordinate clause. The indicative 'completan' would incorrectly present the action as a fact rather than a requirement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the test results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' referring to a future event require the Subjuntivo. When the action has not yet occurred at the time of speaking, the subordinate clause must use the present Subjuntivo, not the future indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as people say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creo que, no pienso que) require the Subjuntivo because they express doubt or denial of a proposition. The affirmative 'creo que' would take the indicative, but negation shifts it to Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la música — los vecinos ya se han quejado.",
    "en": "Please turn down the music — the neighbours have already complained.",
    "options": [
      "baja",
      "bajas",
      "bajen",
      "no bajas"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -ar verbs is formed with the third-person singular of the present indicative: baja (from bajar). This is distinct from the negative tú imperative, which uses the Subjuntivo: no bajes."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus teléfonos durante el despegue.",
    "en": "Ladies and gentlemen, please do not use your phones during takeoff.",
    "options": [
      "no usan",
      "no usáis",
      "no usen",
      "no usar"
    ],
    "correct": 2,
    "explanation": "The ustedes imperative — both affirmative and negative — is formed using the third-person plural of the Subjuntivo. For 'usar,' this gives 'usen.' In Latin American Spanish, 'ustedes' replaces 'vosotros' for all formal and informal plural address."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ salido ya a comprar.",
    "en": "He's not answering the phone. He must have already gone out shopping.",
    "options": [
      "Ha",
      "Habrá",
      "Haya",
      "Hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when seen from the present. It conveys speculation — equivalent to 'must have' or 'probably has' in English — rather than a certainty expressed by the Pretérito Perfecto."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
