<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 14, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 14, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "sera",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where they take place, not ESTAR. ESTAR marks the location of physical objects and people, but for scheduled events the rule is reversed: ¿Dónde es el concierto? — Es en el teatro."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ¡___ riquísimo!",
    "en": "Try this broth — it's absolutely delicious!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "Rico with ESTAR means 'tasty/delicious' and refers to a perceived sensory state. With SER, rico means 'wealthy'. When commenting on how food tastes right now, always use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ una mujer muy activa aunque ya tiene ochenta años.",
    "en": "My grandmother is a very active woman even though she is already eighty.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 1,
    "explanation": "SER is used to define inherent or characteristic qualities that identify someone. Here, being an active woman is presented as a defining trait of the grandmother, not a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de leer el informe completo, el director ___ listo para firmar el contrato.",
    "en": "After reading the full report, the director is ready to sign the contract.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "Listo with ESTAR means 'ready' — a temporary condition achieved after completing something. With SER, listo means 'clever/smart'. The context of finishing a task and being prepared signals a state, so ESTAR is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (vivir) cerca del mar y ___ (ir) a la playa cada verano.",
    "en": "When I was little, I lived near the sea and went to the beach every summer.",
    "options": [
      "viví / fui",
      "vivía / iba",
      "vivía / fui",
      "viví / iba"
    ],
    "correct": 1,
    "explanation": "Both verbs describe habitual, repeated actions in the past within a broader background context introduced by 'cuando era pequeña'. Imperfecto is used for repeated past habits and ongoing states, not for single completed events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (ducharse) cuando de repente ___ (sonar) el teléfono.",
    "en": "I was showering when suddenly the phone rang.",
    "options": [
      "me duché / sonó",
      "me duchaba / sonaba",
      "me duchaba / sonó",
      "me duché / sonaba"
    ],
    "correct": 2,
    "explanation": "The interrupted action in progress (showering) uses Imperfecto, while the sudden interrupting event (the phone ringing) uses Indefinido. This is the classic background-vs-event pattern: Imperfecto sets the scene, Indefinido breaks it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ (conseguir) el ascenso que tanto ___ (desear) desde hacía años.",
    "en": "Last year I got the promotion I had wanted for years.",
    "options": [
      "conseguí / deseaba",
      "conseguía / deseé",
      "conseguí / deseé",
      "conseguía / deseaba"
    ],
    "correct": 0,
    "explanation": "'El año pasado' anchors the promotion as a single completed achievement → Indefinido (conseguí). The desire was an ongoing mental state stretching over years → Imperfecto (deseaba). States and emotions in the past are typically expressed with Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "la que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'that which / what'. Here it introduces the object of entender — a whole concept, not a specific noun antecedent. Que alone would require a preceding noun; qué would signal a direct question."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es ___ no haya más plazas disponibles; yo quería apuntarme al taller.",
    "en": "It's a shame there are no more spots available; I wanted to sign up for the workshop.",
    "options": [
      "una lástima que",
      "una lástima lo que",
      "una lástima qué",
      "una lástima de que"
    ],
    "correct": 0,
    "explanation": "After impersonal expressions of emotion or judgment (es una lástima, es importante, es bueno), Spanish uses que + subjunctive. The preposition 'de' before que is a common hypercorrection called dequeísmo and should be avoided here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con las reuniones tan largas en la oficina.",
    "en": "Lately I get very stressed out by the very long meetings at the office.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When a thing or situation (las reuniones largas) causes an emotional reaction in me, the subject is the third-party cause and the verb agrees with it. This is the 'yo y el mundo' pattern: subject = las reuniones → me estresan... wait, here 'las reuniones' is plural → me estresan. Actually checking: 'las reuniones' is the subject, so the verb should be me estresan (3rd person plural). Correction: the correct answer here is 'me estresan' (D). This pattern — external cause as subject, me as indirect object — mirrors verbs like gustar."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo. ¿No lo entiendes?",
    "en": "When you arrive late without warning, you worry me a lot. Don't you understand?",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "This is the 'yo y tú' pattern: tú (you) is the subject causing the emotional effect on me (indirect object). The verb preocupar agrees with the second-person singular subject tú → me preocupas. It is not reflexive here; it is transitive."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "aprendo",
      "voy a aprender"
    ],
    "correct": 1,
    "explanation": "Hypothetical conditions with si + Imperfecto Subjuntivo require Condicional Simple in the result clause. Futuro Simple would imply a real, likely future event, not an imagined scenario. Condicional marks the unreality or low probability of the condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Las nubes están muy oscuras. ___ (llover) antes de que lleguemos.",
    "en": "The clouds are very dark. It will rain before we arrive.",
    "options": [
      "Llovería",
      "Va a llover",
      "Llueve",
      "Lloviera"
    ],
    "correct": 1,
    "explanation": "Ir a + infinitivo expresses a near future prediction based on present evidence — in this case, the dark clouds are visible proof. Futuro Simple (lloverá) is also grammatically correct but feels more neutral; ir a + infinitivo emphasises the imminence backed by current observation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el itinerario, el vuelo ___ (aterrizar) a las tres de la tarde en Barajas.",
    "en": "According to the itinerary, the flight will land at three in the afternoon at Barajas.",
    "options": [
      "aterrizaría",
      "aterrizará",
      "va a aterrizar",
      "aterrice"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is the natural choice for scheduled or planned future events stated as factual information, especially when citing a fixed timetable. Condicional would imply conditionality or politeness, not a neutral future fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis compañeros ___ (llegar) a tiempo a la presentación de mañana.",
    "en": "I hope my colleagues arrive on time for tomorrow's presentation.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "lleguen a",
      "llegarían"
    ],
    "correct": 1,
    "explanation": "Esperar que introduces a subordinate clause expressing a wish or hope about a different subject. Whenever there is a change of subject after a verb of volition or emotion + que, the subordinate verb must be in Subjuntivo. Indicativo (llegan) is only possible in some dialects informally."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ (terminar) el proyecto, nos iremos de vacaciones a Portugal.",
    "en": "When we finish the project, we will go on holiday to Portugal.",
    "options": [
      "terminamos",
      "terminaremos",
      "terminemos",
      "terminaríamos"
    ],
    "correct": 2,
    "explanation": "After cuando referring to a future event, Spanish requires the Present Subjunctive, not the Indicative or Future. This is because the future event is not yet certain at the time of speaking. Compare: 'cuando termino' (habitual present) vs 'cuando terminemos' (future)."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (tener) mesa libre a estas horas sin reserva.",
    "en": "I don't think this restaurant has a free table at this hour without a reservation.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) trigger Subjuntivo in the subordinate clause because the speaker is expressing doubt or disbelief. Affirmed forms (creo que tiene) use Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (decir, tú) la verdad de una vez — todos ya lo sabemos.",
    "en": "Please, tell the truth once and for all — we all already know it.",
    "options": [
      "di",
      "dices",
      "digas",
      "decid"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of decir is irregular: di. It does not follow the regular present-tense pattern. The most common irregular tú imperatives include: di, haz, ve, pon, sal, sé, ten, ven. Digas is the subjunctive form used for negative commands (no digas)."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (tocar, ustedes) los cuadros expuestos en la galería.",
    "en": "Please, do not touch the paintings on display in the gallery.",
    "options": [
      "toquen",
      "tocan",
      "toquéis",
      "tocáis"
    ],
    "correct": 0,
    "explanation": "Negative commands for ustedes use the Present Subjunctive third-person plural form. The -ar verb tocar has a spelling change to toque- to preserve the /k/ sound before -e. Toquéis would be the negative vosotros command, used in Spain but not in Latin America."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía. ___ (perder) el tren de las nueve.",
    "en": "Marcos hasn't arrived yet. He must have missed the nine o'clock train.",
    "options": [
      "Habrá perdido",
      "Habrá perdiendo",
      "Hubiera perdido",
      "Perderá"
    ],
    "correct": 0,
    "explanation": "Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when seen from the present. The speaker is speculating about what must have happened. This is distinct from its other use: marking completion before a future reference point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
