<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 26, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 26, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de Carmen ___ en el jardín del hotel, así que todos llevaron paraguas por si acaso.",
    "en": "Carmen's wedding was in the hotel garden, so everyone brought an umbrella just in case.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "Events and their locations use SER, not ESTAR. Even though location usually triggers ESTAR, when we specify where an event takes place, the verb is SER. 'Fue' (preterite of SER) is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese chile — ___ muy picante. O bueno, igual te gusta así.",
    "en": "Don't touch that chili pepper — it's very spicy. Well, maybe you like it that way.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Inherent, defining characteristics of things use SER. The spiciness of a chili pepper is considered an intrinsic quality of that type of food, so 'es' is correct, unlike temporary states which take ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres días sin dormir, el director ___ listo para firmar cualquier cosa con tal de terminar.",
    "en": "After going three days without sleep, the director was ready to sign anything just to be done.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "'Listo' changes meaning depending on the verb: SER + listo means 'to be clever/intelligent' (a permanent trait), while ESTAR + listo means 'to be ready' (a temporary state). Here the context of readiness demands ESTAR, in the imperfect for a background state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba el caldo — ___ rico con el jengibre que le eché.",
    "en": "Taste the broth — it's delicious with the ginger I added.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "'Rico' with SER means 'wealthy' (a permanent trait), but with ESTAR it means 'delicious' or 'tasty', describing a sensory experience in the moment. Since we're evaluating the broth right now after tasting it, ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cada verano, mi abuela ___ pan en el horno de leña antes de que amaneciera.",
    "en": "Every summer, my grandmother baked bread in the wood-fired oven before dawn.",
    "options": [
      "horneó",
      "horneaba",
      "había horneado",
      "hornea"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past, especially when signaled by expressions like 'cada verano' (every summer). The indefinido would imply a single, completed event rather than a routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma del edificio.",
    "en": "I was reading calmly when the building alarm suddenly went off.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the imperfecto ('leía') and the interrupting event uses the indefinido ('sonó'). The imperfecto sets the scene; the indefinido cuts into it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la propuesta que llevábamos meses preparando.",
    "en": "Yesterday we finally submitted the proposal we had been preparing for months.",
    "options": [
      "entregábamos",
      "entregamos",
      "entregáramos",
      "entreguemos"
    ],
    "correct": 1,
    "explanation": "The indefinido ('entregamos') marks a single, completed action at a specific point in time, here signaled by 'ayer' (yesterday) and 'por fin' (finally). The imperfecto would wrongly suggest an ongoing or habitual action rather than a concluded event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ te molesta tanto de su comentario — a mí me pareció inofensivo.",
    "en": "I don't understand what bothers you so much about their comment — it seemed harmless to me.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'that which' or 'what', and is used when the whole clause acts as a noun (here, the object of 'entiendo'). 'Que' alone would need an antecedent, and 'qué' with an accent is used in direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese puesto — te lo mereces después de todo el esfuerzo.",
    "en": "How great that you got that position — you deserve it after all the effort.",
    "options": [
      "Lo que",
      "Cómo",
      "Qué",
      "Que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory sentences to intensify adjectives or adverbs, equivalent to 'how' or 'what a' in English. 'Qué bien' is a fixed exclamatory structure expressing enthusiasm or approval."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la autopista, ___ muchísimo y llego al trabajo de mal humor.",
    "en": "When there's a lot of traffic on the highway, it stresses me out a lot and I arrive at work in a bad mood.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When an external, impersonal cause (like 'el tráfico') produces a feeling in the speaker, the verb agrees with that cause, not the speaker. 'El tráfico me estresa' follows the pattern of 'me gusta' — the subject is the stressor, and 'me' is the indirect object."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ tanto que luego me arrepiento de lo que digo.",
    "en": "Whenever we argue, I get so worked up that I later regret what I say.",
    "options": [
      "me alteras",
      "me altero",
      "me altera",
      "nos alteramos"
    ],
    "correct": 1,
    "explanation": "'Me altero' is the true reflexive use — the subject (yo) performs the action on themselves, meaning 'I get worked up / I lose my temper'. This is the 'yo y yo' pattern where the subject and the object are the same person."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ un especialista externo para el proyecto.",
    "en": "If we had more budget, we would hire an external specialist for the project.",
    "options": [
      "contrataríamos",
      "contrataremos",
      "vamos a contratar",
      "contratemos"
    ],
    "correct": 0,
    "explanation": "In hypothetical conditional sentences with 'si + imperfecto de subjuntivo', the main clause requires the condicional simple. This structure expresses an unreal or unlikely condition in the present or future, making 'contrataremos' (futuro) grammatically incompatible."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ lluvias fuertes en el norte del país.",
    "en": "According to the forecast, there will be heavy rain in the north of the country tomorrow.",
    "options": [
      "habría",
      "habrá",
      "va a haber",
      "haya"
    ],
    "correct": 1,
    "explanation": "Both 'habrá' (futuro simple) and 'va a haber' can express future events, but 'habrá' is preferred in more formal or reported contexts like weather forecasts. The condicional 'habría' is reserved for hypothetical or reported speech situations, not direct future predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que el paquete ___ el jueves, pero ya es viernes y no ha llegado.",
    "en": "They told me the package would arrive on Thursday, but it's already Friday and it hasn't come.",
    "options": [
      "llegará",
      "llegaba",
      "llegaría",
      "llegue"
    ],
    "correct": 2,
    "explanation": "The condicional is used for the future-in-the-past — to express what was expected to happen from the perspective of a past moment ('me dijeron'). This is called 'futuro del pasado' and is the equivalent of 'would' in reported speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El cliente insiste en que el informe ___ listo antes del mediodía del viernes.",
    "en": "The client insists that the report be ready before noon on Friday.",
    "options": [
      "está",
      "estará",
      "esté",
      "estaría"
    ],
    "correct": 2,
    "explanation": "Verbs of insistence, desire, or demand (insistir en que, querer que, pedir que) trigger the subjuntivo in the subordinate clause when the subject changes. 'Esté' is the present subjuntivo of ESTAR, used here because the client's insistence is expressing a wish about another party."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis, por favor.",
    "en": "Call me as soon as you get the test results, please.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tuvieras"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' referring to a future action, the subjuntivo is required. The indicative 'tienes' would only be used when referring to a habitual present situation, not a future event."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que Rodrigo ___ tiempo para venir a la cena con todo lo que tiene en el trabajo.",
    "en": "I don't think Rodrigo has time to come to the dinner with everything he has going on at work.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que, no parecer que) trigger the present subjuntivo because the speaker is casting doubt or denying the reality of the subordinate clause. Affirmative 'creo que' would take the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — creo que te has dejado las llaves en la mesa.",
    "en": "Hey, wait a moment — I think you left your keys on the table.",
    "options": [
      "esperas",
      "espera",
      "no esperes",
      "espere"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -AR verbs is formed using the third person singular of the present indicative. 'Espera' is the correct tú command. 'Espere' would be the formal usted command, and 'no esperes' is the negative subjunctive form."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el formulario sin leerlo todo — hay cláusulas que no son nada favorables.",
    "en": "Don't sign the form without reading it all — there are some clauses that aren't at all favorable.",
    "options": [
      "firmes",
      "firma",
      "firme",
      "firmas"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the present subjuntivo with 'no'. For -AR verbs, this means the tú subjuntivo ending -es: 'no firmes'. The affirmative imperative 'firma' cannot be used in negative commands — the form changes entirely."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Sonia todavía no ha contestado. ___ perdido el teléfono otra vez.",
    "en": "It's eleven at night and Sonia still hasn't replied. She must have lost her phone again.",
    "options": [
      "Habrá perdido",
      "Habrá estado perdiendo",
      "Perdería",
      "Hubiera perdido"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past — equivalent to 'must have' in English. It is distinct from the condicional compuesto, which is used in hypothetical past contexts."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
