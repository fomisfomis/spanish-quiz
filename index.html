<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 28, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 28, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to indicate where they take place, even though location normally triggers ESTAR. This is one of the most common tricky cases: SER is used for the location of events, while ESTAR is used for the location of people and objects."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tanto trabajo, el chef ___ listo para presentar el plato final.",
    "en": "After so much work, the chef is ready to present the final dish.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready' (a temporary state or condition), while SER + listo means 'to be clever or smart' (a permanent characteristic). Context here — finishing a task and being prepared — clearly points to the temporary state, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este mango recién cortado ___ riquísimo. No puedo parar de comerlo.",
    "en": "This freshly cut mango is absolutely delicious. I can't stop eating it.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a expresses how something tastes right now — a sensory, temporary experience. SER + rico/a would mean the food is inherently, objectively high-quality or that a person is wealthy. When commenting on how food tastes in the moment, always use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecina ___ viuda desde hace tres años, pero ahora está saliendo con alguien.",
    "en": "My neighbor has been a widow for three years, but now she is dating someone.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 0,
    "explanation": "Although widowhood might seem like a fixed social status suggesting SER, Spanish uses ESTAR + viudo/a to describe it as a life circumstance or state resulting from a change — someone became a widow, which implies a transition. Civil and social states resulting from change (divorciado, casado, muerto, viudo) use ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, mi abuelo siempre me ___ cuentos antes de dormir.",
    "en": "When I was a child, my grandfather always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The imperfect (contaba) is used for habitual or repeated actions in the past, especially when accompanied by frequency markers like 'siempre'. The indefinido (contó) would describe a single completed event. Here, the storytelling was a repeated childhood routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un documento importante cuando el ordenador se apagó de repente.",
    "en": "I was writing an important document when the computer suddenly shut down.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "había escrito"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the imperfect (escribía) and the sudden interrupting event uses the indefinido (se apagó). The imperfect sets the scene; the indefinido breaks into it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El tren ___ a las 8:47 exactamente y todos corrimos al andén.",
    "en": "The train arrived at exactly 8:47 and everyone ran to the platform.",
    "options": [
      "llegaba",
      "llegó",
      "ha llegado",
      "hubiera llegado"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido (llegó) expresses a single, completed event at a precise moment in the past — reinforced here by the exact time '8:47'. The imperfect would suggest a habitual or ongoing action. When an action is pinpointed in time and clearly finished, use the indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ tanto te molesta de ese comentario.",
    "en": "I don't understand what bothers you so much about that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a nominalizer meaning 'what' or 'the thing that,' and is used when the relative pronoun introduces a noun clause referring to something undefined or general. Que alone would need a clear antecedent, and qué (with accent) introduces a direct question or exclamation, not a subordinate clause like this one."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ bien huele esta panadería! Tengo que comprar algo.",
    "en": "How good this bakery smells! I have to buy something.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "Qué (with accent mark) is used in exclamatory sentences to express admiration, surprise, or strong emotion, equivalent to 'how' or 'what a' in English. Without the accent, que is a conjunction or relative pronoun and cannot introduce an exclamation like this."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ muchísimo porque tengo demasiados proyectos a la vez.",
    "en": "Lately I stress a lot because I have too many projects at once.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "When the subject and the object of the stress are the same person (I stress myself), the verb is truly reflexive: yo me estreso. Me estresas would mean 'you stress me out' (subject = tú), and me estresa would require an external subject like 'el trabajo'. Here the speaker is both agent and recipient."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hablas en voz alta durante las películas, ___ muchísimo.",
    "en": "Every time you talk loudly during movies, you irritate me a lot.",
    "options": [
      "me irrito",
      "te irritas",
      "me irritas",
      "nos irritamos"
    ],
    "correct": 2,
    "explanation": "Me irritas follows the 'yo y tú' pattern: tú (subject) me (object = yo) irritas. The action comes from one person and affects another. Me irrito would mean the speaker irritates themselves; te irritas would mean 'you get irritated.' The structure [tú] + me + verbo is key here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ a tres nuevos empleados el mes que viene.",
    "en": "If we had more budget, we would hire three new employees next month.",
    "options": [
      "contrataremos",
      "contratamos",
      "contrataríamos",
      "vamos a contratar"
    ],
    "correct": 2,
    "explanation": "Hypothetical si-clauses in the past subjunctive (si tuviéramos) require the conditional (contrataríamos) in the result clause — this is the standard structure for unreal or unlikely conditions. The future simple or 'vamos a + infinitivo' are used for real, anticipated events, not hypotheticals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes — el técnico ___ antes de las cinco para arreglar el router.",
    "en": "Don't worry — the technician will come before five o'clock to fix the router.",
    "options": [
      "vendría",
      "vendrá",
      "va a venir",
      "venga"
    ],
    "correct": 2,
    "explanation": "Both vendrá (futuro simple) and va a venir (perífrasis) are correct for real future plans, but va a venir is preferred in spoken Spanish for near-future events that are already arranged or expected. Vendría (conditional) would imply uncertainty or a hypothetical. The context — reassuring someone about a confirmed appointment — favors the perífrasis."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mi jefa dijo que ___ los resultados del informe antes del viernes.",
    "en": "My boss said she would share the report results before Friday.",
    "options": [
      "compartirá",
      "comparte",
      "compartirá",
      "compartiría"
    ],
    "correct": 3,
    "explanation": "When reporting what someone said about a future action (indirect speech in the past), Spanish uses the conditional (compartiría) where English uses 'would.' The future simple (compartirá) is used for direct statements about the future, not for indirect speech anchored in a past verb like 'dijo.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho vasos de agua al día.",
    "en": "The doctor recommends that you drink at least eight glasses of water a day.",
    "options": [
      "bebes",
      "beber",
      "bebas",
      "beberás"
    ],
    "correct": 2,
    "explanation": "Verbs of recommendation, advice, and influence (recomendar, sugerir, aconsejar) trigger the subjunctive in the subordinate clause when the subject changes. The structure is: verbo de influencia + que + subjuntivo. Bebes (indicative) and beberás (future) cannot follow 'que' in this dependency."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tuvieras"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions referring to a future moment — en cuanto, cuando, hasta que, tan pronto como — require the present subjunctive, not the future indicative. Even though we think of this as a future event, Spanish grammar uses the subjunctive to express that the moment has not yet arrived."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ cocina japonesa y sepa trabajar bajo presión.",
    "en": "They are looking for someone who knows Japanese cuisine and can work under pressure.",
    "options": [
      "conoce",
      "conocerá",
      "conozca",
      "conociera"
    ],
    "correct": 2,
    "explanation": "When the antecedent of a relative clause is indefinite or hypothetical — 'someone who may or may not exist' — the subjunctive is required. Here, the company doesn't have a specific person in mind yet, so alguien que conozca (subjunctive) expresses the desired but unidentified candidate. If they had already found the person, indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ la puerta antes de salir, por favor! Hace mucho frío afuera.",
    "en": "Close the door before you leave, please! It's very cold outside.",
    "options": [
      "Cierras",
      "Cerrar",
      "Cierra",
      "Cierres"
    ],
    "correct": 2,
    "explanation": "For affirmative tú commands, the imperative form is typically the same as the third-person singular of the present indicative (él/ella form): cierra. Cierres is the present subjunctive, used only in negative commands (no cierres). Cierras is the indicative and cerrar is the infinitive — neither functions as a command."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el teléfono durante la cena. Es una norma de la casa.",
    "en": "Don't use your phone during dinner. It's a house rule.",
    "options": [
      "usa",
      "usar",
      "usas",
      "uses"
    ],
    "correct": 3,
    "explanation": "Negative tú commands are formed with no + present subjunctive, not the affirmative imperative form. The affirmative command is 'usa,' but to negate it, you must switch to the subjunctive: 'no uses.' This is a fundamental distinction — affirmative and negative tú commands use different verb forms."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Valentina no contesta los mensajes desde ayer. ___ perdido el móvil otra vez.",
    "en": "Valentina hasn't replied to messages since yesterday. She must have lost her phone again.",
    "options": [
      "Habrá perdido",
      "Habrá perdiendo",
      "Hubiera perdido",
      "Perderá"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used not only to describe actions completed before a future point, but also to express probability or deduction about something that likely happened in the recent past. This is equivalent to English 'she must have...' and is a common use in everyday spoken Spanish."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
