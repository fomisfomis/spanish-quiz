<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 17, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 17, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though SER typically expresses permanent traits. ESTAR is used for the location of physical objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante para los niños.",
    "en": "Don't touch that sauce — it's very spicy for the kids.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "When describing an inherent or characteristic quality of something (like a sauce being inherently spicy by nature), SER is used. ESTAR would imply the spiciness is a temporary or unexpected state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado! El suelo ___ mojado después de la lluvia.",
    "en": "Careful! The floor is wet after the rain.",
    "options": [
      "es",
      "está",
      "sera",
      "estará"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the floor being wet is a temporary condition caused by an external event (the rain), not a defining characteristic of the floor."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino siempre contaba chistes, pero hoy ___ muy aburrido — no dijo nada.",
    "en": "My neighbor always told jokes, but today he was very boring — he didn't say anything.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "The adjective 'aburrido' with ESTAR means 'boring (on this occasion)' as a temporary behavior, while with SER it means 'a boring person by nature.' Because the context is a one-time departure from his usual self, ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (vivir) en un pueblo cerca del mar.",
    "en": "When I was little, I used to live in a village near the sea.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing states in the past with no defined endpoint. 'Cuando era pequeña' signals an extended background period, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Me ___ (duchar) cuando de repente sonó el teléfono.",
    "en": "I was showering when the phone suddenly rang.",
    "options": [
      "duché",
      "duchaba",
      "he duchado",
      "duchara"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the ongoing background action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Duchaba' sets the scene; 'sonó' is the sudden event that broke it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, María ___ (conseguir) un ascenso en su trabajo.",
    "en": "Last year, María got a promotion at work.",
    "options": [
      "conseguía",
      "consiguió",
      "ha conseguido",
      "consiga"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed, one-time events with a clear beginning and end. 'El año pasado' is a specific closed time frame, which triggers the Indefinido, not the Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir.",
    "en": "I don't understand what you are trying to tell me.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' referring to an entire concept or thing. 'Que' alone is a simple connector and cannot stand in as the object of 'entender' without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "Ella insistió en ___ la reunión empezara a las nueve en punto.",
    "en": "She insisted that the meeting start at nine o'clock sharp.",
    "options": [
      "lo que",
      "que",
      "qué",
      "cual"
    ],
    "correct": 1,
    "explanation": "After verbs of insistence like 'insistir en,' the conjunction 'que' introduces a subordinate clause. The preposition 'en' belongs to the main verb and does not merge with 'que' in this structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ (estresarse) mucho con los plazos del proyecto.",
    "en": "Lately I have been getting very stressed about the project deadlines.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 0,
    "explanation": "When the subject and the experiencer are the same person (yo), the reflexive pronoun 'me' is used and the verb conjugates in first person: 'me estreso.' This is the Yo y yo pattern — the self causes the feeling in itself."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ (preocupar) muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the Yo y tú pattern, a second person (tú) causes a feeling in the speaker (yo). The verb agrees with the subject 'tú' — 'preocupas' — while 'me' marks who experiences the worry."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses that use the Imperfecto de Subjuntivo in the condition, the main clause requires the Condicional Simple to express an imagined or unreal outcome."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Espera, ya te lo explico — ___ (voy a explicar / explicaré) todo en detalle ahora mismo.",
    "en": "Wait, I'll explain it to you — I'm going to explain everything in detail right now.",
    "options": [
      "explicaría",
      "explicaré",
      "voy a explicar",
      "explique"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for intentions or plans decided at the moment of speaking, especially when combined with an adverb like 'ahora mismo.' The Futuro Simple suits predictions or more distant plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) todo el día en la costa.",
    "en": "According to the forecast, it will rain all day on the coast tomorrow.",
    "options": [
      "llovería",
      "va a llover",
      "llueve",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "The Futuro Simple is used for objective predictions or forecasts about a defined future moment. While 'va a llover' is also acceptable colloquially, 'lloverá' is the standard choice for reported predictions based on evidence like a forecast."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' referring to a future event, Spanish requires the Subjuntivo, not the Indicativo. The future moment is hypothetical until it happens."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una lástima que el museo ___ (estar) cerrado los lunes.",
    "en": "It's a shame that the museum is closed on Mondays.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions that convey emotion or value judgment ('es una lástima,' 'es bueno,' 'es importante') trigger the Subjuntivo in the subordinate clause, because the speaker is reacting subjectively to a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que esta decisión ___ (ser) la correcta para todos.",
    "en": "I don't think this decision is the right one for everyone.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creo que,' 'no pienso que') require the Subjuntivo because the speaker is distancing themselves from asserting the truth of the subordinate clause."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (decir, tú) la verdad — ya no hay tiempo para excusas.",
    "en": "Please, tell the truth — there's no more time for excuses.",
    "options": [
      "dices",
      "di",
      "diga",
      "decid"
    ],
    "correct": 1,
    "explanation": "'Di' is the irregular affirmative tú imperative of 'decir.' Many common verbs have one-syllable irregular imperatives (di, haz, pon, sal, sé, ten, ven, ve), which must be memorized as they do not follow the standard pattern."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (tocar, tú) esos cables — pueden ser peligrosos.",
    "en": "Don't touch those cables — they can be dangerous.",
    "options": [
      "tocas",
      "toques",
      "toca",
      "toque"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present Subjuntivo: 'no toques.' The affirmative tú imperative ('toca') cannot be used with 'no' — the negative always switches to the subjunctive form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No veo las llaves por ningún lado. Las ___ (dejar) en la oficina.",
    "en": "I can't find the keys anywhere. I must have left them at the office.",
    "options": [
      "dejaré",
      "dejé",
      "habré dejado",
      "habría dejado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto ('habré + participio') is used to express probability or deduction about a past event as seen from the present moment. It is the equivalent of 'must have done something' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
