<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 11, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 11, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio municipal esta noche.",
    "en": "The concert is at the municipal stadium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "The location of events uses SER, not ESTAR. ESTAR expresses where physical objects or people are, but SER is used to indicate where an event takes place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de estudiar toda la noche, Miguel ___ listo para el examen.",
    "en": "After studying all night, Miguel is ready for the exam.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, ESTAR + listo means 'ready', while SER + listo means 'clever/smart'. Since Miguel prepared and is now in a state of readiness, ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Esa fruta tropical ___ riquísima — nunca había probado nada igual.",
    "en": "That tropical fruit is delicious — I had never tasted anything like it.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means 'tastes/smells delicious' and refers to a sensory experience in the moment. SER + rico/a would mean 'wealthy' or describe an inherent characteristic of something."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy activa para sus ochenta años — todavía sale a caminar cada mañana.",
    "en": "My grandmother is very active for her eighty years — she still goes out for a walk every morning.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 1,
    "explanation": "When describing a characteristic that defines someone's personality or nature over time, SER is used. Although age might suggest change, here the speaker is defining her as an active person, not describing a temporary state."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (ir) al mercado con mi madre todos los sábados.",
    "en": "When I was a child, I used to go to the market with my mother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past with no defined endpoint. The phrase 'todos los sábados' signals a routine, making Imperfecto the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ (sonar) el teléfono.",
    "en": "I was reading the report calmly when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "hubiera sonado"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the background action uses Imperfecto (leía) and the interrupting event uses Pretérito Indefinido. The phone ringing is the sudden completed event that interrupts the ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ (visitar, nosotros) tres países durante las vacaciones de verano.",
    "en": "Last year we visited three countries during the summer holidays.",
    "options": [
      "visitábamos",
      "visitamos",
      "hemos visitado",
      "visitaríamos"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido is used for completed actions with a defined time frame. 'El año pasado' marks a specific, finished period, so the action is presented as a single completed event, not a habit."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás queriendo decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what', replacing an entire idea. It is used when there is no specific noun antecedent — the speaker refers to the whole meaning of what is being said."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien ___ te haya salido la entrevista — te lo mereces.",
    "en": "How great that the interview went well for you — you deserve it.",
    "options": [
      "Lo que / que",
      "Qué / que",
      "Que / que",
      "Cómo / que"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to intensify a quality or emotion, equivalent to 'how' or 'what a' in English. The second 'que' introduces the subordinate clause after the exclamative structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo que hablar en público.",
    "en": "Lately I get very nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "te pongo nervioso",
      "me pones nervioso",
      "se pone nervioso"
    ],
    "correct": 0,
    "explanation": "The 'yo y yo' pattern describes an internal state that arises within oneself, with no external agent causing it. 'Me pongo nervioso' means the subject experiences the emotion by themselves, not because of another person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you worry me a great deal.",
    "options": [
      "me preocupo",
      "te preocupas",
      "me preocupas",
      "se preocupa"
    ],
    "correct": 2,
    "explanation": "The 'yo y tú' pattern is used when a second person (tú) causes an emotion in the speaker (me). 'Me preocupas' means 'you [tú] worry me [yo]', with the verb agreeing with the subject tú and the indirect object pronoun me indicating who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si consiguiera ese ascenso, ___ (poder) comprarme un apartamento propio.",
    "en": "If I got that promotion, I would be able to buy my own apartment.",
    "options": [
      "podré",
      "puedo",
      "podría",
      "voy a poder"
    ],
    "correct": 2,
    "explanation": "In hypothetical conditional sentences with 'si + imperfecto de subjuntivo', the main clause requires the Condicional Simple. This structure expresses an unlikely or imagined condition and its hypothetical consequence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ (llover) bastante esta semana en el norte del país.",
    "en": "According to the forecast, it will rain quite a lot this week in the north of the country.",
    "options": [
      "llovería",
      "va a llover",
      "llueve",
      "lloviera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (ir a + infinitivo) is preferred in spoken Spanish for planned or predicted near-future events, especially when there is external evidence like a forecast. Futuro Simple also works but sounds more formal."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que el nuevo proyecto ___ (comenzar) en enero del año que viene.",
    "en": "The director said that the new project would begin in January of next year.",
    "options": [
      "comenzará",
      "comenzaría",
      "comienza",
      "haya comenzado"
    ],
    "correct": 1,
    "explanation": "When reporting future plans from the perspective of a past-tense reporting verb (dijo), Spanish uses the Condicional Simple, not Futuro Simple. The Condicional acts as the 'future in the past' in indirect speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ (entregar) los formularios antes del viernes.",
    "en": "It is essential that all employees hand in the forms before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregarían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance like 'es fundamental que' trigger the Subjuntivo in the subordinate clause because they express a subjective judgment about what should happen, not an objective fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el tren ___ (llegar) a tiempo con este temporal de nieve.",
    "en": "I don't think the train will arrive on time in this snowstorm.",
    "options": [
      "llega",
      "llegue",
      "llegará",
      "llegaría"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' require the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial about the truth of the statement. Affirmative 'creo que' would use Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar, tú) de cocinar, pon la mesa, por favor.",
    "en": "As soon as you finish cooking, set the table, please.",
    "options": [
      "terminas",
      "termines",
      "terminaste",
      "terminarás"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' referring to future events require the Subjuntivo. Even though the action feels certain, it hasn't happened yet at the time of speaking."
  },
  {
    "topic": "Imperativo",
    "q": "___ (decir, tú) la verdad — te prometo que no me voy a enfadar.",
    "en": "Tell the truth — I promise I won't get angry.",
    "options": [
      "Di",
      "Dices",
      "Digas",
      "Decir"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'decir' is irregular: 'di'. It follows the pattern of monosyllabic irregular imperatives (di, haz, ve, pon, sal, sé, ten, ven). The negative would be 'no digas', using the subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, ustedes) — ya hemos reservado todo para la excursión.",
    "en": "Don't worry — we have already booked everything for the excursion.",
    "options": [
      "se preocupen",
      "se preocuparán",
      "preocúpense",
      "se preocupan"
    ],
    "correct": 0,
    "explanation": "Negative imperatives in all persons are formed with the Subjuntivo. For 'ustedes' with reflexive verbs in the negative, the pronoun 'se' precedes the verb: 'no se preocupen'. Affirmative would attach the pronoun: 'preocúpense'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "— ¿Por qué no ha llegado Ana todavía? — No sé, ___ (perder) el autobús otra vez.",
    "en": "— Why hasn't Ana arrived yet? — I don't know, she must have missed the bus again.",
    "options": [
      "habrá perdido",
      "habría perdido",
      "hubiera perdido",
      "habrá perdiendo"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that happened in the recent past. It is equivalent to 'must have + past participle' in English and signals that the speaker is making an educated guess."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
