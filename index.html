<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 25, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 25, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de música ___ en el parque central este fin de semana.",
    "en": "The music festival is in the central park this weekend.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, not ESTAR. ESTAR indicates where objects or people are physically located, but scheduled events (festivals, concerts, weddings) always use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary conditions and states, including temperature at a given moment. SER + caliente would imply an inherent, permanent quality, which rarely applies to food temperature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuidado con ese hombre — dicen que ___ muy listo y te puede engañar fácilmente.",
    "en": "Be careful with that man — they say he is very clever and can trick you easily.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + listo means 'to be clever/smart' as a personality trait. ESTAR + listo, by contrast, means 'to be ready.' This is one of the adjectives whose meaning shifts depending on which verb accompanies it."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este vino tinto — ___ riquísimo con el queso manchego.",
    "en": "Try this red wine — it's absolutely delicious with Manchego cheese.",
    "options": [
      "es",
      "está",
      "es que",
      "está siendo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a expresses how something tastes in the moment of eating or drinking it. SER + rico/a, on the other hand, means 'to be wealthy.' When talking about flavor experienced right now, always use ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially with frequency markers like 'siempre.' The Indefinido would imply a single, completed event rather than a regular childhood routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente por el parque cuando de repente empezó a llover a cántaros.",
    "en": "I was walking calmly through the park when it suddenly started to pour.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes the background action in progress (caminar) that was interrupted by a sudden completed event (empezó a llover), expressed in the Indefinido. 'De repente' is a classic signal for the interrupting action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "firma",
      "ha firmado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed, one-time event in the past with a clear time reference ('el año pasado'). The Imperfecto would suggest a habitual or ongoing action, which doesn't fit a singular business milestone."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ te pone tan nervioso en las reuniones de trabajo.",
    "en": "I don't understand what makes you so nervous in work meetings.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizing relative pronoun meaning 'what / the thing that,' equivalent to 'that which.' It is used when there is no specific antecedent noun — it refers to an undefined thing or idea."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien huele este pan recién horneado, ¿verdad?",
    "en": "How good this freshly baked bread smells, doesn't it?",
    "options": [
      "Lo que",
      "El que",
      "Qué",
      "Que"
    ],
    "correct": 2,
    "explanation": "Qué with an accent mark is used in exclamatory sentences to express surprise or strong emotion, equivalent to 'how' or 'what a' in English. Without the accent, 'que' is a conjunction and cannot introduce exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hay atasco en la autopista, ___ muchísimo.",
    "en": "Whenever there is a traffic jam on the highway, I get really stressed.",
    "options": [
      "me estresas",
      "me estresa",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "When the subject causing the stress is 'yo' (the speaker themselves reacting to a situation), you use the first-person reflexive: me estreso. This is the 'Yo y yo' pattern — the subject and the object of the action are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "This is the 'Yo y tú' pattern: a second-person subject (tú) is acting upon a first-person object (me). The verb conjugates for tú (estresas) while the reflexive pronoun me signals who receives the effect."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tomé",
      "tome"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple is required in the main clause of hypothetical 'si + Imperfecto de Subjuntivo' constructions. The Futuro Simple cannot be used here because the condition is contrary to current reality."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en el sur del país.",
    "en": "According to the forecast, tomorrow it will be very hot in the south of the country.",
    "options": [
      "haría",
      "haga",
      "hará",
      "va a hacer"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for objective predictions and forecasts based on external evidence. While 'va a hacer' is also possible in spoken Spanish, the Futuro Simple is more formal and is the standard choice in weather forecasts."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Hemos decidido que ___ a Japón el próximo verano para celebrar nuestro aniversario.",
    "en": "We have decided that we are going to Japan next summer to celebrate our anniversary.",
    "options": [
      "iremos",
      "iríamos",
      "vamos a ir",
      "vayamos"
    ],
    "correct": 2,
    "explanation": "'Vamos a + infinitivo' (ir a + infinitivo) expresses a planned future action with clear intention and prior decision-making. It is preferred over the Futuro Simple when the action has already been arranged or decided."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis colegas ___ el informe antes del mediodía.",
    "en": "I hope my colleagues finish the report before noon.",
    "options": [
      "terminan",
      "terminen",
      "terminaron",
      "terminarán"
    ],
    "correct": 1,
    "explanation": "After verbs of wishing or hoping like 'esperar que,' the Subjuntivo is mandatory when the subject of the main clause differs from the subject of the subordinate clause. The Indicativo cannot be used here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo inmediatamente.",
    "en": "As soon as I get the test results, I'll call you immediately.",
    "options": [
      "recibo",
      "recibiré",
      "reciba",
      "recibí"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when they refer to a future action that has not yet occurred. The Indicativo is only used when referring to habitual or past situations."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el código de seguridad antes de entrar al laboratorio.",
    "en": "It is essential that all employees enter the security code before entering the laboratory.",
    "options": [
      "introducen",
      "introduzcan",
      "introducirán",
      "introdujeron"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance ('es fundamental que,' 'es necesario que,' 'es importante que') always trigger the Subjuntivo in the dependent clause, since they express a subjective judgment rather than a fact."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ de hablar tanto en clase — el profesor ya está harto.",
    "en": "Hey, stop talking so much in class — the teacher is already fed up.",
    "options": [
      "para",
      "pare",
      "pares",
      "no pares"
    ],
    "correct": 0,
    "explanation": "The affirmative tú command of 'parar' is 'para,' which is the third-person singular of the Presente de Indicativo. Only negative tú commands use the Subjuntivo form (no pares). Here the command is affirmative."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, por favor no ___ los teléfonos durante el despegue.",
    "en": "Ladies and gentlemen, please do not use your phones during takeoff.",
    "options": [
      "usen",
      "usan",
      "usar",
      "usad"
    ],
    "correct": 0,
    "explanation": "Negative ustedes commands use the third-person plural of the Presente de Subjuntivo. For formal commands (ustedes), both affirmative and negative forms are identical and drawn from the Subjuntivo, unlike tú commands which differ by polarity."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Nadie contesta en la oficina. ___ salido todos a comer ya.",
    "en": "Nobody is answering at the office. They must have already gone out for lunch.",
    "options": [
      "Habrán",
      "Habían",
      "Han",
      "Hubieran"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrán + participio) is used to express probability or deduction about a past event from the speaker's present perspective. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
