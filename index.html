<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 10, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 10, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place. ESTAR is used for the location of physical objects and people, but scheduled events use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace una semana.",
    "en": "Don't touch that cheese — it has been bad for a week.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or spoiled (a change of state). SER + malo would describe a permanently bad quality or a bad person."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista; nunca la puedes engañar.",
    "en": "My grandmother is very clever; you can never fool her.",
    "options": [
      "está",
      "es",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'to be clever or sharp,' which is an inherent personality trait. ESTAR + listo/a means 'to be ready,' describing a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la maratón, los corredores ___ agotados pero felices.",
    "en": "After the marathon, the runners were exhausted but happy.",
    "options": [
      "fueron",
      "estuvieron",
      "eran",
      "estaban"
    ],
    "correct": 1,
    "explanation": "ESTAR describes a temporary, resulting condition caused by an action or event. Exhaustion after a race is a change-of-state condition, not a permanent characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play soccer every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a recurring routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "escribiré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted. The interrupting event ('se fue la luz') uses Indefinido because it was a sudden, completed action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally submitted the report that I had been preparing for weeks.",
    "options": [
      "entregaba",
      "entregué",
      "entregara",
      "habré entregado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a single completed action at a specific moment in the past. Words like 'ayer' and 'por fin' anchor the action to a definite point in time."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' or 'that which' and is used when referring to an unspecified or abstract thing. 'Que' alone is a simple connector and cannot introduce this kind of embedded clause."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa encontrarte aquí en Buenos Aires!",
    "en": "What a surprise to run into you here in Buenos Aires!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory constructions to express strong emotion or surprise, following the pattern ¡Qué + noun/adjective! It carries stress and exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I get very stressed about work deadlines.",
    "options": [
      "me estresan",
      "me estresas",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "'Estresarse' is used when the subject causes their own stress (yo y yo pattern). 'Me estreso' = I stress myself out. 'Me estresan' would require a third-party plural subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupas",
      "me preocupo",
      "te preocupas",
      "me preocupa"
    ],
    "correct": 0,
    "explanation": "This is the 'yo y tú' pattern: a second-person subject (tú) causes an effect on a first-person object (me). 'Me preocupas' = you worry me, where tú is the grammatical subject acting on me."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "voy a tomar"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical (si + imperfecto subjuntivo) construction. It expresses what would happen under an unlikely or imaginary condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región.",
    "en": "According to the forecast, tomorrow it will be very hot throughout the region.",
    "options": [
      "haría",
      "habrá",
      "haga",
      "vaya a hacer"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is used for neutral predictions or statements about future events, especially when based on objective information like a forecast. Condicional would imply a condition or reported speech context."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale en diez minutos — ___ corriendo a la estación ahora mismo.",
    "en": "The train leaves in ten minutes — I'm going to run to the station right now.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses an immediate, decided intention closely linked to the present moment. 'Iré' sounds more detached and distant; 'voy a ir' conveys urgency and a plan already in motion."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho horas cada noche.",
    "en": "The doctor recommends that you sleep at least eight hours every night.",
    "options": [
      "duermes",
      "duermas",
      "dormirás",
      "durmiendo"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, wish, or influence (recomendar, querer, pedir), the subordinate clause uses the Subjuntivo. The subject changes (médico → tú), triggering 'que + subjunctive.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegabas"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future action that has not yet occurred at the time of speaking."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ abierto a estas horas.",
    "en": "I don't think that restaurant is open at this hour.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar) trigger the Subjuntivo in the dependent clause because they express doubt or denial rather than asserting a fact."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión.",
    "en": "Please, don't use your phone during the meeting.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "usa"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjunctive form. The affirmative imperative 'usa' is NOT used with negation — you must switch to 'no uses' (subjunctive) for negative commands."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus asientos con el cinturón abrochado.",
    "en": "Ladies and gentlemen, please remain in your seats with your seatbelts fastened.",
    "options": [
      "permanezcan",
      "permanezca",
      "permanecéis",
      "permaneced"
    ],
    "correct": 0,
    "explanation": "The ustedes command (used in Latin America and formal contexts in Spain) is formed from the third-person plural present subjunctive. 'Permanezcan' is the correct ustedes imperative form here."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Sofía todavía no ha llegado. ___ perdido el autobús.",
    "en": "It's three in the afternoon and Sofía still hasn't arrived. She must have missed the bus.",
    "options": [
      "Habría perdido",
      "Habrá perdido",
      "Ha perdido",
      "Perdería"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened. It conveys 'she must have' or 'she probably has' — speculation about a past event from a present perspective."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
