<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 03, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 03, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Location of events uses SER, not ESTAR. ESTAR expresses the location of physical objects and people, but scheduled events take SER to indicate where they take place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este pastel — ___ riquísimo, lo hice con miel de naranja.",
    "en": "Try this cake — it's absolutely delicious, I made it with orange honey.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'tastes delicious' (a sensory experience you are having right now). SER + rico would mean 'to be wealthy.' This is a classic adjective that changes meaning depending on ser or estar."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela lleva ochenta años de vida y todavía ___ muy viva — sale a caminar cada mañana.",
    "en": "My grandmother is eighty years old and is still very much alive — she goes for a walk every morning.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + vivo/a means 'to be alive' (a condition). SER + vivo/a means 'to be clever or sharp-witted.' Since the sentence describes a physical state of being alive, ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué a la reunión, todos ___ listos para empezar.",
    "en": "When I arrived at the meeting, everyone was ready to start.",
    "options": [
      "eran",
      "estaban",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready' (a temporary state). SER + listo means 'to be clever or smart.' Here the sentence describes a condition at a specific moment, so ESTAR is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cada verano, mi familia ___ (pasar) dos semanas en la costa.",
    "en": "Every summer, my family spent two weeks on the coast.",
    "options": [
      "pasó",
      "pasaba",
      "ha pasado",
      "había pasado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'cada verano' signals a recurring pattern, which calls for the Imperfecto, not the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when the phone suddenly rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "he leído"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another, the background ongoing action takes the Imperfecto and the interrupting event takes the Indefinido. 'Leía' describes what was in progress; 'sonó' is the sudden event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Laura ___ (conseguir) un ascenso en su empresa.",
    "en": "Last year, Laura got a promotion at her company.",
    "options": [
      "conseguía",
      "consiguió",
      "ha conseguido",
      "conseguiría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed actions at a specific point in the past. 'El año pasado' marks a finished time frame, and getting a promotion is a single completed event, both pointing to the Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what / that which' when it refers to an unspecified thing or idea. 'Que' alone is a conjunction linking clauses, and 'qué' with an accent is used in direct or indirect questions with a more interrogative flavour."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ susto me diste cuando apagaste las luces sin avisar!",
    "en": "What a fright you gave me when you turned off the lights without warning!",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to intensify meaning, equivalent to 'What a…!' in English. Without the accent, 'que' is a subordinating conjunction and cannot carry exclamatory force."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo extra que tengo.",
    "en": "Lately I stress myself out a lot with all the extra work I have.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes the feeling in themselves (yo → yo), use the first-person reflexive: 'me estreso'. 'Me estresas' would mean someone else (tú) stresses you, and 'me estresa' means a third-party thing stresses you."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Oye, cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "Hey, when you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes the feeling in the speaker (yo), the verb is 'me estresas'. The subject is 'tú' but the object pronoun 'me' shows who is affected. This is the yo-y-tú pattern."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomara"
    ],
    "correct": 1,
    "explanation": "In a second-conditional (si + Imperfecto Subjuntivo), the main clause requires the Condicional Simple to express a hypothetical outcome. The Futuro Simple would imply a real, likely plan rather than a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes — ___ a recogerte al aeropuerto sin falta.",
    "en": "Don't worry — I'm going to pick you up from the airport without fail.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya a ir"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a near future plan or strong intention, often with personal commitment already made. The Futuro Simple 'iré' is also correct but sounds more neutral and distant; in spoken Spanish, 'voy a ir' conveys more immediate certainty."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región norte.",
    "en": "According to the forecast, tomorrow it will rain across the entire northern region.",
    "options": [
      "llovería",
      "lloverá",
      "llueva",
      "va a llover"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for predictions based on objective evidence, such as a weather forecast. The Condicional would imply a hypothetical or reported-speech context rather than a factual prediction about tomorrow."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que nosotros ___ (entregar) el informe antes del viernes.",
    "en": "The boss wants us to hand in the report before Friday.",
    "options": [
      "entregamos",
      "entregaremos",
      "entreguemos",
      "entregáramos"
    ],
    "correct": 2,
    "explanation": "Verbs of desire or wish (querer, desear, esperar) require the Subjuntivo in the subordinate clause when the subject changes. 'Entreguemos' is the present subjunctive of entregar for nosotros."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al hotel y te doy las instrucciones.",
    "en": "Call me as soon as you arrive at the hotel and I'll give you the instructions.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "After conjunctions of time like 'en cuanto', 'cuando', and 'hasta que' referring to a future event, Spanish requires the Subjuntivo. Since the arrival hasn't happened yet, 'llegues' is correct, not the indicative 'llegas'."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que él ___ (tener) razón en este asunto.",
    "en": "I don't think he is right about this matter.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief ('no creer que', 'no pensar que') trigger the Subjuntivo in the following clause because they express doubt or denial rather than assertion. Affirmative 'creo que' would take the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (decirme, tú) la verdad sobre lo que pasó anoche.",
    "en": "Please, tell me the truth about what happened last night.",
    "options": [
      "dime",
      "me di",
      "díme",
      "me dices"
    ],
    "correct": 0,
    "explanation": "For affirmative tú commands with a pronoun, the pronoun attaches directly to the end of the imperative form: 'di' (irregular tú imperative of decir) + 'me' = 'dime'. The accent is only added if attaching the pronoun shifts the stress to a non-natural syllable."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (salir, tú) sin el paraguas — está nublado y puede llover.",
    "en": "Don't leave without your umbrella — it's cloudy and it might rain.",
    "options": [
      "salgas",
      "salgas no",
      "sal",
      "sales"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with 'no' + present subjunctive, not the affirmative imperative form. The affirmative tú command 'sal' cannot be used in the negative — you must switch to 'no salgas'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Rodrigo todavía no está aquí. ___ (perderse) con el nuevo sistema de metro.",
    "en": "It's three in the afternoon and Rodrigo still isn't here. He must have gotten lost with the new metro system.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdió",
      "Se perdería"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about something that may have already occurred. Here the speaker is speculating about why Rodrigo is late — a past event seen from the present moment."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
