<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 27, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 27, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el teatro principal esta noche.",
    "en": "The concert is at the main theater tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (concerts, parties, meetings), even though location normally uses ESTAR. ESTAR is reserved for the physical location of objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres años en Francia, Marcos ___ muy diferente.",
    "en": "After spending three years in France, Marcos is very different.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to express a change of state or a condition that results from a change. Since Marcos has changed as a result of his experience, ESTAR captures this shift from a previous state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese pastel todavía — ___ listo para comer en una hora!",
    "en": "Don't touch that cake yet — it will be ready to eat in an hour!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "The adjective 'listo' changes meaning depending on the verb: SER listo means 'to be clever/smart', while ESTAR listo means 'to be ready'. Here the cake being ready is a condition, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ una persona muy activa, aunque ya tiene ochenta años.",
    "en": "My grandmother is a very active person, even though she is already eighty years old.",
    "options": [
      "está",
      "es",
      "estaba",
      "era"
    ],
    "correct": 1,
    "explanation": "SER is used to describe inherent or defining characteristics of a person, especially when talking about their personality or nature. Being active is presented here as a defining trait of the grandmother."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (vivir) en un pueblo pequeño cerca del mar.",
    "en": "When I was a child, I used to live in a small town near the sea.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing states in the past with no defined end point. 'Cuando era niño' signals a repeated or continuous background condition, making Imperfecto the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (hablar) con mi jefe cuando de repente sonó el teléfono.",
    "en": "I was talking to my boss when the phone suddenly rang.",
    "options": [
      "hablé",
      "hablaba",
      "había hablado",
      "hablaré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was in progress when a new event interrupted it. 'De repente sonó' (rang suddenly) is the completed interrupting event in Indefinido, while 'hablaba' paints the scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, Sofía ___ (terminar) el informe y luego salió a cenar.",
    "en": "Last Saturday, Sofía finished the report and then went out to dinner.",
    "options": [
      "terminaba",
      "terminó",
      "ha terminado",
      "termine"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions at a specific point in the past. 'El sábado pasado' anchors the event in finished time, and the sequence 'terminó… salió' shows two consecutive completed actions."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con eso.",
    "en": "I don't understand what you mean by that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what / the thing that' and is used when 'what' introduces an embedded clause that acts as a noun (object of 'entender'). 'Que' alone is a simple subordinating conjunction and cannot replace 'lo que' here."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ calor hace hoy en Sevilla!",
    "en": "What heat there is in Seville today! / It's so hot in Seville today!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "Exclamations of this type use 'qué' (with accent) before a noun to express surprise or strong emotion. 'Qué + noun' is a fixed exclamatory structure; 'que' without an accent is a conjunction and cannot introduce exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con el trabajo. Hay demasiadas horas extra.",
    "en": "Lately I stress a lot because of work. There are too many overtime hours.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject is 'yo' and the action reflects back on oneself (Yo y yo pattern), use 'me estreso'. 'Me estresas' would mean 'you stress me out', and 'me estresa' means 'it stresses me out' — the subject and agent are different in those cases."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot / it worries me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "This is the 'Yo y tú' pattern: a second-person subject (tú) causes an emotional effect on a first-person object (me). The verb agrees with 'tú', so 'me preocupas' = 'you worry me'. 'Me preocupo' would mean 'I worry myself'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "aprendo",
      "aprendiera"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple expresses a hypothetical result in a contrary-to-fact conditional sentence (si + Imperfecto Subjuntivo → Condicional). Because the condition is currently unfulfilled, Condicional is required, not Futuro."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región.",
    "en": "According to the forecast, it will rain throughout the region tomorrow.",
    "options": [
      "llovería",
      "llueve",
      "lloverá",
      "va a llover"
    ],
    "correct": 2,
    "explanation": "When making a straightforward prediction about the future, especially based on evidence or forecasts, Futuro Simple ('lloverá') is natural. 'Voy a + infinitivo' is more common in spoken Spanish for planned near-future events, but Futuro Simple is preferred for objective predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "—¿Por qué no vino Ana a la reunión? —No sé, ___ (estar) enferma.",
    "en": "—Why didn't Ana come to the meeting? —I don't know, she might be sick.",
    "options": [
      "estará",
      "estaría",
      "está",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple can express probability or conjecture about a past situation (probability in the past). 'Estaría' here means 'she was probably sick', referring to a past moment. Futuro Simple expresses probability about the present, not the past."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres quieren que yo ___ (llamarles) cada semana.",
    "en": "My parents want me to call them every week.",
    "options": [
      "llamo",
      "llamaré",
      "llame",
      "llamara"
    ],
    "correct": 2,
    "explanation": "After verbs of wanting or wishing (querer que), the subordinate clause takes the Subjuntivo Simple when the subjects are different. 'Quiero que + subjuntivo' is one of the most fundamental triggers for the present subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (llegar) puntualmente a las reuniones.",
    "en": "It is important that all employees arrive punctually to meetings.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or value (es importante que, es necesario que, es bueno que) always trigger the Subjuntivo Simple in the subordinate clause, because they express a subjective judgment rather than stating a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) a casa, te mando el documento por correo.",
    "en": "As soon as I get home, I'll send you the document by email.",
    "options": [
      "llego",
      "llegue",
      "llegara",
      "llegaré"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' require Subjuntivo when they refer to a future action that has not yet happened. The indicative would only be used when referring to habitual or past actions."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (cerrar, tú) la ventana — necesito aire fresco.",
    "en": "Don't close the window — I need fresh air.",
    "options": [
      "cierras",
      "cierres",
      "cierra",
      "cerrar"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present subjunctive (no + subjuntivo), NOT the affirmative imperative form. 'No cierres' is the negative command; 'cierra' is the affirmative command, which cannot be negated directly."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) el cinturón de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abróchense",
      "se abrochen",
      "abróchaos",
      "abrocharse"
    ],
    "correct": 0,
    "explanation": "For affirmative ustedes commands, use the third-person plural of the present subjunctive. With reflexive verbs, the pronoun 'se' attaches to the end of the verb: 'abróchense'. Note the written accent to preserve the original stress."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las 10 de la noche y Lucía aún no ha llegado. ___ (perderse) en el metro.",
    "en": "It's 10 p.m. and Lucía still hasn't arrived. She must have gotten lost on the subway.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdería",
      "Se ha perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habré + participio) expresses probability or deduction about something that has already happened, viewed from the present moment. It corresponds to 'must have + past participle' in English. 'Se perderá' would speculate about a future event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
