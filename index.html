<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 20, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 20, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El director del hospital ___ muy aburrido en las reuniones de presupuesto.",
    "en": "The hospital director is very bored at budget meetings.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with 'aburrido' to describe a temporary emotional state (feeling bored). With SER, 'aburrido' would mean the person IS boring as a permanent trait — a very different meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mi prima ___ en el jardín del hotel, no en la iglesia.",
    "en": "My cousin's wedding is in the hotel garden, not in the church.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where or when they take place. ESTAR is used for the location of physical objects or people, but not for the location of events like weddings or concerts."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuidado con ese vendedor — ___ muy listo y siempre consigue lo que quiere.",
    "en": "Be careful with that salesman — he is very clever and always gets what he wants.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + 'listo' means clever or sharp as a defining characteristic. ESTAR + 'listo' means ready — so choosing SER here conveys the intended meaning of intelligence as a trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que empezó la dieta, la abuela ___ más delgada que antes.",
    "en": "Since starting her diet, grandma is thinner than before.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here to show a change of state — grandma has become thinner as a result of her diet. This is not a permanent characteristic, but a new condition compared to a previous one."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, mi padre me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was little, my father used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. 'Todas las noches' signals a routine, so Imperfecto (contaba) is correct, not Indefinido which marks a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente por el parque cuando de repente empezó a llover a cántaros.",
    "en": "I was walking calmly through the park when it suddenly started pouring.",
    "options": [
      "caminaba",
      "caminé",
      "caminaría",
      "haya caminado"
    ],
    "correct": 0,
    "explanation": "The Imperfecto describes an ongoing background action (walking) that was interrupted by a sudden event (Indefinido: empezó). The structure 'ongoing action + de repente + completed event' is a classic Imperfecto/Indefinido contrast."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un contrato importante con una firma japonesa.",
    "en": "Last year, my company signed an important contract with a Japanese firm.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmara"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido is used for completed, one-time events at a specific point in the past. 'El año pasado' anchors the action to a finished time period, triggering Indefinido (firmó)."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás pidiendo — explícamelo otra vez, por favor.",
    "en": "I don't understand what you're asking me — explain it to me again, please.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'that which.' 'Que' alone is a relative or conjunction connector and cannot introduce an indirect question the way 'lo que' can here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí después de tantos años.",
    "en": "What a pleasant surprise to run into you here after so many years.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express surprise or emotion, equivalent to 'What a…' in English. Without the accent, 'que' is a conjunction or relative pronoun and cannot open an exclamation like this."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo demasiadas responsabilidades en el trabajo.",
    "en": "Lately I get very stressed because I have too many responsibilities at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "'Me estreso' is the 'yo y yo' pattern — the subject (yo) causes the emotional reaction in themselves. 'Me estresa' would require an external subject causing the stress, and 'me estresas' would mean 'you stress me out.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo y luego no puedo dormir.",
    "en": "When you arrive late without warning, you stress me out a lot and then I can't sleep.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "te estresan"
    ],
    "correct": 2,
    "explanation": "'Me estresas' is the 'yo y tú' pattern — a second-person subject (tú) causes an emotional reaction in the speaker (me). The verb agrees with tú (second person) while 'me' marks who receives the effect."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ voluntariado en el refugio de animales.",
    "en": "If I had more time, I would do volunteer work at the animal shelter.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "The Condicional (haría) is required in the main clause of a hypothetical 'si + Imperfecto de Subjuntivo' structure. The Futuro Simple (haré) is used for real future intentions, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa mediterránea.",
    "en": "According to the forecast, tomorrow it will be very hot along the entire Mediterranean coast.",
    "options": [
      "haría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "Futuro Simple (habrá) is used for objective predictions or scheduled future events based on evidence. The Condicional (haría) would imply a hypothetical condition, which is absent here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He decidido que esta tarde ___ el informe en lugar de esperar al lunes.",
    "en": "I've decided that this afternoon I'm going to finish the report instead of waiting until Monday.",
    "options": [
      "terminaré",
      "voy a terminar",
      "terminaría",
      "termine"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention based on a present decision or plan. Futuro Simple (terminaré) can also work but sounds more formal; in spoken Spanish, 'voy a terminar' is the natural choice for a just-made decision."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi jefa quiere que nosotros ___ el proyecto antes del viernes sin falta.",
    "en": "My boss wants us to finish the project before Friday without fail.",
    "options": [
      "terminamos",
      "terminaremos",
      "terminemos",
      "termináramos"
    ],
    "correct": 2,
    "explanation": "Verbs of wanting or wishing (querer) trigger the Subjuntivo in the subordinate clause when the subject changes. 'Que + subjuntivo' is required here because the boss wants someone else to do the action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ noticias del médico, te llamo inmediatamente.",
    "en": "As soon as I get news from the doctor, I'll call you immediately.",
    "options": [
      "tengo",
      "tendré",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future action. Even though the main clause is future, the subordinate time clause uses Subjuntivo, not Futuro."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los empleados ___ los protocolos de seguridad al pie de la letra.",
    "en": "It is essential that employees follow the safety protocols to the letter.",
    "options": [
      "siguen",
      "seguirán",
      "sigan",
      "siguieran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental, es necesario, es importante) always trigger the Subjuntivo in the subordinate clause. The Indicativo would incorrectly state a fact rather than an obligation."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el formulario antes de leer todas las instrucciones con atención.",
    "en": "Don't fill out the form before reading all the instructions carefully.",
    "options": [
      "rellenes",
      "rellena",
      "rellenar",
      "rellene"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present Subjuntivo form (no rellenes). The affirmative tú imperative (rellena) cannot be used after 'no' — this is a key asymmetry in the Spanish imperative system."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad durante el despegue, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts during takeoff.",
    "options": [
      "abrochen",
      "abrochar",
      "abrochad",
      "abroche"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (used in Latin America and formal contexts), both affirmative and negative forms use the third-person plural Subjuntivo. 'Abrochad' is the vosotros form used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la mañana y Jorge todavía no ha llegado. ___ perdido el último metro.",
    "en": "It's three in the morning and Jorge still hasn't arrived. He must have missed the last metro.",
    "options": [
      "Habrá",
      "Había",
      "Habría",
      "Haya"
    ],
    "correct": 0,
    "explanation": "Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from a present perspective. It is equivalent to 'must have' or 'probably' in English when speculating about what has already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
