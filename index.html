<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 31, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 31, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal este viernes.",
    "en": "The conference is in the main auditorium this Friday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR is used for the physical location of objects and people, but the location of scheduled events (concerts, meetings, conferences) requires SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it's been bad (spoiled) for three days.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "When 'malo' is used with ESTAR, it means something is spoiled, sick, or in a bad condition — a temporary or changed state. With SER, 'malo' would mean the person or thing is inherently bad or evil."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista; siempre sabe cómo resolver los problemas.",
    "en": "My grandmother is very clever; she always knows how to solve problems.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "SER + 'listo' means clever or sharp as an inherent characteristic. ESTAR + 'listo' would mean 'to be ready', referring to a temporary state, not a personality trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después del maratón, todos los participantes ___ agotados.",
    "en": "After the marathon, all the participants were exhausted.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 3,
    "explanation": "ESTAR describes a resulting or temporary state, and 'estuvieron' (preterite of ESTAR) indicates the completed state of exhaustion as a direct result of a specific event. 'Estaban' would suggest ongoing background exhaustion, but here it's a specific completed condition."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al parque todos los domingos con mi padre.",
    "en": "When I was a child, I used to go to the park every Sunday with my father.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (iba) is used for habitual or repeated past actions — things that happened regularly over an unspecified period. 'Todos los domingos' is a key signal of habitual action. The Indefinido would imply a single completed trip."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ la cena cuando de repente sonó el teléfono.",
    "en": "I was preparing dinner when the phone suddenly rang.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "prepararé"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (preparaba) describes the ongoing background action that was interrupted. The interrupting event ('sonó') uses Indefinido. This is the classic interrupted action pattern: Imperfecto sets the scene, Indefinido provides the new event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un contrato muy importante con un cliente japonés.",
    "en": "Last year, my company signed a very important contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "ha firmado",
      "firmará"
    ],
    "correct": 1,
    "explanation": "The Indefinido (firmó) is used for a single, completed action at a specific point in the past. 'El año pasado' is a specific time marker that signals a completed event, making the Indefinido the correct choice over the Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás pidiendo con tanto misterio.",
    "en": "I don't understand what you're asking me with so much mystery.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what' in the sense of referring to an undefined thing. It is used when 'what' can be replaced by 'the thing that'. 'Que' alone is a simple connector and cannot stand alone as the subject or object here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ interesante es que nadie en la reunión dijo nada al respecto.",
    "en": "What is interesting is that nobody in the meeting said anything about it.",
    "options": [
      "Qué",
      "Que",
      "Lo que",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Lo que' is used here as a noun clause that functions as the subject of the sentence, meaning 'the thing that is interesting'. 'Qué' with an accent is used in exclamations and questions, not to introduce a noun clause that acts as a sentence subject."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando llego tarde al trabajo.",
    "en": "Lately I stress myself out a lot when I arrive late to work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estreso"
    ],
    "correct": 0,
    "explanation": "When the subject causes the action to themselves (yo → yo), the reflexive pronoun 'me' is used with the first-person verb form 'estreso'. This is the 'yo y yo' pattern — the subject and the affected person are the same."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando no me escuchas, ___ mucho y no puedo concentrarme.",
    "en": "When you don't listen to me, you frustrate me a lot and I can't concentrate.",
    "options": [
      "me frustro",
      "me frustras",
      "me frustra",
      "te frustras"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes an effect on the speaker (yo), the structure is subject tú + verb in second person + object pronoun 'me'. This is the 'yo y tú' pattern: 'me frustras' = you frustrate me."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomara"
    ],
    "correct": 1,
    "explanation": "The Condicional (tomaría) is used in the main clause of hypothetical si-clauses where the condition is unlikely or contrary to current reality. The si-clause uses Imperfecto de Subjuntivo ('tuviera'), signaling that the Condicional is the correct response form."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche ___ con mis amigos; ya tenemos todo planeado.",
    "en": "Tonight I'm going to go out with my friends; we already have everything planned.",
    "options": [
      "saldría",
      "saldré",
      "voy a salir",
      "salga"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when a future action is already planned or decided upon, especially in the near future. The Futuro Simple ('saldré') can also work but sounds more neutral; 'voy a salir' emphasizes prior planning and immediate intention."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No sé exactamente cuándo llegará el paquete, pero ___ el martes.",
    "en": "I don't know exactly when the package will arrive, but it will probably arrive on Tuesday.",
    "options": [
      "llegaría",
      "llegará",
      "llegue",
      "va a llegar"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used in Spanish to express probability or conjecture about the present or future. 'Llegará' here conveys a future prediction or approximation. The Condicional would suggest a hypothetical or conditional situation, which is not the case here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi jefa insiste en que todos ___ el informe antes del mediodía.",
    "en": "My boss insists that everyone submit the report before noon.",
    "options": [
      "entreguen",
      "entregan",
      "entregarán",
      "entreguen"
    ],
    "correct": 0,
    "explanation": "After verbs of insistence, desire, or influence (like 'insistir en que'), the subjunctive is required in the subordinate clause. The subjunctive (entreguen) expresses that the subject (jefa) is trying to influence the actions of others."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamo inmediatamente.",
    "en": "As soon as I get the results, I'll call you immediately.",
    "options": [
      "recibo",
      "recibiré",
      "reciba",
      "recibiera"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' that refer to a future action, the subjunctive must be used. The present indicative 'recibo' would imply a habitual action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y tenga dos habitaciones.",
    "en": "I'm looking for an apartment that is near the metro and has two bedrooms.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent (the thing being looked for) is unknown or hypothetical — the apartment may or may not exist — the subjunctive is used in the relative clause. If you were referring to a specific known apartment, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el móvil durante la cena, por favor.",
    "en": "Don't use your phone during dinner, please.",
    "options": [
      "uses",
      "usas",
      "usés",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive: 'no uses'. The affirmative tú imperative ('usa') is different, but all negative imperatives for tú use the subjunctive form, making 'no uses' the correct negative command."
  },
  {
    "topic": "Imperativo",
    "q": "Si quieren más información, ___ al departamento de atención al cliente.",
    "en": "If you (all) want more information, contact the customer service department.",
    "options": [
      "llamen",
      "llamen ustedes",
      "llamen vosotros",
      "llamad"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (used in Latin America and in formal contexts in Spain), the imperative is the same as the third-person plural subjunctive: 'llamen'. 'Llamad' is the vosotros affirmative imperative, used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las 10 de la noche y Laura aún no ha llegado. ___ perdido el tren.",
    "en": "It's 10 at night and Laura still hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from the perspective of the present. The speaker is speculating about what likely happened, equivalent to 'she must have' or 'she probably missed' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
