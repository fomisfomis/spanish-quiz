<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 30, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 30, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de esta noche ___ en el parque central.",
    "en": "Tonight's concert is in the central park.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, not ESTAR. ESTAR expresses the physical location of objects or people, but for scheduled events, SER is the correct verb."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it has been bad for three days.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is currently in a poor condition (a state). SER + malo would mean it is inherently bad or evil by nature, which is a different meaning entirely."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'to be clever or smart' as a permanent characteristic. ESTAR + listo/a, by contrast, means 'to be ready', which is a temporary state — a completely different meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la maratón, los corredores ___ agotados pero felices.",
    "en": "After the marathon, the runners were exhausted but happy.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 3,
    "explanation": "ESTAR describes states that result from an event or change, which is exactly what exhaustion after a race represents. ESTUVIERON (preterite of ESTAR) is used here because this is a completed state tied to a specific past event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (ir) al mercado todos los sábados con mi padre.",
    "en": "When I was a child, I used to go to the market every Saturday with my father.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "vaya"
    ],
    "correct": 1,
    "explanation": "The imperfecto (iba) expresses habitual or repeated actions in the past. The clue 'todos los sábados' signals a routine, not a single completed event, so indefinido (fui) would be incorrect."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Miriam ___ (leer) el informe cuando su jefe entró de repente en la oficina.",
    "en": "Miriam was reading the report when her boss suddenly walked into the office.",
    "options": [
      "leyó",
      "leía",
      "ha leído",
      "lea"
    ],
    "correct": 1,
    "explanation": "The imperfecto (leía) describes the background action already in progress when a new event interrupted it. The interrupting event (entró) uses indefinido, while the ongoing background action uses imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar, nosotros) de pintar toda la casa.",
    "en": "Yesterday we finally finished painting the whole house.",
    "options": [
      "terminábamos",
      "terminamos",
      "terminemos",
      "habíamos terminado"
    ],
    "correct": 1,
    "explanation": "Indefinido (terminamos) is used for a completed action with a clear endpoint in the past. The word 'por fin' (finally) and 'ayer' both signal a single, finished event, ruling out the imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you are trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a relative pronoun meaning 'what / the thing that' when referring to an unspecified thing or idea. 'Que' alone cannot introduce a noun clause where 'what' is the object of the embedded verb."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ vestido tan elegante llevas hoy!",
    "en": "What an elegant dress you are wearing today!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory sentences to express admiration, surprise, or emotion before a noun. Without the accent, 'que' is a conjunction or a relative pronoun and cannot function this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causing stress is 'yo' (I am the one getting stressed by the situation in general), use the first-person reflexive form 'me estreso'. 'Me estresa' would require a third-person subject noun to trigger the stress, like 'el tráfico me estresa'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que me criticas delante de todos, ___ muchísimo.",
    "en": "Every time you criticize me in front of everyone, you embarrass me a lot.",
    "options": [
      "me avergüenzo",
      "me avergüenzas",
      "me avergüenza",
      "te avergüenzas"
    ],
    "correct": 1,
    "explanation": "When a second-person subject (tú) causes an effect on a first-person object (me), the verb agrees with 'tú' and takes the second-person conjugation. 'Me avergüenzas' follows the pattern 'yo y tú' — you do something to me."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ (hacer)?",
    "en": "If you had more free time, what would you do?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The conditional (harías) is required in the main clause of a hypothetical 'si' sentence when the 'si' clause uses the imperfecto de subjuntivo (tuvieras). This structure expresses an unlikely or imaginary situation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El vuelo sale a las seis, así que mañana a las diez ya ___ (llegar, nosotros) a Buenos Aires.",
    "en": "The flight leaves at six, so tomorrow at ten we will already have arrived in Buenos Aires.",
    "options": [
      "llegaríamos",
      "llegaremos",
      "vamos a llegar",
      "lleguemos"
    ],
    "correct": 1,
    "explanation": "Futuro simple (llegaremos) is used for concrete future plans or predictions based on current facts. 'Vamos a llegar' could also work in informal speech, but futuro simple is preferred with a specific future time marker and a factual basis."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que ___ (llamar, ellos) antes de venir, pero nunca lo hicieron.",
    "en": "They told me they would call before coming, but they never did.",
    "options": [
      "llamarán",
      "llamarían",
      "van a llamar",
      "llamen"
    ],
    "correct": 1,
    "explanation": "The conditional (llamarían) is used in indirect speech to report a future-in-the-past promise or intention. When the reporting verb is in the past (dijeron), the future reported shifts to the conditional, not the futuro simple."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el cliente ___ (aceptar) la propuesta que le enviamos.",
    "en": "I hope the client accepts the proposal we sent him.",
    "options": [
      "acepta",
      "aceptará",
      "acepte",
      "aceptara"
    ],
    "correct": 2,
    "explanation": "After verbs of wish or hope like 'esperar que', the present subjunctive is required when there is a change of subject. The subjunctive expresses the speaker's desire about someone else's action, not a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ (terminar, tú) de comer, por favor pon los platos en el lavavajillas.",
    "en": "When you finish eating, please put the dishes in the dishwasher.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminabas"
    ],
    "correct": 2,
    "explanation": "When 'cuando' refers to a future event that has not yet happened, the subjunctive (termines) is required, not the indicative. 'Cuando' + present indicative refers to habitual or general truths, but for future reference, subjunctive is mandatory."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (tener) mesa libre un viernes por la noche.",
    "en": "I don't think this restaurant has a free table on a Friday night.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief ('no creer que', 'no pensar que') trigger the subjunctive in the subordinate clause. When the speaker expresses doubt or denial rather than a factual opinion, the subjunctive is required."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ (escuchar, tú) bien las instrucciones antes de empezar el examen!",
    "en": "Listen carefully to the instructions before starting the exam!",
    "options": [
      "Escucha",
      "Escuche",
      "Escuches",
      "Escuchas"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed by dropping the -s from the present indicative tú form: escuchas → escucha. This is different from the negative tú imperative, which uses the subjunctive (no escuches)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, ustedes) — nosotros nos encargamos de todo.",
    "en": "Don't worry (you all) — we will take care of everything.",
    "options": [
      "se preocupen",
      "os preocupéis",
      "se preocupar",
      "preocúpense"
    ],
    "correct": 0,
    "explanation": "The negative ustedes command uses the present subjunctive form with the pronoun placed before the verb: 'no se preocupen'. The affirmative would be 'preocúpense' (pronoun attached), but in the negative, the pronoun always precedes the verb."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Lucía todavía no ha llegado. ___ (perder) el autobús otra vez.",
    "en": "It is eleven at night and Lucía still has not arrived. She must have missed the bus again.",
    "options": [
      "Perdió",
      "Perderá",
      "Habrá perdido",
      "Habría perdido"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about a past event when viewed from the present moment. The speaker is speculating about what likely happened, not stating a fact or making a future plan."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
