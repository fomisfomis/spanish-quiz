<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 21, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 21, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Events and scheduled activities use SER to indicate where they take place, even though location normally uses ESTAR. ESTAR indicates the physical location of objects and people, but for events, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Prueba este postre! El chocolate ___ riquísimo hoy.",
    "en": "Try this dessert! The chocolate is absolutely delicious today.",
    "options": [
      "es",
      "está",
      "fue",
      "era"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with 'rico' when it means 'tastes delicious,' referring to a current sensory experience. SER with 'rico' would mean the chocolate is wealthy, which makes no sense here — ESTAR signals a temporary, perceived quality."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ha cuidado mucho su alimentación; ___ muy sana para tener 80 años.",
    "en": "My grandmother has always taken care of her diet; she is very healthy for being 80 years old.",
    "options": [
      "es",
      "está",
      "sea",
      "estará"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'sana' describes a current, observable state of health rather than an inherent characteristic. The phrase 'para tener 80 años' reinforces that this is a condition that stands out compared to expectations."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El profesor Morales ___ muy aburrido; nadie presta atención en su clase.",
    "en": "Professor Morales is very boring; nobody pays attention in his class.",
    "options": [
      "es",
      "está",
      "fue",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER with 'aburrido' means the person IS boring — it describes an inherent personality trait. ESTAR with 'aburrido' would mean the person FEELS bored. The context here (a chronic classroom problem) points to a personality characteristic, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los días después del colegio.",
    "en": "When I was a child, I used to play football every day after school.",
    "options": [
      "jugué",
      "jugaba",
      "había jugado",
      "jugaré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. 'Todos los días' is a clear marker of habitual behavior, and 'cuando era niño' sets a general past timeframe rather than a specific completed moment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was in progress when another event interrupted it. 'Leía' sets the scene; the interrupting event ('sonó') uses Indefinido because it was a completed, punctual action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally finished the report that I had been preparing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "terminaré",
      "habré terminado"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a completed action at a specific, bounded moment in the past. 'Ayer' and 'por fin' are strong temporal markers indicating a definitive endpoint, which calls for Indefinido, not Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó a los organizadores del problema.",
    "en": "What surprises me is that nobody warned the organizers about the problem.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'what' or 'the thing that,' and it is used when referring to something non-specific or abstract as the subject of the sentence. 'Que' alone cannot begin a noun clause in subject position without an article, and 'Qué' with an accent is used in questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo el motivo por ___ cancelaron el vuelo sin previo aviso.",
    "en": "I don't understand the reason why they cancelled the flight without prior notice.",
    "options": [
      "lo que",
      "qué",
      "el que",
      "que"
    ],
    "correct": 3,
    "explanation": "After a preposition followed by a specific antecedent noun ('el motivo'), the relative pronoun 'que' is used in everyday speech. 'Por que' (two words) links the preposition to the relative clause, and no accent is needed because it is not a direct or indirect question."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo demasiado trabajo acumulado.",
    "en": "Lately I stress a lot because I have too much work piled up.",
    "options": [
      "me estresa",
      "te estreso",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject and the reflexive pronoun refer to the same person (the speaker), we use 'yo + me.' 'Me estreso' follows the 'yo y yo' pattern — I am doing something to myself. 'Me estresa' would require an external subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas planes sin avisar, ___ muchísimo.",
    "en": "Every time you cancel plans without notice, you frustrate me a lot.",
    "options": [
      "me frustro",
      "te frustras",
      "me frustras",
      "te frustro"
    ],
    "correct": 2,
    "explanation": "This follows the 'yo y tú' pattern: the subject (tú) performs an action that affects the speaker (me). 'Me frustras' means 'you frustrate me' — the pronoun 'me' marks the receiver, and the verb agrees with the subject 'tú.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is used in the main clause of hypothetical ('si + Imperfecto de Subjuntivo') sentences to express what would happen under an unlikely or imagined condition. The Futuro Simple would be used for real future plans, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región norte.",
    "en": "According to the forecast, it will rain tomorrow throughout the northern region.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "llovía"
    ],
    "correct": 1,
    "explanation": "'Voy/va a + infinitivo' is preferred when there is concrete evidence or a reliable plan pointing to a near-future event. A weather forecast is an objective, evidence-based prediction, making 'va a llover' more natural than the more distant or formal Futuro Simple 'lloverá.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que el nuevo proyecto ___ (comenzar) en enero del año que viene.",
    "en": "The director said that the new project would begin in January of next year.",
    "options": [
      "comenzará",
      "comenzaría",
      "comience",
      "comenzaba"
    ],
    "correct": 1,
    "explanation": "The Condicional acts as a 'future in the past' — when a statement about the future is reported from a past perspective. Because 'dijo' (said) is in the past, the subordinate clause shifts from Futuro to Condicional to maintain the correct temporal relationship."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ (asistir) a la sesión de formación.",
    "en": "It is essential that all employees attend the training session.",
    "options": [
      "asisten",
      "asistirán",
      "asistan",
      "asistían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance ('es fundamental que,' 'es importante que') trigger the Subjuntivo in the subordinate clause. The Subjuntivo conveys that the action is desired or required rather than factual."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto para saber que estás bien.",
    "en": "Call me as soon as you arrive at the airport so I know you're okay.",
    "options": [
      "llegas",
      "llegues",
      "llegabas",
      "llegarás"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future event that has not yet occurred. The Indicative would be used only if the action is habitual or already happened."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (ser) tan bueno como dicen las reseñas.",
    "en": "I don't think that restaurant is as good as the reviews say.",
    "options": [
      "es",
      "era",
      "sea",
      "sería"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion or belief ('no creo que,' 'no pienso que') trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or disbelief rather than asserting a fact. The affirmative 'creo que' would use the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (dejar, tú) los platos sucios en el fregadero otra vez.",
    "en": "Please, don't leave the dirty dishes in the sink again.",
    "options": [
      "dejes",
      "deja",
      "dejarás",
      "dejes tú"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the Present Subjunctive form, not the affirmative imperative. The affirmative tú command for 'dejar' is 'deja,' but the negative form requires the Subjuntivo: 'no dejes.' This is a key asymmetry in the Spanish imperative system."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse, ustedes) los cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abróchenlos",
      "abrochárselos",
      "abróchense",
      "se abrochen"
    ],
    "correct": 2,
    "explanation": "For affirmative ustedes commands with reflexive verbs, the reflexive pronoun 'se' is attached directly to the end of the imperative form. The base form 'abrochen' + 'se' becomes 'abróchense,' with an accent added to maintain the original stress."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Daniela aún no ha llegado. ___ (perderse) con las indicaciones que le di.",
    "en": "It's three in the afternoon and Daniela still hasn't arrived. She must have gotten lost with the directions I gave her.",
    "options": [
      "Se perdió",
      "Se perderá",
      "Se habrá perdido",
      "Se habría perdido"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. The speaker doesn't know for certain what happened, so they use this tense to speculate rather than state a fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
