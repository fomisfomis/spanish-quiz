<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 08, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 08, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though SER generally doesn't express location. ESTAR is used for the physical location of objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it's been bad for three days.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is spoiled (a temporary, changed condition). SER + malo means someone or something is evil or of bad quality by nature. Context here implies spoilage, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista para su edad — resuelve crucigramas en minutos.",
    "en": "My grandmother is very sharp for her age — she solves crosswords in minutes.",
    "options": [
      "está",
      "es",
      "estaba",
      "era"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means someone is clever or sharp as an inherent characteristic. ESTAR + listo/a means someone is ready to do something. Since the sentence describes an ongoing intellectual trait, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué raro! La reunión ___ cancelada sin ninguna explicación.",
    "en": "How strange! The meeting is cancelled without any explanation.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a resulting state — the meeting went through a process of being cancelled and is now in that condition. SER + past participle would indicate a passive construction focusing on the action itself, not the resulting state."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, mi padre me ___ cuentos antes de dormir.",
    "en": "When I was a child, my father used to read me stories before bed.",
    "options": [
      "leyó",
      "leía",
      "ha leído",
      "leerá"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions with no specific endpoint, especially in childhood or past routines. The phrase 'cuando era niño' signals an ongoing habit, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un podcast cuando de repente se cortó la luz.",
    "en": "I was listening to a podcast when suddenly the power went out.",
    "options": [
      "escuché",
      "escuchaba",
      "he escuchado",
      "escucharía"
    ],
    "correct": 1,
    "explanation": "The Imperfecto sets the background action that was ongoing (escuchaba), while the Indefinido (se cortó) expresses the sudden interrupting event. 'De repente' is a classic signal of an interrupting completed action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ terminar el informe que llevaba semanas postergando.",
    "en": "Yesterday I finally managed to finish the report I had been putting off for weeks.",
    "options": [
      "podía",
      "pude",
      "puedo",
      "había podido"
    ],
    "correct": 1,
    "explanation": "Pude (Indefinido) signals a completed achievement — power or ability that was successfully used at a specific moment. Podía (Imperfecto) would imply a general ongoing ability without confirming it was actually exercised."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta del trabajo remoto es la falta de contacto humano.",
    "en": "What bothers me about remote work is the lack of human contact.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'what' (the thing that), and is used as the subject or object of a sentence when referring to something non-specific. Que alone cannot open a noun clause as subject without an antecedent."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es importante ___ llegues puntual a la entrevista mañana.",
    "en": "It is important that you arrive on time for the interview tomorrow.",
    "options": [
      "lo que",
      "qué",
      "que",
      "de que"
    ],
    "correct": 2,
    "explanation": "After impersonal expressions like 'es importante', the conjunction que introduces a subjunctive clause. No article or preposition is needed between the impersonal expression and que in this structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en la oficina.",
    "en": "Lately I stress myself out a lot with the delivery deadlines at the office.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "Me estreso is the 'yo y yo' pattern — the subject and the object are the same person (I stress myself). Me estresas would mean 'you stress me out', and me estresa would require a third-person subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "te preocupas",
      "me preocupas",
      "te preocupo"
    ],
    "correct": 2,
    "explanation": "Me preocupas is the 'yo y tú' pattern — a second-person subject (tú) acts on a first-person object (me). The subject is the implicit 'tú' (from llegas), and the speaker is the one being affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir, ___ vivir cerca del mar.",
    "en": "If I could choose, I would live near the sea.",
    "options": [
      "viviré",
      "vivía",
      "viviría",
      "voy a vivir"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple expresses hypothetical or unreal situations, especially in the result clause of a si + imperfecto subjuntivo conditional. Futuro Simple would imply a realistic future plan, not a hypothetical wish."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo reservado — ___ a Madrid el jueves por la tarde.",
    "en": "I have the flight booked — I'm going to Madrid on Thursday afternoon.",
    "options": [
      "iré",
      "voy a viajar",
      "viajaría",
      "viajaba"
    ],
    "correct": 1,
    "explanation": "Voy a + infinitivo is preferred when a future action is already planned and decided, especially with concrete evidence (a booked flight). Iré (Futuro Simple) is more neutral or used for predictions, and would sound less natural here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El meteorólogo dijo que mañana ___ lluvias por la tarde.",
    "en": "The meteorologist said that tomorrow there would be rain in the afternoon.",
    "options": [
      "habrá",
      "habría",
      "hay",
      "haya"
    ],
    "correct": 1,
    "explanation": "After a past reporting verb (dijo que), Spanish uses the Condicional to express a future-in-the-past — the future as seen from a past point in time. Habrá (Futuro) would be used if the reporting verb were in the present."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ balcón y esté bien comunicado.",
    "en": "I'm looking for an apartment that has a balcony and is well-connected.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent is unknown or hypothetical (you haven't found the apartment yet), the subjunctive is required in the relative clause. If you were describing a specific known apartment, the indicative (tiene) would be correct."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the analysis results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuve"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the subjunctive when they refer to future actions that haven't happened yet. The present indicative would be used only to describe habitual or past patterns."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el jefe ___ consciente del estrés que hay en el equipo.",
    "en": "I don't think the boss is aware of the stress in the team.",
    "options": [
      "está",
      "sea",
      "esté",
      "es"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion or belief (no creo que, no pienso que) trigger the subjunctive in the subordinate clause. ESTAR is the appropriate verb for a condition like being aware, so the subjunctive form esté is correct here."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la cena — es una regla de casa.",
    "en": "Please, don't use your phone during dinner — it's a house rule.",
    "options": [
      "uses",
      "usas",
      "use",
      "usar"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive, not the indicative. The negative imperative no uses comes from the subjunctive paradigm (no uses), while the affirmative tú command would be usa (from the indicative)."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen preguntas después de la presentación, ___ sin dudarlo.",
    "en": "If you have questions after the presentation, ask without hesitation.",
    "options": [
      "pregunten",
      "preguntan",
      "pregunten ustedes",
      "preguntar"
    ],
    "correct": 0,
    "explanation": "Ustedes commands — both affirmative and negative — use the third-person plural present subjunctive form. Pregunten is the correct ustedes imperative; preguntan is indicative and cannot be used as a direct command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos de la tarde y Sofía todavía no ha llegado. ¿Crees que ___ perdido el tren?",
    "en": "It's two in the afternoon and Sofía still hasn't arrived. Do you think she might have missed the train?",
    "options": [
      "habrá",
      "hubiera",
      "haya",
      "había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or speculation about something that may have already happened in the past. It translates roughly as 'she must have / might have' and is distinct from the subjunctive haya, which would require a different trigger."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
