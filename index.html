<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 02, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 02, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, even though SER is not typically used for location. Only physical objects and people use ESTAR for location; scheduled events follow the rule SER + location."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Marcos ___ completamente muerto.",
    "en": "After running ten kilometers, Marcos is completely dead tired.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because 'muerto' expresses a temporary state or condition resulting from an action, not an inherent characteristic. When adjectives describe a current physical or emotional state, ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel de chocolate ___ riquísimo — ¿me das la receta?",
    "en": "This chocolate cake is absolutely delicious — will you give me the recipe?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "The adjective 'rico' changes meaning depending on the verb: SER rico means 'to be wealthy,' while ESTAR rico means 'to taste delicious.' Since we are commenting on how the cake tastes right now, ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ___ lista para ayudar a cualquiera que lo necesite.",
    "en": "My grandmother is always ready to help anyone who needs it.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR listo/a means 'to be ready,' whereas SER listo/a means 'to be clever or smart.' Since the sentence describes readiness or preparedness, ESTAR is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, mi padre me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was a child, my father would tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todas las noches' signals a routine, not a single completed event, so Pretérito Imperfecto is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma de incendios.",
    "en": "I was working calmly when suddenly the fire alarm went off.",
    "options": [
      "trabajé",
      "trabajaba",
      "he trabajado",
      "había trabajado"
    ],
    "correct": 1,
    "explanation": "When one action is interrupted by another, the ongoing background action uses the Imperfecto and the interrupting event uses the Indefinido. 'Trabajaba' sets the scene that was interrupted by 'sonó.'"
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Lucía ___ un nuevo trabajo en una empresa de tecnología.",
    "en": "Last year, Lucía found a new job at a technology company.",
    "options": [
      "encontraba",
      "encontró",
      "ha encontrado",
      "hubiera encontrado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for single completed actions at a specific point in the past. 'El año pasado' is a time marker that signals a finished event, making Indefinido the correct tense."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta es que nadie avisa cuando llega tarde a las reuniones.",
    "en": "What bothers me is that nobody gives notice when they are late to meetings.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a nominalizing relative pronoun meaning 'what/the thing that,' referring to something unspecified or abstract. 'Que' alone cannot begin a noun clause in subject position the same way; 'lo que' is needed here."
  },
  {
    "topic": "Usos de QUE",
    "q": "Necesito hablar con la persona con ___ firmaste el contrato.",
    "en": "I need to speak with the person with whom you signed the contract.",
    "options": [
      "que",
      "quien",
      "la que",
      "quién"
    ],
    "correct": 1,
    "explanation": "After prepositions, when the antecedent is a person, both 'quien' and 'el/la que' are correct, but 'quien' is more natural and common in formal speech. 'Que' alone cannot follow a preposition in a relative clause."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo un proyecto urgente, ___ muchísimo y no puedo dormir bien.",
    "en": "When I have an urgent project, I get very stressed and can't sleep well.",
    "options": [
      "me estresan",
      "me estresa",
      "me estreso",
      "te estreso"
    ],
    "correct": 2,
    "explanation": "This is a 'Yo y yo' pattern: the subject and the person affected are the same (I stress myself out). The verb 'estresarse' is reflexive — 'me estreso' means I am the one experiencing and causing my own stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me hablas así de brusco, realmente ___ mucho.",
    "en": "When you talk to me that rudely, you really stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "te estresas",
      "me estresan"
    ],
    "correct": 1,
    "explanation": "This is a 'Yo y tú' pattern: a second person (tú) is causing stress to the speaker (me). The verb agrees with the third-person singular subject 'tú' in this construction: 'me estresa' — you stress me out."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses of the type 'si + Imperfecto de Subjuntivo,' the main clause requires the Condicional Simple. This structure expresses unlikely or contrary-to-fact conditions, not real future plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana tengo la entrevista confirmada — ___ el tren de las nueve.",
    "en": "Tomorrow I have the confirmed interview — I'm going to take the nine o'clock train.",
    "options": [
      "tomaría",
      "tomaré",
      "voy a tomar",
      "tome"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when the action is a concrete, near-future plan already decided upon. It conveys intention and preparation, whereas 'tomaré' (Futuro Simple) sounds more neutral or distant."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "En tu lugar, yo no ___ ese apartamento sin revisar el contrato con cuidado.",
    "en": "In your place, I would not rent that apartment without reviewing the contract carefully.",
    "options": [
      "alquilaré",
      "alquilo",
      "alquilaría",
      "alquile"
    ],
    "correct": 2,
    "explanation": "The expression 'en tu lugar' (in your place) introduces a hypothetical scenario and triggers the Condicional Simple. It is used to give advice by imagining oneself in another person's situation."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el vuelo no ___ retraso esta vez.",
    "en": "I hope the flight doesn't have a delay this time.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "The verb 'esperar que' expresses a wish or hope and triggers the Subjuntivo in the subordinate clause. The rule is: when the subjects of the main and subordinate clauses differ and the main verb expresses desire, use the Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ los resultados del análisis, llámame inmediatamente.",
    "en": "When the test results arrive, call me immediately.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegarían"
    ],
    "correct": 1,
    "explanation": "When 'cuando' refers to a future event rather than a habitual or past situation, the Subjuntivo is required in the subordinate clause. The Indicative would imply the action is already a known, habitual fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el director ___ de acuerdo con esa propuesta tan radical.",
    "en": "I don't think the director will agree with such a radical proposal.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creo que,' 'no pienso que') require the Subjuntivo in the subordinate clause because the speaker is not affirming the truth of the subordinate action, only expressing doubt."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el formulario sin leer las instrucciones primero.",
    "en": "Don't fill out the form without reading the instructions first.",
    "options": [
      "rellenes",
      "rellena",
      "rellene",
      "rellenas"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present Subjuntivo, not the affirmative Imperativo form. For 'rellenar,' the present Subjuntivo tú form is 'rellenes,' which is the correct form for all negative tú commands."
  },
  {
    "topic": "Imperativo",
    "q": "Si no entienden el menú, ___ al camarero sin vergüenza.",
    "en": "If you all don't understand the menu, ask the waiter without embarrassment.",
    "options": [
      "pregunten",
      "pregunten ustedes",
      "preguntan",
      "preguntad"
    ],
    "correct": 0,
    "explanation": "The ustedes affirmative command is formed using the third-person plural of the present Subjuntivo. 'Pregunten' is correct; 'preguntad' is the vosotros command used in Spain, not the ustedes form used in Latin America and formal contexts."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Daniela todavía no ha llegado — ___ perdido con las indicaciones.",
    "en": "It's three in the afternoon and Daniela still hasn't arrived — she must have gotten lost with the directions.",
    "options": [
      "habrá",
      "habrá perdido",
      "habría perdido",
      "hubiera perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that has likely already happened in the recent past. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
