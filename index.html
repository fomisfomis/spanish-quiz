<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 30, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 30, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place, even though location normally uses ESTAR. Events are not 'located' like objects — they 'occur' somewhere, which is treated as a defining characteristic of the event."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary physical states or conditions. The soup's temperature is a current, changeable state, not a permanent or defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en cada momento.",
    "en": "My grandmother is very clever — she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, SER + listo means 'to be clever/smart' as a permanent trait. ESTAR + listo means 'to be ready.' Since we're describing her intelligence as a characteristic, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy débil.",
    "en": "After chemotherapy, the patient is very weak.",
    "options": [
      "es",
      "está",
      "sería",
      "estaría"
    ],
    "correct": 1,
    "explanation": "ESTAR describes a resulting state caused by a specific circumstance or change. The weakness is not an inherent trait of the patient but a condition brought on by treatment, making ESTAR the appropriate choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play soccer every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "jugaría",
      "juegue"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when the frequency is stated explicitly (todos los sábados). The Indefinido would imply a single completed event rather than a regular habit."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Me ___ un mensaje mientras preparaba la cena.",
    "en": "He/she sent me a message while I was making dinner.",
    "options": [
      "mandaba",
      "mandó",
      "mandaría",
      "haya mandado"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another ongoing action in the past, the interrupting event uses Indefinido and the background action uses Imperfecto. 'Preparaba' is the ongoing background, and 'mandó' is the sudden completed interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El mercado ___ lleno de gente y todos ___ buscando gangas.",
    "en": "The market was full of people and everyone was looking for bargains.",
    "options": [
      "estuvo / estaban",
      "estaba / estaban",
      "estuvo / estuvieron",
      "estaba / estuvieron"
    ],
    "correct": 1,
    "explanation": "Both verbs describe the scene or background atmosphere of a past moment — neither represents a completed event. Imperfecto is used to paint a picture of ongoing circumstances, so 'estaba' and 'estaban' are both correct."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie dijo nada durante la reunión.",
    "en": "What surprises me is that nobody said anything during the meeting.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' or 'the thing that,' and is used when there is no specific antecedent. 'Que' alone cannot begin a noun clause as the subject of a sentence without 'lo' in this type of construction."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ hambre tengo después de tanto ejercicio!",
    "en": "How hungry I am after all that exercise!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cuánta"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations before nouns or adjectives to express surprise or intensity. Without the accent, 'que' is a relative pronoun or conjunction and cannot introduce exclamatory sentences of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico, ___ muchísimo y llego a casa de mal humor.",
    "en": "When there's a lot of traffic, I get very stressed and arrive home in a bad mood.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes its own emotional state through a reflexive action, use the first person reflexive (me + verb conjugated for yo). This is the 'yo y yo' pattern — the speaker is both the experiencer and the implicit cause of the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que discutimos, ___ muchísimo con tus comentarios sarcásticos.",
    "en": "Every time we argue, I get really upset by your sarcastic comments.",
    "options": [
      "me enfado",
      "te enfado",
      "me enfadas",
      "se enfada"
    ],
    "correct": 2,
    "explanation": "When another person (tú) causes an emotional reaction in the speaker (yo), use the 'yo y tú' pattern: me + verb conjugated for tú. The subject is 'tú' (your sarcastic comments / you), so the verb agrees with the second person."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + imperfecto de subjuntivo), the main clause requires the Conditional, not the Future. The Condicional expresses what would happen under an unlikely or imaginary condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo reservado — ___ a Madrid el próximo jueves.",
    "en": "I have the flight booked — I'm going to Madrid next Thursday.",
    "options": [
      "iría",
      "voy a ir",
      "fuera",
      "haya ido"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred when a future plan is concrete, already arranged, or decided. The Futuro Simple (iré) would sound more distanced or uncertain here. Context clues like 'tengo el vuelo reservado' confirm it's a fixed plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be more than 35 degrees across the whole region.",
    "options": [
      "haría",
      "va a hacer",
      "hará",
      "hiciera"
    ],
    "correct": 2,
    "explanation": "Both Futuro Simple and 'voy a' are possible, but Futuro Simple is more natural with objective forecasts, official predictions, or when citing external sources (según el pronóstico). It conveys a neutral, factual prediction rather than a personal intention."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ el informe antes del viernes.",
    "en": "It's important that all employees read the report before Friday.",
    "options": [
      "leen",
      "leerán",
      "lean",
      "leyeran"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of obligation or importance (es importante que, es necesario que) trigger the Subjuntivo in the subordinate clause. The Indicativo would be used to state facts, not to express judgment or necessity."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que tu jefe te ___ un aumento este mes.",
    "en": "I don't think your boss will give you a raise this month.",
    "options": [
      "dará",
      "da",
      "dé",
      "dio"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion or belief (no creo que, no pienso que) require the Subjuntivo because they express doubt or denial rather than certainty. Affirmative 'creo que' + Indicativo states a belief as fact; negating it shifts to uncertainty."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as the analysis results come in, I'll call you right away.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaran"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to future events. Although the sentence refers to a future moment, the Indicativo is reserved for habitual or past repeated actions with these connectors."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la puerta al salir, que hace frío.",
    "en": "Hey, close the door on your way out, it's cold.",
    "options": [
      "cierras",
      "cierra",
      "cierres",
      "cerrar"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -ar and stem-changing verbs uses the third-person singular present indicative form. 'Cierra' is correct because it's the tú affirmative command; 'cierres' is the negative command or subjunctive form."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la clase de yoga.",
    "en": "Please, don't use your phone during the yoga class.",
    "options": [
      "usa",
      "usas",
      "uses",
      "usés"
    ],
    "correct": 2,
    "explanation": "Negative tú commands always use the present subjunctive form. While 'usa' is the affirmative command, adding 'no' switches the form to the subjunctive 'uses.' This is a fundamental rule: affirmative and negative commands use different verb forms."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevo llamándote una hora — ¿dónde ___ metido?",
    "en": "I've been calling you for an hour — where on earth have you been?",
    "options": [
      "estarás",
      "habrás estado",
      "estabas",
      "hayas estado"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habré + participio) is used to speculate or make deductions about something that has already happened in the past. Here the speaker is wondering where the other person has been — expressing probability about a completed past situation."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
