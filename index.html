<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 10, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 10, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though SER normally does not indicate location. ESTAR is used for the location of physical objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres horas en el sol, los turistas ___ agotados.",
    "en": "After spending three hours in the sun, the tourists were exhausted.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for temporary states or conditions resulting from an action or circumstance. Here, exhaustion is a temporary state caused by the heat, not a permanent characteristic, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel de chocolate ___ riquísimo — ¡no puedo parar de comerlo!",
    "en": "This chocolate cake is absolutely delicious — I can't stop eating it!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "The adjective 'rico' changes meaning depending on the verb: SER + rico means 'to be wealthy,' while ESTAR + rico means 'to be delicious.' When tasting food and commenting on its flavor, ESTAR is always used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very sharp — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'to be clever or sharp' as an inherent personality trait. ESTAR + listo/a, by contrast, means 'to be ready.' Since the sentence describes an intellectual quality, SER is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) en un pueblo pequeño cerca del mar.",
    "en": "When she was a child, she used to live in a small village near the sea.",
    "options": [
      "vivió",
      "vivía",
      "ha vivido",
      "había vivido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, as well as ongoing background states. 'Cuando era niña' signals a continuous, repeated situation in childhood, which calls for the Imperfecto, not the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) el informe cuando mi jefa entró a la oficina.",
    "en": "I was reading the report when my boss came into the office.",
    "options": [
      "leí",
      "leía",
      "he leído",
      "había leído"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in progress, the background ongoing action uses the Imperfecto and the interrupting completed action uses the Indefinido. 'Leía' describes what was already happening; 'entró' is the interrupting event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer, Marcos ___ (llamar) a su madre tres veces sin conseguir respuesta.",
    "en": "Yesterday, Marcos called his mother three times without getting an answer.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "hubiera llamado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido expresses completed actions or events that happened a specific, countable number of times in the past. 'Tres veces' and 'ayer' are markers of completed, bounded actions, making the Indefinido the correct tense."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie haya dicho nada durante la reunión.",
    "en": "What surprises me is that nobody said anything during the meeting.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what/the thing that,' and it is used as the subject or object of a sentence. 'Que' alone cannot begin a noun clause acting as a subject in this structure; 'lo que' is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es importante ___ los empleados lleguen a tiempo a las reuniones.",
    "en": "It is important that employees arrive on time to meetings.",
    "options": [
      "lo que",
      "qué",
      "que",
      "de que"
    ],
    "correct": 2,
    "explanation": "After impersonal expressions like 'es importante,' 'es necesario,' etc., the connector 'que' introduces the subordinate clause with a verb in the Subjuntivo. No article or preposition is inserted between the impersonal expression and 'que' in standard usage."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cuando tengo un examen importante, ___ muchísimo y no puedo dormir.",
    "en": "When I have an important exam, I stress out a lot and I can't sleep.",
    "options": [
      "me estresa",
      "me estresas",
      "me estreso",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "In the 'yo y yo' pattern, the subject causes the feeling in themselves: 'yo me estreso' (I stress myself out). Compare this with 'me estresas tú' (you stress me out) or 'me estresa el tráfico' (the traffic stresses me out), where the cause is external."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Siempre ___ cuando cancelas los planes a última hora.",
    "en": "I always get upset when you cancel plans at the last minute.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "nos molestamos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) causes a feeling in a first-person object (me). The verb agrees with 'tú' (third person singular in this construction), giving 'me molestas,' meaning 'you bother/upset me.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses (si + Imperfecto Subjuntivo), the main clause uses the Condicional Simple to express what would happen under an unlikely or contrary-to-fact condition. The Futuro Simple cannot be used in the main clause of these hypotheticals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde en toda la región.",
    "en": "According to the forecast, it will rain tomorrow afternoon across the whole region.",
    "options": [
      "llovería",
      "llueve",
      "va a llover",
      "lloviera"
    ],
    "correct": 2,
    "explanation": "'Voy/va a + infinitivo' is preferred for future events that are planned or predicted with evidence in the present, such as a weather forecast. While the Futuro Simple is also grammatically correct, 'va a llover' sounds more natural with an immediate, evidence-based prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Dijo que nos ___ (enviar) el contrato firmado antes del viernes.",
    "en": "He said he would send us the signed contract before Friday.",
    "options": [
      "enviará",
      "envíe",
      "enviaría",
      "va a enviar"
    ],
    "correct": 2,
    "explanation": "When reporting what someone said about a future action (reported speech with a past reporting verb like 'dijo'), the Condicional replaces the Futuro Simple. This is called the 'future of the past,' expressing what was going to happen from a past perspective."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ (hacer) ejercicio moderado todos los días.",
    "en": "The doctor recommends that you do moderate exercise every day.",
    "options": [
      "hagas",
      "haces",
      "harás",
      "harías"
    ],
    "correct": 0,
    "explanation": "Verbs of recommendation, advice, or desire (recomendar, querer, sugerir, etc.) trigger the Subjuntivo in the subordinate clause when there is a change of subject. 'El médico recomienda' is the main clause; 'que hagas' introduces the Subjuntivo with a different subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (abrir) los lunes por la noche.",
    "en": "I don't think that restaurant opens on Monday nights.",
    "options": [
      "abra",
      "abre",
      "abrirá",
      "abría"
    ],
    "correct": 0,
    "explanation": "Negated verbs of opinion or belief (no creo que, no pienso que, no me parece que) require the Subjuntivo in the dependent clause because they express doubt or denial about the truth of a proposition. Affirmative 'creo que' takes the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ (llegar) al aeropuerto.",
    "en": "I will call you as soon as I arrive at the airport.",
    "options": [
      "llegaré",
      "llego",
      "llegue",
      "llegara"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que,' when referring to future events, require the Subjuntivo in the subordinate clause. Since the arrival has not happened yet at the moment of speaking, the Subjuntivo is obligatory."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (poner) la mesa, por favor — los invitados llegan en diez minutos.",
    "en": "Hey, set the table, please — the guests arrive in ten minutes.",
    "options": [
      "pongas",
      "pone",
      "pon",
      "ponga"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of irregular verbs like 'poner' uses a shortened form: 'pon,' not 'pones' or 'pongas.' There is a small group of verbs (poner→pon, hacer→haz, tener→ten, salir→sal, venir→ven, etc.) with these one-syllable irregular imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse) tanto por lo que piensen los demás, Isabel.",
    "en": "Don't worry so much about what other people think, Isabel.",
    "options": [
      "te preocupas",
      "te preocupa",
      "te preocupes",
      "preocúpate"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are formed using the present Subjuntivo with 'no.' For reflexive verbs, the reflexive pronoun 'te' is placed before the verb in negative commands: 'no te preocupes.' In affirmative commands the pronoun would attach to the end: 'preocúpate.'"
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha respondido ningún mensaje. ___ (quedarse) sin batería otra vez.",
    "en": "Marcos hasn't replied to any messages. He must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se queda",
      "Se habrá quedado",
      "Se hubiera quedado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about something that has already happened, equivalent to 'must have + past participle' in English. It allows the speaker to speculate about a past event from a present perspective."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
