<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 17, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 17, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events. ESTAR is used for the location of physical objects and people, but for scheduled events, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo después de tanto tiempo cocinando.",
    "en": "Try this broth — it's absolutely delicious after all that cooking time.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means something tastes good (a perceived, sensory state). SER + rico/a would mean someone is wealthy. Context and meaning shift depending on which verb is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecina ___ viuda desde que murió su marido el año pasado.",
    "en": "My neighbor has been a widow since her husband died last year.",
    "options": [
      "es",
      "está",
      "sería",
      "estaría"
    ],
    "correct": 0,
    "explanation": "SER is used to classify someone's civil or social status, such as being widowed, married, or divorced. Though it results from a change, Spanish treats these as defining identity states with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Creía que era una reunión aburrida, pero el ponente ___ muy listo y nos tuvo a todos enganchados.",
    "en": "I thought it would be a boring meeting, but the speaker was very clever and had us all hooked.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 0,
    "explanation": "SER + listo means 'to be clever or intelligent' (an inherent quality). ESTAR + listo means 'to be ready.' Here the context confirms intellectual ability, so SER in the preterite (fue) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis amigos del barrio.",
    "en": "When I was a child, I used to play football every Saturday with my neighborhood friends.",
    "options": [
      "jugué",
      "jugaré",
      "jugaba",
      "jugaría"
    ],
    "correct": 2,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a routine, making jugaba the correct form rather than jugué, which would imply a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading the report calmly when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "When one ongoing action (Imperfecto: leía) is interrupted by a sudden event, the interrupting action uses the Indefinido (sonó). The Indefinido marks the new, completed event that breaks the background scene."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ lleno, así que decidimos pedir comida a domicilio.",
    "en": "The restaurant was full, so we decided to order home delivery.",
    "options": [
      "fue",
      "estuvo",
      "estaba",
      "estuviera"
    ],
    "correct": 2,
    "explanation": "The Imperfecto (estaba) is used to describe background conditions or states that set the scene for other actions. The fullness of the restaurant is a circumstance, not an event, so Imperfecto is required."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'that which' or 'what.' It replaces a whole idea or thing not previously specified. Que alone would need a clear antecedent, and qué (with accent) is used in direct or indirect questions expressing interrogation."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí en Berlín, ¡no me lo esperaba!",
    "en": "What a pleasant surprise to run into you here in Berlin, I wasn't expecting it!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "Qué with an accent mark is used in exclamatory expressions to express surprise or strong emotion, as in ¡Qué sorpresa! or ¡Qué bonito! It is not interchangeable with que (conjunction) or lo que (noun clause)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay demasiado ruido en la oficina, ___ mucho y no puedo concentrarme.",
    "en": "When there's too much noise in the office, I get very stressed and can't concentrate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 0,
    "explanation": "Me estreso is the 'yo y yo' reflexive pattern — the subject causes their own state. Me estresas would mean 'you stress me out' (yo y tú), and me estresa would need an external third-person subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ con tus comentarios negativos antes de las presentaciones.",
    "en": "Lately you've been making me nervous with your negative comments before presentations.",
    "options": [
      "me pongo nervioso",
      "me pones nervioso",
      "me pone nervioso",
      "me nervioso"
    ],
    "correct": 1,
    "explanation": "Me pones nervioso is the 'yo y tú' pattern — a second-person subject (tú) causes a change of state in the first person (me). Me pongo nervioso would mean I make myself nervous (yo y yo), and me pone nervioso requires a third-person subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ diferente en tu vida diaria?",
    "en": "If you had more free time, what would you do differently in your daily life?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "When the si-clause uses the Imperfecto de Subjuntivo (tuvieras), the main clause requires the Condicional (harías). This is the standard structure for hypothetical or contrary-to-fact conditions in Spanish."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Acabo de ver el cielo: ___ con paraguas porque parece que va a llover en cualquier momento.",
    "en": "I just looked at the sky: I'm going to go out with an umbrella because it looks like it could rain any minute.",
    "options": [
      "saldré",
      "salgo",
      "voy a salir",
      "saldría"
    ],
    "correct": 2,
    "explanation": "Voy a + infinitivo is preferred for plans or intentions based on immediate evidence or context. The speaker just looked at the sky (evidence), making this a near, contextually motivated decision rather than a distant prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el contrato, el nuevo empleado ___ a trabajar el primer lunes de septiembre.",
    "en": "According to the contract, the new employee will start work on the first Monday of September.",
    "options": [
      "empezaría",
      "va a empezar",
      "empiece",
      "empezará"
    ],
    "correct": 3,
    "explanation": "The Futuro Simple (empezará) is used for factual future events, official arrangements, or predictions stated neutrally. The Condicional (empezaría) would imply conditionality or reported speech, which does not match the tone of a contract statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes sin falta.",
    "en": "The boss wants everyone to submit the report by Friday without fail.",
    "options": [
      "entregan",
      "entregarán",
      "entreguen",
      "entregaron"
    ],
    "correct": 2,
    "explanation": "After verbs of wanting or desire (querer, desear) followed by que and a different subject, the Subjuntivo is required. The present subjunctive entreguen is needed because the boss's wish is directed at others."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese método ___ tan efectivo como dicen los anuncios.",
    "en": "I don't think that method is as effective as the ads say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs such as no creer que trigger the Subjuntivo in the subordinate clause because the speaker is casting doubt rather than asserting a fact. Affirmative creer que, by contrast, uses the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo inmediatamente.",
    "en": "As soon as I get the test results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuve"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the Subjuntivo when referring to future events. Although the action is anticipated, it has not yet happened, so the present subjunctive (tenga) is used instead of the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Marta, por favor no ___ el archivo todavía — necesito añadir unas páginas más.",
    "en": "Marta, please don't send the file yet — I need to add a few more pages.",
    "options": [
      "envía",
      "envíes",
      "enviéis",
      "enviará"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present subjunctive, not the affirmative imperative form. No envíes is the correct negative command for tú; no envía would be incorrect and does not exist as a negative imperative."
  },
  {
    "topic": "Imperativo",
    "q": "Si alguien llama a la puerta mientras estoy en la ducha, ___ que vuelva más tarde.",
    "en": "If someone knocks at the door while I'm in the shower, tell them to come back later.",
    "options": [
      "les dices",
      "diles",
      "díles",
      "deciles"
    ],
    "correct": 1,
    "explanation": "Diles is the affirmative tú imperative of decir (irregular: di) with the indirect object pronoun les attached directly to the verb. Pronouns attach to the end of affirmative imperatives and the accent falls naturally without a written accent here."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Rodrigo aún no ha llegado. ___ perdido el último tren.",
    "en": "It's eleven at night and Rodrigo still hasn't arrived. He must have missed the last train.",
    "options": [
      "Habrá",
      "Habrías",
      "Habrá habido",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when the speaker lacks certainty. It is equivalent to 'must have' in English and differs from the Pretérito Perfecto, which states a fact rather than a supposition."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
