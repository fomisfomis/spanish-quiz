<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 03, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 03, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (concerts, meetings, parties), even though location normally uses ESTAR. ESTAR is reserved for the location of people, animals, and physical objects."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de cocinar todo el día, la chef ___ agotada.",
    "en": "After cooking all day, the chef is exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for states or conditions that are the result of a change, especially temporary physical or emotional states. Exhaustion after a long day is a condition, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese queso! ___ malo desde hace una semana.",
    "en": "Don't touch that cheese! It has been bad for a week.",
    "options": [
      "Es",
      "Está",
      "Era",
      "Estaba"
    ],
    "correct": 1,
    "explanation": "With 'malo', SER means someone is evil or morally bad, while ESTAR means something has gone bad or is in poor condition (like spoiled food). Here the cheese has deteriorated, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino siempre tiene una solución para todo — ___ muy listo.",
    "en": "My neighbor always has a solution for everything — he is very clever.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER + listo means someone is clever or smart as an inherent characteristic. ESTAR + listo would mean 'to be ready.' Since we're describing his natural intelligence, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (vivir) en un pueblo pequeño cerca del mar.",
    "en": "When I was a child, I used to live in a small town near the sea.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "había vivido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or ongoing situations in the past with no specific endpoint. 'Cuando era niño' sets a background period, and living somewhere during childhood is an ongoing state, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Nosotros ___ (cenar) tranquilamente cuando de repente sonó la alarma.",
    "en": "We were having dinner calmly when suddenly the alarm went off.",
    "options": [
      "cenamos",
      "cenábamos",
      "hemos cenado",
      "habíamos cenado"
    ],
    "correct": 1,
    "explanation": "In interrupted action sentences, the ongoing background action uses Imperfecto, while the interrupting event uses Indefinido. 'Cenábamos' describes what was in progress when 'sonó' (Indefinido) broke in."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (lanzar) tres nuevos productos al mercado.",
    "en": "Last year, my company launched three new products on the market.",
    "options": [
      "lanzaba",
      "lanzó",
      "lanzaría",
      "ha lanzado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions with a specific time reference. 'El año pasado' marks a closed, finished period, and launching products is a concrete event with a clear endpoint."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás diciendo ahora mismo.",
    "en": "I don't understand what you are telling me right now.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when referring to something unspecified or abstract. 'Que' alone is a conjunction that must follow a specific antecedent, which is absent here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ calor hace hoy — ¡no puedo ni salir a la calle!",
    "en": "What heat there is today — I can't even go outside!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express surprise, admiration, or complaint. In this structure 'qué + noun', it intensifies the emotional reaction and always carries a written accent mark."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que tengo una reunión importante, ___ muchísimo.",
    "en": "Every time I have an important meeting, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional reaction (yo → yo), use the reflexive form with the first-person singular: 'me estreso.' This is the 'Yo y yo' pattern — the subject and the experiencer are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, a second person (tú) causes an emotional reaction in the first person (yo). The verb agrees with the subject (tú → preocupas) and the indirect object pronoun 'me' marks who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses that are contrary to reality (si + Imperfecto de Subjuntivo), the main clause requires the Condicional. The Futuro Simple would imply a real, likely future condition, not a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región norte.",
    "en": "According to the forecast, it will rain tomorrow in the entire northern region.",
    "options": [
      "lloverá",
      "llovería",
      "va a llover",
      "llueva"
    ],
    "correct": 0,
    "explanation": "Both 'lloverá' and 'va a llover' can work here, but Futuro Simple is particularly natural with reported or official forecasts. 'Voy a + infinitivo' tends to express personal intention or immediate plans, while Futuro Simple sounds more formal or objective."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Dijeron que el tren ___ (llegar) a las nueve, pero ya son las diez.",
    "en": "They said the train would arrive at nine, but it is already ten.",
    "options": [
      "llegará",
      "llegaría",
      "va a llegar",
      "llegue"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about the future from a past perspective (reported speech), Spanish uses the Condicional as the 'future in the past.' 'Dijeron que + Condicional' mirrors 'they said it would.'"
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (leer) el nuevo reglamento.",
    "en": "It is important that all employees read the new regulations.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "leerían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es importante que, es necesario que) trigger the Subjuntivo in the subordinate clause. The subjunctive signals that the action is desired or required, not a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Avísame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Let me know as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "Time conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to future events. The arrival hasn't happened yet, so it remains hypothetical and uncertain from the speaker's point of view."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ (tener) terraza y luz natural.",
    "en": "I'm looking for an apartment that has a terrace and natural light.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tendría"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or unknown (the speaker doesn't have a specific apartment in mind), the Subjuntivo is required. If a specific apartment were meant, the indicative 'tiene' would be used."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ (hablar) tan rápido, por favor! No te entiendo.",
    "en": "Don't speak so fast, please! I don't understand you.",
    "options": [
      "habla",
      "hables",
      "hablas",
      "hablarás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present subjunctive form, not the affirmative imperative. The affirmative tú command 'habla' becomes 'no hables' in the negative — the subjunctive is always used for all negative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrochar) sus cinturones de seguridad antes del despegue.",
    "en": "Passengers, fasten your seatbelts before takeoff.",
    "options": [
      "abrochad",
      "abróchense",
      "abrochen",
      "abróchenlos"
    ],
    "correct": 2,
    "explanation": "In Latin America, 'ustedes' is used for all plural commands (both formal and informal), and its imperative form matches the third-person plural of the present subjunctive. 'Abrochad' is the vosotros form used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No sé nada de Marcos desde ayer. ___ (perder) el teléfono otra vez.",
    "en": "I haven't heard from Marcos since yesterday. He must have lost his phone again.",
    "options": [
      "Perderá el teléfono",
      "Habrá perdido el teléfono",
      "Perdió el teléfono",
      "Ha perdido el teléfono"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened. It conveys 'he must have lost' or 'he has probably lost' — speculation about a past event from the present."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
