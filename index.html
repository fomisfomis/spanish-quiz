<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 06, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 06, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. ESTAR is for the physical location of people and objects, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for temporary states or conditions, and the heat of a plate is a temporary, changeable state rather than an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo para su edad — siempre encuentra soluciones creativas.",
    "en": "My grandfather is very clever for his age — he always finds creative solutions.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever/smart' as a permanent trait, while ESTAR + listo means 'ready'. The context here describes an inherent mental quality, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy débil.",
    "en": "After chemotherapy, the patient is very weak.",
    "options": [
      "es",
      "sea",
      "esté",
      "está"
    ],
    "correct": 3,
    "explanation": "ESTAR is used to describe a state resulting from a change or circumstance — the weakness is a temporary condition caused by the treatment, not a defining characteristic of the person."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre me leía un cuento cada noche.",
    "en": "When I was little, my mother used to read me a story every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions and for describing background conditions. 'Era pequeña' sets a repeated background state, and 'leía' reinforces the habitual nature."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo preparaba la cena, mi hijo ___ y me asustó mucho.",
    "en": "While I was making dinner, my son screamed and scared me a lot.",
    "options": [
      "gritaba",
      "gritara",
      "gritó",
      "ha gritado"
    ],
    "correct": 2,
    "explanation": "In interrupted action structures, the ongoing background action uses Imperfecto ('preparaba'), while the sudden interrupting event uses Pretérito Indefinido. The scream was a single completed event that broke the ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mis colegas y yo ___ todas las mañanas en la misma cafetería.",
    "en": "Last year, my colleagues and I had breakfast every morning at the same café.",
    "options": [
      "desayunamos",
      "desayunábamos",
      "desayunáramos",
      "hemos desayunado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes habitual past routines. Although 'el año pasado' can appear with Indefinido for completed single events, here 'todas las mañanas' signals repeated habit, requiring Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta es que nunca llegas a tiempo.",
    "en": "What bothers me is that you never arrive on time.",
    "options": [
      "Qué",
      "Lo que",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what' or 'the thing that', and it is used as the subject of a sentence. 'Qué' without an accent is a conjunction; 'qué' with an accent introduces questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿De ___ estás hablando? No entiendo nada.",
    "en": "What are you talking about? I don't understand anything.",
    "options": [
      "lo que",
      "que",
      "qué",
      "cual"
    ],
    "correct": 2,
    "explanation": "When a preposition precedes an interrogative, the accented 'qué' is required in direct questions. The preposition 'de' stays before 'qué' — you never split the preposition from the interrogative in Spanish."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hablo en público, ___ los nervios.",
    "en": "Every time I speak in public, I get the nerves.",
    "options": [
      "me estreso yo",
      "me estresas",
      "me estresan",
      "se me estresan"
    ],
    "correct": 2,
    "explanation": "This is the 'yo y el mundo' pattern: an external thing (los nervios) causes a reaction in the speaker. The verb agrees with the plural subject 'los nervios', and 'me' is the indirect object pronoun indicating who is affected."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me criticas delante de todos, ___ muchísimo.",
    "en": "When you criticise me in front of everyone, you embarrass me a lot.",
    "options": [
      "me avergüenzo",
      "te avergüenzas",
      "me avergüenzas",
      "nos avergonzamos"
    ],
    "correct": 2,
    "explanation": "This is the 'yo y tú' pattern where the subject (tú) causes an emotional effect on the speaker (me). The verb conjugates for 'tú' and 'me' marks the person experiencing the feeling."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a pottery course.",
    "options": [
      "haré",
      "hago",
      "haría",
      "hiciera"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the main clause requires the Condicional, not the Futuro. The Futuro would imply a real future possibility, but 'si tuviera' signals an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ treinta grados en toda la costa.",
    "en": "According to the forecast, tomorrow it will be thirty degrees along the whole coast.",
    "options": [
      "haría",
      "hiciera",
      "hace",
      "hará"
    ],
    "correct": 3,
    "explanation": "The Futuro Simple is used for predictions about real future events, especially with time markers like 'mañana'. The Condicional would suggest hypothesis or politeness, not a factual prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio con Lucía — ya hemos quedado.",
    "en": "This afternoon I'm going to the gym with Lucía — we've already made plans.",
    "options": [
      "iré",
      "voy a ir",
      "fuera",
      "iría"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already arranged or decided, especially in spoken Spanish. 'Iré' is more appropriate for distant or less certain future events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ menos sal en tus comidas.",
    "en": "The doctor recommends that you use less salt in your meals.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "usarías"
    ],
    "correct": 0,
    "explanation": "Verbs of recommendation and advice (recomendar, aconsejar, sugerir) trigger the Subjuntivo in the subordinate clause when the subjects are different. The structure is: verb of influence + que + different subject + Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ tan bueno como dicen.",
    "en": "I don't think that restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "sería",
      "será"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer', 'no pensar', and 'no parecer' require the Subjuntivo in the dependent clause because the speaker is casting doubt on the proposition."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ el informe, te lo mando de inmediato.",
    "en": "As soon as I finish the report, I'll send it to you right away.",
    "options": [
      "terminaré",
      "termino",
      "termine",
      "terminara"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to future events. Using Indicativo would imply habitual present action, not a future intention."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ la ventana — hace un calor insoportable aquí.",
    "en": "Please open the window — it's unbearably hot in here.",
    "options": [
      "abre",
      "abras",
      "abrir",
      "abrís"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of most verbs is formed using the third-person singular of the present indicative. 'Abre' is the correct affirmative tú command; 'abras' is the subjunctive used only in negative commands."
  },
  {
    "topic": "Imperativo",
    "q": "Chicos, no ___ el móvil durante la reunión, por favor.",
    "en": "Guys, please don't use your phone during the meeting.",
    "options": [
      "uséis",
      "usad",
      "usen",
      "usar"
    ],
    "correct": 0,
    "explanation": "Negative commands in Spanish always use the Subjuntivo. For vosotros, the negative command is formed with the present subjunctive: 'no uséis'. 'Usad' is the affirmative vosotros command and cannot be used in negative form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las once de la noche y Marcos aún no ha llegado. ___ perdido en el metro.",
    "en": "It's eleven at night and Marcos still hasn't arrived. He must have got lost on the metro.",
    "options": [
      "Habrá",
      "Habrá habido",
      "Habrá tenido",
      "Se habrá"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to speculate or make deductions about something that has probably already happened. It expresses probability about a past event from the speaker's present perspective."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
