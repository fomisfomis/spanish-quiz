<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 07, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 07, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to express where and when they take place, even though SER normally does not indicate location. For physical objects, ESTAR indicates location, but for events, SER is the rule."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, la atleta ___ completamente agotada.",
    "en": "After running ten kilometers, the athlete is completely exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary condition or state that results from an action or change. Exhaustion after running is a resulting state, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde la semana pasada.",
    "en": "Don't touch that cheese — it has been bad since last week.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With adjectives like 'malo', SER conveys an inherent quality (a bad person), while ESTAR conveys a condition or state (food that has gone bad). Here the cheese is spoiled, a temporary condition, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre ___ lista para ayudar a cualquier miembro de la familia.",
    "en": "My grandmother is always ready to help any member of the family.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Listo' changes meaning depending on the verb: SER + listo means 'to be clever/smart', while ESTAR + listo means 'to be ready'. Since the sentence refers to being prepared and ready, ESTAR is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los fines de semana con mis amigos.",
    "en": "When I was a child, I used to play football every weekend with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used to describe habitual or repeated actions in the past. The phrase 'todos los fines de semana' is a classic signal of a regular habit, requiring Imperfecto rather than Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras María ___ (preparar) la cena, alguien llamó a la puerta.",
    "en": "While María was preparing dinner, someone knocked on the door.",
    "options": [
      "preparó",
      "preparaba",
      "ha preparado",
      "prepare"
    ],
    "correct": 1,
    "explanation": "When one action is interrupted by another in the past, the ongoing background action uses Imperfecto and the interrupting event uses Indefinido. 'Preparaba' sets the scene that was interrupted by the knock."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally finished the report that I had been preparing for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions at a specific, finished point in the past. 'Ayer' and 'por fin' both signal a single completed event, requiring Indefinido rather than Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you are trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'that which' or 'what', referring to an unspecified thing. It is used when 'what' refers to an entire concept or unknown thing, whereas 'que' is a simple conjunction linking clauses."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien huele este pan recién horneado!",
    "en": "How good this freshly baked bread smells!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express intensity or emotion, equivalent to 'how' or 'what a' in English. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce an exclamation of degree."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo demasiado trabajo acumulado, ___ muchísimo.",
    "en": "When I have too much work piled up, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "se estrés"
    ],
    "correct": 0,
    "explanation": "When the subject causes stress in themselves (Yo y yo pattern), use the first-person reflexive: yo me estreso. This is different from 'me estresas' (you stress me) or 'me estresa' (something stresses me), where an external agent causes the state."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you make me very angry.",
    "options": [
      "me enfado",
      "te enfadas",
      "me enfadas",
      "se enoja"
    ],
    "correct": 2,
    "explanation": "In the Yo y tú pattern, tú (the other person) causes the emotional reaction in me (the speaker). The verb is conjugated in the second person (tú → enfadas) and the object pronoun 'me' shows who receives the emotion."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si encontrara un billete de avión barato, ___ (viajar) a Japón el año que viene.",
    "en": "If I found a cheap plane ticket, I would travel to Japan next year.",
    "options": [
      "viajaré",
      "viajaría",
      "viajo",
      "voy a viajar"
    ],
    "correct": 1,
    "explanation": "In hypothetical or contrary-to-fact conditionals with si + Imperfecto de Subjuntivo, the main clause requires the Condicional Simple. Futuro Simple would be used for real, likely future conditions (si + Presente de Indicativo)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) durante toda la tarde.",
    "en": "According to the forecast, tomorrow it will rain all afternoon.",
    "options": [
      "llovería",
      "llueve",
      "lloverá",
      "va a llover"
    ],
    "correct": 2,
    "explanation": "Futuro Simple is used for predictions or forecasts about the future, especially when citing an external source. Both 'lloverá' and 'va a llover' are possible, but Futuro Simple is more neutral and common with weather forecasts."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "En tu lugar, yo ___ (hablar) con el jefe antes de tomar esa decisión.",
    "en": "In your place, I would speak with the boss before making that decision.",
    "options": [
      "hablaré",
      "hablaría",
      "voy a hablar",
      "hablo"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple is used to give advice or recommendations in a polite, hypothetical way, especially with phrases like 'en tu lugar' or 'yo que tú'. Futuro Simple would imply a definite future action, which is not what is meant here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu hermano ___ (conseguir) el trabajo que tanto desea.",
    "en": "I hope your brother gets the job he wants so much.",
    "options": [
      "consigue",
      "consiguió",
      "consiga",
      "conseguirá"
    ],
    "correct": 2,
    "explanation": "After verbs of hope and wish like 'esperar que', the Subjuntivo Presente is required when there is a change of subject between the main clause and the subordinate clause. The speaker hopes for something regarding another person."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los pasajeros ___ (abrocharse) el cinturón de seguridad.",
    "en": "It is important that all passengers fasten their seatbelts.",
    "options": [
      "se abrochan",
      "se abrochen",
      "se abrocharon",
      "se abrocharán"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions like 'es importante que', 'es necesario que', and 'es recomendable que' always trigger the Subjuntivo in the subordinate clause. They express a general valuation or requirement, not a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ (llegar) al aeropuerto.",
    "en": "I will call you as soon as I arrive at the airport.",
    "options": [
      "llego",
      "llegué",
      "llegue",
      "llegaré"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the Subjuntivo when they refer to a future action that has not yet happened. If referring to habitual or past actions, Indicativo is used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (poner, tú) la mesa mientras yo termino de cocinar, por favor.",
    "en": "Hey, set the table while I finish cooking, please.",
    "options": [
      "pones",
      "pongas",
      "pon",
      "pone"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of irregular verbs like 'poner' uses a special short form: pon (not pone or pongas). The negative tú command (no pongas) uses the Subjuntivo, but the affirmative tú command has its own distinct form."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (decir, tú) nada sobre la fiesta sorpresa a tu hermana.",
    "en": "Please, don't say anything about the surprise party to your sister.",
    "options": [
      "di",
      "digas",
      "dices",
      "decir"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are always formed using the Subjuntivo Presente: no digas, no hagas, no vengas. The affirmative tú imperative 'di' cannot be used in a negative command, so 'no di' is incorrect."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No veo las llaves en la mesa. ___ (dejar, yo) en la oficina.",
    "en": "I don't see the keys on the table. I must have left them at the office.",
    "options": [
      "Dejé",
      "Dejaré",
      "Habré dejado",
      "Hubiera dejado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a past event when viewed from the present. It is equivalent to 'must have done' or 'probably did' in English and conveys uncertainty about what happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
