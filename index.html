<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 05, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 05, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "The location of events uses SER, not ESTAR. ESTAR is used for the location of physical objects and people, but SER is used to indicate where an event takes place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with adjectives that describe a temporary or current state. The soup being hot is a condition right now, not a defining characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo — siempre sabe qué decir en cada situación.",
    "en": "My grandfather is very clever — he always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever/smart' as a permanent trait, while ESTAR + listo means 'to be ready'. Here the context describes a personality characteristic, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy malo.",
    "en": "After the chemotherapy, the patient is very ill.",
    "options": [
      "es",
      "está",
      "fuera",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means 'to be sick/ill' (a temporary condition), whereas SER + malo means 'to be a bad person' (a permanent characteristic). Since the patient's illness is a current state, ESTAR is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was little, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The imperfecto (iba) is used for habitual or repeated past actions. The phrase 'todos los sábados' signals a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras ___ (preparar) la cena, sonó el teléfono.",
    "en": "While I was preparing dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "prepararé"
    ],
    "correct": 1,
    "explanation": "The imperfecto (preparaba) is used for the background action that was already in progress, while the pretérito indefinido (sonó) describes the interrupting event that occurred at a specific moment."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que me habían pedido.",
    "en": "Yesterday I finally finished the report they had asked me for.",
    "options": [
      "terminaba",
      "terminé",
      "terminaré",
      "haya terminado"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido (terminé) is used for a completed action at a specific, defined point in the past. 'Ayer' and 'por fin' are clear signals of a one-time, finished event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir.",
    "en": "I don't understand what you're trying to tell me.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a nominalised relative pronoun meaning 'that which' or 'what', referring to something not previously mentioned. It functions as the direct object of 'entiendo' here."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ vestido tan bonito llevas hoy!",
    "en": "What a beautiful dress you're wearing today!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express surprise or admiration, equivalent to 'what a...!' in English. It carries a strong exclamatory force and always needs the accent mark."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I get very stressed by the deadlines at work.",
    "options": [
      "me estreso",
      "te estreso",
      "me estresas",
      "me estresa"
    ],
    "correct": 3,
    "explanation": "When an external thing causes the feeling, the verb agrees with that thing (los plazos = they stress me), using the 'me estresa' pattern. The subject is 'los plazos', so the verb is in third person, and 'me' is the indirect object pronoun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando no me escuchas, ___ mucho.",
    "en": "When you don't listen to me, you annoy me a lot.",
    "options": [
      "me molesto",
      "me molestas",
      "te molestas",
      "te molesto"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, the other person (tú) is the subject causing the feeling, and 'me' indicates who is affected (yo). The verb conjugates in second person (molestas) with first-person object pronoun (me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "The condicional simple (aprendería) is used in the main clause of a hypothetical 'si' sentence when the 'si' clause uses the imperfecto de subjuntivo. It expresses what would happen under an unlikely or imaginary condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región.",
    "en": "According to the forecast, it will rain throughout the region tomorrow.",
    "options": [
      "llovería",
      "va a llover",
      "llueva",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "Both 'lloverá' (futuro simple) and 'va a llover' are possible for future plans, but 'lloverá' is preferred when citing an external, objective prediction like a weather forecast. 'Va a llover' is more common for personal plans or imminent events."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Le pregunté al mecánico cuánto ___ (costar) reparar el coche.",
    "en": "I asked the mechanic how much it would cost to repair the car.",
    "options": [
      "costará",
      "va a costar",
      "costaría",
      "cueste"
    ],
    "correct": 2,
    "explanation": "In reported speech referring back to a past moment, the condicional (costaría) replaces the futuro simple. When the main verb is in the past (pregunté), a future-in-the-past meaning requires the condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis colegas ___ (llegar) a tiempo a la reunión.",
    "en": "I hope my colleagues arrive on time to the meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegarían"
    ],
    "correct": 1,
    "explanation": "After verbs of hope and wish like 'esperar que', the subjuntivo is required when the subject of the main and subordinate clauses are different. 'Lleguen' is the present subjunctive of 'llegar'."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (ser) tan bueno como dicen.",
    "en": "I don't think this restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated opinion expressions like 'no creo que' trigger the subjunctive in the subordinate clause because they express doubt or denial about the truth of the statement. Affirmative 'creo que' uses the indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) a casa, te llamaré para contártelo todo.",
    "en": "As soon as I get home, I'll call you to tell you everything.",
    "options": [
      "llego",
      "llegue",
      "llegaré",
      "llegaba"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' when referring to a future action, the subjunctive is required. The indicative would imply a habitual or past action instead."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (hablar) tan rápido, por favor — no te entiendo.",
    "en": "Don't speak so fast, please — I can't understand you.",
    "options": [
      "hablas",
      "habla",
      "hables",
      "hablás"
    ],
    "correct": 2,
    "explanation": "Negative tú commands use the present subjunctive form (no hables), not the affirmative imperative (habla). This is a key distinction: negative imperatives always use subjunctive forms in Spanish."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse) los cinturones de seguridad.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochense",
      "abróchense",
      "se abrochen",
      "abrochénse"
    ],
    "correct": 1,
    "explanation": "Ustedes affirmative commands are formed from the subjunctive stem, and when attaching reflexive pronouns, the pronoun goes directly after the verb with an accent mark to preserve the original stress. The correct form is 'abróchense'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las dos de la tarde y Jorge no ha llegado. ___ (perder) el autobús.",
    "en": "It's two in the afternoon and Jorge hasn't arrived. He must have missed the bus.",
    "options": [
      "Perdería el autobús",
      "Habrá perdido el autobús",
      "Habría perdido el autobús",
      "Perderá el autobús"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that happened in the recent past. It is equivalent to 'must have + past participle' in English and signals a logical inference about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
