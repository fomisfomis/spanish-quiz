<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 01, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 01, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta tarde.",
    "en": "The conference is in the main auditorium this afternoon.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. ESTAR is reserved for the physical location of people, objects, and places."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions. The soup being hot is a current, changeable state, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tres meses viajando, Ricardo ___ muy vivo — sobrevivió solo en la selva.",
    "en": "After three months traveling, Ricardo is very much alive — he survived alone in the jungle.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Vivo' with ESTAR means 'alive' (a state of being). With SER, 'es vivo' means 'he is clever/sharp.' Context here is about survival, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este restaurante nuevo ___ increíble — los sabores son únicos.",
    "en": "This new restaurant is incredible — the flavors are unique.",
    "options": [
      "es",
      "está",
      "era",
      "estaba"
    ],
    "correct": 0,
    "explanation": "Although reactions to experiences can use ESTAR (e.g., 'está buenísimo'), describing a restaurant as 'incredible' as a general characteristic or identity uses SER. 'Está increíble' would also be heard colloquially to express a surprised reaction, but SER assigns it as an inherent quality here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions. The word 'siempre' and the general framing of childhood habit signal that this was a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un email importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "había escrito"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the Imperfecto and the interrupting event uses the Indefinido. 'Se fue la luz' is the interruption; writing the email was already in progress."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, Marta ___ un nuevo trabajo en una empresa tecnológica.",
    "en": "Last year, Marta found a new job at a tech company.",
    "options": [
      "encontraba",
      "encontró",
      "ha encontrado",
      "hubiera encontrado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido expresses a completed action at a specific, defined past time. 'El año pasado' is a closed time reference, signaling a single finished event rather than an ongoing or habitual situation."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (= 'the thing that'). It acts as the object of 'entiendo.' 'Que' alone would need a preceding noun to refer to, and 'qué' with an accent is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas podido venir a la boda, ¡te echábamos de menos!",
    "en": "How great that you were able to come to the wedding — we missed you!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express emotion or intensity, equivalent to 'How...!' or 'What...!' in English. It is not a relative pronoun here but an exclamatory word."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "Últimamente ___ mucho con los plazos del trabajo — hay demasiada presión.",
    "en": "Lately I stress a lot about work deadlines — there's too much pressure.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the 'yo y yo' pattern: the subject (yo) performs the action on themselves. Compare: 'me estresas' (you stress me out — yo y tú) or 'me estresa el trabajo' (work stresses me — yo y el mundo)."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "'Me preocupas' follows the 'yo y tú' pattern: the subject (tú) causes the feeling in the speaker (me). The verb agrees with 'tú,' not with 'yo.' This is different from 'me preocupo' (I worry myself) or 'me preocupa algo' (something worries me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "hago",
      "haría",
      "voy a hacer"
    ],
    "correct": 2,
    "explanation": "Hypothetical si-clauses in the present use the Imperfecto de Subjuntivo in the if-clause and the Condicional in the main clause. The Condicional expresses what would happen under an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Termina el informe ahora — el jefe ha dicho que lo necesita mañana. No te preocupes, ___ listo antes de las seis.",
    "en": "Finish the report now — the boss said he needs it tomorrow. Don't worry, it will be ready before six.",
    "options": [
      "estaría",
      "estaré",
      "voy a estar",
      "esté"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple expresses a firm prediction or promise about the future. While 'voy a estar' (option C) also works for planned intentions, 'estaré' here conveys a confident future assertion, which is the most natural choice for reassurance in this context."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Crees que ___ mucha gente en el festival este fin de semana?",
    "en": "Do you think there will be a lot of people at the festival this weekend?",
    "options": [
      "habría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for predictions or assumptions about future events. In questions and statements of speculation about what will happen, the Futuro Simple (habrá) is the standard choice, not the Condicional (habría), which would signal a hypothetical or polite register."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el nuevo protocolo de seguridad.",
    "en": "It is essential that all employees follow the new safety protocol.",
    "options": [
      "siguen",
      "seguirán",
      "sigan",
      "siguieron"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es necesario que, es importante que) trigger the Subjuntivo in the dependent clause. The Indicative would be used if simply stating a fact, not expressing a subjective judgment."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ el resultado del análisis.",
    "en": "Call me as soon as you get the test result.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to future events. When these conjunctions refer to habitual present or past facts, they use the Indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que tenga luz natural.",
    "en": "I'm looking for an apartment that is close to the metro and has natural light.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (the speaker doesn't know if such an apartment exists), the Subjuntivo is required. If the apartment were known and specific, the Indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ¡___ eso con el cliente antes de que llegue a la reunión!",
    "en": "Hey, talk to the client about that before he arrives at the meeting!",
    "options": [
      "hablas",
      "habla",
      "hables",
      "hablar"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed using the third-person singular present indicative (habla). The subjunctive form 'hables' is used for negative tú commands (no hables), not affirmative ones."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el móvil durante la cena — es una norma en casa.",
    "en": "Don't use your phone during dinner — it's a house rule.",
    "options": [
      "usa",
      "usas",
      "uses",
      "usar"
    ],
    "correct": 2,
    "explanation": "Negative tú imperatives are formed with the present subjunctive (no uses, no hables, no comas). The affirmative form 'usa' cannot be used after 'no' as a command; the subjunctive is mandatory."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las diez de la noche y Pablo aún no ha llegado. ___ perdido en el nuevo barrio.",
    "en": "It's ten at night and Pablo still hasn't arrived. He must have gotten lost in the new neighborhood.",
    "options": [
      "Se habrá perdido",
      "Se perderá",
      "Se hubiera perdido",
      "Se perdería"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about something that may have already happened. It is the Spanish equivalent of 'must have + past participle' when speculating about a past event from the present perspective."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
