<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 19, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 19, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de música ___ en el parque central este fin de semana.",
    "en": "The music festival is in the central park this weekend.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: ESTAR for the physical location of objects and people, SER for the location of events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary state or condition, such as temperature at a given moment. SER would imply an inherent, permanent characteristic of the substance."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi suegra ___ muy lista — siempre sabe cómo resolver los problemas.",
    "en": "My mother-in-law is very clever — she always knows how to solve problems.",
    "options": [
      "está",
      "es",
      "estará",
      "sería"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, SER + listo/a means 'to be clever/smart' as an inherent trait, while ESTAR + listo/a means 'to be ready.' Here the context confirms we mean intelligence, so SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de comer toda la pizza él solo, Miguel ___ un poco avergonzado.",
    "en": "After eating all the pizza by himself, Miguel was a little embarrassed.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR describes an emotional state resulting from a specific situation or circumstance. SER would suggest that being embarrassed is a defining, permanent characteristic of Miguel's personality, which is not the intended meaning."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play football every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaría",
      "jugaba",
      "he jugado"
    ],
    "correct": 2,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past — things that happened regularly over an unspecified period. The clue words 'cuando era niño' and 'todos los sábados' signal a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leyó",
      "leía",
      "había leído"
    ],
    "correct": 2,
    "explanation": "In interrupted action structures, the background or ongoing action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Leía' sets the scene; 'sonó' is the sudden completed event that cuts it short."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, la empresa ___ (contratar) a veinte nuevos empleados en junio.",
    "en": "Last year, the company hired twenty new employees in June.",
    "options": [
      "contrataba",
      "contrató",
      "contrate",
      "ha contratado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for single, completed actions that happened at a specific moment in the past. The time reference 'el año pasado… en junio' pins this to a definite, closed point in time."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to say to me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' and it is used when the object of a verb is an entire clause with no specific antecedent noun. 'Que' alone cannot act as the object here without a preceding noun."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí después de tantos años!",
    "en": "What a pleasant surprise to find you here after so many years!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory sentences to express surprise or strong emotion, equivalent to 'What a…!' in English. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la autopista, ___ muchísimo.",
    "en": "When there is a lot of traffic on the motorway, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject is 'yo' and the stress is self-generated or triggered by a situation (not a specific person acting on you), the verb agrees with the first person: 'yo me estreso.' This is the 'yo y yo' pattern — you are both the subject and the object of the action."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Oye, cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Hey, every time you arrive late without warning, you make me really worried.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "me preocupan"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, the subject performing the action is 'tú,' which affects 'me' (the first person). The verb therefore conjugates in the third person… wait — no, it conjugates in the second person: 'tú me preocupas,' because 'tú' is the grammatical subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is used in the main clause of hypothetical si-clauses where the condition is contrary to current reality (Si + Imperfecto de Subjuntivo → Condicional). The Futuro Simple cannot be used in this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (hacer) mucho calor en toda la región.",
    "en": "According to the forecast, tomorrow it will be very hot throughout the region.",
    "options": [
      "haría",
      "hará",
      "va a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "Both 'hará' (Futuro Simple) and 'va a hacer' can express future plans or predictions, but 'hará' is typically used for more distant or formally stated predictions, such as weather forecasts. Option C is grammatically correct but less natural for cited forecast contexts."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me ___ (poder) ayudar a mover este sofá un momento, por favor?",
    "en": "Could you help me move this sofa for a moment, please?",
    "options": [
      "podrás",
      "puedes",
      "podrías",
      "puedas"
    ],
    "correct": 2,
    "explanation": "The Condicional is used to make polite requests, softening the directness of a demand. 'Podrías' is more courteous than 'podrás' (Futuro), which sounds more like a direct expectation than a polite ask."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Hemos decidido que el próximo verano ___ (ir) a Japón en lugar de a Tailandia.",
    "en": "We've decided that next summer we are going to Japan instead of Thailand.",
    "options": [
      "iríamos",
      "vamos a ir",
      "vayamos",
      "iremos"
    ],
    "correct": 1,
    "explanation": "'Voy/vamos a + infinitivo' is typically used for plans or intentions that have already been decided or arranged, emphasising the speaker's commitment. 'Iremos' is also possible but sounds less certain than a firm, already-made plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres quieren que yo ___ (llamar) más a menudo.",
    "en": "My parents want me to call more often.",
    "options": [
      "llamo",
      "llamaré",
      "llame",
      "llamaba"
    ],
    "correct": 2,
    "explanation": "After verbs of desire or wish (querer, desear, esperar) followed by 'que' and a change of subject, the verb in the subordinate clause must be in the Subjuntivo. The rule is: different subject + desire verb + que → Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los pasajeros ___ (llevar) el cinturón abrochado.",
    "en": "It is essential that all passengers wear their seatbelt fastened.",
    "options": [
      "llevan",
      "llevarán",
      "lleven",
      "llevaría"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of obligation or necessity (es fundamental, es importante, es necesario) + que always trigger the Subjuntivo in the following clause because they express a subjective judgment or requirement rather than a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ (terminar) la reunión, te mando un mensaje para quedar.",
    "en": "When the meeting finishes, I'll send you a message to make plans.",
    "options": [
      "termina",
      "terminará",
      "termine",
      "terminaba"
    ],
    "correct": 2,
    "explanation": "When 'cuando' introduces a future time clause (the meeting hasn't finished yet), the verb must be in the Subjuntivo, not the Indicativo or Futuro. This is one of the key triggers: temporal conjunctions referring to future events require Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse) tanto por los detalles — el resultado final es lo que importa. (tú)",
    "en": "Don't worry so much about the details — the final result is what matters.",
    "options": [
      "te preocupes",
      "te preocupa",
      "preocúpate",
      "te preocuparás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present Subjuntivo form with the pronoun placed before the verb: 'no te preocupes.' For affirmative commands the pronoun attaches to the end ('preocúpate'), but in the negative construction this reversal is obligatory."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (sentarse) donde prefieran, señores. (ustedes)",
    "en": "Please sit wherever you prefer, ladies and gentlemen.",
    "options": [
      "siéntense",
      "siéntense ustedes",
      "se sientan",
      "sentaos"
    ],
    "correct": 0,
    "explanation": "The ustedes affirmative command is formed from the third-person plural of the present Subjuntivo. For reflexive verbs, the pronoun 'se' attaches to the end of the imperative form: 'siéntense.' 'Sentaos' is the vosotros form, not used with ustedes."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ (quedarse) dormido en el sofá otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep on the sofa again.",
    "options": [
      "Se habrá quedado",
      "Se quedará",
      "Se había quedado",
      "Se haya quedado"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past — equivalent to 'must have + past participle' in English. It frames speculation about a completed event from a present-tense perspective."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
