<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 05, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 05, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, and the temperature of food at a given moment is a changeable condition, not a permanent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Pensé que el examen iba a ser fácil, pero ___ muy difícil.",
    "en": "I thought the exam was going to be easy, but it was very difficult.",
    "options": [
      "fue",
      "estuvo",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR + adjective signals a change from an expected state or a surprising condition — here the speaker is expressing that the exam turned out differently than expected. This change-of-state meaning requires ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado con él! Dicen que ___ muy listo y puede engañarte fácilmente.",
    "en": "Watch out for him! They say he's very clever and can trick you easily.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'clever/smart' (an inherent quality), while ESTAR means 'ready'. Since the sentence refers to a personality trait, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) en un pequeño pueblo cerca del mar.",
    "en": "When I was a child, I used to live in a small village near the sea.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, as well as ongoing background situations. 'Cuando era niña' signals a general past period, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (ducharse) cuando de repente se fue la luz.",
    "en": "I was showering when suddenly the power went out.",
    "options": [
      "me duché",
      "me duchaba",
      "me había duchado",
      "me duche"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted. The interrupting event ('se fue la luz') uses Indefinido, while the action in progress uses Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer mi jefe me ___ (llamar) tres veces para preguntarme sobre el informe.",
    "en": "Yesterday my boss called me three times to ask about the report.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llamara"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions in the past with a defined number of occurrences. 'Tres veces' and 'ayer' signal a finished, countable event, making Indefinido the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con esa actitud.",
    "en": "I don't understand what you're trying to tell me with that attitude.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what/that which', used when there is no specific noun antecedent. 'Que' alone would need a noun before it, and 'qué' is for direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ casa tan acogedora tienes. Me encanta la decoración.",
    "en": "What a cosy house you have. I love the decoration.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' is used in exclamatory sentences to express admiration or surprise, often followed directly by a noun. 'Lo que' and 'que' do not carry exclamatory force in this structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get very stressed.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and the object of the stress are the same person (yo), a simple reflexive form is used: 'me estreso' — the 'yo' pattern where the self affects the self. 'Me estresa' would need an external subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando llegas tarde sin avisar. Por favor, sé más considerado.",
    "en": "You always stress me out when you arrive late without warning. Please be more considerate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes an emotional effect on the speaker (yo), the verb conjugates in the second person: 'me estresas' — the 'yo y tú' pattern where another person acts on the speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir cualquier destino, ___ (viajar) a Japón sin dudarlo.",
    "en": "If I could choose any destination, I would travel to Japan without hesitation.",
    "options": [
      "viajaré",
      "voy a viajar",
      "viaje",
      "viajaría"
    ],
    "correct": 3,
    "explanation": "In hypothetical 'si' clauses of the type si + Imperfecto Subjuntivo, the main clause must use the Condicional Simple, not the Futuro. The Condicional expresses what would happen under an unreal or imagined condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira las nubes que hay. Creo que ___ (llover) esta tarde.",
    "en": "Look at those clouds. I think it's going to rain this afternoon.",
    "options": [
      "llovería",
      "lloverá",
      "voy a llover",
      "llueva"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple expresses a prediction or expectation about something that will happen. Both 'lloverá' and 'va a llover' can work here, but when introduced by 'creo que', Futuro Simple signals a confident future prediction based on evidence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "— ¿Por qué no me dijiste nada? — ___ (poder) al menos enviarme un mensaje.",
    "en": "— Why didn't you tell me anything? — You could have at least sent me a message.",
    "options": [
      "Puedes",
      "Podrías",
      "Podrás",
      "Puedas"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple is used to express polite suggestions, reproaches, or hypothetical advice about the past or present. 'Podrías' here implies 'you could/should have', which is a softer, more indirect criticism than the present tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis padres ___ (entender) mi decisión de cambiar de carrera.",
    "en": "I hope my parents understand my decision to change careers.",
    "options": [
      "entienden",
      "entiendan",
      "entenderán",
      "entendieran"
    ],
    "correct": 1,
    "explanation": "After verbs of hope and desire like 'esperar que', the Subjuntivo is required because the main clause expresses a wish about a different subject. The present subjunctive is used when the action refers to the present or future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante del barrio ___ (ser) tan bueno como dicen.",
    "en": "I don't think the new neighbourhood restaurant is as good as they say.",
    "options": [
      "es",
      "será",
      "sea",
      "fuera"
    ],
    "correct": 2,
    "explanation": "Negated verbs of opinion such as 'no creer que' trigger the Subjuntivo because the speaker is expressing doubt or denial. If the opinion were positive ('creo que es'), the Indicativo would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) la reunión, te mando los documentos por correo.",
    "en": "As soon as the meeting finishes, I'll send you the documents by email.",
    "options": [
      "termina",
      "termine",
      "terminará",
      "terminó"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que', when the action refers to a future event that has not yet occurred, the Subjuntivo must be used, not the Indicativo or Futuro."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (decirme) la verdad de una vez. Puedo manejarlo.",
    "en": "Hey, tell me the truth once and for all. I can handle it.",
    "options": [
      "me dices",
      "dime",
      "me digas",
      "dígame"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of 'decir' is irregular: 'di'. With a reflexive or indirect object pronoun, the pronoun attaches to the end of the imperative form, giving 'dime'. Negative commands use the subjunctive: 'no me digas'."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (preocuparse) tanto por cosas que no podéis controlar.",
    "en": "Please, don't worry so much about things you can't control. (addressing a group)",
    "options": [
      "os preocupéis",
      "os preocupáis",
      "se preocupen",
      "preocupaos"
    ],
    "correct": 0,
    "explanation": "Negative vosotros commands use the present subjunctive: 'no os preocupéis'. The reflexive pronoun 'os' precedes the verb in negative commands, unlike affirmative commands where it attaches to the verb form ('preocupaos')."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Pedro todavía no ha llegado. ___ (perderse) con las indicaciones que le di.",
    "en": "It's three in the afternoon and Pedro still hasn't arrived. He must have got lost with the directions I gave him.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdió",
      "Se hubiera perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used in Spanish to express probability or deduction about something that likely happened in the recent past. It is the equivalent of 'must have done' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
