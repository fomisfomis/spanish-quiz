<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 16, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 16, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso de medicina ___ en el hotel Meliá este año.",
    "en": "The medical congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though SER is not normally used for location. This is a classic exception: the location of an event uses SER, not ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, including temperature that something currently has. The soup's heat is a current, changeable condition, not a defining characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres horas en la reunión, todos ___ aburridos.",
    "en": "After spending three hours in the meeting, everyone was bored.",
    "options": [
      "eran",
      "estaban",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR + aburrido means 'to feel bored' — a temporary emotional state. SER + aburrido would mean 'to be a boring person' by nature. The context of a long meeting signals a temporary condition."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué rico ___ este ceviche! Lo han preparado con mucho cuidado.",
    "en": "How delicious this ceviche is! They prepared it with great care.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'to taste/be delicious' — a sensory experience in the moment. SER + rico means 'to be rich (wealthy)' or describes an inherent characteristic, not how something tastes right now."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ al parque todos los sábados con mi abuela.",
    "en": "When I was a child, I used to go to the park every Saturday with my grandmother.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' (every Saturday) signals a routine, which calls for Imperfecto, not Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, sonó el teléfono.",
    "en": "While I was making dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "preparo",
      "había preparado"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the ongoing background action uses Imperfecto (preparaba) and the sudden interruption uses Indefinido (sonó). The 'mientras' clause describes what was in progress."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ la novela que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the novel I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "Indefinido (terminé) marks a completed event with a clear endpoint. The word 'ayer' and 'por fin' signal a finished, one-time action, not an ongoing state or habit — key signals for Pretérito Indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what' (the thing that). It replaces a noun and is used when 'what' refers to something non-specific. 'Qué' with accent mark introduces direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo — ¡llevas meses buscando!",
    "en": "How great that you got the job — you've been looking for months!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to intensify an adjective, adverb, or noun: ¡Qué bien!, ¡Qué suerte! It expresses surprise or strong emotion, distinct from 'que' (conjunction) or 'lo que' (noun clause)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo que tengo pendiente.",
    "en": "Lately I stress out a lot with all the work I have pending.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' (yo + yo pattern) means the subject causes their own stress — a reflexive action where the person acts upon themselves. Compare: 'me estresas' (you stress me out) or 'me estresa el trabajo' (work stresses me out)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "'Me preocupas' (yo y tú pattern) means 'you cause worry in me' — the subject (tú) acts on the speaker (me). This differs from 'me preocupo' (I worry myself) or 'me preocupa' + noun (something worries me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses with Imperfecto de Subjuntivo (si tuviera), the main clause requires the Condicional (haría). The Futuro Simple (haré) is used for real future plans, not hypothetical ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "He comprado los ingredientes — esta noche ___ paella para todos.",
    "en": "I've bought the ingredients — tonight I'm going to make paella for everyone.",
    "options": [
      "haría",
      "hago",
      "voy a hacer",
      "hiciera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future plan with clear intention or evidence (the ingredients are already bought). It is preferred over Futuro Simple when there is an established plan or present evidence pointing to the action."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be more than 35 degrees across the whole region.",
    "options": [
      "habría",
      "habrá",
      "va a haber",
      "hay"
    ],
    "correct": 1,
    "explanation": "Futuro Simple (habrá) is used for predictions or forecasts, especially from an external source. While 'va a haber' is also possible, 'habrá' is more natural for weather forecasts and objective future predictions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi jefa insiste en que ___ el informe antes del viernes.",
    "en": "My boss insists that I finish the report before Friday.",
    "options": [
      "termino",
      "terminé",
      "termine",
      "terminaré"
    ],
    "correct": 2,
    "explanation": "Verbs of volition or insistence (insistir en que, querer que, pedir que) trigger the Subjunctive in the subordinate clause when the subjects are different. 'Termine' is the present subjunctive of terminar."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ de trabajar, llámame y quedamos.",
    "en": "As soon as you finish work, call me and we'll meet up.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminaste"
    ],
    "correct": 2,
    "explanation": "Time conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjunctive when they refer to a future action. If they referred to a habitual or past action, the Indicative would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ tan bueno como dicen.",
    "en": "I don't think that restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "fue",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creo que', 'no pienso que', and 'no me parece que' require the Subjunctive because the speaker is expressing doubt or denial. The affirmative 'creo que' would take the Indicative."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ eso en la mesa — ponlo en el cajón!",
    "en": "Don't leave that on the table — put it in the drawer!",
    "options": [
      "dejas",
      "dejes",
      "deja",
      "dejés"
    ],
    "correct": 1,
    "explanation": "Negative commands for 'tú' use the present subjunctive form: no dejes, no hagas, no digas. The affirmative tú command 'deja' cannot be used after 'no' — the subjunctive is required for all negative imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus documentos listos antes de pasar por el control.",
    "en": "Passengers, please have your documents ready before going through security.",
    "options": [
      "tened",
      "tenga",
      "tengan",
      "tienen"
    ],
    "correct": 2,
    "explanation": "In Latin American Spanish, 'ustedes' is used for both formal and informal plural commands, and its imperative form comes from the present subjunctive: tengan, hablen, escriban. In Spain, 'vosotros' would use 'tened'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta al teléfono. ___ salido ya a cenar.",
    "en": "He's not answering the phone. He must have already gone out for dinner.",
    "options": [
      "Habrá",
      "Había",
      "Ha",
      "Hubiera"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when seen from the present. It implies 'I suppose/he must have...' — a key use distinct from simple past narration."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
