<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 18, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 18, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de esta noche ___ en el parque central.",
    "en": "Tonight's concert is in the central park.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate location, not ESTAR. Even though location normally uses ESTAR, events (concerts, weddings, meetings) are an exception and require SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary conditions or states, and temperature as a current condition of an object is temporary. SER would imply that being hot is a permanent, defining characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué a casa, mi abuela ___ viva, pero muy débil.",
    "en": "When I arrived home, my grandmother was alive, but very weak.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with 'vivo/a' when it means currently alive (a state), whereas SER + vivo would mean 'lively or clever'. Since this describes a temporary physical state, ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué rico ___ este ceviche! No puedo parar de comer.",
    "en": "This ceviche is so delicious! I can't stop eating.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With 'rico', ESTAR means 'tastes delicious' (a sensory experience), while SER + rico means 'to be wealthy'. When describing how food tastes in the moment, always use ESTAR."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cada verano, mi familia ___ a la misma playa en Galicia.",
    "en": "Every summer, my family used to go to the same beach in Galicia.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "irá"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The key phrase 'cada verano' signals a recurring action, ruling out the indefinido which marks a completed, one-time event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, alguien llamó a la puerta.",
    "en": "While I was making dinner, someone knocked on the door.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "preparo"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in progress, the background/ongoing action uses imperfecto and the interrupting action uses indefinido. 'Preparaba' sets the ongoing scene; 'llamó' is the sudden event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el libro que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the book I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The indefinido marks a completed action with a clear endpoint. 'Por fin' and 'ayer' are strong markers of a single, finished event. The imperfecto would suggest an ongoing or habitual action, which contradicts the meaning."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'that which' or 'what', referring to an entire idea or concept. 'Que' alone would need a clear antecedent noun, and 'qué' with an accent is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonita está la ciudad con todas las luces de Navidad.",
    "en": "How beautiful the city looks with all the Christmas lights.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express surprise or admiration. Without the accent, 'que' is a conjunction or relative pronoun, neither of which fits an exclamation structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get very stressed.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "se estresa"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the Yo + Yo pattern: the subject (yo) performs and experiences the action themselves. 'Me estresa' would require an external subject (el tráfico) causing stress to me, and 'me estresas' would mean you (tú) stress me."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas los planes en el último momento, ___ mucho.",
    "en": "Every time you cancel plans at the last minute, you upset me a lot.",
    "options": [
      "me molesto",
      "me molestas",
      "me molesta",
      "nos molestamos"
    ],
    "correct": 1,
    "explanation": "'Me molestas' follows the Yo + Tú pattern: tú is the subject causing the effect, and me is the indirect object experiencing it. 'Me molesto' would mean I upset myself, and 'me molesta' needs a third-person subject like 'eso'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "hago"
    ],
    "correct": 1,
    "explanation": "The conditional (haría) is required in the main clause of a hypothetical si + imperfecto subjuntivo sentence. The futuro simple (haré) is used for real future plans, not hypothetical or contrary-to-fact conditions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Oye, esta tarde ___ al supermercado, ¿necesitas algo?",
    "en": "Hey, I'm going to the supermarket this afternoon — do you need anything?",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fui"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans already decided or with clear present context, especially in informal spoken Spanish. 'Iré' sounds more formal or distant, and 'iría' is conditional, implying a hypothetical."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el parte meteorológico, mañana ___ lluvias en el norte del país.",
    "en": "According to the weather forecast, there will be rain in the north of the country tomorrow.",
    "options": [
      "habrían",
      "habría",
      "habrá",
      "haya"
    ],
    "correct": 2,
    "explanation": "The futuro simple is used for factual predictions and forecasts about future events. The conditional (habría) would be used for hypothetical situations or reported speech, not straightforward future statements."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu hermano ___ bien después de la operación.",
    "en": "I hope your brother recovers well after the operation.",
    "options": [
      "se recupera",
      "se recupere",
      "se recuperará",
      "se recuperaría"
    ],
    "correct": 1,
    "explanation": "After verbs of hope and desire like 'esperar que', the subjuntivo is required when the subject of the subordinate clause is different from the main clause. The indicative 'se recupera' would incorrectly present the recovery as a known fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del trabajo.",
    "en": "Call me as soon as you get news about the job.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tenías"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' referring to a future event, the subjuntivo is required. The indicative is only used when referring to habitual or past situations."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el jefe ___ razón en ese asunto tan delicado.",
    "en": "I don't think the boss is right about that sensitive matter.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' trigger the subjuntivo because the speaker is expressing doubt or disbelief rather than asserting a fact. Affirmed 'creo que' would take the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es una norma de la empresa.",
    "en": "Please don't use your phone during the meeting — it's a company rule.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjuntivo form. 'No uses' is the negative imperative for tú, because in Spanish negative commands are always formed with the subjuntivo, unlike affirmative commands which use a special form."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen alguna pregunta sobre el contrato, ___ sin dudarlo.",
    "en": "If you (all) have any questions about the contract, ask without hesitation.",
    "options": [
      "pregunten",
      "pregunten ustedes",
      "preguntar",
      "preguntan"
    ],
    "correct": 0,
    "explanation": "Ustedes commands use the third-person plural present subjuntivo form. 'Pregunten' is the correct affirmative imperative for ustedes. The infinitive 'preguntar' cannot function as a direct command in standard Spanish."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Lucía no ha llegado. ___ perdido el autobús.",
    "en": "It's three in the afternoon and Lucía hasn't arrived. She must have missed the bus.",
    "options": [
      "Habrá",
      "Habría",
      "Habrá sido",
      "Ha"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about a past event from a present-time perspective. It is equivalent to 'she must have...' or 'she has probably...' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
