<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 12, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 12, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de esta noche ___ en el parque central.",
    "en": "Tonight's concert is in the central park.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Use SER to indicate the location of events (concerts, weddings, meetings). ESTAR is used for the location of physical objects and people, but events are considered a defining characteristic expressed with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tanto trabajar, Marcos ___ completamente listo para irse a casa.",
    "en": "After working so much, Marcos is completely ready to go home.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, context matters: 'ser listo' means to be clever/smart (permanent trait), while 'estar listo' means to be ready (a current state). Here the context of being prepared to leave signals a state, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este queso importado de Francia ___ riquísimo — ¡nunca había probado algo igual!",
    "en": "This imported cheese from France is absolutely delicious — I had never tasted anything like it!",
    "options": [
      "es",
      "está",
      "sería",
      "estaría"
    ],
    "correct": 1,
    "explanation": "'Estar rico' means something tastes/feels delicious right now (a sensory experience in the moment), whereas 'ser rico' means to be wealthy or inherently rich. When commenting on how food tastes, Spanish speakers use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela, aunque tiene ochenta años, ___ muy viva y llena de energía.",
    "en": "My grandmother, even though she is eighty years old, is very lively and full of energy.",
    "options": [
      "es",
      "está",
      "fue",
      "era"
    ],
    "correct": 0,
    "explanation": "'Ser vivo/a' means to be sharp, lively, or quick-witted (a personality trait), while 'estar vivo/a' means to be alive (a biological state). Here the sentence describes her energetic personality, so SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, todos los veranos ___ (nosotros) a la misma playa en el sur.",
    "en": "When I was a child, every summer we went to the same beach in the south.",
    "options": [
      "fuimos",
      "íbamos",
      "vamos",
      "hayamos ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when phrases like 'todos los veranos' (every summer) signal routine. The Indefinido would imply a single completed trip rather than a recurring habit."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba hablando por teléfono cuando de repente ___ la alarma de incendios.",
    "en": "I was talking on the phone when suddenly the fire alarm went off.",
    "options": [
      "sonaba",
      "sonó",
      "suena",
      "sonara"
    ],
    "correct": 1,
    "explanation": "The classic interrupted-action pattern uses Imperfecto for the ongoing background action ('estaba hablando') and Pretérito Indefinido for the sudden interrupting event. 'Sonó' is the completed, punctual event that cut into the continuous action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El mercado ___ lleno de gente y olía a especias cuando llegamos por primera vez.",
    "en": "The market was full of people and smelled of spices when we arrived for the first time.",
    "options": [
      "estuvo",
      "estaba",
      "está",
      "estaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used to set the scene or describe background conditions in a past narrative. 'Estaba lleno' describes the state of the market as background context, not a completed action, which is why ESTAR in Imperfecto is correct here."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a relative pronoun meaning 'what/that which' and is used when there is no specific antecedent noun — it refers to a whole concept or idea. 'Que' alone would need a noun to follow, and 'qué' (with accent) is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿Es ___ no tienes ganas de salir esta noche o simplemente estás cansado?",
    "en": "Is it that you don't feel like going out tonight, or are you just tired?",
    "options": [
      "lo que",
      "qué",
      "que",
      "el que"
    ],
    "correct": 2,
    "explanation": "The construction 'es que' is a set phrase used to introduce an explanation or justification. It literally means 'it is that...' and is extremely common in spoken Spanish. Neither 'lo que' nor 'qué' fits this fixed idiomatic structure."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo por las mañanas.",
    "en": "When there is a lot of traffic in the city, I get really stressed in the mornings.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresas tú"
    ],
    "correct": 0,
    "explanation": "When the subject causes stress upon themselves (Yo y yo pattern), use the first-person reflexive: 'me estreso' = I stress myself / I get stressed. 'Me estresa' would be used when an external thing (like traffic as subject) stresses you, and 'me estresas' when another person (tú) stresses you."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho porque no sé dónde estás.",
    "en": "When you arrive late without telling me, you worry me a lot because I don't know where you are.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "nos preocupamos"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, the subject is 'tú' and the person affected is 'yo' (me). 'Me preocupas' = you (tú) worry me. 'Me preocupo' would mean I worry myself, and 'me preocupa' would require a third-person or thing as the grammatical subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomara"
    ],
    "correct": 1,
    "explanation": "Hypothetical 'si' clauses with the Imperfecto de Subjuntivo in the condition clause require the Condicional in the result clause. Futuro Simple ('tomaré') would be used with 'si' + Presente to express a likely/real future condition, not a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región mediterránea.",
    "en": "According to the forecast, tomorrow it will be very hot throughout the Mediterranean region.",
    "options": [
      "haría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is used for facts, predictions, and objective statements about the future. The Condicional ('haría') is used for hypothetical situations or polite requests, not straightforward weather forecasts based on real data."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo muchas ganas de descansar. Esta tarde ___ a darme un baño largo y a leer.",
    "en": "I really feel like relaxing. This afternoon I'm going to take a long bath and read.",
    "options": [
      "iré",
      "voy",
      "voy a ir",
      "iría"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (periphrastic future) expresses intentions or plans that feel imminent and personally motivated — things you have decided to do soon. 'Iré' (Futuro Simple) sounds more distant or formal, and is better for scheduled or less personal future events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregar"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting/wishing (querer, desear, esperar) with a change of subject, the subordinate verb must be in the Subjuntivo. The structure 'querer que + subjuntivo' is one of the most fundamental triggers for the subjunctive mood in Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamaré inmediatamente.",
    "en": "As soon as the results arrive, I will call you immediately.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaran"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the Subjuntivo when referring to future events, even though the sentence might feel like a simple future statement. The event hasn't happened yet, so subjunctive captures that uncertainty."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del centro y que no sea demasiado caro.",
    "en": "I'm looking for an apartment that is close to the centre and not too expensive.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or non-specific (the speaker doesn't know if such a thing exists yet), the Subjuntivo is required. Since the speaker is still searching, the apartment is not a definite, known entity."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (tú) ese mensaje sin leerlo bien primero — podría ser importante.",
    "en": "Don't delete that message without reading it carefully first — it could be important.",
    "options": [
      "borres",
      "borra",
      "borrar",
      "borras"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present Subjuntivo form. The affirmative tú imperative of 'borrar' would be 'borra', but for negative commands the form switches entirely to the subjunctive: 'no borres'. This rule applies to all -ar, -er, and -ir verbs."
  },
  {
    "topic": "Imperativo",
    "q": "Si quieren más información, ___ (ustedes) al departamento de atención al cliente directamente.",
    "en": "If you want more information, contact the customer service department directly.",
    "options": [
      "llamen",
      "llama",
      "llamen ustedes",
      "llamad"
    ],
    "correct": 0,
    "explanation": "Ustedes commands (used in Latin America as the formal and informal plural) use the third-person plural present Subjuntivo form. 'Llamad' is the vosotros affirmative imperative used in Spain, while 'llama' is only the tú affirmative command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Lucía todavía no ha llegado. ___ perdido el autobús otra vez.",
    "en": "It's three in the afternoon and Lucía still hasn't arrived. She must have missed the bus again.",
    "options": [
      "Habrá",
      "Habrá perdido",
      "Perdería",
      "Ha perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely already happened in the recent past. It is the equivalent of 'must have done' in English and signals the speaker is making an educated guess rather than stating a fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
