<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 01, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 01, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (scheduled happenings), even though location normally uses ESTAR. ESTAR is used for the physical location of objects and people, but events are located with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for conditions or states that can change, such as temperature. The soup being hot is a temporary physical condition, not an inherent characteristic, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista para su edad — resuelve crucigramas en minutos.",
    "en": "My grandmother is very clever for her age — she solves crosswords in minutes.",
    "options": [
      "está",
      "es",
      "será",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'clever or intelligent' as an inherent trait. ESTAR + listo/a means 'to be ready.' Since the sentence describes a characteristic of the grandmother's personality, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El mercado de artesanías ___ cerrado hoy porque es festivo.",
    "en": "The craft market is closed today because it's a holiday.",
    "options": [
      "es",
      "está",
      "fue",
      "estaba"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with past participles like 'cerrado' to describe a resulting state or current condition. The market being closed is a temporary situation, not a defining characteristic, so ESTAR is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, todos los veranos ___ (nosotros) a la playa con los abuelos.",
    "en": "When I was a child, every summer we would go to the beach with the grandparents.",
    "options": [
      "fuimos",
      "íbamos",
      "vamos",
      "habíamos ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los veranos' (every summer) signals a recurring pattern, which requires the Imperfecto rather than the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "había escrito",
      "escribo"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the Imperfecto and the interrupting event uses the Indefinido. 'Escribía' sets the scene; 'se fue' is the sudden completed interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ un nuevo contrato con un cliente japonés.",
    "en": "Last year, my company signed a new contract with a Japanese client.",
    "options": [
      "firmaba",
      "firmó",
      "firma",
      "habría firmado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for single, completed actions at a specific point in the past. 'El año pasado' marks a finished time frame, and signing the contract was a one-time completed event, not a background state or habit."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'that which' or 'what,' and is used when the antecedent is unspecified or abstract. 'Que' alone would require a specific noun antecedent before it in this structure."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo, ¡te lo mereces!",
    "en": "How great that you got that job — you deserve it!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory structures to express strong emotion or surprise, equivalent to 'How...!' or 'What a...!' in English. It is not a conjunction (que) or a question word in this context."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que hablo en público, ___ muchísimo.",
    "en": "Every time I speak in public, I get very stressed.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When the subject experiences a self-generated emotion or reaction (Yo y yo pattern), use the reflexive verb with the matching subject pronoun. 'Me estreso' = I stress myself out; the subject (yo) is both the agent and the experiencer."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ de verdad.",
    "en": "When you arrive late without letting me know, you really worry me.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "nos preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, another person (tú) causes an emotional reaction in the speaker (yo). The verb agrees with the subject (tú → preocupas), and 'me' indicates the indirect object, the person who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "voy a tomar"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of hypothetical si-clauses when the condition is contrary to present reality (si + Imperfecto de Subjuntivo → Condicional). The Futuro Simple would only be used in real, open conditions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región.",
    "en": "According to the forecast, it will be very hot throughout the region tomorrow.",
    "options": [
      "haría",
      "habrá",
      "haga",
      "vaya a hacer"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for predictions or statements about what will happen based on known information or forecasts. The Condicional would be used in hypothetical or reported speech contexts, not for direct future predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Oye, esta tarde ___ al supermercado después del trabajo, ¿necesitas algo?",
    "en": "Hey, this afternoon I'm going to go to the supermarket after work — do you need anything?",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a planned or intended near-future action, especially when there is already a decision or intention in mind. 'Iré' (Futuro Simple) sounds more formal or less personal, and is more natural for more distant or uncertain futures."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entreguen"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or wishing with a change of subject (querer que + different subject), the Subjuntivo is required. The boss's desire influences others' actions, which is a classic trigger for the present Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ a Buenos Aires, avísame y quedamos.",
    "en": "When you get to Buenos Aires, let me know and we'll meet up.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarás a",
      "llegar"
    ],
    "correct": 1,
    "explanation": "When 'cuando' refers to a future event that has not yet happened, it triggers the present Subjuntivo. If the action after 'cuando' is habitual or in the past, the Indicativo is used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que esta solución ___ suficiente para resolver el problema.",
    "en": "I don't think this solution is enough to solve the problem.",
    "options": [
      "es",
      "sea",
      "será",
      "esté"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) require the Subjuntivo in the subordinate clause because they express doubt or denial. The affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión, es una falta de respeto.",
    "en": "Please, don't use your phone during the meeting — it's disrespectful.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo: 'no uses' (tú). The affirmative tú command 'usa' is irregular-looking but the negative always borrows the Subjuntivo form, which is 'uses' for -ar verbs."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen preguntas al final, ___ la mano y las respondemos todas.",
    "en": "If you have questions at the end, raise your hand and we'll answer them all.",
    "options": [
      "levantan",
      "levanten",
      "levantad",
      "se levantan"
    ],
    "correct": 1,
    "explanation": "'Levanten' is the ustedes affirmative imperative, formed from the third-person plural present Subjuntivo. In Latin America, 'ustedes' serves as both formal and informal plural command, and its imperative form always coincides with the Subjuntivo."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No sé nada de Marcos desde hace días. ___ de viaje sin decir nada.",
    "en": "I haven't heard from Marcos in days. He must have gone on a trip without saying anything.",
    "options": [
      "Habrá ido",
      "Irá",
      "Iría",
      "Ha ido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to speculate or make deductions about something that probably happened in the past. It expresses probability about a completed past action, equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
