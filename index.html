<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 14, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 14, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled activities use SER to express where they take place, even though location normally uses ESTAR. 'La reunión es en...' describes where an event occurs, not the physical position of an object."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary or current state or condition. The soup being hot right now is a changeable condition, not a permanent characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ muy listo — siempre sabe cómo resolver los problemas.",
    "en": "My grandfather is very clever — he always knows how to solve problems.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means 'to be clever/smart' (an inherent characteristic), while ESTAR + listo means 'to be ready'. Since the sentence describes his personality trait, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar ocho kilómetros, todos nosotros ___ agotados.",
    "en": "After walking eight kilometers, all of us were exhausted.",
    "options": [
      "éramos",
      "estábamos",
      "fuimos",
      "somos"
    ],
    "correct": 1,
    "explanation": "ESTAR describes a resulting state caused by a specific action or circumstance. Exhaustion after walking is a temporary condition, not a permanent trait, so ESTAR (estábamos) is the right choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (ir) al parque todos los domingos con mi familia.",
    "en": "When I was little, I used to go to the park every Sunday with my family.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (iba) expresses habitual or repeated past actions — things that happened regularly over an unspecified period. The clue 'todos los domingos' signals a recurring routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ (preparar) la cena, mi hermano llegó a casa gritando.",
    "en": "While I was preparing dinner, my brother arrived home shouting.",
    "options": [
      "preparé",
      "preparaba",
      "había preparado",
      "preparo"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (preparaba) describes the ongoing background action that was in progress when a sudden event interrupted it. The interrupting event ('llegó') uses the Indefinido, while the continuous action uses the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) el informe que llevaba semanas sin acabar.",
    "en": "Yesterday I finally finished the report that I had been unable to finish for weeks.",
    "options": [
      "terminaba",
      "terminé",
      "terminaré",
      "haya terminado"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido (terminé) marks a completed, one-time event with a clear endpoint. 'Ayer' is a specific time marker that anchors the action as finished and bounded in the past."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to say to me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what / the thing that' and is used when there is no specific antecedent noun. 'Que' alone would need a prior noun to refer back to, and 'qué' (with accent) is used in direct or indirect questions expressing inquiry, not in this embedded clause."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonita ___ te has puesto hoy, Sofía!",
    "en": "How beautiful you look today, Sofía!",
    "options": [
      "Lo que / estás",
      "Qué / estás",
      "Que / eres",
      "Cuán / seas"
    ],
    "correct": 1,
    "explanation": "'Qué' (with accent) is used in exclamatory sentences to express surprise or admiration, equivalent to 'how' or 'what a' in English. The structure 'Qué + adjective + que + verb' is a common exclamatory pattern in Spanish."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos del trabajo. No puedo más.",
    "en": "Lately I've been stressing out a lot about work deadlines. I can't take it anymore.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional state (Yo y yo pattern), the reflexive verb agrees with the first-person subject: 'yo me estreso'. This is different from when an external thing causes the emotion, which would require a third-person verb."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas los planes a última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you frustrate me so much.",
    "options": [
      "me frustro",
      "te frustras",
      "me frustras",
      "me frustra"
    ],
    "correct": 2,
    "explanation": "In the Yo y tú pattern, a second-person subject (tú) causes an emotion in a first-person object (me). The verb agrees with the subject 'tú' → 'frustras', and 'me' is the indirect object pronoun showing who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "The Condicional Simple (aprendería) is used in the main clause of hypothetical si-clauses when the si-clause contains the Imperfecto de Subjuntivo (tuviera). This expresses an unlikely or imaginary condition in the present/future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Sabes qué? ___ (llamar) al médico mañana a primera hora — llevo tres días con fiebre.",
    "en": "You know what? I'm going to call the doctor first thing tomorrow morning — I've had a fever for three days.",
    "options": [
      "llamaría",
      "llamaré",
      "voy a llamar",
      "llame"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near future intention that is already decided or planned, often prompted by a present circumstance. The speaker has made a concrete decision based on current evidence (three days of fever), making 'voy a llamar' more natural than the neutral future 'llamaré'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que el nuevo proyecto ___ (comenzar) a principios de marzo.",
    "en": "The director said that the new project would begin at the start of March.",
    "options": [
      "comenzará",
      "comienza",
      "comenzaría",
      "haya comenzado"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is used as the 'future of the past' in reported speech. When the main verb is in the past ('dijo'), the future of the original statement shifts to the Condicional in the reported clause."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ (leer) el manual de seguridad antes de empezar.",
    "en": "It is essential that all employees read the safety manual before starting.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "han leído"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es necesario que, es importante que) trigger the Subjuntivo in the subordinate clause because they express a subjective judgment about someone else's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante ___ (ser) tan bueno como dicen las reseñas.",
    "en": "I don't think the new restaurant is as good as the reviews say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer, no pensar, no opinar) require the Subjuntivo in the dependent clause because the negation introduces doubt or denial of the proposition. Affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (llegar) los resultados del análisis, te aviso inmediatamente.",
    "en": "As soon as the test results arrive, I'll let you know immediately.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the Subjuntivo when referring to future events that have not yet happened. If the action were habitual or already completed, the Indicativo would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (apagar, tú) las luces cuando salgas del despacho.",
    "en": "Please turn off the lights when you leave the office.",
    "options": [
      "apaga",
      "apagues",
      "apagar",
      "apague"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for regular -ar verbs uses the third-person singular present indicative form (apaga). This is different from the negative tú imperative, which uses the subjunctive (no apagues)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, vosotros) tanto — el problema tiene solución.",
    "en": "Don't worry so much — the problem has a solution.",
    "options": [
      "os preocupéis",
      "os preocupáis",
      "os preocupéis vosotros",
      "preocupaos"
    ],
    "correct": 0,
    "explanation": "Negative imperatives for vosotros use the present subjunctive form with the reflexive pronoun placed before the verb: 'no os preocupéis'. In affirmative commands the pronoun attaches to the verb (preocupaos), but in negative commands it always precedes it."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no contesta el teléfono. ___ (quedarse) sin batería otra vez.",
    "en": "Marcos isn't answering the phone. He must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se habrá quedado",
      "Se quedó",
      "Se queda"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. The speaker is making an inference about a past event based on present evidence (he's not answering), not making a prediction about the future."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
