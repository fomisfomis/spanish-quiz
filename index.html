<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 02, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 02, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de jazz ___ en el teatro municipal este sábado.",
    "en": "The jazz concert is at the municipal theater this Saturday.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR indicates the location of physical objects or people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for temporary conditions and physical states that can change, such as temperature. The plate being hot right now is a transient state, not an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela siempre decía que la paciencia ___ la clave del éxito.",
    "en": "My grandmother always said that patience is the key to success.",
    "options": [
      "está",
      "estaba",
      "es",
      "era"
    ],
    "correct": 3,
    "explanation": "SER is used to define, identify, or equate concepts and nouns. Here 'patience' is being equated with 'the key to success,' which is a defining statement. The imperfect 'era' matches the past tense context of 'decía.'"
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este ceviche — ¡___ riquísimo!",
    "en": "Try this ceviche — it's absolutely delicious!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With food, 'estar rico' means it tastes good right now (a sensory experience), while 'ser rico' would mean it is inherently rich or wealthy. ESTAR is used here because the deliciousness is being experienced in the moment of eating."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ niño, mi padre me llevaba al mercado todos los domingos.",
    "en": "When I was a child, my father used to take me to the market every Sunday.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto 'era' is correct because being a child is a background state or life stage during which repeated actions occurred. The imperfecto describes ongoing conditions and habitual actions in the past, not completed single events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ella ___ un mensaje cuando el teléfono se quedó sin batería.",
    "en": "She was writing a message when the phone ran out of battery.",
    "options": [
      "escribió",
      "escribía",
      "ha escrito",
      "escribiría"
    ],
    "correct": 1,
    "explanation": "The imperfecto 'escribía' describes an action in progress that was interrupted. The interrupting event (the phone dying) uses the indefinido 'se quedó.' This is the classic background-action vs. interrupting-event pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ terminar el informe que llevaba semanas posponiéndolo.",
    "en": "Yesterday I finally managed to finish the report I had been putting off for weeks.",
    "options": [
      "podía",
      "pude",
      "puedo",
      "podría"
    ],
    "correct": 1,
    "explanation": "The indefinido 'pude' signals a completed achievement at a specific moment ('ayer'). 'Podía' in the indefinido would imply general ability or failed attempt without completion; 'pude' specifically means the action was accomplished."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what,' and is used when referring to a concept or idea rather than a specific noun antecedent. 'Que' alone cannot introduce an embedded question or undefined concept this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "Llevamos tres horas esperando y aún no hay noticias. ¡___ situación más desesperante!",
    "en": "We've been waiting three hours and there's still no news. What a more desperate situation!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "La que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory sentences to express strong emotion or emphasis. Without the accent, 'que' is a conjunction or relative pronoun. Exclamations follow the pattern '¡Qué + noun/adjective!'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con las reuniones que no terminan nunca.",
    "en": "Lately I get really stressed out by meetings that never end.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 3,
    "explanation": "When a thing or group of things causes a feeling in you, the verb agrees with the subject causing the feeling, not with 'me.' 'Las reuniones' (plural) is the subject, so the verb is 'me estresan' — the 'yo y el mundo' pattern where an external plural subject triggers the emotion."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que discutimos, ___ y necesito salir a caminar para calmarme.",
    "en": "Every time we argue, I get frustrated and need to go for a walk to calm down.",
    "options": [
      "te frustro",
      "me frustras",
      "me frustro",
      "nos frustramos"
    ],
    "correct": 2,
    "explanation": "'Me frustro' follows the 'yo y yo' pattern, where the subject and the object of the feeling are the same person — oneself. The speaker is describing their own internal emotional reaction, not blaming another person or an external situation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ contratar a dos diseñadores nuevos.",
    "en": "If we had more budget, we would hire two new designers.",
    "options": [
      "podremos",
      "podremos a",
      "podríamos",
      "vamos a poder"
    ],
    "correct": 2,
    "explanation": "The conditional 'podríamos' is required in the result clause of a hypothetical si-clause using the imperfect subjunctive. The structure is 'si + imperfecto de subjuntivo + condicional.' The conditional expresses what would happen under an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ llover toda la semana que viene.",
    "en": "According to the forecast, it will rain all next week.",
    "options": [
      "llovaría",
      "lloverá",
      "va a llover",
      "llueve"
    ],
    "correct": 2,
    "explanation": "'Va a llover' (ir a + infinitivo) is the most natural choice for near-future plans or events with clear evidence or certainty (like a weather forecast). 'Lloverá' is also grammatically correct but sounds more formal or distant; 'va a' feels more immediate and evidence-based."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó que cuándo ___ los resultados del análisis de sangre.",
    "en": "He asked me when the blood test results would arrive.",
    "options": [
      "llegarán",
      "llegarían",
      "van a llegar",
      "lleguen"
    ],
    "correct": 1,
    "explanation": "In reported speech (indirect speech in the past), a future reference is expressed with the conditional, not the futuro simple. The original question 'cuándo llegarán' shifts to 'cuándo llegarían' when reporting what someone asked in the past."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo reservado para las seis — ___ al aeropuerto a las cuatro.",
    "en": "I have my flight booked for six — I'm going to the airport at four.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "'Voy a ir' is preferred for planned, scheduled near-future events, especially when there is already a concrete arrangement in place (a booked flight). 'Iré' is also acceptable but sounds more formal or refers to a more open future; 'ir a + infinitivo' emphasises intention and prior planning."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el nuevo empleado ___ adaptarse rápido al equipo.",
    "en": "I hope the new employee can adapt quickly to the team.",
    "options": [
      "puede",
      "podría",
      "pueda",
      "podrá"
    ],
    "correct": 2,
    "explanation": "After verbs of wish or hope like 'esperar que,' the subjunctive is required in the subordinate clause when the subjects of the two clauses are different. 'Pueda' is the present subjunctive of 'poder,' expressing a desired but uncertain outcome."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te aviso en cuanto ___ noticias del hospital.",
    "en": "I'll let you know as soon as I get news from the hospital.",
    "options": [
      "tengo",
      "tendré",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "With temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' referring to future events, the subjunctive is required, not the indicative or future. The subjunctive 'tenga' signals that the event hasn't happened yet at the time of speaking."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ tres idiomas y experiencia en exportación.",
    "en": "They are looking for someone who speaks three languages and has export experience.",
    "options": [
      "habla",
      "hable",
      "hablará",
      "hablaría"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical, unknown, or non-specific (they haven't found the person yet), the subjunctive is used. If they were referring to a specific known person, the indicative 'habla' would be correct."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el informe sin revisarlo primero.",
    "en": "Please, don't send the report without reviewing it first.",
    "options": [
      "mandes",
      "mandas",
      "manda",
      "mandarás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive, not the affirmative imperative form. 'Manda' is the affirmative tú imperative, but for negative commands you must use 'no + subjuntivo': 'no mandes.'"
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad en este momento.",
    "en": "Passengers, please fasten your seatbelts at this time.",
    "options": [
      "abrocha",
      "abrochen",
      "abrochad",
      "abrocháis"
    ],
    "correct": 1,
    "explanation": "In Latin America (and in formal registers with 'ustedes'), the ustedes imperative is formed using the third-person plural present subjunctive. 'Abrochen' addresses a group formally; 'abrochad' is the vosotros form used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas tres horas en la cocina — ___ preparado algo increíble.",
    "en": "You've been in the kitchen for three hours — you must have prepared something incredible.",
    "options": [
      "habrás preparado",
      "habrías preparado",
      "prepararás",
      "hubieras preparado"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habré + participio) is used to make a deduction or express probability about something that has likely already happened. Here, the speaker is making a logical inference about what the other person has probably done based on available evidence."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
