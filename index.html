<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 24, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 24, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events. ESTAR indicates where a person or object is located, but for scheduled events (concerts, meetings, parties), SER is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for conditions or states that can change over time. The soup's temperature is a temporary condition, not a defining characteristic, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ lista para salir antes que nadie en la familia.",
    "en": "My grandmother is ready to leave before anyone else in the family.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Listo' changes meaning depending on the verb: SER + listo = to be clever/smart; ESTAR + listo = to be ready. Here the context clearly means 'ready to leave', so ESTAR is used."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Ese chef famoso ___ muy rico ahora que tiene tres restaurantes.",
    "en": "That famous chef is very rich now that he has three restaurants.",
    "options": [
      "está",
      "es",
      "estuvo",
      "fue"
    ],
    "correct": 1,
    "explanation": "'Rico' with SER means wealthy (a permanent or long-standing characteristic of the person), while ESTAR + rico means something tastes delicious. Financial status is treated as a defining trait, so SER is used."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis primos.",
    "en": "When I was a child, I used to play football every Saturday with my cousins.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. 'Todos los sábados' signals a routine, not a single completed event, so Imperfecto (jugaba) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando de repente ___ el teléfono.",
    "en": "I was reading the report calmly when the phone suddenly rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "When one ongoing action (Imperfecto: leía) is interrupted by a sudden event, the interrupting action takes the Indefinido (sonó). The Indefinido marks the new, completed event that breaks the background."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mis colegas y yo ___ un proyecto muy importante para una empresa alemana.",
    "en": "Last year, my colleagues and I completed a very important project for a German company.",
    "options": [
      "terminábamos",
      "terminamos",
      "habíamos terminado",
      "terminaríamos"
    ],
    "correct": 1,
    "explanation": "The Indefinido (terminamos) is used for actions that were completed at a specific time in the past. 'El año pasado' is a completed time frame, signaling a finished, bounded event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (that which) and is used when referring to something non-specific or unknown. 'Que' alone is a conjunction and cannot introduce an indirect question here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí después de tantos años.",
    "en": "What a pleasant surprise to run into you here after so many years.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cual"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express a strong reaction, often followed by a noun (¡Qué + noun + tan/más + adjective!). Without an accent, 'que' is a conjunction, not an exclamative."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los ruidos de los vecinos por la noche.",
    "en": "Lately I get really stressed by the noise from the neighbors at night.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When the cause of stress is a thing or situation (los ruidos), it is the grammatical subject, so the verb agrees with it: 'me estresa' (it stresses me). This is the 'Yo y el mundo' pattern where the external world acts on you."
  },
  {
    "topic": "Reflexive verbs",
    "q": "¿Por qué siempre ___ tanto cuando te digo que llegaste tarde?",
    "en": "Why do you always get so annoyed at me when I tell you that you arrived late?",
    "options": [
      "te molestas",
      "te molesto",
      "me molestas",
      "me molesto"
    ],
    "correct": 0,
    "explanation": "'Te molestas' means 'you get annoyed' — the subject is tú and the action reflects back on yourself (Yo y yo pattern, but for tú). 'Te molesto' would mean 'I bother you', which changes the meaning entirely."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cocina japonesa.",
    "en": "If I had more free time, I would take a Japanese cooking course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "Hypothetical or unreal conditions in the present/future use Si + Imperfecto de Subjuntivo + Condicional. The Condicional (haría) expresses the result of an unlikely or imagined scenario."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be over thirty degrees across the whole region.",
    "options": [
      "haría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple (habrá) is used for predictions based on evidence or facts about the future. The Condicional would be used for hypothetical or reported speech, not for a straightforward factual forecast."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo reservado para el viernes — ___ a Barcelona por primera vez.",
    "en": "I have the flight booked for Friday — I'm going to Barcelona for the first time.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "fuera"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred when there is concrete evidence or a specific plan already in place (a booked ticket). 'Iré' is more appropriate for general or distant future predictions without immediate evidence."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres esperan que yo ___ medicina como mi hermana mayor.",
    "en": "My parents hope that I will study medicine like my older sister.",
    "options": [
      "estudio",
      "estudie",
      "estudiaré",
      "estudiar"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or desire (esperar que, querer que, desear que) with a change of subject, the Subjuntivo is required in the subordinate clause. The Indicativo would imply a factual statement, not a wish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "recibes",
      "recibirás",
      "recibas",
      "recibirías"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' referring to future actions, the Subjuntivo must be used. The Indicativo would be used only when referring to habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una lástima que el museo ___ cerrado los lunes.",
    "en": "It's a shame that the museum is closed on Mondays.",
    "options": [
      "está",
      "estará",
      "esté",
      "estuviera"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of emotion or judgment (es una lástima, es importante, es bueno) trigger the Subjuntivo in the following clause when there is a subject. 'Esté' is the present Subjuntivo of ESTAR."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ ese documento antes de mandarlo — tiene varios errores.",
    "en": "Hey, revise that document before sending it — it has several errors.",
    "options": [
      "revisas",
      "revisa",
      "revise",
      "revisarás"
    ],
    "correct": 1,
    "explanation": "For affirmative tú commands, the Imperativo is formed using the third-person singular present indicative (él/ella form). 'Revisa' is the correct tú affirmative imperative of 'revisar'."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el aire acondicionado sin avisarme antes.",
    "en": "Please, don't turn on the air conditioning without letting me know first.",
    "options": [
      "enciendas",
      "enciende",
      "enciendes",
      "encenderás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present Subjuntivo with 'no'. Never use the affirmative imperative form with 'no' — that would be incorrect. So 'no enciendas' is the correct negative command."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Lleva tres días sin responder mensajes. ___ perdido el teléfono otra vez.",
    "en": "He hasn't replied to messages for three days. He must have lost his phone again.",
    "options": [
      "Habrá perdido",
      "Habrá perdiendo",
      "Hubiera perdido",
      "Perdería"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. This is different from its other use of expressing completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
