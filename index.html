<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 15, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 15, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el estadio esta noche, pero la banda ___ de Argentina.",
    "en": "The concert is at the stadium tonight, but the band is from Argentina.",
    "options": [
      "es / es",
      "está / es",
      "es / está",
      "está / está"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location (el concierto es en el estadio), unlike physical objects whose location uses ESTAR. Origin is always expressed with SER (ser de + place)."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este pastel — ¡___ riquísimo! Lo hizo mi abuela.",
    "en": "Try this cake — it's absolutely delicious! My grandmother made it.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means something tastes delicious (a sensory, experiential quality), whereas SER + rico/a means someone is wealthy. With food and drink, use ESTAR to describe how something tastes."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi jefe siempre ___ muy estresado últimamente. Creo que el proyecto lo tiene agotado.",
    "en": "My boss has been very stressed lately. I think the project has him exhausted.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary or changeable state, especially one caused by external circumstances. The context clue 'últimamente' reinforces that this is a current, non-permanent condition."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Nadie esperaba que Fernando ___ tan listo para la reunión; normalmente llega sin prepararse.",
    "en": "Nobody expected Fernando to be so ready for the meeting; he normally arrives unprepared.",
    "options": [
      "fuera",
      "estuviera",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo/a means to be ready or prepared, while SER + listo/a means to be clever or smart. Here the context ('ready for the meeting') confirms ESTAR listo is needed, and the past subjunctive estuviera follows 'nadie esperaba que'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ (ser) niña, mi madre siempre ___ (preparar) tamales los domingos.",
    "en": "When I was a little girl, my mother always made tamales on Sundays.",
    "options": [
      "fui / preparó",
      "era / preparaba",
      "fui / preparaba",
      "era / preparó"
    ],
    "correct": 1,
    "explanation": "Both verbs here describe habitual, repeated actions in the past and background circumstances, so both use Imperfecto. Era sets the childhood background and preparaba describes a recurring Sunday habit."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) el informe tranquilamente cuando de repente ___ (sonar) la alarma de incendios.",
    "en": "I was reading the report calmly when suddenly the fire alarm went off.",
    "options": [
      "leía / sonó",
      "leí / sonaba",
      "leía / sonaba",
      "leí / sonó"
    ],
    "correct": 0,
    "explanation": "The Imperfecto (leía) describes a continuous background action in progress, while the Indefinido (sonó) marks the sudden, completed event that interrupted it. 'De repente' is a classic signal for a punctual past event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ (mudarse) a Valencia y allí ___ (conocer) a su actual pareja.",
    "en": "Last year she moved to Valencia and there she met her current partner.",
    "options": [
      "se mudaba / conocía",
      "se mudó / conoció",
      "se mudaba / conoció",
      "se mudó / conocía"
    ],
    "correct": 1,
    "explanation": "Both actions are completed, one-time events with a specific time reference ('el año pasado'), so both use Pretérito Indefinido. Indefinido is used for actions that are finished and took place at a defined point in the past."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "lo cual"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'what' (= the thing that) and is used as the object of verbs like entender, saber, or decir. Que alone would need a prior antecedent, and qué introduces direct or indirect questions with a question-word meaning."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ sorpresa tan agradable encontrarte aquí después de tantos años!",
    "en": "What a pleasant surprise to run into you here after so many years!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cual"
    ],
    "correct": 2,
    "explanation": "Qué (with accent) introduces exclamations meaning 'what a...!' when followed by a noun, adjective, or adverb. It expresses strong emotion or emphasis and is distinct from the relative pronoun que (no accent)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con todo el trabajo pendiente. No puedo dormir bien.",
    "en": "Lately I've been stressing a lot with all the pending work. I can't sleep well.",
    "options": [
      "me estresas",
      "te estresas",
      "me estreso",
      "se estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and object of a reflexive verb are the same person (yo … yo), use the first-person reflexive: me estreso. This 'Yo y yo' pattern means the person acts upon themselves, caused by general circumstances rather than another person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas planes a última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you frustrate me a lot.",
    "options": [
      "me frustro",
      "te frustras",
      "me frustras",
      "nos frustramos"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y tú' pattern, one person (tú) causes an emotional reaction in another (yo). The verb agrees with the agent (tú → frustras) and the pronoun reflects the affected person (me = yo). Compare: me frustro (I frustrate myself) vs. me frustras (you frustrate me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ a aprender un instrumento musical?",
    "en": "If you had more free time, would you start learning a musical instrument?",
    "options": [
      "irás",
      "irías",
      "vas",
      "fueras"
    ],
    "correct": 1,
    "explanation": "After si + Imperfecto de Subjuntivo (tuvieras), the main clause must use the Condicional (irías), not the Futuro. This is a hypothetical, contrary-to-fact condition that requires the conditional to express what would happen."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio después del trabajo — ya lo tengo todo planeado.",
    "en": "This afternoon I'm going to go to the gym after work — I've already got it all planned.",
    "options": [
      "iría",
      "iré",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "Voy a + infinitivo expresses a near-future plan or intention that is already decided or organized. It implies higher certainty and immediacy than the simple Futuro (iré), which sounds more distant or formal in this context."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa mediterránea.",
    "en": "According to the forecast, tomorrow it will be very hot along the entire Mediterranean coast.",
    "options": [
      "haría",
      "habría",
      "hará",
      "habrá"
    ],
    "correct": 3,
    "explanation": "Habrá (Futuro Simple of haber) is used impersonally to predict future conditions. Futuro Simple is preferred for predictions based on external sources or objective expectations, while Condicional would imply a hypothetical or polite statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el médico ___ algo que pueda ayudarme con el dolor de espalda.",
    "en": "I hope the doctor finds something that can help me with the back pain.",
    "options": [
      "encuentra",
      "encontrará",
      "encuentre",
      "encontraría"
    ],
    "correct": 2,
    "explanation": "After verbs of hope and wishing like esperar que, the subordinate clause requires the Subjuntivo Presente (encuentre). The subjunctive is triggered because the subject of the main clause (yo) is different from that of the subordinate clause (el médico)."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que esta solución ___ suficiente para resolver el problema a largo plazo.",
    "en": "I don't think this solution is enough to solve the problem in the long term.",
    "options": [
      "sea",
      "es",
      "está",
      "esté"
    ],
    "correct": 0,
    "explanation": "Negated opinion verbs like no creer que require the Subjuntivo in the subordinate clause because the speaker is casting doubt on the proposition. With SER vs ESTAR, use SER (sea) for inherent characteristics like sufficiency or adequacy."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as I get the test results, I'll call you right away.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like en cuanto, cuando, or hasta que referring to a future action, Spanish requires the Subjuntivo Presente (tenga), not the Indicative or Future. The future action is uncertain until it actually occurs."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (hablar, tú) con tu hermano antes de tomar una decisión tan importante.",
    "en": "Hey, talk to your brother before making such an important decision.",
    "options": [
      "habla",
      "hablas",
      "hables",
      "hablarás"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed using the third-person singular Presente de Indicativo (habla). It is distinct from the negative tú imperative (no hables), which uses the Subjuntivo Presente."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (olvidar, vosotros) traer el adaptador de corriente para el viaje a Reino Unido.",
    "en": "Don't forget to bring the power adapter for the trip to the UK.",
    "options": [
      "olvidéis",
      "olvidad",
      "olviden",
      "olvidáis"
    ],
    "correct": 0,
    "explanation": "Negative vosotros commands use the Subjuntivo Presente (olvidéis). The affirmative would be 'olvidad', but any negative imperative — for any pronoun — requires the subjunctive form instead."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Lleva dos días sin contestar mensajes. ___ perdido el móvil otra vez.",
    "en": "She hasn't replied to messages in two days. She must have lost her phone again.",
    "options": [
      "Habrá perdido",
      "Habría perdido",
      "Ha perdido",
      "Hubiera perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or logical deduction about a past event viewed from the present — equivalent to 'must have' or 'probably has' in English. It differs from Ha perdido, which states a known fact."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
