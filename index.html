<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 11, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 11, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place. ESTAR is used for the physical location of objects or people, but for scheduled events, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, Miguel ___ completamente listo.",
    "en": "After running ten kilometers, Miguel is completely exhausted (done in).",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "The adjective 'listo' changes meaning depending on the verb: 'ser listo' means to be clever/smart, while 'estar listo' means to be ready or, in this context, completely done/finished. ESTAR reflects a state resulting from an action."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Esta sopa de cebolla ___ riquísima — ¿puedo repetir?",
    "en": "This onion soup is absolutely delicious — can I have seconds?",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Rico' with SER describes an inherent quality (wealthy or naturally tasty), but with ESTAR it expresses how something tastes right now, in the moment of eating. This is a classic change-of-state or experiential use of ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No me sorprende que fracasara — ___ evidente que no había preparado nada.",
    "en": "I'm not surprised he failed — it was obvious he hadn't prepared anything.",
    "options": [
      "Estuvo",
      "Estaba",
      "Era",
      "Fue"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions describing something as an inherent truth or characteristic use SER. 'Era evidente' presents the obviousness as a general fact in the past, not a temporary state, so SER (imperfect) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela me ___ cuentos antes de dormir todas las noches.",
    "en": "When I was a child, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The phrase 'todas las noches' signals that this was a regular routine, not a single completed event, making imperfecto the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "había escrito"
    ],
    "correct": 1,
    "explanation": "In interrupted action constructions, the ongoing background action uses the imperfecto (escribía), while the interrupting event uses the indefinido (se fue). The imperfecto paints the scene that was already in progress."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El martes pasado, el director ___ su renuncia durante la reunión.",
    "en": "Last Tuesday, the director announced his resignation during the meeting.",
    "options": [
      "anunciaba",
      "anunció",
      "anunciaría",
      "ha anunciado"
    ],
    "correct": 1,
    "explanation": "The indefinido is used for a single, completed event at a specific point in the past. 'El martes pasado' is a specific time marker that anchors this as a finished, one-time action, requiring the pretérito indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause equivalent to 'the thing that' or 'what' (in the sense of 'that which'). 'Que' alone would require an antecedent, and 'qué' is used in direct questions or exclamations, not embedded clauses like this one."
  },
  {
    "topic": "Usos de QUE",
    "q": "¿___ película recomiendas para el fin de semana?",
    "en": "What movie do you recommend for the weekend?",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is the interrogative/exclamative form used in direct questions to ask for identification or specification. Without an accent, 'que' is a relative pronoun or conjunction, which would not make grammatical sense here."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos del trabajo — hay demasiada presión.",
    "en": "Lately I stress myself out a lot with work deadlines — there's too much pressure.",
    "options": [
      "me estresas",
      "me estresa",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "When the subject performs the action on themselves ('yo y yo' pattern), the reflexive verb agrees with the first-person subject: 'me estreso' (yo). This differs from 'me estresas' (tú causes me stress) or 'me estresa' (something else causes me stress)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas los planes a última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "In the 'yo y tú' pattern, the subject (tú) performs an action that affects the speaker (me). The verb agrees with the second-person subject (tú), giving 'me estresas' — meaning you are the cause of my stress."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tome",
      "tomaría",
      "voy a tomar"
    ],
    "correct": 2,
    "explanation": "Hypothetical conditions using 'si + imperfecto de subjuntivo' require the condicional simple in the main clause. The condicional expresses what would happen under an unreal or unlikely condition in the present or future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be over 35 degrees across the entire region.",
    "options": [
      "haría",
      "habrá",
      "haga",
      "va a hacer"
    ],
    "correct": 1,
    "explanation": "Both 'habrá' (futuro simple) and 'va a hacer' can express future predictions, but when citing an official forecast with a specific future time marker like 'mañana,' the futuro simple is more neutral and formal. 'Haría' is condicional, used for hypotheticals, not direct predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "—¿Por qué llegó tarde Sofía? —No sé... ___ atasco en la autopista.",
    "en": "'Why did Sofía arrive late?' 'I don't know... there probably was a traffic jam on the highway.'",
    "options": [
      "Habrá",
      "Habría",
      "Hubo",
      "Haya"
    ],
    "correct": 1,
    "explanation": "The condicional simple can express probability or supposition about a past situation, similar to 'must have been' in English. It is used when speculating about something that happened in the past, while the futuro simple expresses probability in the present."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres quieren que yo ___ medicina, pero a mí me apasiona el diseño.",
    "en": "My parents want me to study medicine, but I am passionate about design.",
    "options": [
      "estudio",
      "estudie",
      "estudiaré",
      "estudiara"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or wishing ('querer que') with a change of subject, Spanish requires the present subjunctive in the subordinate clause. The present subjunctive 'estudie' expresses a desired action in the present or near future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo enseguida.",
    "en": "As soon as the test results arrive, I'll call you right away.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "Conjunctions of time like 'en cuanto,' 'cuando,' and 'hasta que' require the subjunctive when referring to a future event that has not yet happened. Even though the main clause is in the future, the subordinate time clause uses present subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo gerente ___ suficiente experiencia para ese puesto.",
    "en": "I don't think the new manager has enough experience for that position.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs ('no creer que,' 'no pensar que') trigger the subjunctive because the speaker is casting doubt on the truth of the statement. Affirmative 'creo que' would use indicative, but negation shifts it to subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ la puerta al salir, por favor — hace mucho frío.",
    "en": "Hey, close the door when you leave, please — it's really cold.",
    "options": [
      "cierra",
      "cierras",
      "cierres",
      "cerrar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative for stem-changing verbs like 'cerrar' (e→ie) is formed from the third-person singular present indicative: 'cierra.' This is the standard rule for most regular and stem-changing verbs in affirmative tú commands."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el informe hasta que yo lo revise.",
    "en": "Please don't send the report until I review it.",
    "options": [
      "envía",
      "envías",
      "envíes",
      "enviáis"
    ],
    "correct": 2,
    "explanation": "Negative tú commands use the present subjunctive form: 'no envíes.' Unlike affirmative commands, which use the third-person present indicative, negative commands for tú always require the subjunctive, and object pronouns go before the verb."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Para cuando llegues al aeropuerto, nosotros ya ___ el equipaje.",
    "en": "By the time you get to the airport, we will have already checked in the luggage.",
    "options": [
      "facturaremos",
      "hayamos facturado",
      "habremos facturado",
      "facturamos"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habremos + participio) expresses an action that will be completed before a specific future moment. The phrase 'para cuando' followed by a subjunctive future time clause signals that one future action will precede another."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
