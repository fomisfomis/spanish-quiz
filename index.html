<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 10, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 10, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El conferenciante ___ muy aburrido; nadie prestaba atención.",
    "en": "The speaker was very boring; nobody was paying attention.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "With 'aburrido', SER describes an inherent characteristic — the speaker is a boring person by nature. ESTAR + aburrido would mean the subject feels bored themselves, not that they cause boredom in others."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mis primos ___ en el jardín del hotel, no en la iglesia.",
    "en": "My cousins' wedding is in the hotel garden, not in the church.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events (like weddings, concerts, parties) use SER to express location, not ESTAR. ESTAR is used for the location of physical objects and people, but scheduled events take place 'being' in a location via SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, los niños ___ rendidos.",
    "en": "After walking ten kilometres, the children were exhausted.",
    "options": [
      "eran",
      "son",
      "estaban",
      "fueran"
    ],
    "correct": 2,
    "explanation": "ESTAR is used to express a temporary state or condition resulting from an action. The children became exhausted because of the walk — this is a change of state, not a permanent trait, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este aguacate ___ perfecto para hacer guacamole — está en su punto.",
    "en": "This avocado is perfect for making guacamole — it's just right.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR + adjective describes a current condition or state. 'Perfecto' here refers to the avocado's ripeness right now, not an inherent quality. SER + perfecto would imply it is perfect as a general, defining characteristic."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela me ___ cuentos todas las noches antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things that happened regularly over a period of time. The phrase 'todas las noches' reinforces the idea of routine, which calls for Imperfecto, not Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma de incendios.",
    "en": "I was working calmly when suddenly the fire alarm went off.",
    "options": [
      "trabajé",
      "trabajaba",
      "había trabajado",
      "trabajaré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for background or ongoing actions that are interrupted by a sudden event. 'Trabajaba' sets the scene, while 'sonó' (Indefinido) represents the completed, interrupting event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, Ana y Lucía ___ una tienda de ropa nueva en el centro.",
    "en": "Last Saturday, Ana and Lucía opened a new clothing store downtown.",
    "options": [
      "abrieron",
      "abrían",
      "han abierto",
      "abrirían"
    ],
    "correct": 0,
    "explanation": "The Pretérito Indefinido is used for completed, one-time events at a specific point in the past. 'El sábado pasado' is a clear time marker indicating a single, finished action, so Indefinido is correct."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás diciendo. ¿Puedes repetirlo?",
    "en": "I don't understand what you are telling me. Can you repeat it?",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is the nominalized relative pronoun meaning 'what/that which' when referring to an entire idea or unspecified thing. 'Que' is a simple connector, while 'qué' (with accent) is used in direct or indirect questions with an interrogative force."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es una lástima ___ no puedas venir a la cena del viernes.",
    "en": "It's a shame that you can't come to Friday's dinner.",
    "options": [
      "lo que",
      "qué",
      "que",
      "el que"
    ],
    "correct": 2,
    "explanation": "'Es una lástima que' is a fixed impersonal expression of emotion that introduces a subordinate clause with 'que' as a simple conjunction (followed by subjunctive). 'Lo que' and 'el que' act as noun substitutes, not conjunctions in this structure."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "Últimamente ___ mucho por el trabajo. No puedo desconectar.",
    "en": "Lately I stress a lot because of work. I can't switch off.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "estreso"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the 'yo y yo' pattern — the subject (yo) both causes and experiences the stress, using the reflexive form. 'Me estresas' (tú) would mean 'you stress me', and 'me estresa' (él/ella) would mean something external stresses me."
  },
  {
    "topic": "Reflexive verbs — yo y yo / yo y tú / yo y el mundo",
    "q": "No sé por qué, pero el ruido de la lluvia ___ cuando intento estudiar.",
    "en": "I don't know why, but the sound of rain relaxes me when I try to study.",
    "options": [
      "me relajo",
      "me relajas",
      "me relaja",
      "nos relajamos"
    ],
    "correct": 2,
    "explanation": "'Me relaja' follows the 'yo y el mundo' pattern — an external subject (el ruido de la lluvia, third person singular) causes an effect on me (me). This is like 'me gusta': the thing doing the action is the grammatical subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics course.",
    "options": [
      "haré",
      "haría",
      "hago",
      "voy a hacer"
    ],
    "correct": 1,
    "explanation": "In hypothetical 'si' clauses where the condition is contrary to reality (si + imperfect subjunctive), the main clause requires Condicional. Futuro Simple cannot appear in the result clause of this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que ___ esta tarde.",
    "en": "Look at those dark clouds — I think it's going to rain this afternoon.",
    "options": [
      "llovería",
      "llueve",
      "lloverá",
      "vaya a llover"
    ],
    "correct": 2,
    "explanation": "Futuro Simple is used for predictions about the future based on present evidence or reasoning. Condicional would be used in a hypothetical or reported-speech context. 'Lloverá' expresses a confident near-future prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya tengo los billetes comprados: ___ a Lisboa el próximo jueves.",
    "en": "I already have the tickets bought: I'm going to Lisbon next Thursday.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "fui"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred when a future action is already planned or decided, especially with concrete evidence (like bought tickets). 'Iré' (Futuro Simple) sounds more distanced or less committed; 'voy a ir' conveys a near-future, confirmed plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del mediodía.",
    "en": "The boss wants everyone to submit the report before noon.",
    "options": [
      "entreguen",
      "entregan",
      "entregarán",
      "entregaron"
    ],
    "correct": 0,
    "explanation": "Verbs of wanting, wishing, or requesting (querer que, pedir que, desear que) require the Subjunctive in the subordinate clause when the subject changes. 'Entreguen' is the present subjunctive third-person plural of entregar."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ tan buenas reseñas como dicen.",
    "en": "I don't think this restaurant has as good reviews as they say.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creo que, no pienso que, no parece que) trigger the Subjunctive because the speaker is expressing doubt or denial of a proposition. Affirmative 'creo que' would take the indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamo en cuanto ___ los resultados del análisis.",
    "en": "I'll call you as soon as I get the test results.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the Subjunctive when referring to a future event that has not yet occurred. The Indicative would be used when referring to habitual or past actions."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión, es muy molesto.",
    "en": "Please, don't use your phone during the meeting, it's very annoying.",
    "options": [
      "uses",
      "use",
      "usas",
      "usarás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjunctive (second-person singular): no uses, no hagas, no vengas. The affirmative tú command uses a different form (usa), but the negative always borrows from the subjunctive paradigm."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochen",
      "abrochad",
      "abrochéis",
      "abrochamos"
    ],
    "correct": 0,
    "explanation": "'Abrochen' is the ustedes affirmative imperative (identical to the present subjunctive third-person plural). In Latin America and in formal address, 'ustedes' replaces 'vosotros', so 'abrochad' (vosotros form) would not be used in this announcement context."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Marta no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Marta hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Hubiera"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about a past event from the perspective of the present. The speaker doesn't know for certain but is making a logical inference, similar to 'must have' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
