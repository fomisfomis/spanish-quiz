<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 19, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 19, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso de medicina ___ en el hotel Palacio este fin de semana.",
    "en": "The medical conference is at the Hotel Palacio this weekend.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. The rule is: SER for events, ESTAR for physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ vivo y puedes electrocutarte.",
    "en": "Don't touch that wire — it's live and you could electrocute yourself.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "With adjectives that change meaning, 'vivo' with SER means 'live/alive as a permanent property or characteristic,' which fits a live wire. ESTAR vivo means 'alive' for a living being — a subtle but important contrast."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tanto trabajo en el jardín, María ___ agotada pero feliz.",
    "en": "After so much work in the garden, María is exhausted but happy.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to express a temporary state or condition resulting from an action, such as being exhausted after physical work. The context 'after so much work' signals a change of state, which is always ESTAR territory."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este pastel de zanahoria — ___ riquísimo, lo hice yo mismo.",
    "en": "Try this carrot cake — it's incredibly delicious, I made it myself.",
    "options": [
      "es",
      "está",
      "fue",
      "ha sido"
    ],
    "correct": 1,
    "explanation": "When 'rico' is used with ESTAR, it means 'tasty/delicious' as a sensory experience. With SER, 'rico' means 'wealthy.' Since we're tasting the cake right now, ESTAR captures that immediate, experiential quality."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was a child, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The imperfecto (iba) describes a habitual or repeated action in the past. The time marker 'todos los sábados' and the frame 'cuando era niño' signal ongoing routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe tranquilamente cuando el jefe ___ (entrar) y apagó las luces.",
    "en": "I was calmly reading the report when the boss came in and turned off the lights.",
    "options": [
      "entraba",
      "entró",
      "entrara",
      "ha entrado"
    ],
    "correct": 1,
    "explanation": "In interrupted-action structures, the background ongoing action uses imperfecto (leía), while the sudden interrupting event uses indefinido (entró). The two verbs in the main clause — entró and apagó — are both completed, punctual events."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ (estar) lleno de gente, así que decidimos ir a otro sitio.",
    "en": "The restaurant was full of people, so we decided to go somewhere else.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "The first clause sets the background scene or condition that explains the next action — this descriptive backdrop role belongs to the imperfecto. The decision (decidimos) is the completed event in indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what / the thing that' when it replaces an undefined or abstract antecedent. 'Que' alone would need a specific noun referent, and 'qué' (with accent) is used in direct or indirect questions, not in this embedded relative structure."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo, ¡me alegra muchísimo por ti!",
    "en": "How great that you got the job — I'm so happy for you!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong emotion or emphasis (¡Qué bien!, ¡Qué suerte!). 'Que' without an accent is a conjunction or relative pronoun and cannot lead an exclamation of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo tres proyectos a la vez.",
    "en": "Lately I stress out a lot because I have three projects at once.",
    "options": [
      "me estresas",
      "me estresa",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "This is the 'yo y yo' pattern: the subject and the experiencer are the same person (I stress myself out). The reflexive verb 'estresarse' conjugates in first person: 'me estreso.' No external agent is involved."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que llegas tarde sin avisar, ___ muchísimo.",
    "en": "Every time you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "This is the 'yo y tú' pattern: you (tú) are causing stress to me (me). The verb agrees with the subject 'tú' → 'estresas,' and 'me' is the indirect object marking who is affected. This is not reflexive but rather a causative use."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "aprendo",
      "aprendiera"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses where the condition is contrary to current reality (si + imperfecto de subjuntivo), the main clause takes the condicional simple. This structure expresses something imagined rather than planned."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la costa norte.",
    "en": "According to the forecast, tomorrow it will rain along the entire northern coast.",
    "options": [
      "llovería",
      "va a llover",
      "llueve",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "The futuro simple (lloverá) is used for neutral, factual predictions about the future, especially in formal or journalistic contexts. 'Va a llover' would also be acceptable in speech but implies more immediacy or personal certainty; here the formal forecast context favors futuro simple."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "—¿Puedes ayudarme ahora? —Lo siento, ___ (poder) ayudarte mañana por la tarde, no antes.",
    "en": "'Can you help me now?' 'Sorry, I could help you tomorrow afternoon, not before.'",
    "options": [
      "podré",
      "puedo",
      "podría",
      "voy a poder"
    ],
    "correct": 2,
    "explanation": "The condicional (podría) is used here as a polite softener to express possibility or willingness in a diplomatic way — similar to 'could' in English. Using podré (futuro) would sound more assertive and less courteous in this context."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Quiero que el técnico ___ (revisar) el ordenador antes de que cierre la tienda.",
    "en": "I want the technician to check the computer before the store closes.",
    "options": [
      "revisa",
      "revisará",
      "revise",
      "revisaría"
    ],
    "correct": 2,
    "explanation": "After 'querer que' with a different subject in the subordinate clause, the subjunctive is required (revise). This is a wish or desire directed at someone else — the classic trigger for subjuntivo in noun clauses."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) la reunión, te mando los apuntes por correo.",
    "en": "As soon as the meeting finishes, I'll send you the notes by email.",
    "options": [
      "termina",
      "terminará",
      "termine",
      "terminó"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the subjunctive when they refer to future events. Although the action feels certain, the event has not yet happened, so subjuntivo (termine) is obligatory."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese candidato ___ (tener) suficiente experiencia para el puesto.",
    "en": "I don't think that candidate has enough experience for the position.",
    "options": [
      "tiene",
      "tendrá",
      "tenga",
      "tuviera"
    ],
    "correct": 2,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' trigger the subjunctive in the subordinate clause because the speaker is casting doubt or denying the truth of the proposition. 'Creer que' in the affirmative would take indicative."
  },
  {
    "topic": "Imperativo",
    "q": "___ (llamar, tú) a tu madre antes de salir — lleva días sin saber de ti.",
    "en": "Call your mother before you leave — she hasn't heard from you in days.",
    "options": [
      "Llamas",
      "Llama",
      "Llames",
      "Llamad"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed using the third-person singular present indicative form (llama). This is different from the negative tú command, which would use the subjunctive (no llames)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) por los detalles — ya me encargo yo de todo.",
    "en": "Don't worry about the details — I'll take care of everything.",
    "options": [
      "te preocupas",
      "te preocupa",
      "te preocupes",
      "te preocuparás"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are formed with 'no' + present subjunctive. For reflexive verbs, the reflexive pronoun (te) is placed before the verb and never attached to it in negative commands. Hence: no te preocupes."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "—¿Por qué no ha llegado todavía Pablo? —No sé, ___ (perder) el autobús otra vez.",
    "en": "'Why hasn't Pablo arrived yet?' 'I don't know, he must have missed the bus again.'",
    "options": [
      "habrá perdido",
      "habría perdido",
      "perdería",
      "perderá"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) can express probability or deduction about a past event when the speaker is speculating. It is the future-perfect equivalent of the present probability use of the simple future (e.g., 'tendrá hambre' → 'habrá llegado tarde')."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
