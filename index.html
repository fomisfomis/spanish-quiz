<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 07, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 07, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta noche.",
    "en": "The conference is in the main auditorium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally requires ESTAR. The rule is: SER + location applies to scheduled events, not to physical objects or people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese café — ___ muy caliente todavía.",
    "en": "Don't touch that coffee — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, such as the current temperature of a drink. Using SER would imply that being hot is an inherent, permanent characteristic of the coffee."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Antes era muy aburrido en las reuniones, pero ahora ___ aburrido de trabajar aquí.",
    "en": "He used to be very boring in meetings, but now he is bored of working here.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "The adjective 'aburrido' changes meaning depending on the verb: SER + aburrido means the person IS boring (a personality trait), while ESTAR + aburrido means the person FEELS bored (a current emotional state)."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este postre ___ riquísimo — ¿puedo pedir la receta?",
    "en": "This dessert is absolutely delicious — can I ask for the recipe?",
    "options": [
      "es",
      "está",
      "siendo",
      "estando"
    ],
    "correct": 1,
    "explanation": "When 'rico' refers to taste as experienced in the moment, Spanish uses ESTAR because it describes a sensory perception rather than an objective defining quality. If you used SER, it would suggest 'rich/wealthy' as a permanent trait."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was a child, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (iba) is used for habitual, repeated actions in the past — something that happened regularly. The signal word 'todos los sábados' confirms this is a routine, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) el informe cuando mi jefe entró sin llamar.",
    "en": "I was reading the report when my boss walked in without knocking.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the background or ongoing action uses the Imperfecto (leía), while the interrupting event uses the Indefinido (entró). The structure is: Imperfecto + cuando + Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, mis amigos y yo ___ (quedar) en un restaurante nuevo del centro.",
    "en": "Last Saturday, my friends and I met up at a new restaurant downtown.",
    "options": [
      "quedábamos",
      "quedamos",
      "habíamos quedado",
      "quedaríamos"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido (quedamos) is used for a single, completed action at a specific moment in the past. 'El sábado pasado' is a time marker that signals a finished, bounded event, not a habitual pattern."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what' in the sense of 'the thing that.' It is used when the clause refers to something non-specific or undefined. 'Que' alone is a conjunction joining two clauses, not a noun replacement."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ susto me diste cuando apagaste las luces de golpe.",
    "en": "What a fright you gave me when you suddenly turned off the lights.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to convey strong emotion or surprise. The structure '¡Qué + noun!' means 'What a + noun!' and always carries a written accent to distinguish it from the conjunction 'que'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there is a lot of traffic in the city, I get very stressed.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "te estreso"
    ],
    "correct": 2,
    "explanation": "'Me estreso' follows the Yo-y-yo pattern where the subject and the person experiencing the emotion are the same person — it's a self-directed reflexive action. 'Me estresa' would require an external subject causing the stress (Yo-y-el-mundo pattern)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without letting me know, you worry me a lot.",
    "options": [
      "te preocupas",
      "me preocupo",
      "me preocupas",
      "te preocupo"
    ],
    "correct": 2,
    "explanation": "'Me preocupas' follows the Yo-y-tú pattern: a second-person subject (tú) causes an emotional effect on a first-person object (me). The verb agrees with 'tú' and the indirect object pronoun 'me' shows who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 1,
    "explanation": "In hypothetical or contrary-to-fact conditional sentences introduced by 'si + Imperfecto de Subjuntivo,' the main clause requires the Condicional Simple (tomaría). The Futuro Simple cannot be used in the result clause of these hypothetical structures."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ tormentas por la tarde.",
    "en": "According to the forecast, tomorrow there will be storms in the afternoon.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple (habrá) is used for predictions or facts expected to occur at a specific future moment, especially when based on external evidence like a forecast. The Condicional is reserved for hypothetical or reported speech contexts."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio después del trabajo — ya lo tengo apuntado en mi agenda.",
    "en": "This afternoon I'm going to the gym after work — I've already written it in my planner.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for planned near-future actions when there is already a concrete intention or arrangement in place. The Futuro Simple (iré) sounds more formal or distant; 'voy a ir' emphasizes personal commitment to a plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi madre quiere que yo ___ (llamar) más seguido.",
    "en": "My mother wants me to call more often.",
    "options": [
      "llamo",
      "llamaré",
      "llame",
      "llamara"
    ],
    "correct": 2,
    "explanation": "After verbs of wanting or wishing like 'querer' with a change of subject (mi madre ≠ yo), the Subjuntivo Presente is required in the subordinate clause. The structure is: querer + que + different subject + Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (abrir) los lunes.",
    "en": "I don't think that restaurant is open on Mondays.",
    "options": [
      "abre",
      "abrirá",
      "abra",
      "abría"
    ],
    "correct": 2,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the Subjuntivo because the speaker is expressing doubt or disbelief rather than asserting a fact. If the verb were affirmative ('creo que'), it would be followed by the Indicativo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ (terminar) la reunión, te llamo enseguida.",
    "en": "When the meeting ends, I'll call you right away.",
    "options": [
      "termina",
      "terminará",
      "termine",
      "terminó"
    ],
    "correct": 2,
    "explanation": "When 'cuando' refers to a future event, it must be followed by the Subjuntivo Presente, not the Futuro or Indicativo. This rule applies to all temporal conjunctions (cuando, en cuanto, hasta que) used in forward-looking contexts."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (decirme) la verdad — ¿te gustó el regalo o no?",
    "en": "Hey, tell me the truth — did you like the gift or not?",
    "options": [
      "me dices",
      "dime",
      "díme",
      "te digo"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of 'decir' is irregular: 'di.' When a reflexive or object pronoun is attached, it becomes 'dime' — one word, with the pronoun appended directly. The accent is not needed here because adding the pronoun does not shift stress to an irregular syllable."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (usar) el móvil durante la cena.",
    "en": "Please don't use your phone during dinner.",
    "options": [
      "uses",
      "usas",
      "usarás",
      "usa"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the Subjuntivo Presente: 'no uses.' The affirmative imperative form ('usa') can never be used after 'no' — this is a fundamental distinction between affirmative and negative commands in Spanish."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Miguel todavía no ha llegado. ___ (perder) el autobús otra vez.",
    "en": "It's three in the afternoon and Miguel still hasn't arrived. He must have missed the bus again.",
    "options": [
      "Perdería",
      "Habrá perdido",
      "Perderá",
      "Ha perdido"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to speculate or make deductions about a past event from the present perspective. It expresses probability about what has already happened, equivalent to 'he must have' or 'he probably' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
