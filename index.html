<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 08, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 08, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de mañana ___ en el parque central.",
    "en": "Tomorrow's concert is in the central park.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, even though physical objects use ESTAR. The concert is an event, so 'es en el parque' is correct. ESTAR would imply a physical object sitting somewhere."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante para los niños.",
    "en": "Don't touch that sauce — it's very spicy for the kids.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used for inherent or defining characteristics of a thing, including its typical flavor profile. The spiciness here is presented as a natural property of the sauce, not a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo desde que le añadieron las especias.",
    "en": "Try this broth — it's incredibly tasty since they added the spices.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "'Rico' with ESTAR means 'tastes good right now' — a sensory, temporary experience. With SER, 'rico' would mean 'wealthy.' The context of tasting something in the moment signals ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela tenía ochenta años pero ___ muy lista: nunca la engañaban.",
    "en": "My grandmother was eighty years old but she was very sharp — nobody ever fooled her.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "'Listo' with SER means 'clever or sharp-minded,' a defining personality trait. With ESTAR, 'listo' means 'ready.' Since the sentence describes a lifelong characteristic, SER (era) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeño, mi padre me leía un cuento cada noche.",
    "en": "When I was little, my father read me a story every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions and for background states. 'When I was little' describes an ongoing state in the past, and 'every night' signals a repeated routine — both require Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Revisaba los correos cuando de repente el sistema ___.",
    "en": "I was checking emails when suddenly the system crashed.",
    "options": [
      "fallaba",
      "falló",
      "ha fallado",
      "falla"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the ongoing background action uses Imperfecto (revisaba) and the sudden interrupting event uses Pretérito Indefinido. 'De repente' is a strong signal for a completed, punctual event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, ___ tres veces a Barcelona por trabajo.",
    "en": "Last year, I went to Barcelona three times for work.",
    "options": [
      "iba",
      "fui",
      "voy",
      "iré"
    ],
    "correct": 1,
    "explanation": "Pretérito Indefinido is used for completed actions with a defined number of occurrences or a closed time frame. 'Three times' and 'last year' both signal a finished, countable event — not a habit or background."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and it is used when the relative pronoun has no explicit antecedent. 'Que' alone would need a prior noun, and 'qué' is used in direct or indirect questions with a question mark."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que por fin hayas conseguido el ascenso que querías.",
    "en": "How great that you've finally got the promotion you wanted.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' is used in exclamatory sentences to express strong emotion and translates as 'how' or 'what a.' It is followed directly by an adjective, adverb, or noun. 'Que' alone cannot open an exclamation in this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho ruido en la oficina, ___ muchísimo y no puedo concentrarme.",
    "en": "When there is a lot of noise in the office, I get really stressed and can't concentrate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the Yo-y-yo pattern: the subject causes their own state, so the verb agrees with 'yo' (first person singular). No external agent is causing the stress — the speaker is the source and experiencer."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando llegas tarde sin avisar; es una falta de respeto.",
    "en": "You always stress me out when you arrive late without warning; it's disrespectful.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "nos estresamos"
    ],
    "correct": 1,
    "explanation": "In the Yo-y-tú pattern, an external agent (tú) causes a reaction in the speaker (me). The verb agrees with 'tú' (second person singular: estresas), while 'me' marks the speaker as the affected object."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomara"
    ],
    "correct": 1,
    "explanation": "Hypothetical si-clauses in the present use the pattern: si + Imperfecto Subjuntivo → Condicional Simple in the main clause. The Condicional expresses a result that is contingent on an unlikely or imagined condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the forecast, tomorrow it will be very hot all along the coast.",
    "options": [
      "haría",
      "hará",
      "va a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is used for factual predictions about the future, especially based on evidence like forecasts. 'Haría' would imply a hypothetical condition. Both 'hará' and 'va a hacer' are possible, but 'hará' better fits a formal, forecast-based statement."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Estoy segura de que esta noche ___ a cenar con nosotros — ya le confirmé la reserva.",
    "en": "I'm sure she is going to have dinner with us tonight — I already confirmed the reservation.",
    "options": [
      "vendría",
      "vendrá",
      "va a venir",
      "venga"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (and its conjugated forms) expresses near-future plans that are already arranged or decided, especially in spoken language. 'Vendrá' is also possible but feels more formal or distant; 'va a venir' fits the conversational certainty here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to submit the report before Friday.",
    "options": [
      "entregan",
      "entreguen",
      "entregarán",
      "entregaban"
    ],
    "correct": 1,
    "explanation": "After expressions of desire (querer que), the subordinate clause requires the Subjuntivo. The subject of the main clause (el jefe) is different from the subject of the subordinate clause (todos), which is the key trigger for Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante ___ tan bueno como dicen.",
    "en": "I don't think the new restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion (no creo que, no pienso que) trigger the Subjuntivo because they express doubt or denial rather than assertion. If the speaker said 'creo que es,' they would use the Indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ el contrato, te llamo inmediatamente.",
    "en": "As soon as I get the contract, I'll call you immediately.",
    "options": [
      "recibo",
      "reciba",
      "recibiré",
      "recibía"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require Subjuntivo when they refer to future events. Using Indicativo (recibo) would suggest a habitual present action, not a future one."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ la música, por favor! Los vecinos ya se han quejado dos veces.",
    "en": "Turn down the music, please! The neighbors have already complained twice.",
    "options": [
      "Bajas",
      "Baja",
      "Bajar",
      "Bajen"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative is formed by dropping the -s from the present tense tú form (bajas → baja). It is used for direct commands addressed to one person informally. 'Bajen' would be the ustedes imperative."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el formulario sin leer las instrucciones completas.",
    "en": "Don't fill out the form without reading the complete instructions.",
    "options": [
      "rellena",
      "rellenes",
      "rellene",
      "rellenar"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the Subjuntivo present tense (no rellenes). The affirmative imperative 'rellena' cannot be used after 'no' — negation forces a switch to the Subjunctive form for all persons."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "¿Por qué no responde al teléfono? ___ quedado sin batería.",
    "en": "Why isn't he answering the phone? He must have run out of battery.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that has already happened in the past. It translates as 'must have' or 'probably has.' This is distinct from its other use of expressing completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
