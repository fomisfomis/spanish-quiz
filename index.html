<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 04, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 04, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de música ___ en el parque central este fin de semana.",
    "en": "The music festival is in the central park this weekend.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER (not ESTAR) to express the location of events. ESTAR expresses the location of physical objects and people, but scheduled events use SER because the location is part of how the event is defined."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, el atleta ___ completamente listo.",
    "en": "After running ten kilometers, the athlete was completely exhausted (listo).",
    "options": [
      "fue",
      "era",
      "estuvo",
      "estaba"
    ],
    "correct": 2,
    "explanation": "With adjectives that change meaning, context is key. 'Estar listo' means 'to be ready/exhausted (worn out)' and describes a temporary state, so ESTAR is used. 'Ser listo' would mean 'to be clever/smart' as an inherent trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Esta sopa de tomate ___ riquísima — ¿le pusiste algo especial?",
    "en": "This tomato soup is absolutely delicious — did you put something special in it?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "Use ESTAR with 'rico' when describing how food tastes right now — a sensory experience in the moment. 'Ser rico' would mean 'to be wealthy' (for people) or an inherent quality, not a current tasting experience."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino siempre ___ de mal humor los lunes por la mañana.",
    "en": "My neighbor is always in a bad mood on Monday mornings.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with emotional or mood states, even when they occur habitually. The word 'siempre' can appear with ESTAR when referring to a recurring condition, rather than an inherent, defining characteristic of the person."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi abuela me contaba historias antes de dormir.",
    "en": "When I was little, my grandmother would tell me stories before bed.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for background conditions and habitual or repeated actions in the past. Here, 'era pequeña' sets the background time frame, and 'contaba' describes the repeated habit — both require the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba leyendo el informe cuando el jefe me ___ a su oficina.",
    "en": "I was reading the report when the boss called me to his office.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llame"
    ],
    "correct": 1,
    "explanation": "In interrupted action constructions, the ongoing background action uses the Imperfecto ('estaba leyendo'), while the interrupting event uses the Indefinido. 'Llamó' is a completed, single action that broke the continuity."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, ___ a París y visité el Louvre por primera vez.",
    "en": "Last year, I went to Paris and visited the Louvre for the first time.",
    "options": [
      "iba",
      "fui",
      "vaya",
      "voy"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for completed actions with a specific time frame ('el año pasado') and for sequential, single events. Both 'fui' and 'visité' mark closed, completed past events, making Indefinido the correct choice."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás tratando de explicar — ¿puedes repetirlo más despacio?",
    "en": "I don't understand what you are trying to explain to me — can you repeat it more slowly?",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is a relative pronoun equivalent to 'what/that which' and is used when there is no specific antecedent noun. It acts as a noun clause meaning 'the thing that.' 'Que' alone would need a prior noun referent to work as a relative pronoun."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo — ¡te lo mereces!",
    "en": "How great that you got the job — you deserve it!",
    "options": [
      "Lo",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to mean 'how' or 'what a.' Here it expresses an emotional reaction. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce exclamations of this type."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo que hablar en público — me pongo rojo y todo.",
    "en": "I always get nervous when I have to speak in public — I turn red and everything.",
    "options": [
      "me pongo nervioso",
      "me pones nervioso",
      "me pone nervioso",
      "se pone nervioso"
    ],
    "correct": 0,
    "explanation": "The 'yo y yo' pattern uses a reflexive verb where the subject causes their own emotional state. 'Me pongo nervioso' means 'I make myself nervous / I get nervous' — the subject and the experiencer are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hablas así, ___ — por favor, elige mejor tus palabras.",
    "en": "When you talk like that, you make me angry — please choose your words better.",
    "options": [
      "me enfado",
      "me enfadas",
      "me enfada",
      "te enfadas"
    ],
    "correct": 1,
    "explanation": "The 'yo y tú' pattern uses a verb conjugated in the second person (tú) with a first-person object pronoun (me). 'Me enfadas' means 'you make me angry' — the subject (tú) causes an emotional effect in the speaker (me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaría",
      "tome",
      "tomara"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the main clause must use the Condicional, not the Futuro. The Condicional expresses what would happen under an imagined or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana ___ a recoger los documentos al ayuntamiento — ya tengo la cita confirmada.",
    "en": "Tomorrow I'm going to pick up the documents from the town hall — I already have the confirmed appointment.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "vaya"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already arranged or decided, especially with concrete evidence like a confirmed appointment. 'Iré' is also grammatically possible but sounds more distant or less certain in conversational Spanish."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El director dijo que el nuevo proyecto ___ al menos seis meses en completarse.",
    "en": "The director said that the new project would take at least six months to complete.",
    "options": [
      "tardará",
      "tardaría",
      "tarde",
      "tardara"
    ],
    "correct": 1,
    "explanation": "When reporting speech in the past (dijo que...), the future verb shifts to the Condicional in Spanish. This is called the 'future of the past' — what was future from the perspective of the past moment of speaking becomes Condicional in reported speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu madre ___ bien después de la operación.",
    "en": "I hope your mother is doing well after the surgery.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "Verbs of hope and wish (esperar que, querer que, desear que) trigger the Subjuntivo in the subordinate clause when the subjects of the two clauses are different. 'Esté' is the present Subjuntivo of ESTAR."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as the test results arrive.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaron"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the Subjuntivo when referring to future or hypothetical events. Even though the action seems likely, its occurrence hasn't happened yet, so the Subjuntivo is mandatory."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ tan buena reputación como dicen.",
    "en": "I don't think this restaurant has as good a reputation as they say.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs ('no creer que,' 'no pensar que,' 'no parecer que') trigger the Subjuntivo because they express doubt or denial about the truth of the subordinate clause. Affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ tanto azúcar al café — el médico te lo ha prohibido.",
    "en": "Don't put so much sugar in your coffee — the doctor has forbidden it.",
    "options": [
      "pongas",
      "pones",
      "pon",
      "pondrás"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo, not the affirmative imperative form. 'Pon' is the affirmative tú command, but to negate it you must use 'no pongas,' following the rule: no + present Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochen",
      "abrochan",
      "abrochad",
      "abrochéis"
    ],
    "correct": 0,
    "explanation": "In Latin American Spanish and in formal contexts, 'ustedes' commands use the third-person plural present Subjuntivo form. 'Abrochen' is the ustedes imperative. 'Abrochad' would be the vosotros form, used in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Ha",
      "Habrá",
      "Había",
      "Haya"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event when speaking from the present moment. It conveys 'he must have / he has probably' done something, not a literal future perfect meaning."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
