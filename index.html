<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 22, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 22, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, even though location normally takes ESTAR. 'La reunión es en...' tells us where the event takes place, not where a physical object is sitting."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace tres días.",
    "en": "Don't touch that cheese — it has been bad (spoiled) for three days.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means 'to be spoiled or in bad condition,' indicating a state that has changed. SER + malo would mean 'to be a bad person or thing by nature.'"
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means 'to be clever or sharp,' an inherent characteristic. ESTAR + listo/a means 'to be ready,' referring to a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué al aeropuerto, mis maletas ya ___ abiertas por la aduana.",
    "en": "When I arrived at the airport, my suitcases had already been opened by customs.",
    "options": [
      "eran",
      "estaban",
      "fueron",
      "estuvieron"
    ],
    "correct": 1,
    "explanation": "ESTAR is used with past participles to describe a resultant state (the suitcases were in an 'opened' condition). SER + past participle would form the passive voice describing the action itself."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cada verano, mi familia ___ a la misma casa rural en Asturias.",
    "en": "Every summer, my family went to the same rural house in Asturias.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The signal word 'cada verano' (every summer) confirms this is a recurring pattern, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó la alarma de incendios.",
    "en": "I was cooking calmly when suddenly the fire alarm went off.",
    "options": [
      "cocinaba",
      "cociné",
      "había cocinado",
      "cocinara"
    ],
    "correct": 0,
    "explanation": "When one action interrupts another in the past, the background action (what was already happening) uses the Imperfecto, while the interrupting event uses the Indefinido. 'Cocinaba' sets the scene; 'sonó' is the sudden event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El director ___ el informe ante toda la empresa el lunes pasado.",
    "en": "The director presented the report to the whole company last Monday.",
    "options": [
      "presentaba",
      "presentó",
      "ha presentado",
      "presentaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for actions completed at a specific, stated point in the past. 'El lunes pasado' is a definite time marker that anchors the event as finished and unique."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you are trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominal relative pronoun meaning 'that which' or 'what,' and is used when referring to a concept or idea without a specific antecedent noun. 'Que' alone cannot introduce an indirect question here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ susto me pegué cuando vi la araña en el baño!",
    "en": "What a fright I got when I saw the spider in the bathroom!",
    "options": [
      "Lo que",
      "Que",
      "¡Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'¡Qué + noun/adjective!' is the structure for exclamations in Spanish, equivalent to 'What a...!' in English. It carries a written accent to distinguish it from the relative pronoun 'que.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo una presentación importante al día siguiente.",
    "en": "I always get stressed when I have an important presentation the next day.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "In the 'yo y yo' pattern, the subject causes their own emotional reaction. 'Me estreso' means 'I stress myself out,' with the verb conjugated in the first person and the reflexive pronoun 'me' referring back to the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho.",
    "en": "When you arrive late without warning, you worry me a lot.",
    "options": [
      "me preocupas",
      "me preocupo",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 0,
    "explanation": "In the 'yo y tú' pattern, a second person (tú) causes an emotional reaction in the speaker (yo). The verb agrees with the subject 'tú' (-as ending) and 'me' indicates the person affected is the speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a pottery class.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "hago"
    ],
    "correct": 1,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause when the si-clause uses the Imperfecto de Subjuntivo. It expresses what would happen under an unreal or unlikely condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale en veinte minutos — ___ a la estación ahora mismo.",
    "en": "The train leaves in twenty minutes — I'm going to the station right now.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "fuera"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for imminent, planned actions with a clear intention in the near future. 'Iré' (Futuro Simple) is more neutral or formal and less tied to immediate plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la península.",
    "en": "According to the forecast, tomorrow it will be very hot across the whole peninsula.",
    "options": [
      "haría",
      "va a hacer",
      "hará",
      "hace"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used for predictions and forecasts about upcoming events, especially in more neutral or formal registers. Both 'hará' and 'va a hacer' are possible, but 'hará' is more typical in weather forecasts."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ el nuevo protocolo de seguridad.",
    "en": "It is essential that all employees follow the new safety protocol.",
    "options": [
      "siguen",
      "seguirán",
      "sigan",
      "seguían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es importante que) trigger the Subjuntivo in the subordinate clause, because they express a subjective judgment rather than a factual statement."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tuvieras"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'hasta que' require the Subjuntivo when referring to a future event that has not yet occurred. The present indicative 'tienes' would imply a habitual fact, not a future action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ terraza y esté cerca del metro.",
    "en": "I'm looking for an apartment that has a terrace and is near the metro.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent is hypothetical or non-specific (you don't know if such an apartment exists), the relative clause uses the Subjuntivo. If you were referring to a specific known apartment, the indicative 'tiene' would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la cena — es una norma de la casa.",
    "en": "Please, don't use your phone during dinner — it's a house rule.",
    "options": [
      "uses",
      "usas",
      "use",
      "usés"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive: no + subjunctive (no uses, no hables, no pongas). The affirmative tú command uses a different form, but negation always requires the subjunctive for all persons."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus asientos antes de que el avión aterrice.",
    "en": "Ladies and gentlemen, take your seats before the plane lands.",
    "options": [
      "toman",
      "tomen",
      "tomar",
      "tomen ustedes"
    ],
    "correct": 1,
    "explanation": "Ustedes commands use the third-person plural present subjunctive form. 'Tomen' is the affirmative ustedes imperative of 'tomar.' The subject 'ustedes' may optionally be added for emphasis but the verb form remains the same."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro mis llaves en ningún sitio — las ___ en la oficina.",
    "en": "I can't find my keys anywhere — I must have left them at the office.",
    "options": [
      "dejaré",
      "dejaría",
      "habré dejado",
      "hubiera dejado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) expresses probability or deduction about a past event when viewed from the present. It is equivalent to 'must have + past participle' in English and signals the speaker's best guess about what happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
