<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 08, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 08, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, even though SER is not typically used for location. The rule 'ESTAR for location' applies to objects and people, but scheduled events use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary physical state or condition. The plate being hot is a current, changeable state, not an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe exactamente qué decir.",
    "en": "My grandmother is very clever — she always knows exactly what to say.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "With 'listo', SER means clever or intelligent as a permanent trait, while ESTAR listo means to be ready. Since the sentence describes a characteristic of the grandmother, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la maratón, los corredores ___ completamente agotados.",
    "en": "After the marathon, the runners were completely exhausted.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 3,
    "explanation": "ESTAR describes physical or emotional states, and 'estuvieron' (preterite of ESTAR) is used here because the exhaustion was the result of a completed event. The preterite of ESTAR emphasizes the state as a concrete outcome."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis primos.",
    "en": "When I was a child, I used to play football every Saturday with my cousins.",
    "options": [
      "jugué",
      "jugaría",
      "jugaba",
      "he jugado"
    ],
    "correct": 2,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a regular routine, which requires the imperfecto rather than the indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted actions, the background or ongoing action uses the imperfecto, while the interrupting event uses the indefinido. 'Leía' sets the scene, and 'sonó' is the sudden interruption."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally submitted the report that I had been preparing for weeks.",
    "options": [
      "entregaba",
      "entregué",
      "entregara",
      "entregaría"
    ],
    "correct": 1,
    "explanation": "The indefinido is used for completed, one-time actions at a specific point in the past. 'Ayer' and 'por fin' are strong markers of a completed event, requiring the pretérito indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominal relative pronoun meaning 'what' or 'that which', used when there is no specific antecedent. 'Que' alone would require a prior noun reference, and 'qué' with an accent is used in direct or indirect questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ vestido tan bonito llevas hoy, Mariana!",
    "en": "What a beautiful dress you're wearing today, Mariana!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamations to express admiration or surprise. In exclamatory sentences with nouns, the structure is '¡Qué + noun + tan/más + adjective!' This is distinct from the relative pronoun 'que' without an accent."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ muchísimo con todos los cambios en la empresa.",
    "en": "Lately I've been stressing a lot with all the changes at the company.",
    "options": [
      "me estresa",
      "me estresas",
      "me estresan",
      "me estreso"
    ],
    "correct": 3,
    "explanation": "When the subject causes the action upon themselves, the verb agrees with the first-person subject: 'yo me estreso'. This is the 'yo y yo' pattern where the person is both the agent and receiver of the action."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho.",
    "en": "When you arrive late without letting me know, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresa",
      "me estresas",
      "te estresas"
    ],
    "correct": 2,
    "explanation": "In the 'yo y tú' pattern, someone else (tú) causes the emotional state in the speaker (me). The verb conjugates in the second person 'estresas' while 'me' is the indirect object indicating who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si pudiera elegir, ___ vivir cerca del mar.",
    "en": "If I could choose, I would live near the sea.",
    "options": [
      "viviré",
      "voy a vivir",
      "viviría",
      "viva"
    ],
    "correct": 2,
    "explanation": "The conditional is used in hypothetical or unreal situations introduced by 'si + imperfecto de subjuntivo'. It expresses what would happen under imagined conditions, not real plans or predictions."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de treinta grados en toda la región.",
    "en": "According to the forecast, tomorrow it will be over thirty degrees across the whole region.",
    "options": [
      "haría",
      "habría",
      "habrá",
      "vaya a hacer"
    ],
    "correct": 2,
    "explanation": "The futuro simple is used for objective predictions or forecasts about the future. When referring to a concrete future event based on evidence like a weather forecast, the futuro simple is preferred over the conditional."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "—¿Cuándo vas a terminar el proyecto? —___ terminarlo este fin de semana sin falta.",
    "en": "'When are you going to finish the project?' 'I'm going to finish it this weekend without fail.'",
    "options": [
      "Terminaré",
      "Terminaría",
      "Voy a terminar",
      "Termine"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a planned, intentional action in the near future with a sense of commitment or decision already made. It is preferred over the futuro simple when the speaker has a concrete plan in mind."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tus padres ___ bien el largo vuelo.",
    "en": "I hope your parents handle the long flight well.",
    "options": [
      "toleren",
      "toleran",
      "tolerarán",
      "toleraran"
    ],
    "correct": 0,
    "explanation": "After verbs of hope or desire like 'esperar que', the subjuntivo presente is required when the subject of the main clause differs from the subject of the subordinate clause. This is a core trigger for the subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Voy a esperar aquí hasta que ___ el mecánico.",
    "en": "I'm going to wait here until the mechanic arrives.",
    "options": [
      "llega",
      "llegará",
      "llegue",
      "llegara"
    ],
    "correct": 2,
    "explanation": "After temporal conjunctions like 'hasta que', 'cuando', and 'en cuanto' referring to future events, the subjuntivo is required. When the action has not yet happened at the time of speaking, the present subjunctive is used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los empleados ___ las normas de seguridad.",
    "en": "It is essential that employees follow the safety regulations.",
    "options": [
      "siguen",
      "sigan",
      "seguirán",
      "seguían"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance like 'es fundamental que', 'es necesario que', and 'es importante que' always trigger the subjuntivo in the subordinate clause."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ esa canción otra vez — me encanta el estribillo.",
    "en": "Hey, play that song again — I love the chorus.",
    "options": [
      "pon",
      "pones",
      "pongas",
      "no pongas"
    ],
    "correct": 0,
    "explanation": "For affirmative tú commands, most verbs use the third-person singular of the present indicative. 'Pon' is the irregular affirmative imperative of 'poner', which drops the -er ending entirely."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión.",
    "en": "Please, don't use your phone during the meeting.",
    "options": [
      "usa",
      "usas",
      "uses",
      "usarás"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are formed with 'no' + present subjunctive. The affirmative command 'usa' becomes 'no uses' in the negative. This is why the subjuntivo is essential for negative imperatives."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro mis llaves. Las ___ en la chaqueta que dejé en la oficina.",
    "en": "I can't find my keys. I must have left them in the jacket I left at the office.",
    "options": [
      "habré dejado",
      "habría dejado",
      "he dejado",
      "había dejado"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habré + participio) is used to express probability or deduction about a past event from the speaker's present perspective. It is equivalent to 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
