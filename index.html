<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 18, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 18, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR is used for the physical location of objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese queso — ___ malo desde hace una semana.",
    "en": "Don't touch that cheese — it has been bad for a week.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is in a state of spoilage, which is a temporary condition. SER + malo would mean something is inherently evil or of poor quality by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very clever — she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means to be clever or smart as an inherent characteristic. ESTAR + listo/a, by contrast, means to be ready, which is a temporary state rather than a permanent trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la caminata de ocho horas, todos nosotros ___ muertos de cansancio.",
    "en": "After the eight-hour hike, all of us were dead tired.",
    "options": [
      "éramos",
      "fuimos",
      "estábamos",
      "somos"
    ],
    "correct": 2,
    "explanation": "ESTAR is used for states resulting from an action or experience, and 'muerto de cansancio' describes a temporary physical condition. The imperfect ESTÁBAMOS is correct because it describes an ongoing state at that moment in the past."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los sábados con mis vecinos.",
    "en": "When I was a child, I used to play football every Saturday with my neighbors.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaré"
    ],
    "correct": 1,
    "explanation": "The imperfect (jugaba) expresses habitual or repeated past actions. The clue 'todos los sábados' signals a regular routine, not a single completed event, which would require the indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "The imperfect (leía) describes the background action in progress that was interrupted, while the indefinido (sonó) expresses the completed event that interrupted it. This is the classic interrupted-action structure."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por la mañana, mi jefa ___ (llamar) para cancelar la reunión.",
    "en": "Yesterday morning, my boss called to cancel the meeting.",
    "options": [
      "llamaba",
      "llamaría",
      "llamó",
      "ha llamado"
    ],
    "correct": 2,
    "explanation": "The indefinido (llamó) is used for a single, completed action at a specific past time. 'Ayer por la mañana' is a time marker indicating a finished, bounded event, which rules out the imperfect."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a nominalised relative pronoun meaning 'what' or 'that which' and introduces a noun clause. It is used here because the clause refers to an unspecified thing, not to an explicitly mentioned noun."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido ese trabajo tan pronto.",
    "en": "How great that you got that job so quickly.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuánto"
    ],
    "correct": 1,
    "explanation": "Qué + adjective/adverb is the structure for exclamations in Spanish. It expresses an emotional reaction and is accentuated to distinguish it from the relative pronoun que and the conjunction que."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo demasiado trabajo, ___ mucho y no puedo dormir.",
    "en": "When I have too much work, I stress a lot and can't sleep.",
    "options": [
      "me estresa",
      "te estreso",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "Me estreso follows the 'yo y yo' pattern: the subject and the person affected are the same (I stress myself). Me estresa would mean something external stresses me, which would require naming that external cause."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you stress me out a lot.",
    "options": [
      "me estreso",
      "te estresas",
      "me estresa",
      "me estresas"
    ],
    "correct": 3,
    "explanation": "Me estresas follows the 'yo y tú' pattern: tú (you) is the subject causing the effect on me (the indirect object). This is different from me estreso (I stress myself) or me estresa (something else stresses me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The conditional (aprendería) is used in the main clause of hypothetical si-clauses when the si-clause contains the imperfect subjunctive. This structure expresses a situation that is contrary to current reality."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana tengo una entrevista importante — ___ (salir) de casa a las ocho en punto.",
    "en": "Tomorrow I have an important interview — I'm going to leave the house at exactly eight.",
    "options": [
      "saldría",
      "salgo",
      "voy a salir",
      "saliera"
    ],
    "correct": 2,
    "explanation": "Voy a + infinitivo expresses a planned or intended future action with a sense of immediacy and personal commitment. The simple future (saldré) is also possible but feels more formal, while voy a salir suggests a concrete, already-decided plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El año que viene, el gobierno ___ (construir) tres nuevos hospitales en la región.",
    "en": "Next year, the government will build three new hospitals in the region.",
    "options": [
      "construiría",
      "construye",
      "construirá",
      "construyera"
    ],
    "correct": 2,
    "explanation": "The simple future (construirá) is used for official announcements, predictions, and statements about future events with a degree of certainty. The conditional would imply doubt or a hypothetical condition."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Esperamos que el vuelo ___ (llegar) a tiempo porque tenemos conexión.",
    "en": "We hope that the flight arrives on time because we have a connection.",
    "options": [
      "llega",
      "llegue",
      "llegará",
      "llegara"
    ],
    "correct": 1,
    "explanation": "Esperar que triggers the present subjunctive (llegue) because it expresses a wish or hope projected onto a different subject. The subjunctive is required after verbs of volition and desire when the subjects of the two clauses differ."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (ser) tan bueno como dicen.",
    "en": "I don't think this restaurant is as good as they say.",
    "options": [
      "es",
      "sea",
      "será",
      "sería"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like no creer que require the subjunctive in the subordinate clause because the speaker is casting doubt on the statement rather than asserting it as fact. Affirmative creo que, by contrast, uses the indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ (terminar) la reunión, te llamo para contarte todo.",
    "en": "As soon as the meeting finishes, I'll call you to tell you everything.",
    "options": [
      "termina",
      "terminará",
      "termine",
      "terminara"
    ],
    "correct": 2,
    "explanation": "Cuando and en cuanto require the present subjunctive when referring to future events, even though English uses the present tense in such clauses. This is a key rule because the future indicative (terminará) is never used after these conjunctions in this context."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (escuchar) bien lo que te voy a decir, porque es importante.",
    "en": "Hey, listen carefully to what I'm going to tell you, because it's important.",
    "options": [
      "escuche",
      "escuchas",
      "escucha",
      "escuches"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed with the third-person singular present indicative (escucha). This is different from the negative tú imperative, which uses the present subjunctive (no escuches)."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (encender) el aire acondicionado — acabo de abrir la ventana.",
    "en": "Please don't turn on the air conditioning — I just opened the window.",
    "options": [
      "enciendas",
      "enciende",
      "enciendes",
      "encender"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjunctive (no enciendas). The affirmative imperative form (enciende) can never be made negative by simply adding 'no' — the subjunctive form must be used instead."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas tres horas con el teléfono. ___ (hablar) con alguien toda la tarde.",
    "en": "You've been on your phone for three hours. You must have been talking to someone all afternoon.",
    "options": [
      "Hablarás",
      "Habrás hablado",
      "Habías hablado",
      "Hablaste"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrás hablado) is used to express probability or deduction about something that has likely already happened in the recent past. This is the 'epistemic' use, similar to saying 'you must have been talking' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
