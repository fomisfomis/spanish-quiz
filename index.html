<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 28, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 28, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de mañana ___ en el parque central, así que lleva una manta.",
    "en": "Tomorrow's concert ___ in the central park, so bring a blanket.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where and when they take place, even though location normally uses ESTAR. ESTAR is used for the physical position of objects and people, but scheduled events are described with SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it ___ still very hot.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, including current temperature. SER would imply that being hot is an inherent, permanent characteristic of the soup, which is not the intended meaning here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este pastel que hice — ¡___ riquísimo!",
    "en": "Try this cake I made — it ___ absolutely delicious!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "With the adjective 'rico', SER means 'to be rich/wealthy', but ESTAR rico means 'to taste/be delicious'. This is a meaning-changing adjective where the choice of verb completely alters the meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecino ___ bastante aburrido — siempre habla de lo mismo.",
    "en": "My neighbor ___ quite boring — he always talks about the same things.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + aburrido means the person has a boring personality as a characteristic trait. ESTAR aburrido would mean the person feels bored at a particular moment — a temporary emotional state rather than a defining quality."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ niño, mi abuelo me contaba historias todas las noches.",
    "en": "When I ___ a child, my grandfather would tell me stories every night.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto (era) is used here because being a child is a background condition or ongoing state during a past period, not a completed event. Imperfecto sets the scene for habitual or repeated past actions."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ el informe cuando de repente se fue la luz.",
    "en": "I ___ the report when suddenly the power went out.",
    "options": [
      "terminé",
      "terminaba",
      "escribí",
      "escribía"
    ],
    "correct": 3,
    "explanation": "The imperfecto (escribía) describes an ongoing background action that was interrupted. The interrupting event ('se fue la luz') uses the indefinido. The structure 'action in progress + de repente + completed event' is a classic imperfecto vs. indefinido pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El sábado pasado, Ana ___ al gimnasio por primera vez en meses.",
    "en": "Last Saturday, Ana ___ to the gym for the first time in months.",
    "options": [
      "iba",
      "fue",
      "ha ido",
      "hubiera ido"
    ],
    "correct": 1,
    "explanation": "Pretérito indefinido (fue) is used for a completed, one-time action at a specific past moment ('el sábado pasado'). 'Por primera vez' further signals a singular, completed event rather than a habitual or ongoing situation."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand ___ you are trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'the thing that'. It is used when 'what' refers to an unspecified thing or idea. 'Que' alone cannot introduce an indirect question or replace 'the thing that'."
  },
  {
    "topic": "Usos de QUE",
    "q": "Llevo tres horas esperando. Es ___ el tráfico hoy es imposible.",
    "en": "I've been waiting three hours. It's ___ the traffic today is impossible.",
    "options": [
      "lo que",
      "qué",
      "que",
      "el que"
    ],
    "correct": 2,
    "explanation": "'Es que' is a fixed explanatory phrase used to introduce a reason or excuse, equivalent to 'the thing is that' or 'it's just that' in English. It is not interchangeable with 'lo que' or 'qué' in this context."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos tan ajustados del trabajo.",
    "en": "Lately I ___ a lot because of the very tight deadlines at work.",
    "options": [
      "me estreso",
      "te estreso",
      "me estresas",
      "se estresa"
    ],
    "correct": 0,
    "explanation": "'Me estreso' follows the 'yo y yo' pattern: the subject experiences a self-generated or internally felt state. The reflexive pronoun 'me' matches the subject 'yo', indicating the stress originates from within or from circumstances, not from another person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo.",
    "en": "When you arrive late without warning, you ___ me a lot.",
    "options": [
      "me estreso",
      "te estresas",
      "me estresas",
      "se estresa"
    ],
    "correct": 2,
    "explanation": "'Me estresas' follows the 'yo y tú' pattern: a second person (tú) causes an effect on a first person (me). The subject is 'tú' and the object pronoun 'me' shows who receives the emotional impact of the action."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ con él?",
    "en": "If you had more free time, what ___ you do with it?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The condicional (harías) is required in the main clause of a hypothetical 'si + imperfecto de subjuntivo' structure. The futuro simple would imply a likely real future condition, not a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya tomé la decisión: este verano ___ a Japón.",
    "en": "I've already made the decision: this summer I ___ to Japan.",
    "options": [
      "iría",
      "voy a ir",
      "fuera",
      "haya ido"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' expresses a firm intention or plan already decided in the near or defined future. The futuro simple (iré) is also grammatically correct but feels more neutral and distant, while 'voy a ir' conveys a concrete, personal commitment."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ más de 35 grados en Sevilla.",
    "en": "According to the forecast, tomorrow it ___ over 35 degrees in Seville.",
    "options": [
      "haría",
      "habrá",
      "haya",
      "habría"
    ],
    "correct": 1,
    "explanation": "Futuro simple (habrá) is used for objective predictions or forecasts about the future, especially when based on evidence or external sources. The condicional (habría) would express a hypothetical or reported condition, not a direct prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mis padres quieren que ___ más cuidado con el dinero.",
    "en": "My parents want me to be more careful with money.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tener"
    ],
    "correct": 1,
    "explanation": "After 'querer que', the subjunctive is mandatory when there is a change of subject. 'Querer + que + subjunctivo' expresses a desire directed at someone else. The indicative 'tengo' cannot follow 'que' in a wish clause with a different subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ el resultado del examen.",
    "en": "I'll call you as soon as I ___ the exam result.",
    "options": [
      "sepa",
      "sé",
      "sabré",
      "supiera"
    ],
    "correct": 0,
    "explanation": "After time conjunctions like 'en cuanto', 'cuando', or 'hasta que' referring to a future event, the subjunctive (sepa) is required. The indicative is used for habitual or past situations, not for actions that haven't happened yet."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo jefe ___ tanto como dicen.",
    "en": "I don't think the new boss ___ as much as they say.",
    "options": [
      "sabe",
      "sepa",
      "sabía",
      "supo"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the subjunctive because the speaker is casting doubt on the truth of the following clause. When 'creer' is affirmative, it takes the indicative; the negation shifts it to subjunctive."
  },
  {
    "topic": "Imperativo",
    "q": "Antes de salir, ___ las ventanas — está nublado.",
    "en": "Before leaving, ___ the windows — it's cloudy.",
    "options": [
      "cierra",
      "cierras",
      "cerrar",
      "cierres"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'cerrar' is 'cierra', which is identical to the third-person singular present indicative. This is a regular pattern for most -ar and -er verbs: drop the -s from the tú present indicative form."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión.",
    "en": "Please, don't ___ your phone during the meeting.",
    "options": [
      "uses",
      "usas",
      "usar",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present subjunctive: 'no uses'. The affirmative imperative 'usa' is not used with negation — you must switch to the subjunctive form 'uses' for all negative commands in the tú form."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Rodrigo no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Rodrigo hasn't arrived. He ___ missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about a past event when speaking from a present-time perspective. It is the equivalent of 'must have' in English and conveys reasoned speculation about what has already happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
