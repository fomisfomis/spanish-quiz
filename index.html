<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 23, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 23, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events (concerts, parties, meetings), even though location normally uses ESTAR. ESTAR is reserved for the location of physical objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese chile — ___ muy picante y te va a quemar la boca.",
    "en": "Don't touch that chili pepper — it's very spicy and it will burn your mouth.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER is used for inherent, defining characteristics of things. Being spicy is a natural, intrinsic property of a chili pepper, not a temporary or changeable state, so SER is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de trabajar doce horas seguidas, el chef ___ completamente listo para irse a casa.",
    "en": "After working twelve hours straight, the chef is completely ready to go home.",
    "options": [
      "es",
      "fue",
      "está",
      "sea"
    ],
    "correct": 2,
    "explanation": "ESTAR + listo means 'to be ready,' a state someone is in at a given moment. SER + listo means 'to be clever or smart.' The context of being ready to leave after a long shift calls for ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ viuda desde hace veinte años.",
    "en": "My grandmother has been a widow for twenty years.",
    "options": [
      "está",
      "es",
      "estaba",
      "era"
    ],
    "correct": 0,
    "explanation": "Although widowhood might seem permanent, Spanish uses ESTAR + viudo/a because it describes a civil or marital state — a condition someone is in, similar to casado, divorciado, or soltero. These are states, not intrinsic identities."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los sábados con mis primos.",
    "en": "When I was a child, I used to play soccer every Saturday with my cousins.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' is a key marker of habitual past behavior, signaling imperfecto rather than indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Nosotros ___ (cenar) cuando de repente sonó el teléfono.",
    "en": "We were having dinner when suddenly the phone rang.",
    "options": [
      "cenamos",
      "cenábamos",
      "habíamos cenado",
      "cenamos"
    ],
    "correct": 1,
    "explanation": "The imperfecto describes a background action in progress (cenar) that was interrupted by a sudden completed event (sonó, in indefinido). The structure 'background imperfecto + de repente + indefinido' is a classic pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El martes pasado, María ___ (terminar) su informe justo antes de la reunión.",
    "en": "Last Tuesday, María finished her report just before the meeting.",
    "options": [
      "terminaba",
      "terminó",
      "había terminado",
      "terminaría"
    ],
    "correct": 1,
    "explanation": "The indefinido (pretérito perfecto simple) is used for a single, completed action at a specific point in the past. 'El martes pasado' is a definite time marker indicating a finished event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' (the thing that) and is used as the object of a verb when referring to something unspecified. 'Que' alone is a simple conjunction and cannot serve this role here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ calor hace hoy — mejor nos quedamos en casa con el aire acondicionado.",
    "en": "What heat there is today — we'd better stay home with the air conditioning.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong feeling or emphasis (¡Qué calor!, ¡Qué bonito!). Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce exclamations."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con tanto ruido en la oficina — no puedo concentrarme.",
    "en": "Lately I get really stressed with so much noise in the office — I can't concentrate.",
    "options": [
      "me estresa",
      "me estresas",
      "me estreso",
      "me han estresado"
    ],
    "correct": 2,
    "explanation": "'Yo me estreso' follows the 'Yo y yo' pattern, where the subject and the person affected are the same (reflexive). The person actively experiences the stress as a reaction from within themselves, not caused by another specific person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo — por favor, mándame un mensaje.",
    "en": "When you arrive late without warning, you stress me out a lot — please send me a message.",
    "options": [
      "me estreso",
      "me estresa",
      "te estresas",
      "me estresas"
    ],
    "correct": 3,
    "explanation": "'Me estresas' follows the 'Yo y tú' pattern — the subject (tú) causes an emotional effect on another person (me). The verb agrees with the subject causing the reaction, while 'me' is the indirect object receiving it."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿___ (viajar) a Japón?",
    "en": "If you had more free time, would you travel to Japan?",
    "options": [
      "viajarás",
      "vas a viajar",
      "viajarías",
      "viajes"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses (si + imperfect subjunctive), the main clause requires the condicional simple. This structure expresses an unlikely or imagined condition, not a real future plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que ___ (llover) esta tarde.",
    "en": "Look at those dark clouds — I think it's going to rain this afternoon.",
    "options": [
      "lloverá",
      "llovería",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "'Ir a + infinitivo' is preferred when there is visible or immediate evidence pointing to a near-future event (the dark clouds). Futuro simple (lloverá) sounds more like a neutral prediction without the sense of imminent evidence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el horario oficial, el tren ___ (llegar) a las 9:15 de la mañana.",
    "en": "According to the official timetable, the train will arrive at 9:15 in the morning.",
    "options": [
      "llegaría",
      "va a llegar",
      "llegará",
      "llegue"
    ],
    "correct": 2,
    "explanation": "The futuro simple is appropriate for scheduled, official, or formally planned future events. 'Ir a + infinitivo' is more colloquial and intention-based; the condicional would imply unreality or reported speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los empleados ___ (leer) el nuevo reglamento antes del viernes.",
    "en": "It is important that all employees read the new regulations before Friday.",
    "options": [
      "leen",
      "lean",
      "leerán",
      "leyeran"
    ],
    "correct": 1,
    "explanation": "After impersonal expressions like 'es importante que,' 'es necesario que,' or 'es bueno que,' the subjunctive is required because they express a wish, recommendation, or judgment about someone else's action."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto — estaré esperando noticias.",
    "en": "Call me as soon as you arrive at the airport — I'll be waiting for news.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the subjunctive when they refer to a future or hypothetical event. When they refer to habitual or past actions, the indicative is used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (ser) tan bueno como dicen las reseñas.",
    "en": "I don't think this restaurant is as good as the reviews say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que, no parecer que) trigger the subjunctive in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (hablar) tan rápido — no te entiendo bien.",
    "en": "Please, don't speak so fast — I don't understand you well.",
    "options": [
      "hablas",
      "habla",
      "hables",
      "hablás"
    ],
    "correct": 2,
    "explanation": "Negative tú commands use the present subjunctive form, not the affirmative imperative. So while 'habla' is the affirmative tú command, 'no hables' is the negative tú command."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse) los cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, fasten your seatbelts, please.",
    "options": [
      "abróchense",
      "abróchate",
      "abrochad",
      "se abrochen"
    ],
    "correct": 0,
    "explanation": "For ustedes commands (used in Latin America and formal contexts in Spain), use the third-person plural present subjunctive form. Reflexive pronouns are attached directly to the end of affirmative commands: abróchense."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía. ___ (perderse) en el metro — siempre le pasa.",
    "en": "Marcos hasn't arrived yet. He must have gotten lost on the subway — it always happens to him.",
    "options": [
      "Se perdió",
      "Se perderá",
      "Se habrá perdido",
      "Se había perdido"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habrá + participio) is used to speculate or make deductions about something that probably happened in the past or recently, when the speaker doesn't know for certain. It expresses probability about a completed past action."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
