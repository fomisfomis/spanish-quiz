<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 29, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 29, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express location, not ESTAR. ESTAR indicates the physical location of objects or people, but for scheduled events, SER is required even though it feels like a location question."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese pastel — ___ para la reunión de mañana.",
    "en": "Don't touch that cake — it's for tomorrow's meeting.",
    "options": [
      "está",
      "es",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER is used to express purpose or destination (ser + para). This describes what the cake is intended for, which is an inherent characteristic of its purpose, not a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, los niños ___ listos para dormir.",
    "en": "After walking ten kilometers, the children were ready to fall asleep.",
    "options": [
      "eran",
      "fueron",
      "estaban",
      "estuvieron"
    ],
    "correct": 2,
    "explanation": "ESTAR + listo means 'ready', describing a temporary condition resulting from exhaustion. SER + listo would mean 'clever/smart', a permanent character trait — context makes clear we want the temporary state here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué raro! La sopa que hizo mi abuela hoy ___ muy rica.",
    "en": "How strange! The soup my grandmother made today is very tasty.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico describes how something tastes in the moment of eating — a sensory, temporary experience. SER + rico would mean the food is generally considered a high-quality or expensive item, not how it tastes right now."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando ___ pequeña, mi madre siempre me cantaba una canción antes de dormir.",
    "en": "When I was little, my mother always sang me a song before sleep.",
    "options": [
      "fui",
      "era",
      "estuve",
      "estaba"
    ],
    "correct": 1,
    "explanation": "The imperfecto (era) is used for habitual or repeated past actions and ongoing states. 'Siempre' reinforces the habitual nature, and being 'little' is a background state rather than a completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente el periódico cuando de repente sonó el teléfono.",
    "en": "I was calmly reading the newspaper when the phone suddenly rang.",
    "options": [
      "leí",
      "leer",
      "leía",
      "había leído"
    ],
    "correct": 2,
    "explanation": "The imperfecto (leía) describes an ongoing background action that was interrupted. The interrupting event (sonó) takes the indefinido because it is a completed, punctual action — the classic imperfecto/indefinido contrast."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ hablar con el director sobre mi aumento de sueldo.",
    "en": "Yesterday I finally managed to speak with the director about my raise.",
    "options": [
      "podía",
      "pude",
      "puedo",
      "pudiera"
    ],
    "correct": 1,
    "explanation": "The indefinido (pude) signals a completed, successful action at a specific moment ('ayer por fin'). Podía would imply an ongoing ability without stressing that it was actually accomplished — indefinido of poder often means 'managed to'."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "qué",
      "lo que",
      "que",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a relative pronoun meaning 'what/that which' and replaces a noun concept (the thing that). Que alone would need a specific antecedent, and qué is used in direct or indirect questions with an interrogative meaning."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo, ¡me alegra mucho!",
    "en": "How great that you got the job, I'm so happy for you!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Lo cual"
    ],
    "correct": 1,
    "explanation": "Qué is used in exclamations to express strong emotion (¡Qué bien!, ¡Qué lástima!). It functions as an exclamative adjective or adverb and is always written with an accent mark to distinguish it from the relative/conjunction que."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Desde que empecé este trabajo nuevo, ___ mucho por las noches y no consigo dormir.",
    "en": "Since I started this new job, I stress a lot at night and can't sleep.",
    "options": [
      "me estresan",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "Me estreso follows the 'yo y yo' pattern — the subject and the person affected are the same (I stress myself / I experience stress). This is a true reflexive action where the subject performs and receives the action."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho y no puedo concentrarme.",
    "en": "When you arrive late without warning, you stress me out a lot and I can't concentrate.",
    "options": [
      "me estreso",
      "me estresa",
      "te estresas",
      "me estresan"
    ],
    "correct": 1,
    "explanation": "Me estresa follows the 'yo y tú' pattern — a second party (tú) is causing stress to the speaker (me). The verb conjugates in third person to agree with the implicit subject causing the effect, not the person experiencing it."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "voy a hacer",
      "haría",
      "haga"
    ],
    "correct": 2,
    "explanation": "The condicional (haría) is required in the result clause of a hypothetical si-clause using subjuntivo (si tuviera). Futuro simple or voy a + infinitivo cannot be used in this structure because the situation is contrary to current reality."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la región sur.",
    "en": "According to the forecast, tomorrow it will be very hot in the entire southern region.",
    "options": [
      "haría",
      "habría",
      "hará",
      "vaya a hacer"
    ],
    "correct": 2,
    "explanation": "The futuro simple (hará) expresses a future fact or prediction based on information (the weather forecast). The condicional is used for hypotheticals or reported speech, not straightforward future predictions backed by evidence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Espera, no salgas todavía — ___ hablar con el jefe antes de tomar esa decisión.",
    "en": "Wait, don't leave yet — you should speak with the boss before making that decision.",
    "options": [
      "deberás",
      "deberías",
      "vas a deber",
      "debes"
    ],
    "correct": 1,
    "explanation": "The condicional (deberías) softens a recommendation or advice, making it more polite and less imposing. Deberás would be a firm future obligation, and debes is a direct present obligation — condicional is the standard form for gentle suggestions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ al menos ocho horas cada noche.",
    "en": "The doctor recommends that you sleep at least eight hours every night.",
    "options": [
      "duermes",
      "dormirás",
      "duermas",
      "duermen"
    ],
    "correct": 2,
    "explanation": "After verbs of recommendation, wish, or command (recomendar, querer, sugerir) with a change of subject, the subjuntivo is required in the subordinate clause. The trigger verb and the subject of the dependent clause are different (el médico vs tú)."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the analysis results.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tenías"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like en cuanto, cuando, and hasta que require the subjuntivo when referring to a future action that has not yet occurred. The indicative is only used with these conjunctions when describing habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ cerca del metro y que no sea muy caro.",
    "en": "I'm looking for an apartment that is close to the metro and not too expensive.",
    "options": [
      "está",
      "esté",
      "estará",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent is indefinite or hypothetical (the apartment may not exist yet), the relative clause requires the subjuntivo. If the speaker were talking about a specific known apartment, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ las instrucciones antes de montar el mueble, por favor.",
    "en": "Hey, read the instructions before assembling the furniture, please.",
    "options": [
      "lees",
      "lea",
      "lee",
      "leas"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative of regular -er verbs is formed using the third-person singular present indicative (lee). This is different from the negative tú imperative (no leas) which uses the present subjuntivo form."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, señores pasajeros, no ___ en los pasillos durante el despegue.",
    "en": "Please, passengers, do not stand in the aisles during takeoff.",
    "options": [
      "se paren",
      "párese",
      "párense",
      "se para"
    ],
    "correct": 2,
    "explanation": "Negative ustedes commands use the present subjuntivo form with the reflexive pronoun placed before the verb (no + pronoun + subjuntivo). Affirmative commands would attach the pronoun after the verb (párense), but negative ones always separate them."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No veo las llaves por ningún lado. Las ___ en la oficina.",
    "en": "I can't find the keys anywhere. I must have left them at the office.",
    "options": [
      "habría dejado",
      "dejé",
      "dejaré",
      "habré dejado"
    ],
    "correct": 3,
    "explanation": "The futuro compuesto (habré dejado) expresses probability or deduction about a past event when the speaker is in the present. It is equivalent to 'must have + past participle' in English and is used when reasoning about what likely happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
