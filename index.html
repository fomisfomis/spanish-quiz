<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 30, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 30, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mi prima ___ en el jardín del hotel, no en la iglesia.",
    "en": "My cousin's wedding is in the hotel garden, not in the church.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express their location, even though location normally uses ESTAR. When the subject is an event (a wedding, a concert, a meeting), SER is used to indicate where or when it takes place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa salsa — ___ muy picante para los niños.",
    "en": "Don't touch that sauce — it's very spicy for the kids.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "SER is used for inherent or defining characteristics of something, such as the natural flavor or spiciness of a food. ESTAR would imply a temporary or changed state, which does not fit here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué raro — el gerente ___ muy listo hoy! Normalmente tarda en entender las cosas.",
    "en": "How strange — the manager is very sharp today! He normally takes a while to understand things.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, context is key: 'ser listo' means to be clever by nature, but 'estar listo' means to be ready or, in context like this, sharp/on the ball at a particular moment. The clue 'hoy' signals a temporary state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después del accidente, el ciclista ___ vivo de milagro.",
    "en": "After the accident, the cyclist was alive by a miracle.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "'Estar vivo' expresses a state — being alive — rather than a permanent characteristic. ESTAR is used because 'vivo/muerto' describes a condition that can change, and the sentence refers to a specific moment after the accident."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, ___ (ir) al mercado con mi abuela todos los sábados.",
    "en": "When I was little, I used to go to the market with my grandmother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' signals a routine, not a single completed event, so the Indefinido would be incorrect here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (preparar) la cena cuando de repente sonó la alarma de incendios.",
    "en": "I was preparing dinner when the fire alarm suddenly went off.",
    "options": [
      "preparé",
      "preparaba",
      "he preparado",
      "prepare"
    ],
    "correct": 1,
    "explanation": "In interrupted-action sentences, the ongoing background action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Preparaba' sets the scene; 'sonó' is the sudden event that broke it."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (ganar) el premio nacional de innovación.",
    "en": "Last year, my company won the national innovation award.",
    "options": [
      "ganaba",
      "ganó",
      "ha ganado",
      "ganaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a single completed action at a specific point in the past. 'El año pasado' is a closed time reference that signals a finished event, making the Imperfecto unsuitable."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta del aeropuerto es la cantidad de anuncios por megafonía.",
    "en": "What annoys me about the airport is the number of announcements over the PA system.",
    "options": [
      "Qué",
      "Lo que",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when the relative pronoun has no specific antecedent. 'Que' alone cannot begin a subject clause in this way without an article."
  },
  {
    "topic": "Usos de QUE",
    "q": "Llamé a tres fontaneros, pero ninguno ___ estaba disponible el fin de semana.",
    "en": "I called three plumbers, but none of the ones who were available on the weekend.",
    "options": [
      "lo que",
      "qué",
      "que",
      "el cual"
    ],
    "correct": 2,
    "explanation": "'Que' is the standard relative pronoun used to introduce a defining relative clause after a noun antecedent (here, 'fontaneros'). 'Lo que' is used when there is no noun antecedent, and 'el cual' is more formal and used in non-defining clauses."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con la cantidad de correos que tengo que responder. (yo / el trabajo)",
    "en": "Lately I get very stressed by the amount of emails I have to reply to.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When an external thing (la cantidad de correos) causes the feeling, the verb agrees with that thing, not with 'yo'. This is the 'yo y el mundo' pattern: the subject is the stressor, and 'me' is the indirect object experiencing the effect."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que discutimos, ___ durante horas y no llegamos a ninguna conclusión.",
    "en": "Every time we argue, we stress each other out for hours and reach no conclusion.",
    "options": [
      "nos estresamos",
      "nos estresas",
      "me estresan",
      "os estresas"
    ],
    "correct": 0,
    "explanation": "'Nos estresamos' here expresses the 'yo y tú' reciprocal pattern (we stress each other) or the reflexive 'we stress ourselves'. The first-person plural reflexive pronoun 'nos' with the matching verb ending captures the mutual action between two people."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprendo"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + Imperfecto de Subjuntivo), the main clause requires the Condicional Simple, not the Futuro. The Futuro or 'voy a + infinitivo' cannot follow a past subjunctive condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ (llamar) a la clínica para confirmar mi cita — ya lo tengo decidido.",
    "en": "This afternoon I'm going to call the clinic to confirm my appointment — I've already decided.",
    "options": [
      "llamaría",
      "llamaré",
      "voy a llamar",
      "llamo"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses an intention or plan that has already been decided in the near future. While 'llamaré' is also grammatically possible, 'voy a llamar' better conveys a pre-made decision, especially with 'ya lo tengo decidido'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Crees que el tren ___ (llegar) a tiempo mañana, dado el mal tiempo?",
    "en": "Do you think the train will arrive on time tomorrow, given the bad weather?",
    "options": [
      "llegaría",
      "llegará",
      "va a llegar",
      "llegue"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used to express predictions or likelihood about future events. Here, the speaker is asking about a real future possibility, not a hypothesis, so the Condicional is inappropriate. 'Va a llegar' could also work but feels less natural in a speculative question."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el nuevo compañero de trabajo ___ (adaptarse) bien al equipo.",
    "en": "I hope the new coworker adapts well to the team.",
    "options": [
      "se adapta",
      "se adapte",
      "se adaptará",
      "se adaptaría"
    ],
    "correct": 1,
    "explanation": "Verbs expressing hope, wish, or desire (esperar, querer, desear) trigger the Subjuntivo in the subordinate clause when the subjects are different. 'Que' introduces the subjunctive clause, and the Indicativo cannot replace it here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (abrir) los lunes — siempre está cerrado.",
    "en": "I don't think this restaurant opens on Mondays — it's always closed.",
    "options": [
      "abre",
      "abra",
      "abrirá",
      "abriría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of belief or opinion (no creer, no pensar) require the Subjuntivo in the subordinate clause. The affirmative 'creo que' takes Indicativo, but the negated form expresses doubt, triggering Subjuntivo."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te mandaré las fotos en cuanto ___ (tener) acceso al wifi.",
    "en": "I'll send you the photos as soon as I have access to wifi.",
    "options": [
      "tengo",
      "tenga",
      "tendré",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to a future event that has not yet occurred. Using the Indicativo would imply habitual or past action, not a future intention."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ (poner, tú) esa cara — solo te estoy diciendo la verdad!",
    "en": "Don't make that face — I'm just telling you the truth!",
    "options": [
      "pongas",
      "pongas tú",
      "pones",
      "pon"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed with the present Subjuntivo (no + subjuntivo). The affirmative 'pon' is correct for positive commands, but in the negative, it must switch to 'no pongas'. Subject pronouns are generally omitted in commands."
  },
  {
    "topic": "Imperativo",
    "q": "Si quieren más café, ___ (servirse, ustedes) — la cafetera está en la cocina.",
    "en": "If you want more coffee, help yourselves — the coffee maker is in the kitchen.",
    "options": [
      "se sirven",
      "sírvanse",
      "servirlos",
      "os servid"
    ],
    "correct": 1,
    "explanation": "Affirmative ustedes commands are identical to the third-person plural present Subjuntivo. Reflexive pronouns attach to the end of affirmative imperative forms: 'sirvan' becomes 'sírvanse'. 'Os servid' uses the vosotros form, which is not used in Latin American Spanish."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ (quedarse) sin batería otra vez.",
    "en": "She's not answering the phone. She must have run out of battery again.",
    "options": [
      "Se quedó",
      "Se quedaría",
      "Se habrá quedado",
      "Se había quedado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to make deductions or express probability about something that has likely already happened. It translates roughly to 'must have + past participle' in English, and contrasts with the Pluscuamperfecto, which refers to past-before-past without the probabilistic nuance."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
