<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 20, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 20, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events, not ESTAR. ESTAR expresses the location of physical objects and people, but scheduled events use SER to indicate where they take place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este pastel — ___ riquísimo con tanto chocolate.",
    "en": "Try this cake — it tastes absolutely delicious with all that chocolate.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico/a means 'to taste delicious' (a sensory experience in the moment). SER + rico/a means 'to be wealthy.' The context of tasting food always calls for ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No sabía que tu abuela todavía ___ viva — ¡qué alegría!",
    "en": "I didn't know your grandmother was still alive — how wonderful!",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR + vivo/a means 'to be alive' (a state of being). SER + vivo/a would mean 'to be clever/sharp.' Since we're describing a life condition at a past moment, ESTAR in imperfecto is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Desde que empezó a trabajar en esa empresa, Miguel ___ muy aburrido con su rutina.",
    "en": "Since he started working at that company, Miguel has been very bored with his routine.",
    "options": [
      "es",
      "está",
      "fue",
      "sea"
    ],
    "correct": 1,
    "explanation": "ESTAR + aburrido/a means 'to feel bored' (a temporary emotional state). SER + aburrido/a means 'to be a boring person' (a permanent characteristic). Since Miguel is experiencing boredom, ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, ___ (ir) al mercado con mi madre todos los sábados.",
    "en": "When I was little, I used to go to the market with my mother every Saturday.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "vaya"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' (every Saturday) signals a recurring habit, making IMPERFECTO the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba leyendo el informe cuando el jefe ___ (entrar) de repente en la oficina.",
    "en": "I was reading the report when the boss suddenly entered the office.",
    "options": [
      "entraba",
      "entró",
      "había entrado",
      "entrara"
    ],
    "correct": 1,
    "explanation": "When one ongoing background action (imperfecto: estaba leyendo) is interrupted by a sudden completed event, the interrupting action takes the pretérito indefinido. 'Entró' is the single completed event that broke the continuity."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El cielo ___ (estar) nublado y hacía frío, así que decidimos cancelar el picnic.",
    "en": "The sky was cloudy and it was cold, so we decided to cancel the picnic.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estuviera"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used to set the scene or describe background conditions in the past. The weather here is context/background for the main event (cancelar), not a completed action with a clear endpoint."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "LO QUE functions as a noun clause meaning 'what' (= the thing that) and acts as the object of the verb 'entender.' QUE alone is a conjunction or relative pronoun and cannot stand alone as the object here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ pena que no puedas venir a la fiesta — te lo ibas a pasar muy bien.",
    "en": "What a shame you can't come to the party — you would have had a great time.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "El que"
    ],
    "correct": 1,
    "explanation": "QUÉ (with accent) is used in exclamatory expressions to express strong emotion, equivalent to 'What a…!' in English. '¡Qué pena!' is a set exclamatory phrase expressing disappointment."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho porque tengo demasiadas responsabilidades en el trabajo.",
    "en": "Lately I stress out a lot because I have too many responsibilities at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional state (yo → yo), use the first-person reflexive form: me estreso. This is the 'yo y yo' pattern where I am both the experiencer and the indirect cause of the feeling."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ muchísimo y no puedo concentrarme.",
    "en": "When you arrive late without warning, you stress me out a lot and I can't concentrate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estresas"
    ],
    "correct": 1,
    "explanation": "When another person (tú) causes the emotional state in me (yo), the verb agrees with the subject (tú → estresas) while 'me' marks who experiences the effect. This is the 'yo y tú' pattern."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendería",
      "voy a aprender",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "The condicional is used in the main clause of hypothetical (si + imperfecto de subjuntivo) sentences to express what would happen under an unreal or unlikely condition. Futuro simple cannot be used in this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ (llover) toda la semana que viene.",
    "en": "According to the forecast, it will rain all next week.",
    "options": [
      "llovería",
      "llueve",
      "lloverá",
      "vaya a llover"
    ],
    "correct": 2,
    "explanation": "The futuro simple is used to state predictions about the future as objective or expected facts. The condicional would imply a condition or hypothesis, which is absent here. A forecast is presented as a likely future fact."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo las maletas listas — ___ (salir) para el aeropuerto en una hora.",
    "en": "My bags are packed — I'm going to leave for the airport in an hour.",
    "options": [
      "saldré",
      "saldría",
      "voy a salir",
      "salga"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' expresses a near-future plan or intention that is already decided and imminent, often supported by present evidence (maletas listas). It is preferred over the futuro simple when the action is concrete and planned in the immediate future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el nuevo compañero de trabajo ___ (adaptarse) bien al equipo.",
    "en": "I hope the new coworker adapts well to the team.",
    "options": [
      "se adapta",
      "se adaptará",
      "se adapte",
      "se adaptaría"
    ],
    "correct": 2,
    "explanation": "After verbs of hope and desire such as 'esperar que,' the subjuntivo is required in the subordinate clause because the speaker is expressing a wish about someone else's action, not stating a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ (terminar) la reunión, te llamo y quedamos para cenar.",
    "en": "When the meeting finishes, I'll call you and we'll arrange dinner.",
    "options": [
      "termina",
      "terminará",
      "termine",
      "terminaría"
    ],
    "correct": 2,
    "explanation": "When 'cuando' introduces a clause referring to a future event, the subjuntivo must be used, not the indicative future. This is a key rule: 'cuando + subjuntivo' for future temporal clauses."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ (abrir) los lunes — deberíamos comprobarlo antes.",
    "en": "I don't think that restaurant opens on Mondays — we should check first.",
    "options": [
      "abre",
      "abra",
      "abrirá",
      "abriría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creo que,' 'no pienso que') trigger the subjuntivo in the following clause because the speaker is denying or doubting the truth of the proposition."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, ___ (decir, tú) la verdad — todos lo entenderemos mejor así.",
    "en": "Please tell the truth — we will all understand better that way.",
    "options": [
      "dices",
      "di",
      "digas",
      "decid"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of 'decir' is irregular: 'di.' Several common verbs have monosyllabic irregular tú imperatives (di, haz, ve, pon, sal, sé, ten, ven). The subjunctive form 'digas' is used for negative commands."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto por los resultados — lo has hecho muy bien.",
    "en": "Don't worry so much about the results — you've done very well.",
    "options": [
      "te preocupa",
      "te preocupes",
      "preocúpate",
      "se preocupe"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present subjunctive form, and with reflexive verbs the pronoun 'te' precedes the verb: 'no te preocupes.' Affirmative reflexive commands attach the pronoun after the verb (preocúpate), but negative commands never do."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevo horas llamando a Lucía y no contesta. ___ (quedarse) sin batería otra vez.",
    "en": "I've been calling Lucía for hours and she doesn't answer. She must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se habrá quedado",
      "Se quedó",
      "Se quedaría"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about something that has likely already happened in the recent past. It is equivalent to 'must have + past participle' in English when speculating about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
