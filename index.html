<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 16, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 16, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso de medicina ___ en el hotel Meliá este año.",
    "en": "The medical conference is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR is used for the location of physical objects and people, but scheduled events are treated as definitions, not positions."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary condition or current state. The soup's temperature is a changeable state, not a defining characteristic, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de años trabajando en finanzas, mi tío ___ muy rico.",
    "en": "After years working in finance, my uncle is very rich.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "With 'rico' meaning wealthy, both SER and ESTAR can be used, but SER implies it is a stable, established characteristic. ESTAR + rico would mean the food tastes delicious, so context of wealth points to SER here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi hermana ___ lista para salir antes de que yo me levantara.",
    "en": "My sister was ready to leave before I even got up.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "ESTAR + listo/a means 'to be ready,' a temporary state. SER + listo/a would mean 'to be clever/smart.' Here the context clearly indicates readiness, so ESTAR in the imperfect tense is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, ___ al parque todos los sábados con mi abuelo.",
    "en": "When I was little, I used to go to the park every Saturday with my grandfather.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past. The phrase 'todos los sábados' is a clear signal of a recurring routine, which requires the imperfecto rather than the indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ una novela tranquilamente cuando sonó el timbre.",
    "en": "I was reading a novel quietly when the doorbell rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the imperfecto and the interrupting event uses the indefinido. 'Leía' describes what was in progress when 'sonó' (indefinido) cut it off."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Al final, el equipo ___ el campeonato después de cinco años de intentos.",
    "en": "In the end, the team won the championship after five years of attempts.",
    "options": [
      "ganaba",
      "ganó",
      "había ganado",
      "ha ganado"
    ],
    "correct": 1,
    "explanation": "The indefinido expresses a single, completed event with a clear endpoint. Phrases like 'al final' and 'después de cinco años' signal a finished, bounded action, which requires the pretérito indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what.' It refers back to an unspecified thing, acting as the object of 'entiendo.' 'Que' alone cannot introduce an embedded question or nominalised clause here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan bonita la que me habéis dado!",
    "en": "What a lovely surprise you've given me!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to express intensity or emotion, equivalent to 'What a...!' in English. It modifies the noun 'sorpresa' and requires the written accent to distinguish it from the conjunction 'que.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo que hablar en público.",
    "en": "I always get nervous when I have to speak in public.",
    "options": [
      "me pongo nervioso",
      "te pongo nervioso",
      "le pongo nervioso",
      "nos ponemos nervioso"
    ],
    "correct": 0,
    "explanation": "When the subject and the object of the emotion are the same person (Yo → me), the reflexive pronoun 'me' is used. This is the 'Yo y yo' pattern: the speaker acts upon or experiences something within themselves."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que cancelas planes de última hora, ___ muchísimo.",
    "en": "Every time you cancel plans at the last minute, you frustrate me a lot.",
    "options": [
      "me frustro",
      "te frustras",
      "me frustras",
      "nos frustramos"
    ],
    "correct": 2,
    "explanation": "In the 'Yo y tú' pattern, the subject (tú) causes an emotional effect on the speaker (me). The verb agrees with the subject 'tú' (frustras), while 'me' indicates who is affected — this is not reflexive but rather a causative-emotional construction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses (si + imperfecto de subjuntivo), the main clause requires the condicional simple. The condicional expresses what would happen under an unreal or unlikely condition, not a firm future intention."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el informe del tiempo, ___ unos 30 grados en Sevilla este fin de semana.",
    "en": "According to the weather report, it will be about 30 degrees in Seville this weekend.",
    "options": [
      "habría",
      "habrá",
      "voy a haber",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The futuro simple is used for objective predictions or scheduled future events based on evidence. When citing external information like a weather report, the future tense is preferred over 'voy a' which implies personal intention."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ a recoger a los niños porque mi pareja trabaja hasta tarde.",
    "en": "This afternoon I'm going to pick up the kids because my partner is working late.",
    "options": [
      "recogeré",
      "recogería",
      "voy a recoger",
      "recoja"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is used for plans already decided or arranged in the near future, especially when the context and reason are already established. It feels more immediate and intentional than the simple future tense."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El médico recomienda que ___ menos cafeína durante el embarazo.",
    "en": "The doctor recommends that she consume less caffeine during pregnancy.",
    "options": [
      "consume",
      "consuma",
      "consumirá",
      "consumía"
    ],
    "correct": 1,
    "explanation": "After verbs of recommendation, desire, or influence (recomendar, querer, pedir), the subordinate clause requires the subjuntivo. The structure is: verb of influence + que + subjuntivo, regardless of tense in the main clause."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del hospital.",
    "en": "Call me as soon as you get news from the hospital.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tuvieras"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the subjuntivo when referring to a future event that has not yet occurred. The present indicative would suggest a habitual action, not a future one."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una lástima que tu jefe no ___ el esfuerzo que pones en el trabajo.",
    "en": "It's a shame that your boss doesn't recognize the effort you put into your work.",
    "options": [
      "reconoce",
      "reconociera",
      "reconozca",
      "reconocerá"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions that convey emotion or evaluation (es una lástima, es importante, es bueno) trigger the subjuntivo in the subordinate clause. The present subjuntivo is used when the main verb is in the present tense."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil encima de la mesa durante la cena.",
    "en": "Please, don't put your phone on the table during dinner.",
    "options": [
      "pongas",
      "pongas tú",
      "pon",
      "pones"
    ],
    "correct": 0,
    "explanation": "Negative commands in Spanish use the subjuntivo for all forms. For 'tú,' the negative imperative is formed with 'no + present subjunctive' (no pongas). The affirmative imperative 'pon' cannot be used with negation."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus asientos hasta que el avión se detenga por completo.",
    "en": "Ladies and gentlemen, keep your seats until the plane comes to a complete stop.",
    "options": [
      "mantenga",
      "mantengan",
      "mantenéis",
      "mantened"
    ],
    "correct": 1,
    "explanation": "In Latin American Spanish and formal European Spanish, 'ustedes' is used for plural address, and its affirmative command form is identical to the third-person plural present subjuntivo (mantengan). 'Mantened' is the vosotros command used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marta no contesta el teléfono. ___ quedado dormida en el sofá otra vez.",
    "en": "Marta isn't answering the phone. She must have fallen asleep on the sofa again.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) is used to express probability or deduction about a past event when the speaker is in the present. It is equivalent to 'must have + past participle' in English and reflects reasoned speculation."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
