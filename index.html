<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 28, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 28, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el auditorio principal esta noche.",
    "en": "The conference is in the main auditorium tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Events (conferences, concerts, parties) use SER to indicate where and when they take place. ESTAR is used for the physical location of people and objects, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de caminar diez kilómetros, los turistas ___ rendidos.",
    "en": "After walking ten kilometers, the tourists were exhausted.",
    "options": [
      "son",
      "fueron",
      "estaban",
      "eran"
    ],
    "correct": 2,
    "explanation": "ESTAR is used to describe temporary states or conditions, especially those resulting from an action or circumstance. Exhaustion after walking is a temporary, resulting state, not an inherent characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques ese queso — ___ malo desde hace tres días!",
    "en": "Don't touch that cheese — it has been bad for three days!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means something has gone bad or is spoiled (a temporary condition). SER + malo means something is bad by nature or morally bad. Context about food spoiling requires ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi suegra ___ muy lista — siempre sabe cómo resolver cualquier problema.",
    "en": "My mother-in-law is very clever — she always knows how to solve any problem.",
    "options": [
      "está",
      "es",
      "será",
      "esté"
    ],
    "correct": 1,
    "explanation": "SER + listo/a means to be clever or intelligent — an inherent personality trait. ESTAR + listo/a means to be ready. Since we are describing a permanent intellectual characteristic, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (vivir) cerca del mar y todos los veranos nadaba con mis primos.",
    "en": "When I was a child, I used to live near the sea and every summer I swam with my cousins.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "viviera"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past and for background descriptions. 'When I was a child' sets a habitual, ongoing past scenario — not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (ducharse) cuando de repente se fue la luz.",
    "en": "I was showering when suddenly the lights went out.",
    "options": [
      "me duché",
      "me duchaba",
      "me había duchado",
      "me duchara"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the Imperfecto and the interrupting event uses the Indefinido. 'Me duchaba' is the interrupted, ongoing action."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer mi jefa me ___ (llamar) tres veces para hablar sobre el nuevo proyecto.",
    "en": "Yesterday my boss called me three times to talk about the new project.",
    "options": [
      "llamaba",
      "llamaría",
      "llamó",
      "ha llamado"
    ],
    "correct": 2,
    "explanation": "The Indefinido is used for completed actions that occurred a specific number of times in a defined past period. 'Ayer' (yesterday) and 'three times' signal a closed, completed event, not a habitual one."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "Lo que functions as a noun clause meaning 'what' (that which) when it acts as the object of a verb. It is different from qué (interrogative) and que (simple conjunction). 'Lo que me estás diciendo' = 'that which you are saying.'"
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí después de tantos años.",
    "en": "What a pleasant surprise to run into you here after so many years.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Cuál"
    ],
    "correct": 2,
    "explanation": "Qué with an accent is used in exclamations to intensify a noun or adjective, equivalent to English 'What a...!' The structure is ¡Qué + noun (+ tan/más + adjective)!"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que tengo una reunión importante, ___ muchísimo.",
    "en": "Every time I have an important meeting, I get very stressed.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "se me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject causes their own emotional or psychological state ('Yo y yo' pattern), the reflexive pronoun matches the subject. 'Me estreso' = I stress myself out; the action originates from and returns to the same person (yo)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando me hablas así de mal, realmente ___ mucho.",
    "en": "When you talk to me like that, you really hurt me.",
    "options": [
      "me hieres",
      "me hiero",
      "te hieres",
      "nos herimos"
    ],
    "correct": 0,
    "explanation": "In the 'Yo y tú' pattern, the action goes from one person (tú) to another (yo). The object pronoun 'me' indicates the recipient of the action, and the verb conjugates for the subject 'tú' — me hieres (you hurt me)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tome",
      "tomaría",
      "voy a tomar"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses about the present or future (si + Imperfecto de Subjuntivo), the main clause requires the Condicional Simple. This expresses an imagined or unlikely scenario, not a real plan."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en toda la costa.",
    "en": "According to the forecast, tomorrow it will be very hot along the entire coast.",
    "options": [
      "haría",
      "hiciera",
      "habrá",
      "habría"
    ],
    "correct": 2,
    "explanation": "Futuro Simple is used for factual predictions about the future, especially when based on concrete evidence like weather forecasts. The Condicional would suggest a hypothetical, not a real prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al dentista porque llevo semanas con este dolor.",
    "en": "This afternoon I'm going to the dentist because I've had this pain for weeks.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "fui"
    ],
    "correct": 1,
    "explanation": "Ir a + infinitivo is preferred for near-future plans that are already decided or intended, especially when there is a present reason or motivation (the ongoing pain). It feels more immediate and personal than the simple future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis compañeros ___ (llegar) a tiempo a la reunión de mañana.",
    "en": "I hope my colleagues arrive on time for tomorrow's meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "After expressions of wish or hope like 'esperar que', the Subjuntivo is required because the speaker is expressing desire about someone else's action. The change of subject (yo espero / ellos lleguen) triggers the subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Avísame en cuanto ___ (saber) los resultados del análisis.",
    "en": "Let me know as soon as you find out the test results.",
    "options": [
      "sepas",
      "sabes",
      "sabrás",
      "supieras"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to future events that have not yet happened. If the event were habitual or past, the Indicative would be used."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ tan bueno como dicen las reseñas.",
    "en": "I don't think that new restaurant is as good as the reviews say.",
    "options": [
      "es",
      "sea",
      "será",
      "fuera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creer que', 'no pensar que') trigger the Subjuntivo in the subordinate clause because the speaker is casting doubt on the information rather than asserting it as fact."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ (escuchar, tú) bien estas instrucciones antes de empezar el examen!",
    "en": "Listen carefully to these instructions before starting the exam!",
    "options": [
      "Escuchas",
      "Escucha",
      "Escuches",
      "Escuchad"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative is formed like the third-person singular of the present indicative for most verbs. 'Escucha' is correct for tú. The negative tú command would use the subjunctive (no escuches), but this is an affirmative command."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (preocuparse, tú) tanto por lo que piensen los demás.",
    "en": "Don't worry so much about what other people think.",
    "options": [
      "te preocupas",
      "te preocupa",
      "te preocupes",
      "te preocupe"
    ],
    "correct": 2,
    "explanation": "Negative tú commands use the present subjunctive form, and reflexive pronouns are placed before the verb in negative commands. 'No te preocupes' = subjunctive form of preocuparse with the pronoun before the verb."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas tres horas sin contestar mensajes. ¿___ (quedarse) sin batería otra vez?",
    "en": "You've been ignoring messages for three hours. Could you have run out of battery again?",
    "options": [
      "¿Te quedas",
      "¿Te quedarás",
      "¿Te habrás quedado",
      "¿Te hayas quedado"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habré + participio) is used to express probability or deduction about a past event from the present perspective — equivalent to 'I wonder if you have...' or 'You must have...' in English. It is not about a future action here."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
