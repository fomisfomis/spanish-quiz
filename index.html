<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 18, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 18, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR is used for the location of people or objects, but the location of a scheduled event requires SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, including temperature felt at a specific moment. The heat of the soup right now is a current condition, not a defining characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi suegra ___ muy lista — siempre encuentra la mejor oferta en el supermercado.",
    "en": "My mother-in-law is very clever — she always finds the best deal at the supermarket.",
    "options": [
      "está",
      "es",
      "estará",
      "será"
    ],
    "correct": 1,
    "explanation": "SER + listo means 'to be clever or smart' as an inherent trait. ESTAR + listo means 'to be ready,' so the choice of verb here completely changes the meaning."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "El nuevo chef del restaurante ___ muy rico — cocina con ingredientes de temporada.",
    "en": "The restaurant's new chef is very rich — he cooks with seasonal ingredients.",
    "options": [
      "está",
      "es",
      "esté",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + rico means 'to be wealthy' as a characteristic of a person. ESTAR + rico means 'to taste delicious,' so when talking about a person's wealth as an ongoing trait, SER is required."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (vivir) cerca del mar y cada verano aprendía a bucear.",
    "en": "When I was a child, I lived near the sea and every summer I learned to dive.",
    "options": [
      "viví",
      "vivía",
      "he vivido",
      "había vivido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes habitual or ongoing situations in the past that provided background context. 'When I was a child' sets a repeated, continuous scene, so vivía is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando el informe cuando el jefe ___ (entrar) en la oficina sin avisar.",
    "en": "I was reviewing the report when the boss came into the office without warning.",
    "options": [
      "entraba",
      "entró",
      "ha entrado",
      "había entrado"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in progress, the interrupting event uses the Pretérito Indefinido (a completed, punctual action), while the background action uses the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ (terminar) la novela que llevaba meses leyendo.",
    "en": "Yesterday I finally finished the novel I had been reading for months.",
    "options": [
      "terminaba",
      "terminé",
      "he terminado",
      "terminaré"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido expresses a completed action at a specific point in the past. 'Ayer' and 'por fin' are clear temporal markers signaling a finished, one-time event."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to say to me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what,' and is used when referring to something unspecified or abstract. 'Que' alone is a simple connector and cannot replace 'lo que' as the direct object here."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonito es el vestido que llevas hoy.",
    "en": "How beautiful the dress you're wearing today is!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to intensify an adjective or noun, equivalent to 'How...!' or 'What a...!' in English. It always carries a written accent in exclamatory and interrogative contexts."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho tráfico en la ciudad, ___ muchísimo.",
    "en": "When there's a lot of traffic in the city, I get really stressed.",
    "options": [
      "me estresas",
      "me estreso",
      "me estresa",
      "me estresan"
    ],
    "correct": 1,
    "explanation": "When the subject causing stress is 'yo' (I am the one reacting internally with no external trigger in the sentence), use the yo-form: me estreso. This is the 'yo y yo' pattern where the subject and object of the action are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que discutimos, ___ muchísimo con tus palabras.",
    "en": "Every time we argue, you hurt me a lot with your words.",
    "options": [
      "me hiero",
      "me hieres",
      "me hiere",
      "nos herimos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, tú is the subject acting on yo, so the verb conjugates in the second person (me hieres). The pronoun 'me' marks who receives the action, while the verb ending reflects who performs it."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple expresses hypothetical or unreal situations in the present or future, typically in the main clause of a si + Imperfecto Subjuntivo structure. The Futuro Simple is used for real future plans, not hypotheticals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "No te preocupes, ___ (llamar) en cuanto lleguemos al aeropuerto.",
    "en": "Don't worry, I will call you as soon as we get to the airport.",
    "options": [
      "llamaría",
      "llamo",
      "llamaré",
      "voy a llamar"
    ],
    "correct": 2,
    "explanation": "The Futuro Simple is used after 'en cuanto' to express a future action that is planned or expected to happen. The Condicional would imply doubt or hypothetical conditions, which are not present here."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo el vuelo mañana a las ocho, así que ___ (salir) de casa antes de las seis.",
    "en": "I have a flight tomorrow at eight, so I'm going to leave home before six.",
    "options": [
      "saldría",
      "salgo",
      "saldré",
      "voy a salir"
    ],
    "correct": 3,
    "explanation": "'Voy a + infinitivo' expresses a near-future intention based on a concrete plan already decided. It is preferred over the Futuro Simple when there is immediate evidence or a clear intention, as opposed to a more distant or formal prediction."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis compañeros de trabajo ___ (llegar) a tiempo a la reunión de mañana.",
    "en": "I hope my coworkers arrive on time for tomorrow's meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaron"
    ],
    "correct": 1,
    "explanation": "After expressions of hope and wish like 'esperar que,' the subjuntivo is required in the subordinate clause because the action is desired but not certain. The subjuntivo reflects the speaker's attitude toward the action rather than stating a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (tener) una mesa disponible sin reserva un sábado.",
    "en": "I don't think this restaurant has a table available without a reservation on a Saturday.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que) trigger the subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than affirming a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame cuando ___ (terminar) de hablar con el médico.",
    "en": "Call me when you finish talking to the doctor.",
    "options": [
      "terminas",
      "terminarás",
      "termines",
      "terminaste"
    ],
    "correct": 2,
    "explanation": "When 'cuando' introduces a future action, the subordinate verb must be in the present subjuntivo, not the future indicative. This is because the action has not yet occurred and remains hypothetical at the time of speaking."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (hablar) tan alto en la biblioteca — hay gente estudiando.",
    "en": "Please don't speak so loudly in the library — people are studying.",
    "options": [
      "habla",
      "hables",
      "hablas",
      "hablarás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present subjuntivo form, not the affirmative imperative form. 'No hables' is correct for a negative instruction directed at one person informally, while 'no habla' would be the negative usted command."
  },
  {
    "topic": "Imperativo",
    "q": "___ (decirme, ustedes) cuál de las dos propuestas prefieren antes del viernes.",
    "en": "Tell me which of the two proposals you prefer before Friday.",
    "options": [
      "Decídme",
      "Díganme",
      "Decirme",
      "Díme"
    ],
    "correct": 1,
    "explanation": "The ustedes affirmative command of 'decir' is 'digan,' which comes from the third-person plural present subjuntivo. When attaching a pronoun like 'me,' it becomes 'díganme' with an accent to maintain the original stress."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Miguel todavía no ha llegado. ___ (perderse) en el camino.",
    "en": "It's three in the afternoon and Miguel still hasn't arrived. He must have gotten lost on the way.",
    "options": [
      "Se perderá",
      "Se habrá perdido",
      "Se perdió",
      "Se perdería"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It is equivalent to 'must have + past participle' in English when speculating about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
