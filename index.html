<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 13, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 13, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR would indicate the physical position of a person or object, not the location of a scheduled event."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "fue"
    ],
    "correct": 1,
    "explanation": "ESTAR describes a current, temporary condition or state. The soup being hot is a changeable physical state at a particular moment, not a defining characteristic, so ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista para su edad — resuelve crucigramas en minutos.",
    "en": "My grandmother is very clever for her age — she solves crosswords in minutes.",
    "options": [
      "está",
      "es",
      "sea",
      "estará"
    ],
    "correct": 1,
    "explanation": "With adjectives that change meaning, SER + listo/a means 'clever/smart' as a personality trait, while ESTAR + listo/a means 'ready.' Since the sentence describes an inherent quality, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de correr diez kilómetros, ___ completamente muerto.",
    "en": "After running ten kilometres, I am completely exhausted/dead.",
    "options": [
      "soy",
      "estoy",
      "seré",
      "estaré"
    ],
    "correct": 1,
    "explanation": "ESTAR + muerto describes a resulting condition or an extreme state caused by an experience. While SER + muerto would indicate the permanent state of being dead (literally), ESTAR captures the change-of-state meaning — feeling completely wiped out."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (caminar) al colegio todos los días.",
    "en": "When I was a child, I used to walk to school every day.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto is used for habitual or repeated actions in the past — things that happened regularly over a period of time. The phrase 'todos los días' reinforces the habitual nature, making indefinido incorrect here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el periódico cuando de repente ___ (sonar) el teléfono.",
    "en": "I was reading the newspaper when suddenly the phone rang.",
    "options": [
      "sonaba",
      "sonó",
      "ha sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "In interrupted-action constructions, the ongoing background action uses imperfecto (leía), and the sudden interrupting event uses pretérito indefinido. 'De repente' (suddenly) signals a completed, punctual event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (abrir) una nueva oficina en Lisboa.",
    "en": "Last year, my company opened a new office in Lisbon.",
    "options": [
      "abría",
      "abrió",
      "ha abierto",
      "abriría"
    ],
    "correct": 1,
    "explanation": "Pretérito indefinido expresses a completed, one-time event within a specified past time frame. 'El año pasado' anchors the action as finished and bounded in time, which rules out the imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me preocupa no es el dinero, sino el tiempo.",
    "en": "What worries me is not the money, but the time.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is a nominalised relative pronoun meaning 'what' or 'the thing that,' used as the subject or object of a clause when there is no specific antecedent noun. 'Que' alone cannot begin a noun clause acting as the subject in this way."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ susto me has dado al entrar sin llamar!",
    "en": "What a fright you gave me by coming in without knocking!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' (with accent) is used in exclamatory sentences before nouns, adjectives, or adverbs to express strong emotion or surprise. 'Que' without accent is a conjunction or relative pronoun and cannot function as an exclamative determiner."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre ___ cuando tengo una presentación importante al día siguiente.",
    "en": "I always get stressed when I have an important presentation the next day.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "When the subject causes its own emotional or physical reaction — the 'yo y yo' pattern — the reflexive verb agrees with the subject (yo → me estreso). This differs from 'me estresas' (you stress me out) or 'me estresa el tráfico' (traffic stresses me out)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cada vez que me ignoras en una reunión, ___ muchísimo.",
    "en": "Every time you ignore me in a meeting, you irritate me a lot.",
    "options": [
      "me irrito",
      "me irritas",
      "me irrita",
      "te irritas"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) causes a reaction in the speaker — the 'yo y tú' pattern — the verb conjugates in the second person: me irritas. The 'me' signals who is affected, and the verb ending (-as) signals who causes the reaction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendería",
      "aprendo",
      "aprenda"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses with an imperfecto de subjuntivo in the condition (si tuviera), the main clause requires the condicional simple. The futuro simple cannot be used in the result clause of this type of contrary-to-fact hypothesis."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que ___ (llover) esta tarde.",
    "en": "Look at those dark clouds — I think it's going to rain this afternoon.",
    "options": [
      "llovaría",
      "lloverá",
      "voy a llover",
      "llovería"
    ],
    "correct": 1,
    "explanation": "The futuro simple expresses a prediction about the future, especially when based on observable evidence. 'Voy a + infinitivo' also works for near-future intentions, but the futuro simple is more natural here for a general prediction; condicional expresses hypothetical or reported future, not plain prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El jefe dijo que nos ___ (dar) los resultados el viernes.",
    "en": "The boss said he would give us the results on Friday.",
    "options": [
      "dará",
      "daría",
      "dé",
      "da"
    ],
    "correct": 1,
    "explanation": "When reporting what someone said about the future (reported speech with a past reporting verb like 'dijo'), Spanish shifts from futuro simple to condicional — it acts as the 'future in the past,' parallel to English 'would.'"
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta noche ___ (cenar) con mis padres — ya lo tenemos todo organizado.",
    "en": "Tonight I'm going to have dinner with my parents — we already have everything arranged.",
    "options": [
      "cenaré",
      "cenaría",
      "voy a cenar",
      "ceno"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already arranged or decided, especially in spoken language. Both futuro simple and 'voy a' can work, but 'voy a cenar' is more natural when concrete plans are already in place."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mis colegas ___ (llegar) a tiempo a la reunión de mañana.",
    "en": "I hope my colleagues arrive on time for tomorrow's meeting.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaban"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or hope like 'esperar que,' the verb in the subordinate clause must be in the subjuntivo simple when the subjects of the two clauses differ. The subjuntivo marks the desired action as uncertain or unrealised."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante nuevo ___ (ser) tan bueno como dicen.",
    "en": "I don't think that new restaurant is as good as people say.",
    "options": [
      "es",
      "sea",
      "está",
      "esté"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' trigger the subjuntivo in the following clause because the speaker is casting doubt or denying the truth of the statement. Affirmative 'creo que' would use indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ (aterrizar) el avión.",
    "en": "I'll call you as soon as the plane lands.",
    "options": [
      "aterriza",
      "aterrice",
      "aterrizará",
      "aterrizaba"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' and 'tan pronto como' require the subjuntivo when referring to a future, yet-to-happen event. When the event is habitual or past, indicative is used instead."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ (decirme) la verdad — ¿qué piensas realmente de mi plan?",
    "en": "Hey, tell me the truth — what do you really think of my plan?",
    "options": [
      "díceme",
      "dime",
      "díme",
      "decime"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of 'decir' is irregular: 'di.' When a direct or indirect object pronoun is attached, it is appended directly: 'dime.' The accent rules apply based on the resulting word — 'dime' is two syllables and needs no written accent."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (usar) el móvil durante la reunión.",
    "en": "Please, don't use your phone during the meeting.",
    "options": [
      "uses",
      "usas",
      "usés",
      "use"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjunctive: no uses, no hagas, no digas, etc. The affirmative imperative form (usa) is never used in the negative — the subjunctive takes over for all negative imperatives in Spanish."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No encuentro mis llaves en ningún sitio. Las ___ (dejar) en la oficina.",
    "en": "I can't find my keys anywhere. I must have left them at the office.",
    "options": [
      "dejaré",
      "dejé",
      "habré dejado",
      "habría dejado"
    ],
    "correct": 2,
    "explanation": "The futuro compuesto (habré + participio) is used to express probability or deduction about a past event when viewed from the present. It is equivalent to 'must have + past participle' in English and indicates the speaker is making a logical inference about what happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
