<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 29, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 29, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo porque hay una avería en el sistema.",
    "en": "Don't touch that wire — it is very dangerous right now because there is a fault in the system.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the danger is a temporary, circumstantial condition caused by a specific fault, not an inherent property of the wire. When an adjective describes a state resulting from a change or specific situation, ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La boda de mis primos ___ en el jardín del hotel, así que espero que no llueva.",
    "en": "My cousins' wedding is in the hotel garden, so I hope it doesn't rain.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "The location of events uses SER, not ESTAR. ESTAR expresses where objects or people are physically located, but when talking about where a scheduled event takes place, Spanish uses SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo, cocinó el chef nuevo.",
    "en": "Try this broth — it is absolutely delicious, the new chef cooked it.",
    "options": [
      "Es",
      "Está",
      "Fue",
      "Estuvo"
    ],
    "correct": 1,
    "explanation": "When 'rico' means 'delicious' (a sensory impression experienced in the moment), ESTAR is used because it describes a tasted, perceived quality rather than an inherent classification. 'Es rico' would mean it is a rich/wealthy thing, not that it tastes good."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ya tiene ochenta años pero ___ muy lista — resuelve el crucigrama cada mañana.",
    "en": "My grandmother is already eighty years old but she is very sharp — she solves the crossword every morning.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "With 'listo', SER means 'clever or sharp' as a characteristic of the person, while ESTAR + listo means 'to be ready'. Since the sentence describes an inherent mental quality (solving crosswords daily), SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, todos los veranos ___ (nosotros) a la misma playa en Almería.",
    "en": "When I was little, every summer we went to the same beach in Almería.",
    "options": [
      "fuimos",
      "íbamos",
      "habíamos ido",
      "vamos"
    ],
    "correct": 1,
    "explanation": "Imperfecto is used for habitual or repeated actions in the past, especially when a frequency marker like 'todos los veranos' signals that something happened regularly. Indefinido would imply a single completed trip, not a recurring pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ tranquilamente el periódico cuando de repente sonó el teléfono.",
    "en": "I was calmly reading the newspaper when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leyera"
    ],
    "correct": 1,
    "explanation": "Imperfecto describes the background action in progress when a sudden event interrupts it. 'Sonó' (Indefinido) is the interrupting event, and 'leía' is the ongoing background state — the classic Imperfecto vs Indefinido interrupted-action pattern."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi hermana ___ su propio negocio de repostería en Valencia.",
    "en": "Last year, my sister opened her own pastry business in Valencia.",
    "options": [
      "abría",
      "abrió",
      "había abierto",
      "abriría"
    ],
    "correct": 1,
    "explanation": "Indefinido is used for a completed, one-time event that occurred at a specific point in the past. 'El año pasado' is a time marker that anchors the action as a finished event, making Imperfecto incorrect here."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ tanto te molesta de su actitud.",
    "en": "I don't understand what bothers you so much about his attitude.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'what / that which', used when referring to an unspecified thing or concept. 'Que' alone cannot introduce a noun clause of this type without an article, and 'qué' with an accent is used in direct or indirect questions, not in relative clauses like this."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien te queda ese color — deberías llevarlo más a menudo.",
    "en": "How well that colour suits you — you should wear it more often.",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent is used in exclamatory sentences to express admiration, surprise, or strong reaction, equivalent to 'how' or 'what' in English exclamations. 'Que' without an accent is a conjunction or relative pronoun and cannot open an exclamation this way."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I stress a lot because of the work deadlines.",
    "options": [
      "me estresas",
      "te estreso",
      "me estreso",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and the person experiencing the feeling are the same ('yo' stresses 'yo'), a true reflexive form is used: 'me estreso'. 'Me estresas' would mean 'you stress me out', and 'me estresa' would require a third-person subject causing the stress."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho — por favor, manda un mensaje.",
    "en": "When you arrive late without warning, you worry me a lot — please send a message.",
    "options": [
      "me preocupas",
      "me preocupo",
      "te preocupas",
      "me preocupa"
    ],
    "correct": 0,
    "explanation": "Here the subject is 'tú' (second person) and the person affected is 'yo' (first person), so the structure is subject 'tú' + verb in second person + first-person object pronoun 'me': 'me preocupas'. This is the 'yo y tú' pattern where someone else causes a feeling in the speaker."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si consigo ese puesto, ___ a vivir a Berlín el año que viene.",
    "en": "If I get that position, I will move to Berlin next year.",
    "options": [
      "me iría",
      "me voy",
      "me voy a ir",
      "me fuera"
    ],
    "correct": 2,
    "explanation": "In a real conditional sentence (si + present indicative), the main clause uses future or 'ir a + infinitivo'. 'Voy a ir' (periphrastic future) is very natural here for a concrete, planned intention. 'Me iría' belongs to hypothetical (si + imperfect subjunctive) conditionals, not real ones."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "En tu lugar, ___ el contrato antes de firmarlo con más calma.",
    "en": "In your place, I would read the contract more carefully before signing it.",
    "options": [
      "leeré",
      "leo",
      "leería",
      "lea"
    ],
    "correct": 2,
    "explanation": "The phrase 'en tu lugar' (in your place) signals a hypothetical scenario, which requires the Condicional Simple to express what the speaker would do under imagined circumstances. Futuro Simple would imply a firm intention or prediction, not a hypothetical recommendation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el parte meteorológico, mañana ___ fuertes lluvias en el norte del país.",
    "en": "According to the weather forecast, tomorrow there will be heavy rain in the north of the country.",
    "options": [
      "habría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "Futuro Simple is used for objective predictions and factual forecasts about what will happen. Condicional would be appropriate only in reported speech or hypothetical contexts, not when citing a direct forecast about the future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que los empleados ___ sus dudas antes del cierre del proyecto.",
    "en": "It is essential that employees resolve their doubts before the project closes.",
    "options": [
      "resuelven",
      "resolverán",
      "resuelvan",
      "resolverían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es importante que) trigger the subjunctive in the subordinate clause. The subjunctive expresses that the action is desired or required rather than stating it as a fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as the test results arrive.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaran"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que', when referring to a future event that has not yet happened, require the subjunctive. Using the indicative 'llegan' would imply a habitual present fact, not a future anticipated event."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Busco un apartamento que ___ terraza y esté cerca del metro.",
    "en": "I'm looking for an apartment that has a terrace and is near the metro.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is hypothetical or unknown (the speaker hasn't found the apartment yet), the subjunctive is required. If the apartment were a specific known one, the indicative 'tiene' would be used."
  },
  {
    "topic": "Imperativo",
    "q": "¡No ___ eso ahora, espera a que lleguen todos!",
    "en": "Don't say that now, wait until everyone arrives!",
    "options": [
      "digas",
      "dices",
      "decís",
      "di"
    ],
    "correct": 0,
    "explanation": "Negative tú commands use the present subjunctive, not the affirmative imperative form. 'Di' is the affirmative tú imperative of 'decir', but for negative commands (no + verb), the subjunctive 'digas' is required."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ sus cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochen",
      "abrochan",
      "abrocháis",
      "abrochad"
    ],
    "correct": 0,
    "explanation": "In Latin American Spanish (and formal address), the ustedes imperative is formed identically to the third-person plural present subjunctive. 'Abrochen' is the ustedes command. 'Abrochad' is the vosotros affirmative imperative, used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y María no ha llegado aún — ___ perdido el tren.",
    "en": "It's three in the afternoon and María still hasn't arrived — she must have missed the train.",
    "options": [
      "habrá",
      "habría",
      "haya",
      "había"
    ],
    "correct": 0,
    "explanation": "Futuro Compuesto can express probability or deduction about a past event when the speaker reasons from present evidence. 'Habrá perdido' means 'she must have missed', not a future perfect completion — this epistemic use is common in Spanish for past speculation."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
