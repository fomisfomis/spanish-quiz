<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 22, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 22, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el teatro principal esta noche.",
    "en": "The concert is at the main theater tonight.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place, not ESTAR. ESTAR would indicate the physical location of an object or person, but for scheduled events, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese plato — ___ muy caliente todavía.",
    "en": "Don't touch that plate — it is still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, and temperature felt in the moment is a condition, not a permanent characteristic. SER would imply the plate is inherently and permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Cuidado! Este champiñón ___ malo — no lo comas.",
    "en": "Careful! This mushroom is bad (spoiled) — don't eat it.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR malo means something is spoiled or in poor condition (a temporary state), while SER malo means something or someone is morally bad or of poor quality by nature. Context here points to a spoiled mushroom."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi vecina ___ muy lista — resolvió el problema en segundos.",
    "en": "My neighbor is very clever — she solved the problem in seconds.",
    "options": [
      "está",
      "es",
      "era",
      "estaba"
    ],
    "correct": 1,
    "explanation": "SER listo/a means to be clever or smart as an inherent personality trait. ESTAR listo/a means to be ready. Since the sentence describes an intellectual characteristic, SER is correct here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ al fútbol todos los sábados con mis primos.",
    "en": "When I was a child, I used to play football every Saturday with my cousins.",
    "options": [
      "jugué",
      "jugaré",
      "jugaba",
      "he jugado"
    ],
    "correct": 2,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially when framed by expressions like 'cuando era niño' (when I was a child) and frequency markers like 'todos los sábados'. The Indefinido would suggest a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Mientras yo ___ la cena, sonó el teléfono.",
    "en": "While I was making dinner, the phone rang.",
    "options": [
      "preparé",
      "preparaba",
      "preparo",
      "he preparado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted, while the Indefinido (sonó) describes the sudden interrupting event. The structure 'mientras + Imperfecto' paired with an Indefinido main clause is a classic pattern for interrupted actions."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ el informe que llevaba semanas preparando.",
    "en": "Yesterday I finally submitted the report that I had spent weeks preparing.",
    "options": [
      "entregaba",
      "entregué",
      "entrego",
      "entregaría"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed action at a specific point in the past, signaled here by 'ayer' (yesterday) and 'por fin' (finally). The Imperfecto would imply an ongoing or habitual action without a clear endpoint."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a nominalized relative pronoun meaning 'what' in the sense of 'that which', acting as the object of the verb entender. 'Que' alone is a simple relative or conjunction and cannot replace 'lo que' when 'what' functions as the thing being understood."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ calor tan horrible hace hoy, ¿verdad?",
    "en": "What awful heat there is today, right?",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamatory expressions to express surprise or strong emotion, typically followed by a noun. It should not be confused with the relative conjunction 'que' (no accent) or the interrogative 'cuál'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando tengo demasiado trabajo, ___ muchísimo.",
    "en": "When I have too much work, I get very stressed.",
    "options": [
      "me estresan",
      "te estresas",
      "me estreso",
      "se estresa"
    ],
    "correct": 2,
    "explanation": "When the subject and the person experiencing the feeling are the same (Yo y yo pattern), a reflexive verb is used with the matching subject pronoun: yo me estreso. The action originates and reflects back on the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Hablas tan rápido que ___ cuando intento seguirte.",
    "en": "You talk so fast that you confuse me when I try to follow you.",
    "options": [
      "me confundo",
      "te confundes",
      "me confundes",
      "se confunde"
    ],
    "correct": 2,
    "explanation": "When one person causes an effect on another (Yo y tú pattern), the verb is transitive and conjugated to match the subject (tú) while the object pronoun matches the person affected (me). This is 'me confundes' — you (subject) confuse me (object)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tome",
      "tomaría",
      "tomaré"
    ],
    "correct": 2,
    "explanation": "The Condicional Simple is used in the result clause of hypothetical (si + Imperfecto de Subjuntivo) sentences to express what would happen under an unlikely or imagined condition. The Futuro Simple would express a real future intention, not a hypothetical one."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho viento en la costa.",
    "en": "According to the forecast, tomorrow there will be a lot of wind on the coast.",
    "options": [
      "habría",
      "habrá",
      "haya",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple is used for factual predictions about the future, especially with time markers like 'mañana'. The Condicional would imply a hypothetical or conditional situation, which is not the case here with a weather forecast."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Llevo las llaves, así que esta tarde ___ al gimnasio directamente desde la oficina.",
    "en": "I have my keys, so this afternoon I'm going to go to the gym directly from the office.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred when there is clear present evidence or a concrete plan already in motion, as shown by 'llevo las llaves' (I already have my keys). 'Iré' is also acceptable but feels more distant; 'voy a ir' better conveys immediacy and intention grounded in the present."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que todos ___ el informe antes del viernes.",
    "en": "The boss wants everyone to hand in the report before Friday.",
    "options": [
      "entreguen",
      "entregan",
      "entregarán",
      "entreguen"
    ],
    "correct": 0,
    "explanation": "After verbs of wanting or wishing with a different subject in the subordinate clause (querer que + different subject), the Subjuntivo is required. 'Querer que' triggers the subjunctive because it expresses a desire imposed on someone else."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados, te llamo inmediatamente.",
    "en": "As soon as the results come out, I'll call you immediately.",
    "options": [
      "salen",
      "saldrán",
      "salgan",
      "salieron"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when referring to a future event that has not yet occurred. The indicative would be used only when referring to habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ tan caro como dicen.",
    "en": "I don't think this restaurant is as expensive as they say.",
    "options": [
      "es",
      "sea",
      "fue",
      "estará"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief (no creer que, no pensar que) trigger the Subjuntivo in the subordinate clause because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would use the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ un momento — tengo que contarte algo importante.",
    "en": "Hey, wait a moment — I have to tell you something important.",
    "options": [
      "esperas",
      "espere",
      "espera",
      "esperes"
    ],
    "correct": 2,
    "explanation": "The affirmative tú imperative for regular -AR verbs is formed using the third-person singular present indicative form (espera). Negative tú commands use the subjunctive (no esperes), so the affirmative and negative forms are different."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil en la mesa durante la cena.",
    "en": "Please, don't put your phone on the table during dinner.",
    "options": [
      "pongas",
      "pones",
      "pon",
      "ponéis"
    ],
    "correct": 0,
    "explanation": "Negative tú commands are formed using the present subjunctive (no + subjunctive), not the indicative. 'No pones' is indicative and grammatically incorrect as a command; 'pon' is the affirmative imperative. Irregular verb 'poner' has subjunctive form 'pongas'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las diez de la noche y Marta aún no ha llegado. ___ perdido en el metro.",
    "en": "It's ten at night and Marta still hasn't arrived. She must have gotten lost on the metro.",
    "options": [
      "Se habrá perdido",
      "Se perdería",
      "Se hubiera perdido",
      "Se perderá"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from the speaker's present perspective. It conveys 'must have done something' and is a key use distinct from its other function of marking completion before a future point."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
