<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 09, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 09, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El congreso internacional ___ en el hotel Meliá este año.",
    "en": "The international congress is at the Hotel Meliá this year.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events (congresses, concerts, weddings) use SER to indicate where they take place, even though location normally uses ESTAR. Remember: SER = location of events, ESTAR = location of objects and people."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡No toques esa sopa todavía — ___ muy caliente!",
    "en": "Don't touch that soup yet — it's very hot!",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used for temporary states or conditions, including current temperature of food or objects. Saying 'es caliente' would imply an inherent, permanent characteristic rather than its current state."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de ganar el premio, el chef ___ muy rico — tiene restaurantes en tres países.",
    "en": "After winning the award, the chef is very rich — he has restaurants in three countries.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER + rico means 'to be wealthy' (a lasting characteristic), while ESTAR + rico means 'to be delicious' (a temporary sensory quality). Context about wealth and restaurants confirms SER is correct here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Cuando llegué a la reunión, mi jefa ___ de muy mal humor.",
    "en": "When I arrived at the meeting, my boss was in a very bad mood.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR describes temporary emotional or physical states. A bad mood is a condition someone is experiencing at a specific moment, not a defining permanent trait, so ESTAR (in the imperfect for background description) is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Todos los veranos de mi infancia, mi familia ___ a la misma playa en Cádiz.",
    "en": "Every summer of my childhood, my family went to the same beach in Cádiz.",
    "options": [
      "fue",
      "iba",
      "ha ido",
      "había ido"
    ],
    "correct": 1,
    "explanation": "The imperfect (imperfecto) expresses habitual or repeated past actions. The phrase 'todos los veranos' signals a recurring routine, which requires the imperfect rather than the indefinido, which marks a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ana ___ un podcast cuando de repente le ___ su ex.",
    "en": "Ana was listening to a podcast when her ex suddenly called her.",
    "options": [
      "escuchaba / llamó",
      "escuchó / llamaba",
      "escuchó / llamó",
      "escuchaba / llamaba"
    ],
    "correct": 0,
    "explanation": "In interrupted action patterns, the ongoing background action uses the imperfect (escuchaba) and the sudden interrupting event uses the indefinido (llamó). 'De repente' is a strong signal of a one-off completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado ___ tres veces al gimnasio y luego lo ___ por completo.",
    "en": "Last year I went to the gym three times and then abandoned it completely.",
    "options": [
      "fui / abandoné",
      "iba / abandonaba",
      "fui / abandonaba",
      "iba / abandoné"
    ],
    "correct": 0,
    "explanation": "Both actions here are counted, completed events within a closed time frame ('el año pasado'). When a specific number of occurrences is mentioned or actions are finished and sequential, the indefinido is required for both verbs."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me sorprende es que nadie avisó a los vecinos antes del corte de luz.",
    "en": "What surprises me is that nobody warned the neighbors before the power cut.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'the thing that / what' and acts as the subject of the sentence. 'Que' alone cannot open a sentence as a subject in this way; 'lo que' is needed to nominalize the clause."
  },
  {
    "topic": "Usos de QUE",
    "q": "Es fundamental ___ los estudiantes entreguen el trabajo antes del viernes.",
    "en": "It is essential that students hand in the work before Friday.",
    "options": [
      "que",
      "lo que",
      "qué",
      "de que"
    ],
    "correct": 0,
    "explanation": "After impersonal expressions like 'es fundamental / importante / necesario', the conjunction 'que' introduces a subordinate clause in the subjunctive. No preposition is added before 'que' in these constructions."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Últimamente ___ mucho con el tráfico de la ciudad.",
    "en": "Lately I get very stressed by the city traffic.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When an external thing (el tráfico) causes an emotional reaction in the speaker, the verb agrees with that external subject, not with 'yo'. This is the 'yo y el mundo' pattern, identical in structure to 'me gusta', where the thing causing the feeling is the grammatical subject."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cuando no duermes bien, ___ al día siguiente y todo te parece difícil.",
    "en": "When you don't sleep well, you feel irritable the next day and everything seems hard.",
    "options": [
      "te irritas",
      "te irrita",
      "me irrito",
      "os irritáis"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or physical state (the 'yo y yo' / 'tú y tú' pattern), the reflexive verb agrees with that person: 'tú te irritas'. Here the person is irritating themselves through their own action (lack of sleep), not an external agent."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "haré",
      "haría",
      "haga",
      "hiciera"
    ],
    "correct": 1,
    "explanation": "In hypothetical 'si' clauses about unlikely or contrary-to-fact situations, the structure is si + imperfect subjunctive + conditional. The conditional (haría) expresses what WOULD happen, while the future (haré) cannot be used in the result clause of this structure."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ mucho calor en el sur del país.",
    "en": "According to the forecast, tomorrow it will be very hot in the south of the country.",
    "options": [
      "haría",
      "hará",
      "va a hacer",
      "haría hecho"
    ],
    "correct": 1,
    "explanation": "Both 'hará' and 'va a hacer' can express future plans, but when citing an objective forecast or scheduled prediction, the simple future (futuro simple) is more formal and neutral. 'Voy a + infinitivo' tends to signal personal intention or imminent plans."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me ___ echar una mano con estas cajas? Pesan demasiado para mí sola.",
    "en": "Would you mind giving me a hand with these boxes? They're too heavy for me alone.",
    "options": [
      "podrás",
      "puedes",
      "podrías",
      "puedas"
    ],
    "correct": 2,
    "explanation": "The conditional (podrías) is used for polite requests, softening the tone and making it less direct than the present indicative (puedes) or future (podrás). This is a core pragmatic function of the conditional in everyday Spanish."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mi compañero de piso ___ los platos de vez en cuando.",
    "en": "I hope my flatmate washes the dishes once in a while.",
    "options": [
      "lava",
      "lave",
      "lavará",
      "lavara"
    ],
    "correct": 1,
    "explanation": "After verbs of wishing or hoping like 'esperar que', the subjunctive is required in the subordinate clause because the subject of the main clause and the subordinate clause are different. 'Espero que + subjunctive' is a standard wish expression."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ los resultados del análisis.",
    "en": "Call me as soon as you get the test results.",
    "options": [
      "tienes",
      "tengas",
      "tendrás",
      "tendrías"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' require the subjunctive when referring to a future event that hasn't happened yet. With past or habitual events, the indicative would be used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ abierto los lunes.",
    "en": "I don't think this restaurant is open on Mondays.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creer que', 'no pensar que') trigger the subjunctive in the subordinate clause because the speaker is expressing doubt or negating a fact. The affirmative 'creo que está' would use the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ todo el rato el móvil durante la cena, por favor.",
    "en": "Don't check your phone all the time during dinner, please.",
    "options": [
      "mires",
      "mira",
      "mirar",
      "mires tú"
    ],
    "correct": 0,
    "explanation": "Negative tú commands always use the present subjunctive form: 'no mires'. The affirmative tú command 'mira' cannot be used in negative form — you must switch to the subjunctive. This is one of the most common command errors."
  },
  {
    "topic": "Imperativo",
    "q": "Si tienen preguntas sobre el contrato, ___ directamente al departamento legal.",
    "en": "If you have questions about the contract, send them directly to the legal department.",
    "options": [
      "mandad",
      "manden",
      "mandar",
      "mandéis"
    ],
    "correct": 1,
    "explanation": "In Latin America, 'ustedes' replaces both 'vosotros' and 'ustedes' for plural commands. The ustedes imperative (affirmative and negative) is always the same as the third-person plural present subjunctive: 'manden'."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las tres de la tarde y Lucía todavía no ha llegado. ___ perdido el tren.",
    "en": "It's three in the afternoon and Lucía still hasn't arrived. She must have missed the train.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "The futuro compuesto (habrá + participio) can express probability or deduction about something that likely happened in the recent past. This is equivalent to saying 'she has probably missed the train', used when the speaker is speculating without certainty."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
