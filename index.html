<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 26, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 26, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo.",
    "en": "Don't touch that cable — it's very dangerous right now.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "Use ESTAR for temporary or situational conditions. The cable being dangerous 'right now' implies a current state rather than an inherent property, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia ___ en el Hotel Meliá este año.",
    "en": "The conference is at the Hotel Meliá this year.",
    "options": [
      "está",
      "es",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "Events use SER to indicate where/when they take place, while ESTAR indicates the physical location of objects or people. Since 'la conferencia' is an event, SER is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo, ¿verdad?",
    "en": "Try this broth — it's absolutely delicious, right?",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "With food, ESTAR rico means 'tastes delicious' (a sensory experience in the moment), whereas SER rico means 'to be wealthy'. This is a classic meaning-changing adjective with ser/estar."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista: resolvió el crucigrama en diez minutos.",
    "en": "My grandmother is very sharp: she solved the crossword in ten minutes.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "SER listo/a means 'to be clever or sharp' as a permanent characteristic, while ESTAR listo/a means 'to be ready'. Since we're describing her intelligence as a trait, SER is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeño, mi padre me ___ cuentos todas las noches.",
    "en": "When I was little, my father used to tell me stories every night.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto expresses habitual or repeated actions in the past without a fixed endpoint. 'Todas las noches' signals a routine, making Imperfecto the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo cuando de repente se fue la luz.",
    "en": "I was writing an email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "escribiré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that gets interrupted. The interrupting event ('se fue la luz') uses Indefinido, while the action in progress uses Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Después de meses de negociación, las dos empresas ___ un acuerdo el viernes pasado.",
    "en": "After months of negotiation, the two companies reached an agreement last Friday.",
    "options": [
      "alcanzaban",
      "alcanzaron",
      "han alcanzado",
      "alcanzarían"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido marks a completed, punctual event in the past. 'El viernes pasado' anchors the action to a specific finished moment, requiring Indefinido rather than Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ quieres decir con ese comentario.",
    "en": "I don't understand what you mean by that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which' or 'what', referring to something not previously specified. It acts as the direct object of 'entender' here, replacing an implied noun."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bien que hayas conseguido el trabajo, ¡enhorabuena!",
    "en": "How great that you got the job, congratulations!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "Como"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent is used in exclamatory expressions to express strong emotion or emphasis, equivalent to 'how!' in English. It is distinct from the relative pronoun 'que' (no accent) or the nominaliser 'lo que'."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately, the delivery deadlines at work stress me out a lot.",
    "options": [
      "me estreso",
      "te estreso",
      "me estresa",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When a thing or situation causes the feeling, the verb agrees with that thing (the subject) and the person is expressed with an indirect object pronoun. 'Los plazos' is plural, so the verb must be 'estresan' — but since the subject here is an implied singular concept, 'me estresa' with 'el trabajo' as subject is the correct match."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que hablas tan rápido, ___ completamente.",
    "en": "Whenever you talk that fast, you confuse me completely.",
    "options": [
      "me confundo",
      "te confundes",
      "me confundes",
      "se confunde"
    ],
    "correct": 2,
    "explanation": "When the subject (tú) performs an action that directly affects the speaker (me), the verb is NOT reflexive but transitive with an indirect/direct object pronoun. 'Me confundes' = you (subject) confuse me (object)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de cerámica.",
    "en": "If I had more free time, I would take a ceramics course.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "haga"
    ],
    "correct": 1,
    "explanation": "In hypothetical si-clauses referring to unlikely or contrary-to-fact present situations, the main clause requires the Condicional Simple, not the Futuro. Futuro would imply a real, likely outcome."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, ___ llover toda la semana en el norte.",
    "en": "According to the forecast, it will rain all week in the north.",
    "options": [
      "llovaría",
      "lloverá",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "Both Futuro Simple and 'ir a + infinitivo' express future plans, but 'ir a + infinitivo' is preferred in spoken Spanish for near or evidence-based predictions. Here, either B or C is acceptable, but 'va a llover' better matches the conversational register with a forecast as evidence."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me preguntó si ___ a la boda de su hermana.",
    "en": "He asked me if I would go to his sister's wedding.",
    "options": [
      "iré",
      "iría",
      "voy a ir",
      "fuera"
    ],
    "correct": 1,
    "explanation": "In reported speech, Futuro Simple shifts back to Condicional Simple. The original question 'Will you go?' becomes '...if I would go' in indirect speech, requiring the Condicional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Cuando ___ a Madrid, avísame y quedamos.",
    "en": "When you come to Madrid, let me know and we'll meet up.",
    "options": [
      "vienes",
      "vengas",
      "vendrás",
      "vendrías"
    ],
    "correct": 1,
    "explanation": "After 'cuando' referring to a future event, Spanish requires the Subjuntivo, not the Indicativo or Futuro. This is because the future event has not yet occurred and remains hypothetical from the speaker's perspective."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es una lástima que tu jefe no ___ el esfuerzo que pones en tu trabajo.",
    "en": "It's a shame that your boss doesn't appreciate the effort you put into your work.",
    "options": [
      "aprecia",
      "aprecie",
      "apreciará",
      "apreciaría"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of emotion like 'es una lástima que' trigger the Subjuntivo in the subordinate clause because they express a subjective emotional reaction rather than an objective fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que ese restaurante ___ abierto los lunes.",
    "en": "I don't think that restaurant is open on Mondays.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief ('no creo que', 'no pienso que') trigger the Subjuntivo because the speaker is expressing doubt or denial rather than asserting a fact. Affirmative 'creo que' would take Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, ___ eso de repetir siempre lo mismo — ya lo entendemos.",
    "en": "Hey, stop that habit of always repeating the same thing — we already get it.",
    "options": [
      "deja",
      "dejes",
      "deje",
      "dejar"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed with the third-person singular present indicative (él/ella form). 'Deja' is the correct affirmative tú command of 'dejar'."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el informe hasta que yo lo revise.",
    "en": "Please don't send the report until I review it.",
    "options": [
      "envía",
      "envíes",
      "enviar",
      "envías"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed with the present subjunctive. While 'envía' is the affirmative tú command, the negative form requires 'no envíes' (subjunctive), not the indicative or infinitive."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ salido ya a hacer los recados.",
    "en": "He's not answering the phone. He must have already gone out to run errands.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened in the recent past. It is equivalent to 'must have done' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
