<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 02, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 02, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de jazz ___ en el parque central esta noche.",
    "en": "The jazz concert is at Central Park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express where events take place, even though SER usually does not indicate location. ESTAR is used for the location of physical objects and people, but scheduled events use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar tres meses en la playa, Carlos ___ muy moreno.",
    "en": "After spending three months at the beach, Carlos is very tan.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a state or condition that results from a change, in contrast to an inherent characteristic. Being tan after a beach holiday is a temporary, acquired condition, not a defining trait."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese pastel — ___ para la fiesta de mañana.",
    "en": "Don't touch that cake — it's for tomorrow's party.",
    "options": [
      "está",
      "es",
      "estará",
      "sea"
    ],
    "correct": 1,
    "explanation": "SER expresses purpose or destination (para + noun), which is a defining characteristic of the subject at that moment. This is a core use of SER that is easy to confuse with ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba la sopa — ¡___ riquísima! No sabía que cocinabas tan bien.",
    "en": "Taste the soup — it's absolutely delicious! I didn't know you cooked so well.",
    "options": [
      "es",
      "está",
      "sea",
      "fue"
    ],
    "correct": 1,
    "explanation": "The adjective 'rico' changes meaning depending on the verb: SER + rico means 'wealthy', while ESTAR + rico means 'delicious' or 'tasty'. Here the speaker is reacting to tasting the soup, so ESTAR is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was a child, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially when signalled by adverbs like 'siempre'. The Indefinido would imply a single completed event rather than an ongoing routine."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ un correo importante cuando de repente se fue la luz.",
    "en": "I was writing an important email when suddenly the power went out.",
    "options": [
      "escribí",
      "escribía",
      "he escrito",
      "escribiré"
    ],
    "correct": 1,
    "explanation": "The Imperfecto describes an ongoing background action that was interrupted, while the interrupting event uses the Indefinido ('se fue'). The contrast Imperfecto + Indefinido is the classic structure for interrupted past actions."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por fin ___ al director y le expliqué el problema.",
    "en": "Yesterday I finally met the director and explained the problem to him.",
    "options": [
      "conocía",
      "conocí",
      "he conocido",
      "conozco"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for a completed, single past event that happened at a specific time ('ayer'). The verb 'conocer' in the Indefinido means 'met for the first time', whereas in the Imperfecto it would mean 'knew/was acquainted with'."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese mensaje.",
    "en": "I don't understand what you're trying to tell me with that message.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative pronoun meaning 'that which' or 'what', and it is used when there is no specific antecedent noun. 'Que' alone would be a simple connector, and 'qué' with an accent is used in direct or indirect questions, not relative clauses."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable verte aquí después de tantos años!",
    "en": "What a pleasant surprise to see you here after so many years!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cuál"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong emotion or surprise, translating as 'what a…!' in English. 'Que' without an accent is a conjunction or relative pronoun, not used for exclamatory function."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Últimamente ___ mucho con las reuniones tan largas de la oficina.",
    "en": "Lately I get really stressed out by the very long office meetings.",
    "options": [
      "me estreso",
      "me estrenas",
      "me estresan",
      "me estresas"
    ],
    "correct": 2,
    "explanation": "When an external thing causes a feeling in you, the verb agrees with that thing (las reuniones = plural), making it 'me estresan' — the 'yo y el mundo' pattern. If you stressed yourself it would be 'me estreso', and 'me estresas' would mean a single person (tú) is stressing you out."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cada vez que me criticas delante de todos, ___ muchísimo.",
    "en": "Every time you criticise me in front of everyone, you embarrass me a lot.",
    "options": [
      "me avergüenzo",
      "me avergüenzas",
      "me avergüenza",
      "me avergüenzan"
    ],
    "correct": 1,
    "explanation": "This is the 'yo y tú' pattern: a second-person subject (tú) causes the speaker to feel embarrassed, so the verb takes the second-person singular ending: 'me avergüenzas'. 'Me avergüenzo' would mean you embarrass yourself, and 'me avergüenza' would require a third-person subject."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ el proyecto en la ciudad costera.",
    "en": "If we had more budget, we would launch the project in the coastal city.",
    "options": [
      "lanzaremos",
      "vamos a lanzar",
      "lanzaríamos",
      "lanzamos"
    ],
    "correct": 2,
    "explanation": "In hypothetical conditional sentences using 'si + imperfecto de subjuntivo', the main clause requires the Condicional Simple. The Futuro Simple is used for real future possibilities, not hypothetical or contrary-to-fact situations."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El tren sale a las ocho, así que ___ al aeropuerto a las siete como máximo.",
    "en": "The train leaves at eight, so we'll arrive at the airport by seven at the latest.",
    "options": [
      "llegaríamos",
      "llegaremos",
      "vamos a llegar",
      "lleguemos"
    ],
    "correct": 2,
    "explanation": "'Vamos a + infinitivo' is the preferred form in spoken Spanish for near-future plans or intentions when the context is concrete and decided. Both 'llegaremos' (Futuro Simple) and 'vamos a llegar' are correct here, but 'vamos a llegar' sounds the most natural in everyday conversation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Me ___ un favor? Necesito que alguien recoja a los niños hoy.",
    "en": "Would you do me a favour? I need someone to pick up the kids today.",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is used for polite requests or to soften the tone of a question, equivalent to 'would you…?' in English. The Futuro Simple ('harás') sounds more like a demand or a certain prediction rather than a polite ask."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que mi compañero de piso ___ los platos antes de que lleguen los invitados.",
    "en": "I hope my flatmate washes the dishes before the guests arrive.",
    "options": [
      "lava",
      "lavaría",
      "lave",
      "lavará"
    ],
    "correct": 2,
    "explanation": "The verb 'esperar que' expresses a wish or hope and triggers the Subjuntivo in the subordinate clause. The Indicativo 'lava' would express fact, while 'lavará' (Futuro) cannot follow 'que' after a verb of wishing."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del médico.",
    "en": "Call me as soon as you have news from the doctor.",
    "options": [
      "tienes",
      "tendrás",
      "tengas",
      "tendrías"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjuntivo when they refer to a future action that has not yet happened. When the action is habitual or describes the present/past, the Indicativo is used instead."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo sistema ___ tan eficiente como dicen.",
    "en": "I don't think the new system is as efficient as they say.",
    "options": [
      "sea",
      "es",
      "será",
      "fuera"
    ],
    "correct": 0,
    "explanation": "Negated verbs of opinion such as 'no creer que', 'no pensar que', and 'no parecer que' trigger the Subjuntivo because the speaker is casting doubt on the truth of the statement. Affirmative 'creo que' would use the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ la puerta con llave antes de salir — hay ladrones en el barrio!",
    "en": "Lock the door before you leave — there are thieves in the neighbourhood!",
    "options": [
      "Cierra",
      "Cierres",
      "Cerrar",
      "Cierre"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of most verbs is identical to the third-person singular of the Presente de Indicativo. 'Cierres' is the present subjunctive form, used for negative commands (no cierres), not affirmative ones."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el informe sin revisarlo con el equipo primero.",
    "en": "Please don't send the report without reviewing it with the team first.",
    "options": [
      "manda",
      "mandas",
      "mandes",
      "mandaste"
    ],
    "correct": 2,
    "explanation": "Negative tú commands are formed with 'no' plus the present subjunctive: no mandes, no hagas, no digas. The affirmative imperative ('manda') cannot be negated directly — you must switch to the subjunctive form for all negative commands."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Marcos no ha llegado todavía. ___ perdido en el metro otra vez.",
    "en": "Marcos still hasn't arrived. He must have got lost on the metro again.",
    "options": [
      "Habrá",
      "Habría",
      "Haya",
      "Había"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that may have already happened, equivalent to 'must have' or 'probably has' in English. 'Habría' (Condicional Compuesto) would be used in hypothetical past contexts."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
