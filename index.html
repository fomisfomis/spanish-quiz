<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — April 24, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>April 24, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo porque hay una tormenta eléctrica.",
    "en": "Don't touch that cable — it is very dangerous right now because there is an electrical storm.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the danger is a temporary, situational condition caused by current circumstances, not an inherent property of the cable. When an adjective describes a state resulting from external conditions rather than a defining characteristic, use ESTAR."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia de prensa ___ en el Palacio de Congresos esta tarde.",
    "en": "The press conference is at the Convention Center this afternoon.",
    "options": [
      "está",
      "es",
      "será",
      "estará"
    ],
    "correct": 1,
    "explanation": "Events — as opposed to physical objects — use SER to express location or timing. When the subject is a scheduled event rather than a person or thing occupying space, SER is the correct choice."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de tanto trabajar sin dormir, el jefe ___ bastante malo con sus empleados hoy.",
    "en": "After working so long without sleep, the boss is quite nasty/ill-tempered with his employees today.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo can mean 'ill' or 'in a bad mood/behaving badly,' describing a temporary state. SER + malo would mean the person is inherently bad or evil by character. The context of exhaustion makes this a temporary behavioral state, so ESTAR is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este gazpacho que hiciste ___ riquísimo — ¿cuál es tu secreto?",
    "en": "This gazpacho you made is absolutely delicious — what is your secret?",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'tastes delicious' (a sensory experience in the moment), while SER + rico means 'wealthy.' When commenting on how food tastes, Spanish speakers use ESTAR to describe the experienced quality rather than an objective classification."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era pequeña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was little, my grandmother always used to tell me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions, especially when signaled by words like 'siempre' (always) and 'cuando era pequeña.' The action was an ongoing routine, not a single completed event, so Pretérito Indefinido (contó) would be incorrect here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando los correos cuando de repente el sistema ___ .",
    "en": "I was checking emails when suddenly the system crashed.",
    "options": [
      "se caía",
      "se cayó",
      "se caería",
      "se ha caído"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the ongoing background action uses Imperfecto (estaba revisando) and the sudden interrupting event uses Pretérito Indefinido (se cayó). The adverb 'de repente' also signals a sudden, completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El mercado ___ lleno de gente; los vendedores gritaban y los niños corrían entre los puestos.",
    "en": "The market was full of people; the vendors were shouting and children were running between the stalls.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estaría"
    ],
    "correct": 1,
    "explanation": "Imperfecto is used to paint the background scene or describe how things were at a given point in the past. Here the sentence sets the stage with multiple simultaneous ongoing conditions, none of which are presented as completed events with a clear endpoint."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you are trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominal relative pronoun meaning 'what / that which,' and is used when there is no specific antecedent noun. Here it introduces the entire clause as the object of 'entiendo.' 'Que' alone would require a prior noun referent."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ sorpresa tan agradable encontrarte aquí después de tantos años!",
    "en": "What a pleasant surprise to run into you here after so many years!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express surprise, admiration, or strong emotion, equivalent to 'What a...!' in English. It modifies a noun directly and must carry a written accent to distinguish it from the conjunction 'que.'"
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando hay mucho ruido en la oficina, ___ muchísimo y no puedo concentrarme.",
    "en": "When there is a lot of noise in the office, I get very stressed and can't concentrate.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "te estreso"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or psychological reaction (Yo y yo pattern), the reflexive verb agrees with the first-person subject: yo me estreso. This differs from 'me estresas' (you stress me out — someone else is the cause) or 'me estresa el ruido' (the noise stresses me out)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho porque no sé si estás bien.",
    "en": "When you arrive late without warning, you worry me a lot because I don't know if you're okay.",
    "options": [
      "me preocupo",
      "me preocupas",
      "me preocupa",
      "te preocupas"
    ],
    "correct": 1,
    "explanation": "In the 'Yo y tú' pattern, a second-person subject causes an emotional effect on the first-person speaker. The verb conjugates to match the second-person subject (tú me preocupas), and the object pronoun 'me' shows who is affected."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ ?",
    "en": "If you had more free time, what would you do?",
    "options": [
      "harás",
      "habrás hecho",
      "harías",
      "vayas a hacer"
    ],
    "correct": 2,
    "explanation": "The Condicional is required in the result clause of hypothetical (si + Imperfecto Subjuntivo) sentences to express what would happen under an unlikely or imagined condition. Futuro Simple would imply a real, anticipated future action rather than a hypothesis."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mañana a las nueve ya estoy en el aeropuerto — ___ el vuelo de las diez y media.",
    "en": "Tomorrow at nine I'll already be at the airport — I'm going to take the ten-thirty flight.",
    "options": [
      "tomaría",
      "tomaré",
      "voy a tomar",
      "haya tomado"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for near-future plans that are already decided and arranged, especially when context includes specific times and logistics. It conveys a stronger sense of concrete intention than Futuro Simple, which can sound more distant or uncertain."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Me dijeron que si aprobaba el examen, me ___ un aumento de sueldo.",
    "en": "They told me that if I passed the exam, they would give me a salary raise.",
    "options": [
      "darán",
      "darían",
      "den",
      "hayan dado"
    ],
    "correct": 1,
    "explanation": "When reporting a conditional promise made in the past (indirect speech with a past reporting verb), the Condicional replaces Futuro Simple to maintain the correct tense sequence. The original statement 'si apruebas, te daremos' shifts to 'si aprobaba, le darían' in reported past speech."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los participantes ___ el formulario antes de la sesión.",
    "en": "It is essential that all participants complete the form before the session.",
    "options": [
      "completan",
      "completen",
      "completarán",
      "completaban"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es fundamental que, es necesario que, es importante que) trigger the Subjuntivo in the subordinate clause because they express a subjective demand rather than an objective statement of fact."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ noticias del resultado del análisis.",
    "en": "Call me as soon as you have news about the test result.",
    "options": [
      "tengas",
      "tienes",
      "tendrás",
      "tuvieras"
    ],
    "correct": 0,
    "explanation": "Temporal conjunctions like 'en cuanto,' 'cuando,' 'tan pronto como,' and 'hasta que' require the Subjuntivo when referring to a future action that has not yet occurred. Using Indicativo (tienes) would imply a habitual or currently true situation, not a future event."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo proyecto ___ tan fácil como dicen los directivos.",
    "en": "I don't think the new project is as easy as the managers say.",
    "options": [
      "es",
      "sea",
      "será",
      "fue"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion and belief (no creer que, no pensar que, no parecer que) trigger the Subjuntivo because the speaker is expressing doubt or rejection of a proposition. The affirmative 'creo que' uses Indicativo, but negation shifts it to Subjuntivo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el móvil durante la reunión — es muy molesto para todos.",
    "en": "Please, don't use your phone during the meeting — it is very annoying for everyone.",
    "options": [
      "usas",
      "uses",
      "usarás",
      "use"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present Subjuntivo (no uses), not the indicative form. The affirmative command would be 'usa,' but in the negative, the subjunctive form replaces it entirely. This is a key asymmetry in Spanish imperatives."
  },
  {
    "topic": "Imperativo",
    "q": "Si ya tienen todos los datos del cliente, ___ directamente el presupuesto y envíenmelo.",
    "en": "If you all already have the client's data, prepare the budget directly and send it to me.",
    "options": [
      "preparen",
      "preparad",
      "preparéis",
      "preparen ustedes"
    ],
    "correct": 0,
    "explanation": "Ustedes commands use the third-person plural present Subjuntivo form for both affirmative and negative commands. In Latin America, 'ustedes' is the standard plural second person, so 'preparen' is correct. 'Preparad' is the vosotros form used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ quedado dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Habrá",
      "Habría",
      "Ha",
      "Haya"
    ],
    "correct": 0,
    "explanation": "Futuro Compuesto (habrá + participio) is used to express probability or deduction about a past event from the perspective of the present, equivalent to 'must have done' in English. It signals the speaker's inference rather than certain knowledge of what happened."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
