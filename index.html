<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — June 29, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>June 29, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is in the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Use SER to express the location of events. ESTAR is used for the location of people and objects, but for scheduled events, SER indicates where and when they take place."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de trabajar doce horas seguidas, el chef ___ listo para irse a casa.",
    "en": "After working twelve hours straight, the chef is ready to go home.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + listo means 'to be ready' (a state or condition). SER + listo means 'to be clever or smart' (a permanent characteristic), so context determines which verb to use with this adjective."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este vino tinto ___ muy rico; ¿de qué bodega es?",
    "en": "This red wine is very tasty; which winery is it from?",
    "options": [
      "es",
      "está",
      "fue",
      "ha sido"
    ],
    "correct": 1,
    "explanation": "ESTAR + rico means 'to taste delicious' and describes a sensory experience or state. SER + rico means 'to be wealthy', so the verb changes the meaning of the adjective entirely."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después del accidente, mi vecino ___ un poco aburrido porque no podía salir de casa.",
    "en": "After the accident, my neighbor was a bit bored because he couldn't leave the house.",
    "options": [
      "era",
      "estuvo",
      "fue",
      "estaba"
    ],
    "correct": 3,
    "explanation": "ESTAR + aburrido means 'to feel bored' (a temporary emotional state). SER + aburrido means 'to be a boring person' (an inherent characteristic). Here the ongoing background condition calls for the imperfect ESTABA."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (jugar) al fútbol todos los sábados con mis amigos.",
    "en": "When I was a child, I used to play soccer every Saturday with my friends.",
    "options": [
      "jugué",
      "jugaba",
      "he jugado",
      "jugaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions. The cue 'todos los sábados' signals a regular routine in the past, not a single completed event, which would require Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) el informe cuando de repente sonó el teléfono.",
    "en": "I was reading the report when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leeré"
    ],
    "correct": 1,
    "explanation": "In interrupted action structures, the ongoing background action uses the Imperfecto, while the interrupting event uses the Indefinido. 'Leía' sets the scene; 'sonó' is the sudden event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (cerrar) dos oficinas en el extranjero.",
    "en": "Last year, my company closed two offices abroad.",
    "options": [
      "cerraba",
      "cerró",
      "ha cerrado",
      "cerrará"
    ],
    "correct": 1,
    "explanation": "The Pretérito Indefinido is used for completed actions at a specific, defined time in the past. 'El año pasado' is a closed time frame, signaling a finished event rather than a background condition."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás diciendo; habla más despacio, por favor.",
    "en": "I don't understand what you're telling me; please speak more slowly.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'what' in the sense of 'that which'. It is used when 'what' introduces a subordinate clause and can be replaced by 'la cosa que'. 'Que' alone cannot open this kind of embedded clause."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ calor hace hoy en Sevilla; me voy a derretir.",
    "en": "What heat there is in Seville today; I'm going to melt.",
    "options": [
      "Lo que",
      "El que",
      "Qué",
      "Que"
    ],
    "correct": 2,
    "explanation": "Exclamatory sentences in Spanish use 'qué' with an accent mark followed directly by a noun or adjective to express strong emotion or surprise. This construction does not use an article between 'qué' and the noun."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho cuando tengo reuniones largas por la tarde.",
    "en": "Lately I get very stressed when I have long afternoon meetings.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "nos estresamos"
    ],
    "correct": 2,
    "explanation": "When the subject is 'yo' and the action reflects back on oneself ('yo y yo' pattern), the reflexive verb uses the first-person singular form 'me estreso'. This differs from 'me estresas' (you stress me) or 'me estresa' (something stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que llegas tarde a cenar, ___ muchísimo.",
    "en": "Every time you arrive late for dinner, you irritate me a lot.",
    "options": [
      "me irrito",
      "te irritas",
      "me irritas",
      "me irrita"
    ],
    "correct": 2,
    "explanation": "In the 'yo y tú' pattern, 'tú' is the subject performing an action that affects 'yo', so the verb is second-person singular (irritas) with the first-person object pronoun (me). This gives 'me irritas' — you irritate me."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar el piano.",
    "en": "If I had more free time, I would learn to play the piano.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "voy a aprender"
    ],
    "correct": 2,
    "explanation": "In hypothetical si-clauses with the imperfect subjunctive (si tuviera), the main clause requires the Condicional Simple to express what would happen under that unlikely or imagined condition."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) en toda la región norte.",
    "en": "According to the forecast, tomorrow it will rain throughout the northern region.",
    "options": [
      "llovería",
      "llueve",
      "va a llover",
      "ha llovido"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (ir a + infinitivo) is commonly used in spoken Spanish for near-future plans or predictions with evidence. However, weather forecasts with a specific future time marker like 'mañana' also accept Futuro Simple; here 'va a llover' is the most natural colloquial choice."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "El gerente dijo que ___ (enviar) el contrato antes del viernes.",
    "en": "The manager said he would send the contract before Friday.",
    "options": [
      "enviará",
      "envía",
      "enviaría",
      "haya enviado"
    ],
    "correct": 2,
    "explanation": "When reporting what someone said they would do (reported speech with a past reporting verb like 'dijo'), Spanish uses the Condicional Simple, which acts as the 'future of the past'. Futuro Simple would be used for direct statements about the future."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es fundamental que todos los empleados ___ (cumplir) con el protocolo de seguridad.",
    "en": "It is essential that all employees comply with the safety protocol.",
    "options": [
      "cumplen",
      "cumplirán",
      "cumplan",
      "cumplirían"
    ],
    "correct": 2,
    "explanation": "Impersonal expressions of necessity or obligation like 'es fundamental que' trigger the Subjunctive in the subordinate clause. The subjunctive (cumplan) expresses the desired or required action rather than stating a factual reality."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo restaurante ___ (abrir) los domingos.",
    "en": "I don't think the new restaurant opens on Sundays.",
    "options": [
      "abre",
      "abra",
      "abrirá",
      "ha abierto"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief such as 'no creo que' require the Subjunctive in the dependent clause because the speaker is expressing doubt or denial rather than asserting a fact. The affirmative 'creo que' would use the indicative."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamo en cuanto ___ (llegar) al aeropuerto, ¿vale?",
    "en": "I'll call you as soon as I arrive at the airport, okay?",
    "options": [
      "llego",
      "llegué",
      "llegue",
      "llegaré"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the Subjunctive when they refer to future actions that have not yet occurred. When referring to habitual or past actions, they use the indicative."
  },
  {
    "topic": "Imperativo",
    "q": "¡___ (escuchar, tú) bien antes de responder, por favor!",
    "en": "Listen carefully before answering, please!",
    "options": [
      "Escuchas",
      "Escucha",
      "Escuches",
      "Escuchás"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -AR verbs is formed by dropping the -s from the present indicative tú form (escuchas → escucha). This is distinct from the negative tú imperative, which uses the present subjunctive (no escuches)."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ (poner, tú) la maleta encima de la cama; ponla en el suelo.",
    "en": "Don't put the suitcase on the bed; put it on the floor.",
    "options": [
      "pon",
      "pongas",
      "pones",
      "pondrás"
    ],
    "correct": 1,
    "explanation": "Negative tú commands always use the present subjunctive form. 'Pon' is the affirmative imperative for 'tú', but with 'no', it switches to 'no pongas'. Object pronouns are attached to affirmative commands but precede negative ones."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevo horas llamándole y no contesta. ___ (quedarse) sin batería otra vez.",
    "en": "I've been calling him for hours and he's not answering. He must have run out of battery again.",
    "options": [
      "Se quedará",
      "Se ha quedado",
      "Se habrá quedado",
      "Se quedó"
    ],
    "correct": 2,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or logical deduction about something that likely happened in the recent past. It is the Spanish equivalent of 'must have + past participle' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
