<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 05, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 05, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "La reunión ___ en la sala de conferencias del tercer piso.",
    "en": "The meeting is in the conference room on the third floor.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 0,
    "explanation": "Events use SER to indicate where they take place, even though location typically uses ESTAR. The rule 'location = estar' applies to physical objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ vivo y es muy peligroso.",
    "en": "Don't touch that cable — it's live and very dangerous.",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR + 'vivo' means 'to be alive / live (electrically active)' as a current state. SER + 'vivo' would mean 'to be clever/sharp', so the choice of verb completely changes the meaning of the adjective."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de pasar un año viajando, Marcos ___ muy diferente.",
    "en": "After spending a year traveling, Marcos is very different.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the sentence signals a change of state — Marcos has become different as a result of an experience. When a transformation or new condition is implied, ESTAR replaces SER even with adjectives that normally describe inherent traits."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Este pastel ___ riquísimo — ¿lo hiciste tú?",
    "en": "This cake is absolutely delicious — did you make it yourself?",
    "options": [
      "es",
      "está",
      "sea",
      "fuera"
    ],
    "correct": 1,
    "explanation": "ESTAR + 'rico/a' expresses taste as a sensory experience in the moment ('it tastes delicious'). SER + 'rico/a' would mean 'to be wealthy', making this one of the classic adjectives whose meaning shifts depending on the verb used."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela me ___ cuentos cada noche antes de dormir.",
    "en": "When I was little, my grandmother used to tell me stories every night before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "contaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated past actions — things that happened routinely over an unspecified period. The phrase 'cada noche' (every night) is a strong signal of habitual past action, requiring the Imperfecto."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Estaba revisando mis correos cuando de repente ___ la alarma de incendios.",
    "en": "I was checking my emails when suddenly the fire alarm went off.",
    "options": [
      "sonaba",
      "sonó",
      "haya sonado",
      "sonaría"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for the new event that interrupts the ongoing background action (Imperfecto). The structure 'estaba + gerundio … cuando + Indefinido' is the classic formula for an interrupted action — the alarm going off is the completed interrupting event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El mercado ___ lleno de gente y olía a especias y pan recién horneado.",
    "en": "The market was full of people and smelled of spices and freshly baked bread.",
    "options": [
      "estuvo",
      "estaba",
      "fue",
      "había sido"
    ],
    "correct": 1,
    "explanation": "The Imperfecto sets the scene and describes background conditions, atmosphere, or ongoing states in the past. This sentence is pure description with no completed, bounded event, so both verbs require the Imperfecto."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' is used as a relative pronoun equivalent to 'what / that which' when referring to an unspecified thing or concept. 'Que' alone would need a specific antecedent, and 'qué' with an accent is used in direct or indirect questions about identity, not in this embedded relative clause structure."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonito que te haya salido el jardín este año.",
    "en": "How beautiful your garden has turned out this year.",
    "options": [
      "Lo",
      "Qué",
      "Que",
      "Cuán"
    ],
    "correct": 1,
    "explanation": "'Qué' with an accent mark is used in exclamations to express admiration or strong emotion, equivalent to English 'How + adjective!' or 'What a…!' In this exclamatory structure, 'qué + adjective + que + subjunctive' expresses a reaction to something wonderful."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con la incertidumbre del trabajo.",
    "en": "Lately I stress a lot because of the uncertainty at work.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "me estresa"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or physical state through their own reaction, we use the reflexive pronoun 'me' with the first person singular verb (me estreso = I stress myself). This is the 'yo y yo' pattern where the subject and the agent of the action are the same person."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Cuando llegas tarde sin avisar, ___ mucho.",
    "en": "When you arrive late without letting me know, you stress me out a lot.",
    "options": [
      "me estreso",
      "me estresan",
      "me estresas",
      "me estresa"
    ],
    "correct": 2,
    "explanation": "When someone else (tú) causes the speaker's emotional state, the verb agrees with that second-person subject (me estresas = you stress me). This is the 'yo y tú' pattern — 'me' is the indirect object indicating who is affected, while the verb ending shows who causes it."
  },
  {
    "topic": "Reflexive verbs",
    "q": "___ más de lo que debería cuando no tengo todo bajo control.",
    "en": "The chaos stresses me out more than it should when I don't have everything under control.",
    "options": [
      "Me estreso",
      "Me estresas",
      "Me estresa el caos",
      "El caos me estresan"
    ],
    "correct": 2,
    "explanation": "When a thing or situation (el caos) causes the speaker's emotional state, the verb is third person singular and agrees with that noun subject. This is the 'yo y el mundo' pattern, structurally identical to 'me gusta', where the noun comes after the verb and triggers the agreement."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviéramos más presupuesto, ___ contratar a otro diseñador.",
    "en": "If we had more budget, we would hire another designer.",
    "options": [
      "podríamos",
      "podremos",
      "vamos a poder",
      "podamos"
    ],
    "correct": 0,
    "explanation": "The Condicional is required in the main clause of a hypothetical si-clause when the si-clause uses Imperfecto Subjuntivo. This structure (si + imperfecto subj. + condicional) expresses a contrary-to-fact or unlikely scenario in the present or future."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ una tormenta bastante fuerte.",
    "en": "According to the forecast, tomorrow there will be quite a strong storm.",
    "options": [
      "habría",
      "habrá",
      "vaya a haber",
      "hubiera"
    ],
    "correct": 1,
    "explanation": "The Futuro Simple expresses a factual prediction or event anticipated in the future, especially with time markers like 'mañana'. The Condicional would imply a condition or reported speech, which isn't the case here — this is a straightforward future prediction."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ al gimnasio — ya lo tengo decidido.",
    "en": "This afternoon I'm going to the gym — I've already made up my mind.",
    "options": [
      "iré",
      "voy a ir",
      "fuera",
      "iría"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' is preferred when expressing a planned, intentional action in the near future, especially when the decision has already been made. The Futuro Simple (iré) is more suitable for distant future events or spontaneous decisions, while 'voy a + inf.' signals a concrete personal plan."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que el cliente ___ satisfecho con la propuesta que enviamos.",
    "en": "I hope the client is satisfied with the proposal we sent.",
    "options": [
      "está",
      "esté",
      "estará",
      "estaría"
    ],
    "correct": 1,
    "explanation": "After verbs of wish or hope like 'esperar que', the Subjuntivo is required in the subordinate clause. This is one of the core triggers for the Subjuntivo: the main clause expresses a desire, and the subject of the wish is different from the subject of the main verb."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo.",
    "en": "As soon as the test results come in, I'll call you.",
    "options": [
      "llegan",
      "lleguen",
      "llegarán",
      "llegaran"
    ],
    "correct": 1,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', 'hasta que', and 'tan pronto como' trigger the Subjuntivo when they refer to a future action. When the action is habitual or past, the Indicative is used instead — the future meaning is the key trigger here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que Lucía ___ tiempo para venir a la cena esta semana.",
    "en": "I don't think Lucía has time to come to dinner this week.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' and 'no pensar que' require the Subjuntivo in the subordinate clause because the speaker is expressing doubt or uncertainty. Note that the affirmative 'creo que' uses the Indicative — the negation is what flips the mood."
  },
  {
    "topic": "Imperativo",
    "q": "No ___ el formulario antes de leer todas las instrucciones.",
    "en": "Don't fill out the form before reading all the instructions.",
    "options": [
      "rellena",
      "rellenes",
      "rellenar",
      "rellene"
    ],
    "correct": 1,
    "explanation": "Negative tú commands use the present Subjuntivo, not the affirmative imperative form. While the affirmative tú command is 'rellena', the negative must be 'no rellenes'. This asymmetry is a core feature of Spanish imperatives — negative commands always use Subjuntivo."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas tres horas en el baño. ¿___ encontrado algún problema con las tuberías?",
    "en": "You've been in the bathroom for three hours. Could you have found some problem with the pipes?",
    "options": [
      "Encontraste",
      "Habrás",
      "Habías",
      "Hubieras"
    ],
    "correct": 1,
    "explanation": "The Futuro Compuesto (habrás + participio) expresses probability or speculation about something that may have already happened — it translates as 'you must have' or 'could you have'. This deductive use is distinct from its temporal use (action completed before a future point) and is a key advanced function of this tense."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
