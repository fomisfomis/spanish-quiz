<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 21, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 21, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El festival de jazz ___ en el parque central este fin de semana.",
    "en": "The jazz festival is in the central park this weekend.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events use SER to express where and when they take place. ESTAR indicates the physical location of objects or people, but for scheduled events, Spanish uses SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary condition or state, such as temperature at a given moment. SER would imply the soup is inherently, permanently hot by nature."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este postre — ¡___ riquísimo! No lo esperaba.",
    "en": "Try this dessert — it's absolutely delicious! I wasn't expecting that.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Esté"
    ],
    "correct": 1,
    "explanation": "With 'rico', ESTAR means 'tastes delicious' (a sensory impression in the moment), while SER + rico means 'to be wealthy'. Context and the speaker's surprise confirm this is a current tasting experience."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuelo ___ listo para salir cuando llegamos a su casa.",
    "en": "My grandfather was ready to leave when we arrived at his house.",
    "options": [
      "era",
      "estuvo",
      "fue",
      "estaba"
    ],
    "correct": 3,
    "explanation": "ESTAR + listo means 'to be ready' (a state someone is in). SER + listo means 'to be clever/smart'. Since the sentence describes a condition at a specific moment, ESTAR in the imperfect is correct."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ (caminar) al colegio todos los días.",
    "en": "When I was a child, I used to walk to school every day.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto expresses habitual or repeated actions in the past. The phrase 'todos los días' combined with the childhood context signals an ongoing habit, not a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Yo ___ (leer) tranquilamente cuando de repente sonó el teléfono.",
    "en": "I was reading quietly when suddenly the phone rang.",
    "options": [
      "leí",
      "leía",
      "había leído",
      "leyera"
    ],
    "correct": 1,
    "explanation": "The imperfecto describes a background action in progress that was interrupted. The interrupting event (sonó el teléfono) uses the indefinido because it is a completed, punctual event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Ayer por la mañana, Marcos ___ (llamar) a su jefe y le explicó el problema.",
    "en": "Yesterday morning, Marcos called his boss and explained the problem to him.",
    "options": [
      "llamaba",
      "llamó",
      "ha llamado",
      "llame"
    ],
    "correct": 1,
    "explanation": "The pretérito indefinido is used for completed actions at a specific past time. 'Ayer por la mañana' anchors the event in a finished time frame, and the sequence of completed acts (called, then explained) confirms indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con eso.",
    "en": "I don't understand what you're trying to tell me with that.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalizer meaning 'that which' or 'what', used when referring to an unspecified thing or concept. 'Que' alone is a simple conjunction and cannot serve as the object of 'entender' here without a preceding noun."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ susto me dio el perro cuando saltó la valla de repente.",
    "en": "What a fright the dog gave me when it suddenly jumped the fence.",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with an accent mark is used in exclamations to express strong emotion or surprise, equivalent to 'What a...!' in English. Without the accent, 'que' is a subordinating conjunction and cannot introduce exclamative structures."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Cuando tengo demasiado trabajo, ___ mucho y no puedo dormir bien.",
    "en": "When I have too much work, I get very stressed and I can't sleep well.",
    "options": [
      "me estresas",
      "me estresa",
      "me estreso",
      "me estresan"
    ],
    "correct": 2,
    "explanation": "When the subject and the object are the same person (the speaker acting on themselves), Spanish uses the reflexive 'yo... me' pattern. 'Me estreso' = I stress myself out. 'Me estresas' would mean 'you stress me out' and 'me estresa' needs a third-person subject."
  },
  {
    "topic": "Reflexive verbs — Yo y yo / Yo y tú / Yo y el mundo",
    "q": "Siempre que discutimos, ___ muchísimo con tus comentarios sarcásticos.",
    "en": "Every time we argue, I get really irritated by your sarcastic comments.",
    "options": [
      "me irrito",
      "me irritas",
      "me irritan",
      "me irrita"
    ],
    "correct": 1,
    "explanation": "Here the subject causing the irritation is 'tú' (implied by 'tus comentarios sarcásticos' belonging to the person spoken to), so the verb conjugates in the second person: 'me irritas' = you irritate me. This is the 'yo y tú' pattern."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ (aprender) a tocar la guitarra.",
    "en": "If I had more free time, I would learn to play the guitar.",
    "options": [
      "aprenderé",
      "aprendo",
      "aprendería",
      "aprenda"
    ],
    "correct": 2,
    "explanation": "The condicional simple is used in the main clause of a hypothetical (si + imperfecto de subjuntivo) sentence to express what would happen under an unlikely or imagined condition. The future (aprenderé) cannot be paired with an imperfect subjunctive si-clause."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (nevar) en las montañas del norte.",
    "en": "According to the forecast, tomorrow it will snow in the northern mountains.",
    "options": [
      "nevaría",
      "nieva",
      "nevará",
      "vaya a nevar"
    ],
    "correct": 2,
    "explanation": "The futuro simple expresses objective predictions or events expected to happen based on evidence, like a weather forecast. The condicional would be used for speculation without solid basis or in reported speech from a past perspective."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Esta tarde ___ (ir) al mercado a comprar las verduras para la cena.",
    "en": "This afternoon I'm going to go to the market to buy vegetables for dinner.",
    "options": [
      "iré",
      "voy a ir",
      "iría",
      "vaya"
    ],
    "correct": 1,
    "explanation": "'Voy a + infinitivo' (periphrastic future) is preferred for plans already decided or intentions closely tied to the near future, especially in spoken Spanish. 'Iré' is more formal or used for less immediate or more distant future events."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Espero que tu hermano ___ (conseguir) el trabajo para el que se presentó.",
    "en": "I hope your brother gets the job he applied for.",
    "options": [
      "consigue",
      "conseguirá",
      "consiga",
      "conseguiría"
    ],
    "correct": 2,
    "explanation": "Verbs expressing wishes (esperar que, querer que, desear que) trigger the present subjunctive in the subordinate clause when the subjects of the two clauses differ. The indicative would treat the hope as a statement of fact rather than a desire."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que el nuevo gerente ___ (tener) suficiente experiencia para ese puesto.",
    "en": "I don't think the new manager has enough experience for that position.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated opinion verbs like 'no creer que' require the subjunctive because the speaker is casting doubt on the truth of the statement. Affirmative 'creo que' uses the indicative, but negation shifts the clause into the subjunctive."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te mandaré un mensaje en cuanto ___ (llegar) al aeropuerto.",
    "en": "I'll send you a message as soon as I arrive at the airport.",
    "options": [
      "llego",
      "llegaré",
      "llegue",
      "llegara"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'hasta que' require the present subjunctive when referring to future actions that have not yet occurred. If the action were habitual or past, the indicative would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Marta, no ___ (salir) sin paraguas — está lloviendo a cántaros.",
    "en": "Marta, don't go out without an umbrella — it's raining cats and dogs.",
    "options": [
      "sales",
      "salgas",
      "sal",
      "salís"
    ],
    "correct": 1,
    "explanation": "Negative tú commands are formed using the present subjunctive: 'no salgas'. The affirmative tú imperative 'sal' can only be used in positive commands. Using the indicative 'no sales' is grammatically incorrect for giving a command."
  },
  {
    "topic": "Imperativo",
    "q": "Señores pasajeros, ___ (abrocharse) los cinturones de seguridad, por favor.",
    "en": "Ladies and gentlemen, please fasten your seatbelts.",
    "options": [
      "abrochad",
      "abrochéis",
      "abróchense",
      "se abrochen"
    ],
    "correct": 2,
    "explanation": "When addressing multiple people formally (ustedes), the imperative is formed using the third-person plural present subjunctive: 'abróchense'. Reflexive pronouns are attached to the end of affirmative commands. 'Abrochad' is the vosotros form, used only in Spain."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "— ¿Por qué no ha respondido Lucía? — No sé, ___ (quedarse) sin batería.",
    "en": "— Why hasn't Lucía replied? — I don't know, she must have run out of battery.",
    "options": [
      "se quedará",
      "se queda",
      "se habría quedado",
      "se habrá quedado"
    ],
    "correct": 3,
    "explanation": "The futuro compuesto (habrá + participio) expresses probability or deduction about something that may have already happened in the recent past. It is the future-tense equivalent of 'must have done', used when the speaker is speculating about a past event."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
