<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — August 16, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>August 16, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto de jazz ___ en el parque esta noche.",
    "en": "The jazz concert is in the park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events (concerts, weddings, parties) use SER to express where and when they take place, even though location normally uses ESTAR. ESTAR indicates the physical location of objects and people, not scheduled events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a temporary state or condition, and the temperature of food at a given moment is exactly that — a changeable, temporary quality rather than a defining characteristic."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Pensé que la reunión era aburrida, pero el jefe ___ muy aburrido al final.",
    "en": "I thought the meeting was boring, but the boss was very bored in the end.",
    "options": [
      "era",
      "fue",
      "estaba",
      "estuvo"
    ],
    "correct": 2,
    "explanation": "When 'aburrido' is used with SER it means 'boring' (a characteristic), but with ESTAR it means 'bored' (a mental/emotional state). Here the boss experienced boredom, so ESTAR is required. The imperfect 'estaba' is used because this was an ongoing state during the meeting."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "¡Qué rico ___ este ceviche! Me lo comería todo.",
    "en": "How delicious this ceviche is! I could eat it all.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "'Rico' with SER means 'wealthy' (a permanent attribute), but with ESTAR it means 'delicious' or 'tasty' (a sensory experience in the moment). Since we are tasting the ceviche right now, ESTAR is the correct choice."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, ___ al parque todos los sábados con mi abuela.",
    "en": "When I was a child, I used to go to the park every Saturday with my grandmother.",
    "options": [
      "fui",
      "iba",
      "he ido",
      "iría"
    ],
    "correct": 1,
    "explanation": "The imperfecto (iba) is used for habitual or repeated actions in the past with no specific endpoint. The signal word 'todos los sábados' confirms the routine. Indefinido would suggest a single completed trip."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Leía el informe cuando mi colega ___ con noticias urgentes.",
    "en": "I was reading the report when my colleague arrived with urgent news.",
    "options": [
      "llegaba",
      "llegó",
      "había llegado",
      "llegaría"
    ],
    "correct": 1,
    "explanation": "In interrupted past actions, the background ongoing activity uses the imperfecto (leía) and the interrupting event uses the indefinido (llegó). The conjunction 'cuando' here introduces the sudden completed action that broke the ongoing one."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ lleno, así que decidimos pedir comida a domicilio.",
    "en": "The restaurant was full, so we decided to order food for delivery.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "estaría"
    ],
    "correct": 1,
    "explanation": "The imperfecto (estaba) sets the scene or background condition that existed at a point in time. 'Decidimos' (indefinido) is the resulting action. Background descriptions and states use imperfecto; forward-moving plot events use indefinido."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ me molesta del aeropuerto es la cantidad de gente.",
    "en": "What bothers me about the airport is the amount of people.",
    "options": [
      "Que",
      "Lo que",
      "Qué",
      "El que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'the thing that / what', and is needed when the relative clause acts as the subject or object of the main verb. 'Que' alone cannot begin a sentence in this nominal role without an article."
  },
  {
    "topic": "Usos de QUE",
    "q": "No encuentro el archivo ___ me mandaste ayer.",
    "en": "I can't find the file that you sent me yesterday.",
    "options": [
      "lo que",
      "qué",
      "que",
      "el cual que"
    ],
    "correct": 2,
    "explanation": "'Que' is the standard relative pronoun used after a specific, identified noun antecedent ('el archivo'). 'Lo que' would be used when there is no specific noun antecedent. Adding 'el cual que' is grammatically redundant and incorrect."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con los plazos de entrega en el trabajo.",
    "en": "Lately I stress out a lot because of the work deadlines.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresamos"
    ],
    "correct": 0,
    "explanation": "When you are the cause of your own internal reaction ('yo y yo' pattern), you use the first-person reflexive: me estreso (yo me estrés-o). Compare: 'me estresas' (tú causes my stress) or 'me estresa el tráfico' (el tráfico causes my stress)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé cómo lo haces, pero siempre ___ con tus comentarios sarcásticos.",
    "en": "I don't know how you do it, but you always irritate me with your sarcastic comments.",
    "options": [
      "me irrito",
      "me irritas",
      "me irrita",
      "me irritamos"
    ],
    "correct": 1,
    "explanation": "When a second person (tú) is the cause of an emotional reaction in the speaker, the verb agrees with 'tú' and takes the first-person object pronoun 'me': me irritas ('yo y tú' pattern). The subject is tú, producing the -as ending."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuviera más tiempo libre, ___ un curso de fotografía.",
    "en": "If I had more free time, I would take a photography course.",
    "options": [
      "tomaré",
      "tomaba",
      "tomaría",
      "tome"
    ],
    "correct": 2,
    "explanation": "Hypothetical 'si' clauses in the present/future use the imperfecto de subjuntivo in the 'si' clause and the condicional simple in the result clause. Futuro simple cannot appear directly after a hypothetical 'si tuviera'."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "¿Ves esas nubes tan oscuras? Creo que ___ esta tarde.",
    "en": "Do you see those dark clouds? I think it will rain this afternoon.",
    "options": [
      "llovería",
      "llueva",
      "lloverá",
      "iba a llover"
    ],
    "correct": 2,
    "explanation": "Futuro simple (lloverá) is used for predictions or expectations about real, likely future events. Condicional (llovería) expresses hypothetical outcomes or polite conjecture, not straightforward predictions about what is expected to happen."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Tengo todo listo. Esta noche ___ una cena especial para celebrar el ascenso.",
    "en": "I have everything ready. Tonight I'm going to make a special dinner to celebrate the promotion.",
    "options": [
      "haré",
      "haría",
      "voy a hacer",
      "hago"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' (periphrastic future) is preferred when the speaker has already made a decision or made concrete preparations — the plan is imminent and intentional. 'Haré' is also grammatically possible but sounds more distant; 'voy a hacer' better captures the planned immediacy here."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Mi madre quiere que ___ al médico antes de que empiece el viaje.",
    "en": "My mother wants me to go to the doctor before the trip starts.",
    "options": [
      "vaya",
      "voy",
      "iré",
      "fuera"
    ],
    "correct": 0,
    "explanation": "After 'querer que' (a verb of desire with a change of subject), the subjuntivo present is required. 'Vaya' is the present subjunctive of 'ir'. Indicative (voy) or future (iré) cannot follow a volitional verb with 'que' and a different subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Es importante que todos los pasajeros ___ el cinturón de seguridad.",
    "en": "It is important that all passengers wear their seatbelt.",
    "options": [
      "llevan",
      "lleven",
      "llevarán",
      "llevaran"
    ],
    "correct": 1,
    "explanation": "Impersonal expressions of necessity or importance (es importante que, es necesario que) trigger the present subjunctive in the dependent clause. 'Llevan' is indicative and cannot follow this structure; 'llevaran' is imperfect subjunctive, used for past or hypothetical contexts."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Te llamaré en cuanto ___ noticias del hospital.",
    "en": "I'll call you as soon as I have news from the hospital.",
    "options": [
      "tengo",
      "tuviera",
      "tenga",
      "tendré"
    ],
    "correct": 2,
    "explanation": "When 'en cuanto', 'cuando', or similar conjunctions of time refer to a future action that has not yet occurred, the present subjunctive (tenga) is required. Using the indicative (tengo) or future (tendré) after these conjunctions in a future context is a common error."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, Carmen, ___ esto — me parece que tiene un error.",
    "en": "Hey, Carmen, look at this — I think it has an error.",
    "options": [
      "miras",
      "mira",
      "mires",
      "mirad"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative for regular -AR verbs uses the third-person singular present indicative form: mira. This is distinct from the negative tú command (no mires), which uses the present subjunctive. 'Mirad' would be the vosotros command."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ el documento sin hacer una copia de seguridad.",
    "en": "Please, don't delete the document without making a backup.",
    "options": [
      "borras",
      "borra",
      "borres",
      "borre"
    ],
    "correct": 2,
    "explanation": "Negative tú commands use the present subjunctive: no borres. This is different from the affirmative tú command (borra). The subjunctive form for negative commands applies to all persons: no borre (usted), no borréis (vosotros), no borren (ustedes)."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Llevas tres horas en la cocina. ¡Ya ___ el pastel para cuando lleguen los invitados!",
    "en": "You've been in the kitchen for three hours. You will have finished the cake by the time the guests arrive!",
    "options": [
      "terminarás",
      "habrás terminado",
      "hubieras terminado",
      "hayas terminado"
    ],
    "correct": 1,
    "explanation": "The futuro compuesto (habrás terminado) expresses an action that will be completed before a specific future point in time. It is formed with the future of haber + past participle. 'Terminarás' (simple future) would only say it will happen, not that it will already be done by that moment."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
