<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — July 15, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>July 15, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "No toques ese cable — ___ muy peligroso ahora mismo porque hay una avería en el sistema.",
    "en": "Don't touch that cable — it's very dangerous right now because there's a system fault.",
    "options": [
      "Es",
      "Está",
      "Sea",
      "Esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used here because the danger is a temporary, situational condition caused by the fault — not an inherent property of the cable. When an adjective describes a state resulting from specific circumstances, ESTAR is required."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "La conferencia de prensa ___ en el salón principal del hotel, no en la sala pequeña.",
    "en": "The press conference is in the main hall of the hotel, not in the small room.",
    "options": [
      "es",
      "está",
      "fue",
      "estuvo"
    ],
    "correct": 0,
    "explanation": "SER is used for the location of events (scheduled occurrences), while ESTAR is used for the location of physical objects or people. Because a conference is an event, we use SER."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Creí que el examen sería difícil, pero al final ___ bastante fácil — terminé en veinte minutos.",
    "en": "I thought the exam would be hard, but in the end it was quite easy — I finished in twenty minutes.",
    "options": [
      "era",
      "fue",
      "estuvo",
      "estaba"
    ],
    "correct": 2,
    "explanation": "ESTAR (estuvo) expresses a change-of-state or a result experienced during a bounded event — the speaker found the exam easy as a condition they experienced. SER/fue would classify the exam as inherently easy by nature, which contradicts the speaker's surprise."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Prueba este caldo — ___ riquísimo. El chef le ha puesto azafrán de verdad.",
    "en": "Try this broth — it's absolutely delicious. The chef has used real saffron.",
    "options": [
      "Es",
      "Está",
      "Sería",
      "Estaría"
    ],
    "correct": 1,
    "explanation": "With food, ESTAR + rico/riquísimo describes the taste as experienced right now by the speaker, conveying a sensory impression. SER + rico would mean the food is rich (wealthy) or inherently high-quality as a category, which is not the intended meaning here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niña, mi abuela siempre me ___ cuentos antes de dormir.",
    "en": "When I was a child, my grandmother always told me stories before bed.",
    "options": [
      "contó",
      "contaba",
      "ha contado",
      "había contado"
    ],
    "correct": 1,
    "explanation": "The Imperfecto (contaba) is used for habitual, repeated actions in the past — something that happened routinely over an unspecified period. The adverb 'siempre' and the context of childhood signal this repeated pattern, ruling out the Indefinido."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Miraba el partido tranquilamente cuando de repente ___ la luz en todo el barrio.",
    "en": "I was watching the match calmly when suddenly the light went out all over the neighbourhood.",
    "options": [
      "se fue",
      "se iba",
      "se había ido",
      "se fuera"
    ],
    "correct": 0,
    "explanation": "In interrupted-action constructions, the ongoing background action uses the Imperfecto (miraba) and the sudden interrupting event uses the Indefinido (se fue). 'De repente' is a classic signal of a punctual event that breaks the continuous background."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El restaurante ___ lleno de gente, así que decidimos ir a otro sitio.",
    "en": "The restaurant was full of people, so we decided to go somewhere else.",
    "options": [
      "estuvo",
      "estaba",
      "ha estado",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTABA (Imperfecto) describes a background scene or condition that existed at the moment of another action — it sets the stage. ESTUVO (Indefinido) would present the fullness as a completed, bounded state, which doesn't fit the role of background description here."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con esa metáfora tan confusa.",
    "en": "I don't understand what you're trying to tell me with that confusing metaphor.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a nominalised relative clause meaning 'that which / what', and it is used as the object of 'entender' when no specific antecedent noun has been mentioned. Plain 'que' would require a prior noun to refer back to, and 'qué' with an accent would be used in direct questions."
  },
  {
    "topic": "Usos de QUE",
    "q": "¡___ susto me has dado al entrar así de repente con la música a todo volumen!",
    "en": "What a fright you gave me, coming in like that suddenly with the music blasting!",
    "options": [
      "Lo que",
      "Que",
      "Qué",
      "El que"
    ],
    "correct": 2,
    "explanation": "'Qué' with a written accent is used in exclamatory constructions with nouns (¡Qué + noun!) to express a strong emotional reaction. Without the accent, 'que' is a conjunction or relative pronoun and cannot introduce this type of exclamation."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ muchísimo con los plazos de entrega tan cortos que nos ponen en el trabajo.",
    "en": "Lately I get really stressed with the very short delivery deadlines they give us at work.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresan"
    ],
    "correct": 0,
    "explanation": "'Me estreso' (yo + reflexive) means the subject produces stress in themselves — the emotion originates from the situation but the grammatical agent is 'yo'. This contrasts with 'me estresa' (something stresses me, where the noun is the subject) or 'me estresas' (tú stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Siempre que estamos juntos en reuniones, ___ con tus comentarios tan directos delante de los clientes.",
    "en": "Every time we are together in meetings, you embarrass me with your very direct comments in front of clients.",
    "options": [
      "me averguenzo",
      "te avergüenzas",
      "me avergüenzas",
      "nos avergonzamos"
    ],
    "correct": 2,
    "explanation": "'Me avergüenzas' (tú → me) follows the 'yo y tú' pattern where the subject (tú) causes an emotional or physical reaction in the speaker (me). The verb agrees with the subject 'tú', while 'me' is the indirect object receiving the effect."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si el vuelo sale a las seis, ___ al aeropuerto antes de las cuatro para pasar el control de seguridad.",
    "en": "If the flight leaves at six, we'll have to get to the airport before four to go through security.",
    "options": [
      "tendríamos que llegar",
      "llegaríamos",
      "tendremos que llegar",
      "vamos a llegar"
    ],
    "correct": 2,
    "explanation": "In open conditional sentences (si + present indicative), the result clause uses the Future Simple or 'ir a + infinitivo', never the Conditional. The Conditional (tendríamos) is reserved for hypothetical or contrary-to-fact conditions with si + imperfect subjunctive."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Con más presupuesto, el departamento de diseño ___ renovar toda la identidad visual de la marca.",
    "en": "With more budget, the design department would be able to renew the entire visual identity of the brand.",
    "options": [
      "podrá",
      "va a poder",
      "podría",
      "puede"
    ],
    "correct": 2,
    "explanation": "The Conditional (podría) expresses a hypothetical outcome dependent on an unfulfilled condition ('with more budget' implies they don't currently have it). The Future Simple (podrá) would assert a real future fact, which contradicts the hypothetical framing."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Mira esas nubes tan oscuras — creo que ___ lluvia esta tarde. Mejor llevamos el paraguas.",
    "en": "Look at those dark clouds — I think it's going to rain this afternoon. We'd better take an umbrella.",
    "options": [
      "lloverá",
      "llovería",
      "va a llover",
      "llueva"
    ],
    "correct": 2,
    "explanation": "'Voy/va a + infinitivo' expresses a near future based on present evidence — the dark clouds are direct observable proof of what is about to happen. 'Lloverá' (Future Simple) is also possible but feels more distant or neutral; with visible evidence, 'va a llover' is far more natural and immediate."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Nuestros padres quieren que ___ más tiempo juntos como familia durante las vacaciones.",
    "en": "Our parents want us to spend more time together as a family during the holidays.",
    "options": [
      "pasamos",
      "pasemos",
      "pasaremos",
      "pasaríamos"
    ],
    "correct": 1,
    "explanation": "After verbs of wanting or wishing with a change of subject (querer que + different subject), Spanish requires the Subjunctive. 'Quieren que pasemos' follows the WEIRDO rule — the main verb expresses a desire directed at someone else, triggering the subjunctive in the subordinate clause."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "En cuanto ___ los resultados del análisis, te llamo para que hablemos con el médico juntos.",
    "en": "As soon as the test results come in, I'll call you so we can talk to the doctor together.",
    "options": [
      "llegan",
      "llegarán",
      "lleguen",
      "llegaban"
    ],
    "correct": 2,
    "explanation": "Temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' require the Subjunctive when referring to a future event that has not yet occurred. The Present Indicative would incorrectly imply habitual or current action rather than a future point."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Buscan a alguien que ___ tres idiomas y que tenga experiencia en mercados asiáticos.",
    "en": "They are looking for someone who speaks three languages and has experience in Asian markets.",
    "options": [
      "habla",
      "hable",
      "hablará",
      "hablaría"
    ],
    "correct": 1,
    "explanation": "When the antecedent of a relative clause is unknown, hypothetical, or non-specific (here, 'someone' who may or may not exist), the Subjunctive is required. If they were referring to a specific known person, the Indicative 'habla' would be used."
  },
  {
    "topic": "Imperativo",
    "q": "Oye, si no quieres arrepentirte después, ___ bien antes de firmar el contrato de alquiler.",
    "en": "Hey, if you don't want to regret it later, think it through carefully before signing the rental contract.",
    "options": [
      "piénsalo",
      "piensalo",
      "no lo piensas",
      "piénsale"
    ],
    "correct": 0,
    "explanation": "The affirmative tú imperative of 'pensar' is 'piensa' (irregular stem change), and when a direct object pronoun is added, it attaches to the end of the verb form: 'piénsalo'. A written accent is added to maintain the original stress of the imperative form."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, señores pasajeros, ___ el cinturón de seguridad durante todo el vuelo.",
    "en": "Please, passengers, do not remove your seatbelt during the entire flight.",
    "options": [
      "no quiten",
      "no quitan",
      "no quitéis",
      "no quiten ustedes"
    ],
    "correct": 0,
    "explanation": "For formal negative commands addressed to a group using 'ustedes', Spanish uses 'no' + third-person plural present subjunctive (quiten). 'No quitan' is indicative, not imperative. 'No quitéis' is the vosotros negative imperative, which is used in Spain for informal groups, not formal 'ustedes' contexts."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "Son las diez de la noche y Marta todavía no ha llegado a casa. ___ perdido el autobús otra vez.",
    "en": "It's ten at night and Marta still hasn't come home. She must have missed the bus again.",
    "options": [
      "Habrá perdido",
      "Habría perdido",
      "Ha perdido",
      "Hubiera perdido"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) expresses probability or deduction about a past event from the perspective of the present — the speaker is inferring what likely happened. This is one of its key non-future uses, equivalent to 'she must have / she probably has' in English."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
