<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spanish Quiz — May 17, 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f5f0eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 680px; width: 100%; overflow: hidden; }
  .header { background: #c0392b; color: #fff; padding: 24px 28px 20px; }
  .header h1 { font-size: 1.4em; font-weight: normal; letter-spacing: 0.02em; }
  .header p { font-size: 0.9em; opacity: 0.85; margin-top: 4px; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 99px; height: 6px; margin-top: 14px; }
  .progress-bar { background: #fff; height: 6px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
  .topic-badge { display: inline-block; background: #fef3f2; color: #c0392b; border: 1px solid #f5c6c2; border-radius: 99px; font-size: 0.75em; padding: 3px 10px; margin-bottom: 10px; letter-spacing: 0.03em; text-transform: uppercase; }
  .card { padding: 28px 28px 24px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-num { font-size: 0.82em; color: #999; }
  .question { font-size: 1.13em; color: #1a1a1a; margin-bottom: 6px; line-height: 1.6; }
  .question em { display: block; font-size: 0.85em; color: #666; font-style: italic; margin-top: 4px; }
  .options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { background: #f8f6f3; border: 2px solid #e8e3dc; border-radius: 10px; padding: 12px 16px; text-align: left; font-size: 0.97em; font-family: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: #222; line-height: 1.4; }
  .option-btn:hover:not(:disabled) { background: #fef3f2; border-color: #c0392b; transform: translateX(3px); }
  .option-btn .letter { font-weight: bold; color: #c0392b; margin-right: 8px; }
  .option-btn.correct { background: #eafaf1; border-color: #27ae60; }
  .option-btn.correct .letter { color: #27ae60; }
  .option-btn.wrong { background: #fdf0ef; border-color: #e74c3c; }
  .option-btn.wrong .letter { color: #e74c3c; }
  .option-btn:disabled { cursor: default; transform: none; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 0.93em; line-height: 1.6; display: none; }
  .feedback.correct-fb { background: #eafaf1; border-left: 4px solid #27ae60; color: #1d6a3a; display: block; }
  .feedback.wrong-fb { background: #fdf0ef; border-left: 4px solid #e74c3c; color: #7b1a14; display: block; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .nav { margin-top: 22px; display: flex; justify-content: flex-end; }
  .next-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95em; font-family: inherit; cursor: pointer; display: none; transition: background 0.15s; }
  .next-btn:hover { background: #a93226; }
  .results { padding: 36px 28px; text-align: center; display: none; }
  .score-ring { width: 110px; height: 110px; border-radius: 50%; background: conic-gradient(#27ae60 var(--pct), #e8e3dc var(--pct)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.6em; font-weight: bold; color: #1a1a1a; box-shadow: 0 0 0 8px #fff, 0 0 0 10px #e8e3dc; }
  .results h2 { font-size: 1.4em; color: #1a1a1a; margin-bottom: 8px; }
  .results p { color: #666; font-size: 0.95em; margin-bottom: 20px; }
  .restart-btn { background: #c0392b; color: #fff; border: none; border-radius: 8px; padding: 11px 28px; font-size: 1em; font-family: inherit; cursor: pointer; }
  .restart-btn:hover { background: #a93226; }
  .breakdown { margin-top: 24px; text-align: left; border-top: 1px solid #ece8e3; padding-top: 18px; }
  .breakdown h3 { font-size: 0.9em; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ece8e3; font-size: 0.9em; }
  .bd-row:last-child { border-bottom: none; }
  .bd-score { font-weight: bold; color: #c0392b; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>&#127466;&#127480; Spanish Grammar Quiz</h1>
    <p>May 17, 2026 &nbsp;&middot;&nbsp; 20 questions &nbsp;&middot;&nbsp; Intermediate level</p>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="card" id="quizCard">
    <div class="q-meta">
      <span class="topic-badge" id="topicBadge"></span>
      <span class="q-num" id="qNum"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next-btn" id="nextBtn">Next &rarr;</button></div>
  </div>
  <div class="results" id="resultsScreen">
    <div class="score-ring" id="scoreRing"></div>
    <h2 id="resultsHeading"></h2>
    <p id="resultsSubtext"></p>
    <button class="restart-btn" onclick="restart()">Restart Quiz</button>
    <div class="breakdown" id="breakdown"></div>
  </div>
</div>
<script>
const questions = [
  {
    "topic": "SER vs ESTAR",
    "q": "El concierto ___ en el parque central esta noche.",
    "en": "The concert is at the central park tonight.",
    "options": [
      "es",
      "está",
      "será",
      "estará"
    ],
    "correct": 0,
    "explanation": "Events and scheduled occurrences use SER to indicate where and when they take place, even though SER normally doesn't express location. ESTAR is used for the physical location of objects and people, not events."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "No toques esa sopa — ___ muy caliente todavía.",
    "en": "Don't touch that soup — it's still very hot.",
    "options": [
      "es",
      "está",
      "sea",
      "esté"
    ],
    "correct": 1,
    "explanation": "ESTAR is used to describe a current, temporary condition or state, such as the temperature of food. SER would imply a permanent or defining characteristic, which doesn't apply here."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Mi abuela ___ muy lista — siempre sabe qué decir en cada situación.",
    "en": "My grandmother is very clever — she always knows what to say in every situation.",
    "options": [
      "está",
      "es",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "With the adjective 'listo', SER means 'clever or intelligent' as a defining trait, while ESTAR + listo means 'to be ready'. Since the sentence describes an inherent quality, SER is correct."
  },
  {
    "topic": "SER vs ESTAR",
    "q": "Después de la quimioterapia, el paciente ___ muy malo.",
    "en": "After chemotherapy, the patient was very ill.",
    "options": [
      "era",
      "estaba",
      "fue",
      "estuvo"
    ],
    "correct": 1,
    "explanation": "ESTAR + malo means 'to be sick or ill' (a temporary condition), while SER + malo means 'to be a bad person' (a moral trait). Since illness is a state, ESTAR is used here."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Cuando era niño, ___ (caminar) al colegio todos los días.",
    "en": "When I was a child, I used to walk to school every day.",
    "options": [
      "caminé",
      "caminaba",
      "he caminado",
      "caminaría"
    ],
    "correct": 1,
    "explanation": "The Imperfecto is used for habitual or repeated actions in the past, especially those described with markers like 'todos los días'. The Indefinido would imply a single completed event."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "Nosotros ___ (cenar) tranquilamente cuando alguien llamó a la puerta.",
    "en": "We were having dinner peacefully when someone knocked on the door.",
    "options": [
      "cenamos",
      "cenábamos",
      "habíamos cenado",
      "cenaríamos"
    ],
    "correct": 1,
    "explanation": "When one action interrupts another in the past, the ongoing background action uses the Imperfecto, while the interrupting action uses the Indefinido. Here, 'cenar' is the ongoing action being interrupted by 'llamar'."
  },
  {
    "topic": "Pretérito Indefinido vs Imperfecto",
    "q": "El año pasado, mi empresa ___ (contratar) a cincuenta nuevos empleados.",
    "en": "Last year, my company hired fifty new employees.",
    "options": [
      "contrataba",
      "contrató",
      "ha contratado",
      "contrate"
    ],
    "correct": 1,
    "explanation": "The Indefinido is used for a completed action with a clear time boundary ('el año pasado'). The hiring is presented as a finished event, not a habitual or ongoing background action."
  },
  {
    "topic": "Usos de QUE",
    "q": "No entiendo ___ me estás intentando decir con ese comentario.",
    "en": "I don't understand what you're trying to tell me with that comment.",
    "options": [
      "que",
      "lo que",
      "qué",
      "el que"
    ],
    "correct": 1,
    "explanation": "'Lo que' functions as a noun clause meaning 'that which' or 'what', and is used when there is no prior noun antecedent. 'Que' alone would need a specific noun referent, and 'qué' is used in direct questions or exclamations."
  },
  {
    "topic": "Usos de QUE",
    "q": "___ bonito que te haya sorprendido así en tu cumpleaños!",
    "en": "How lovely that he surprised you like that on your birthday!",
    "options": [
      "Lo que",
      "Qué",
      "Que",
      "Cómo"
    ],
    "correct": 1,
    "explanation": "'Qué' + adjective is used in exclamatory sentences to express a strong reaction or emotion. 'Lo que' introduces noun clauses, 'que' introduces relative or subordinate clauses, and 'cómo' asks or exclaims about manner."
  },
  {
    "topic": "Reflexive verbs",
    "q": "Últimamente ___ mucho con las discusiones en redes sociales. (estresarse)",
    "en": "Lately I get really stressed by the arguments on social media.",
    "options": [
      "me estreso",
      "me estresas",
      "me estresa",
      "me estresamos"
    ],
    "correct": 0,
    "explanation": "When the subject causes their own emotional or physical reaction — the 'yo y yo' pattern — the reflexive verb agrees with the first-person subject: 'yo me estreso'. This differs from 'me estresas' (you stress me) or 'me estresa el tráfico' (traffic stresses me)."
  },
  {
    "topic": "Reflexive verbs",
    "q": "No sé por qué, pero siempre ___ cuando estamos juntos. (reírse — tú a mí)",
    "en": "I don't know why, but you always make me laugh when we're together.",
    "options": [
      "me río",
      "me ríes",
      "me ríe",
      "nos reímos"
    ],
    "correct": 1,
    "explanation": "In the 'yo y tú' pattern, a second-person subject (tú) acts on a first-person object (me), so the verb conjugates in second person: 'me ríes'. This is different from 'me río' (I laugh on my own) or 'me ríe' (he/she makes me laugh)."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Si tuvieras más tiempo libre, ¿qué ___ (hacer)?",
    "en": "If you had more free time, what would you do?",
    "options": [
      "harás",
      "harías",
      "vas a hacer",
      "hagas"
    ],
    "correct": 1,
    "explanation": "The Condicional is used in the main clause of hypothetical (si + Imperfecto Subjuntivo) sentences to express what would happen under an unlikely or imagined condition. The Futuro Simple is used for real future plans, not hypotheticals."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Según el pronóstico, mañana ___ (llover) por la tarde.",
    "en": "According to the forecast, it will rain tomorrow afternoon.",
    "options": [
      "llovería",
      "llueva",
      "va a llover",
      "lloverá"
    ],
    "correct": 3,
    "explanation": "Both 'lloverá' (Futuro Simple) and 'va a llover' are grammatically possible, but Futuro Simple is preferred with explicit future time markers and objective forecasts. 'Llovería' implies a conditional or hypothetical situation."
  },
  {
    "topic": "Condicional vs Futuro Simple",
    "q": "Ya tengo todo listo — ___ el tren de las ocho. (tomar — immediate plan)",
    "en": "I already have everything ready — I'm going to take the eight o'clock train.",
    "options": [
      "tomaré",
      "tomaría",
      "voy a tomar",
      "tome"
    ],
    "correct": 2,
    "explanation": "'Voy a + infinitivo' is preferred for immediate, concrete plans where the speaker has already decided and prepared. The Futuro Simple ('tomaré') sounds more distant or formal, while 'tomaría' is conditional."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "El jefe quiere que nosotros ___ (terminar) el informe antes del viernes.",
    "en": "The boss wants us to finish the report before Friday.",
    "options": [
      "terminamos",
      "terminaremos",
      "terminemos",
      "termináramos"
    ],
    "correct": 2,
    "explanation": "After verbs of wanting or wishing with a change of subject (querer que + different subject), the subordinate clause requires the present Subjuntivo. The Indicativo would be used if there were no change of subject."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "Llámame en cuanto ___ (llegar) al aeropuerto.",
    "en": "Call me as soon as you arrive at the airport.",
    "options": [
      "llegas",
      "llegues",
      "llegarás",
      "llegarías"
    ],
    "correct": 1,
    "explanation": "After temporal conjunctions like 'en cuanto', 'cuando', and 'tan pronto como' referring to a future event, the Subjuntivo must be used. The Indicativo is used only when these conjunctions refer to habitual or past actions."
  },
  {
    "topic": "Subjuntivo Simple",
    "q": "No creo que este restaurante ___ (tener) mesa libre a estas horas.",
    "en": "I don't think this restaurant has a free table at this hour.",
    "options": [
      "tiene",
      "tenga",
      "tendrá",
      "tuviera"
    ],
    "correct": 1,
    "explanation": "Negated verbs of opinion or belief ('no creer que', 'no pensar que') trigger the Subjuntivo in the subordinate clause because the speaker is casting doubt on the proposition. The affirmative 'creo que' would take the Indicativo."
  },
  {
    "topic": "Imperativo",
    "q": "Por favor, no ___ (hablar) tan alto en la biblioteca, chicos.",
    "en": "Please, don't speak so loudly in the library, guys.",
    "options": [
      "habléis",
      "habléis no",
      "hablen",
      "hablad"
    ],
    "correct": 0,
    "explanation": "Negative commands in Spain use the present Subjuntivo for all persons: 'no habléis' for vosotros. 'Hablad' is the affirmative vosotros command and cannot be used in the negative. In Latin America, 'no hablen' would be used for ustedes."
  },
  {
    "topic": "Imperativo",
    "q": "Si quieres más información, ___ (llamar) al número que aparece en la pantalla ahora mismo.",
    "en": "If you want more information, call the number shown on the screen right now.",
    "options": [
      "llamas",
      "llama",
      "llamarás",
      "llames"
    ],
    "correct": 1,
    "explanation": "The affirmative tú imperative of regular -ar verbs is formed like the third-person singular present indicative: 'llama'. 'Llames' is the subjuntivo tú form, used only for negative tú commands ('no llames')."
  },
  {
    "topic": "Futuro Compuesto",
    "q": "No contesta el teléfono. ___ (quedarse) dormido otra vez.",
    "en": "He's not answering the phone. He must have fallen asleep again.",
    "options": [
      "Se habrá quedado",
      "Se quedará",
      "Se había quedado",
      "Se quedaría"
    ],
    "correct": 0,
    "explanation": "The Futuro Compuesto (habrá + participio) is used to express probability or deduction about something that likely happened in the recent past. It translates as 'must have' or 'probably' + past in English, and is distinct from the Pluscuamperfecto (había + participio), which simply narrates past-before-past."
  }
];
const letters = ["A","B","C","D"];
let current = 0, score = 0, topicScores = {}, answered = false;
function init() {
  current = 0; score = 0; topicScores = {}; answered = false;
  questions.forEach(q => { topicScores[q.topic] = topicScores[q.topic] || {right:0,total:0}; });
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("quizCard").style.display = "";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("topicBadge").textContent = q.topic;
  document.getElementById("qNum").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("progressBar").style.width = `${(current/questions.length)*100}%`;
  document.getElementById("questionText").innerHTML = q.q + `<em>${q.en}</em>`;
  const container = document.getElementById("optionsContainer");
  container.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="letter">${letters[i]})</span>${opt}`;
    btn.addEventListener("click", () => selectAnswer(i));
    container.appendChild(btn);
  });
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
}
function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  topicScores[q.topic].total++;
  if (idx === q.correct) {
    buttons[idx].classList.add("correct"); score++; topicScores[q.topic].right++;
    showFeedback(true, q.explanation);
  } else {
    buttons[idx].classList.add("wrong"); buttons[q.correct].classList.add("correct");
    showFeedback(false, q.explanation);
  }
  document.getElementById("nextBtn").style.display = "block";
}
function showFeedback(isCorrect, explanation) {
  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (isCorrect ? "correct-fb" : "wrong-fb");
  fb.innerHTML = (isCorrect ? "&#10003; Correct! &nbsp;" : "&#10007; Not quite. &nbsp;") + explanation;
}
document.getElementById("nextBtn").addEventListener("click", () => {
  current++;
  if (current >= questions.length) showResults(); else showQuestion();
});
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("resultsScreen").style.display = "block";
  const pct = Math.round((score/questions.length)*100);
  const ring = document.getElementById("scoreRing");
  ring.style.setProperty("--pct", `${pct}%`);
  ring.textContent = `${score}/${questions.length}`;
  const h = document.getElementById("resultsHeading"), p = document.getElementById("resultsSubtext");
  if (pct >= 90)      { h.textContent="Excellent work!";       p.textContent="Outstanding — you have a strong command of these structures."; }
  else if (pct >= 70) { h.textContent="Good job!";             p.textContent="Solid performance. Review the topics you missed and try again."; }
  else if (pct >= 50) { h.textContent="Keep practicing!";      p.textContent="You're on the right track — focus on the sections below."; }
  else                { h.textContent="More practice needed."; p.textContent="Don't worry — review the explanations and try again."; }
  const bd = document.getElementById("breakdown");
  bd.innerHTML = "<h3>Score by Topic</h3>";
  Object.entries(topicScores).forEach(([topic, s]) => {
    const row = document.createElement("div");
    row.className = "bd-row";
    row.innerHTML = `<span>${topic}</span><span class="bd-score">${s.right}/${s.total}</span>`;
    bd.appendChild(row);
  });
}
function restart() { init(); }
init();
</script>
</body>
</html>
